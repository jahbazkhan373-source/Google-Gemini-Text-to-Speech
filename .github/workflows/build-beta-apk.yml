                  File temp = new File(dst.getParentFile(), dst.getName() + ".copy.tmp");
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(src), 65536);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
                  LargeFileEngine.atomicReplace(temp, dst);
              }

              private String readSmallFile(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file))) {
                      int offset = 0, read;
                      while (offset < data.length && (read = in.read(data, offset, data.length - offset)) != -1) offset += read;
                  }
                  return new String(data, StandardCharsets.UTF_8);
              }
