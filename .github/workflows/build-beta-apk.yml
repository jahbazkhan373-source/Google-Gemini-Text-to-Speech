                  AccessibilityHelper.applySafeInsets(rootContainer);

                  repository = new LibraryRepository(this);
                  projectRepository = new ProjectRepository(this);
                  recoveryManager = new CrashRecoveryManager(this);
                  settings = new AppSettings(this);

                  findViewById(R.id.btnCreateProject).setOnClickListener(v -> showCreateProjectFlow());
                  findViewById(R.id.btnMyProjects).setOnClickListener(v ->
                          startActivity(new Intent(this, ProjectsActivity.class))
                  );
                  findViewById(R.id.btnNewCode).setOnClickListener(v -> {
                      Intent intent = new Intent(this, EditorActivity.class);
                      intent.putExtra(EditorActivity.EXTRA_START_EMPTY, true);
                      intent.putExtra(EditorActivity.EXTRA_IMPORTED_LANGUAGE, settings.getDefaultLanguage());
                      startActivity(intent);
                  });
                  findViewById(R.id.btnLibrary).setOnClickListener(v ->
                          startActivity(new Intent(this, LibraryActivity.class))
                  );
                  findViewById(R.id.btnImportFile).setOnClickListener(v ->
                          importFileLauncher.launch(new String[]{"text/*", "*/*"})
                  );
                  findViewById(R.id.btnKeystoreVault).setOnClickListener(v ->
                          startActivity(new Intent(this, KeystoreVaultActivity.class))
                  );
                  findViewById(R.id.btnSettings).setOnClickListener(v ->
                          startActivity(new Intent(this, SettingsActivity.class))
                  );
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  checkCrashRecoveryIfNeeded();
              }

              /**
               * Exact 2-step Create Project flow:
               * Step 1: Ask which programming language the code is in.
               * Step 2: Simple 2-field window (App Name + Package Name) with Cancel / OK -> creates & opens Project Editor!
               */
              private void showCreateProjectFlow() {
                  new AlertDialog.Builder(this)
                          .setTitle("Select Project Code Language")
                          .setItems(SUPPORTED_LANGUAGES, (dialog, which) -> {
                              String chosenLang = SUPPORTED_LANGUAGES[which];
                              showCreateProjectTwoFieldDialog(chosenLang);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showCreateProjectTwoFieldDialog(String language) {
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_create_project, null);
                  EditText etAppName = view.findViewById(R.id.etNewProjectAppName);
                  EditText etPackageName = view.findViewById(R.id.etNewProjectPackageName);
                  etPackageName.setText("com.codebook.myapp");

                  new AlertDialog.Builder(this)
                          .setTitle("Create " + language + " Project")
                          .setView(view)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String appName = etAppName.getText().toString().trim();
                              String pkgName = etPackageName.getText().toString().trim();
                              if (appName.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, "Please enter an App Name.");
                                  return;
                              }
                              if (projectRepository.projectNameExists(appName, null)) {
                                  AccessibilityHelper.announce(this, rootContainer, "A project with this name already exists.");
                                  return;
                              }
                              AccessibilityHelper.announce(this, rootContainer, "Creating project " + appName + "...");
                              executor.execute(() -> {
                                  try {
                                      ProjectMeta created = projectRepository.createProject(language, appName, pkgName);
                                      runOnUiThread(() -> {
                                          Intent intent = new Intent(this, EditorActivity.class);
                                          intent.putExtra(EditorActivity.EXTRA_PROJECT_ID, created.id);
                                          intent.putExtra(EditorActivity.EXTRA_PROJECT_REL_PATH, created.mainCodeFile);
                                          startActivity(intent);
                                      });
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(
                                              this, rootContainer, "Project creation failed: " + e.getMessage()
                                      ));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void checkCrashRecoveryIfNeeded() {
                  if (recoveryPromptShown || !recoveryManager.hasPendingRecovery()) return;
                  CrashRecoveryManager.RecoveryState state = recoveryManager.getPendingRecovery();
                  if (state == null) {
                      recoveryManager.clearRecovery();
                      return;
                  }
                  recoveryPromptShown = true;

                  String name = (state.fileName != null && !state.fileName.isEmpty()) ? state.fileName : "Untitled Draft";
                  String time = state.timestamp > 0
                          ? new SimpleDateFormat("dd/MM/yyyy hh:mm a", Locale.US).format(new Date(state.timestamp))
                          : "";

                  AccessibilityHelper.announce(this, rootContainer, "Unsaved work from previous session found. Restore now?");
                  new AlertDialog.Builder(this)
                          .setTitle("Recover Unsaved Work")
                          .setMessage("Unsaved changes for '" + name + "' (" + state.language + ") were safely saved."
                                  + (time.isEmpty() ? "" : "\nTime: " + time)
                                  + "\n\nDo you want to restore this session?")
                          .setPositiveButton(R.string.yes, (d, w) -> {
                              Intent intent = new Intent(this, EditorActivity.class);
                              if (state.projectId != null) {
                                  intent.putExtra(EditorActivity.EXTRA_PROJECT_ID, state.projectId);
                                  if (state.projectRelPath != null) {
                                      intent.putExtra(EditorActivity.EXTRA_PROJECT_REL_PATH, state.projectRelPath);
                                  }
                              } else if (state.fileId != null) {
                                  intent.putExtra(EditorActivity.EXTRA_FILE_ID, state.fileId);
                              } else {
                                  intent.putExtra(EditorActivity.EXTRA_START_EMPTY, false);
                              }
                              intent.putExtra(EditorActivity.EXTRA_RECOVER_SESSION, true);
                              startActivity(intent);
                          })
                          .setNegativeButton(R.string.no, (d, w) -> {
                              recoveryManager.clearRecovery();
                              AccessibilityHelper.announce(this, rootContainer, "Recovery snapshot cleared.");
                          })
                          .setCancelable(false)
                          .show();
              }

              private void handleImportedUri(Uri uri) {
                  String displayName = queryDisplayName(uri);
                  String detectedLang = LibraryRepository.detectLanguageFromFileName(displayName);

                  if (detectedLang != null) {
                      importIntoNewEditor(uri, detectedLang, displayName);
                  } else if (!settings.isAskLanguageOnTxtImport()) {
                      importIntoNewEditor(uri, settings.getDefaultLanguage(), displayName);
                  } else {
                      new AlertDialog.Builder(this)
                              .setTitle("Select Code Language")
                              .setItems(SUPPORTED_LANGUAGES, (dialog, which) ->
                                      importIntoNewEditor(uri, SUPPORTED_LANGUAGES[which], displayName))
                              .setNegativeButton(R.string.cancel, null)
                              .show();
                  }
              }

              private void importIntoNewEditor(Uri uri, String language, String displayName) {
                  AccessibilityHelper.announce(this, rootContainer, "Importing file...");
                  executor.execute(() -> {
                      try {
                          File draftFile = repository.getDraftFile();
                          repository.importUriToFile(uri, draftFile);
                          runOnUiThread(() -> {
                              Intent intent = new Intent(this, EditorActivity.class);
                              intent.putExtra(EditorActivity.EXTRA_START_EMPTY, false);
                              intent.putExtra(EditorActivity.EXTRA_IMPORTED_LANGUAGE, language);
                              intent.putExtra(EditorActivity.EXTRA_IMPORTED_NAME, stripExtension(displayName));
                              startActivity(intent);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "Import failed: " + e.getMessage()
                          ));
                      }
                  });
              }

              private String queryDisplayName(Uri uri) {
                  String name = "ImportedFile.txt";
                  try (Cursor cursor = getContentResolver().query(uri, null, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = cursor.getString(idx);
                      }
                  } catch (Exception ignored) {
                  }
                  return name;
              }

              private String stripExtension(String name) {
                  if (name == null) return "";
                  int dot = name.lastIndexOf('.');
                  return (dot > 0) ? name.substring(0, dot) : name;
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
