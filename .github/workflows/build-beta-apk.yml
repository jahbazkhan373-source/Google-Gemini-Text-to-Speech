              private void collectRelFiles(File root, File cur, List<String> out) {
                  File[] list = cur.listFiles();
                  if (list == null) return;
                  for (File f : list) {
                      if (f.isDirectory()) {
                          String n = f.getName();
                          if ("build".equals(n) || "mipmap-mdpi".equals(n) || "mipmap-hdpi".equals(n)
                                  || "mipmap-xhdpi".equals(n) || "mipmap-xxhdpi".equals(n) || "mipmap-xxxhdpi".equals(n)) {
                              continue;
                          }
                          collectRelFiles(root, f, out);
                      } else if (f.isFile()) {
                          String rel = f.getAbsolutePath().substring(root.getAbsolutePath().length() + 1).replace('\\', '/');
                          String lower = rel.toLowerCase(Locale.US);
                          if (lower.endsWith(".java") || lower.endsWith(".lua") || lower.endsWith(".aly")
                                  || lower.endsWith(".xml") || lower.endsWith(".json") || lower.endsWith(".html")
                                  || lower.endsWith(".css") || lower.endsWith(".js") || lower.endsWith(".py")
                                  || lower.endsWith(".kt") || lower.endsWith(".c") || lower.endsWith(".cpp")
                                  || lower.endsWith(".dart") || lower.endsWith(".pro") || lower.endsWith(".txt")) {
                              out.add(rel);
                          }
                      }
                  }
              }

              public List<File> listMediaAssets(ProjectMeta meta) {
