              private void saveProperties() {
                  try {
                      String appName = etAppName.getText().toString().trim();
                      String pkgName = etPkgName.getText().toString().trim();
                      if (appName.isEmpty()) {
                          AccessibilityHelper.announce(this, rootContainer, "App Name cannot be empty.");
                          return;
                      }
                      project.appName = appName;
                      project.packageName = ProjectRepository.sanitizePackageName(pkgName, appName);
                      project.versionName = etVerName.getText().toString().trim().isEmpty() ? "1.0" : etVerName.getText().toString().trim();
                      project.versionCode = Math.max(1, Integer.parseInt(etVerCode.getText().toString().trim()));

                      project.ultraLightMode = cbUltraLight.isChecked();
                      project.fullScreen = cbFullScreen.isChecked();
                      project.keepScreenOn = cbKeepScreenOn.isChecked();
                      project.allowHttpTraffic = cbAllowHttp.isChecked();
                      project.rtlSupport = cbRtl.isChecked();
                      project.splashScreen = cbSplash.isChecked();
                      project.r8Obfuscate = cbR8.isChecked();

                      project.dependencies = etDependencies.getText().toString().trim();
                      project.customManifestSection = etCustomManifest.getText().toString().trim();
                      project.proguardRules = etProguardRules.getText().toString().trim();

                      projectRepo.updateProject(project);
                      if (!project.proguardRules.isEmpty()) {
                          projectRepo.writeProjectTextFile(project, "proguard-rules.pro", project.proguardRules);
                      }
                      AccessibilityHelper.announce(this, rootContainer, "Project properties & AndroidManifest saved.");
                      finish();
                  } catch (Exception e) {
                      AccessibilityHelper.announce(this, rootContainer, "Save failed: " + e.getMessage());
                  }
              }

              private static String bumpVersionName(String ver) {
                  if (ver == null || ver.isEmpty()) return "1.1";
                  int dot = ver.lastIndexOf('.');
                  if (dot > 0 && dot < ver.length() - 1) {
                      try {
                          int minor = Integer.parseInt(ver.substring(dot + 1));
                          return ver.substring(0, dot + 1) + (minor + 1);
                      } catch (NumberFormatException ignored) {
                      }
                  }
                  return ver + ".1";
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
