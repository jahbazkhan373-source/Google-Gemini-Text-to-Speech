          package com.codebook.editor.checker;

          public class CodeIssue {

              public enum FixType {
                  NONE,
                  REPLACE_LINE,
                  APPEND_NEW_LINE_AT_EOF
              }

              public final String name;
              public final int lineNumber;
              public final int columnNumber;
              public final String reason;
              public final String codeLine;
              public final boolean possibleError;
              public final FixType fixType;
              public final String fixDescription;
              public final String fixPayload;

              public CodeIssue(String name, int lineNumber, int columnNumber, String reason,
                               boolean possibleError, FixType fixType, String fixDescription, String fixPayload) {
                  this(name, lineNumber, columnNumber, reason, "", possibleError, fixType, fixDescription, fixPayload);
              }

              public CodeIssue(String name, int lineNumber, int columnNumber, String reason, String codeLine,
                               boolean possibleError, FixType fixType, String fixDescription, String fixPayload) {
                  this.name = name;
                  this.lineNumber = Math.max(1, lineNumber);
                  this.columnNumber = Math.max(0, columnNumber);
                  this.reason = reason != null ? reason : "";
                  this.codeLine = codeLine != null ? codeLine : "";
                  this.possibleError = possibleError;
                  this.fixType = (fixType != null) ? fixType : FixType.NONE;
                  this.fixDescription = fixDescription;
                  this.fixPayload = fixPayload;
              }

              public boolean hasSafeFix() {
                  return fixType != FixType.NONE && fixPayload != null;
              }

              public String formatCopyText() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Line ").append(lineNumber);
                  if (columnNumber > 0) sb.append(", Col ").append(columnNumber);
                  sb.append(" [").append(possibleError ? "Possible Error" : "Error").append("]: ").append(name).append("\n");
                  sb.append("Reason: ").append(reason);
                  if (!codeLine.isEmpty()) {
                      sb.append("\nCode: ").append(codeLine);
                  }
                  return sb.toString();
              }
          }
