              private void initializeFileSession() {
                  currentFileId = getIntent().getStringExtra(EXTRA_FILE_ID);
                  currentProjectId = getIntent().getStringExtra(EXTRA_PROJECT_ID);
                  currentProjectRelPath = getIntent().getStringExtra(EXTRA_PROJECT_REL_PATH);
                  boolean startEmpty = getIntent().getBooleanExtra(EXTRA_START_EMPTY, false);
                  String importedLang = getIntent().getStringExtra(EXTRA_IMPORTED_LANGUAGE);
                  String importedName = getIntent().getStringExtra(EXTRA_IMPORTED_NAME);
                  String externalTestPath = getIntent().getStringExtra(EXTRA_EXTERNAL_TEST_FILE);
                  boolean recoverSession = getIntent().getBooleanExtra(EXTRA_RECOVER_SESSION, false);

                  if (importedLang != null && !importedLang.isEmpty()) currentLanguage = importedLang;
                  if (importedName != null && !importedName.isEmpty()) currentFileName = importedName;

                  executor.execute(() -> {
                      try {
                          File backingFile;
                          markedLineNumbers.clear();
                          isExternalBenchmarkFile = false;

                          if (currentProjectId != null && !currentProjectId.isEmpty()) {
                              currentProject = projectRepository.getById(currentProjectId);
                              if (currentProject != null) {
                                  // Two-Way SAF Sync: pull any external file edits (e.g. from MT Manager) first!
                                  currentProject = projectRepository.syncProjectFromExternalSaf(currentProject);
                                  if (currentProjectRelPath == null || currentProjectRelPath.isEmpty()) {
                                      currentProjectRelPath = currentProject.mainCodeFile;
                                  }
                                  backingFile = projectRepository.getProjectFile(currentProject, currentProjectRelPath);
                                  currentFileName = currentProject.appName + " / " + currentProjectRelPath;
                                  String detected = LibraryRepository.detectLanguageFromFileName(currentProjectRelPath);
                                  currentLanguage = (detected != null) ? detected : currentProject.language;
                              } else {
                                  backingFile = repository.getDraftFile();
                              }
                          } else if (externalTestPath != null && !externalTestPath.isEmpty()) {
                              backingFile = new File(externalTestPath);
                              isExternalBenchmarkFile = true;
                          } else if (currentFileId != null) {
                              CodeFileMeta meta = repository.getById(currentFileId);
                              if (meta != null) {
                                  currentFileName = meta.name;
                                  currentLanguage = meta.language;
                                  if (meta.markedLines != null) markedLineNumbers.addAll(meta.markedLines);
                              }
                              backingFile = repository.getCodeFile(currentFileId);
                          } else {
                              backingFile = repository.getDraftFile();
                              if (startEmpty && backingFile.exists()) backingFile.delete();
                          }

                          engine = new LargeFileEngine(backingFile, settings.getPageCharLimit());
                          engine.rebuildIndex();
                          currentPageIndex = 0;
                          currentFocusedLineIndex = 0;

                          boolean restoredFromCrash = false;
                          if (recoverSession && recoveryManager.hasPendingRecovery()) {
                              CrashRecoveryManager.RecoveryState st = recoveryManager.getPendingRecovery();
                              if (st != null) {
                                  if (st.language != null && !st.language.isEmpty()) currentLanguage = st.language;
                                  if (st.fileName != null && !st.fileName.isEmpty()) currentFileName = st.fileName;
                                  isLineMode = st.isLineMode;
                                  currentPageIndex = Math.max(0, Math.min(st.pageIndex, engine.getPageCount() - 1));
                                  currentFocusedLineIndex = Math.max(0, Math.min(st.lineIndex, Math.max(0, engine.getLineCount() - 1)));
                                  if (st.hasDirtyPageText) {
                                      String recoveredText = recoveryManager.readRecoveredPageText();
                                      if (recoveredText != null) {
                                          engine.writePage(currentPageIndex, recoveredText);
                                          restoredFromCrash = true;
                                      }
                                  }
                              }
                              recoveryManager.clearRecovery();
                          }

                          lastAutoBackupTime = System.currentTimeMillis();
                          String pageContent = engine.readPage(currentPageIndex);
                          final boolean wasRecovered = restoredFromCrash;

                          runOnUiThread(() -> {
                              boolean inProject = (currentProject != null);
                              btnRunProject.setVisibility(inProject ? View.VISIBLE : View.GONE);
                              btnProjectMoreOptions.setVisibility(inProject ? View.VISIBLE : View.GONE);
                              btnFileSwitcher.setVisibility(inProject ? View.VISIBLE : View.GONE);

                              lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                              lineAdapter.setEngine(engine);
                              displayPageContent(pageContent);
                              applyModeVisibility();
                              updateHeaderAndBarsUI();
                              scheduleNextAutoSave();
                              String openMsg = wasRecovered
                                      ? "Recovered unsaved work successfully."
                                      : ((currentFileName != null ? currentFileName : "New File")
                                          + (isLineMode ? " opened in Line Mode." : " opened in All Mode."));
                              AccessibilityHelper.announce(this, rootContainer, openMsg);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Failed to open file: " + e.getMessage()));
                      }
                  });
