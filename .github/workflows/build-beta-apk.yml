              <string name="library_empty">لائبریری میں ابھی کوئی فائل محفوظ نہیں ہے۔</string>
              <string name="unsaved_draft">نئی غیر محفوظ فائل</string>
          </resources>
          CODEBOOK_EOF
          cat > "app/src/main/res/values/themes.xml" <<'CODEBOOK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CodeBook" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary</item>
                  <item name="colorPrimaryVariant">@color/primary_dark</item>
                  <item name="colorSecondary">@color/accent</item>
                  <item name="android:windowBackground">@color/surface_bg</item>
              </style>
          </resources>
          CODEBOOK_EOF
          cat > "build.gradle" <<'CODEBOOK_EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          CODEBOOK_EOF
          cat > "gradle.properties" <<'CODEBOOK_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          CODEBOOK_EOF
          cat > "settings.gradle" <<'CODEBOOK_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CodeBook"
          include(":app")
          CODEBOOK_EOF

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_FILE="/tmp/codebook-release.jks"
          rm -f "$KS_FILE"
          USE_CUSTOM=false
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            if echo "$KEYSTORE_BASE64" | base64 --decode > "$KS_FILE" 2>/dev/null; then
              if keytool -list -keystore "$KS_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                USE_CUSTOM=true
              else
                echo "Custom keystore secret validation failed; falling back to auto-generated keystore."
                rm -f "$KS_FILE"
              fi
            else
              rm -f "$KS_FILE"
            fi
          fi

          if [ "$USE_CUSTOM" = "true" ]; then
            echo "KEYSTORE_PATH=$KS_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -alias codebook_release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass codebook123456 \
              -keypass codebook123456 \
              -dname "CN=CodeBook, OU=Mobile, O=CodeBook, L=DGKhan, ST=Punjab, C=PK"
            echo "KEYSTORE_PATH=$KS_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=codebook123456" >> $GITHUB_ENV
            echo "KEY_ALIAS=codebook_release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=codebook123456" >> $GITHUB_ENV
          fi

      - name: Build Debug and Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename Final APKs
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/debug/app-debug.apk release_out/CodeBook-Final-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release_out/CodeBook-Final-Release.apk

      - name: Upload Final APKs
        uses: actions/upload-artifact@v4
        with:
          name: CodeBook-Final-v1.0-APKs
          path: release_out/*.apk