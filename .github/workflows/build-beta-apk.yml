                      );
                      v.setPadding(
                              padLeft + bars.left,
                              padTop + bars.top,
                              padRight + bars.right,
                              padBottom + bars.bottom
                      );
                      return insets;
                  });
                  ViewCompat.requestApplyInsets(rootView);
              }

