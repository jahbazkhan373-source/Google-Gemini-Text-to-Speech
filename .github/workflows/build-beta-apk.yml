                  for (int i = 0; i < files.size() && all.size() < maxTotal; i++) {
                      File f = files.get(i);
                      String label = (labels != null && i < labels.size()) ? labels.get(i) : f.getName();
                      if (f == null || !f.exists() || !f.isFile()) continue;
                      try {
                          SearchResult res = search(f, query, matchCase, wholeWord, Math.min(50, maxTotal - all.size()));
                          for (SearchMatch m : res.matches) {
                              all.add(new GlobalSearchMatch(label, f, m.lineNumber, m.linePreview));
                          }
                      } catch (Exception ignored) {
                      }
                  }
                  return all;
              }

              private static boolean processLineForSearch(byte[] rawBytes, long lineStartByte, int lineIndex,
                                                          String needle, int needleLen, boolean matchCase,
                                                          boolean wholeWord, int maxResults,
                                                          List<SearchMatch> out) {
                  int len = rawBytes.length;
                  if (len > 0 && rawBytes[len - 1] == '\r') len--;
                  if (len == 0) return false;

                  String lineStr = new String(rawBytes, 0, len, StandardCharsets.UTF_8);
                  String hay = matchCase ? lineStr : lineStr.toLowerCase(Locale.ROOT);

                  int searchFrom = 0;
                  while (searchFrom <= hay.length() - needleLen) {
                      int idx = hay.indexOf(needle, searchFrom);
                      if (idx < 0) break;

                      if (!wholeWord || isWholeWordMatch(lineStr, idx, idx + needleLen)) {
                          if (out.size() >= maxResults) return true;
                          int prefixBytes = lineStr.substring(0, idx).getBytes(StandardCharsets.UTF_8).length;
                          int matchBytes = lineStr.substring(idx, idx + needleLen).getBytes(StandardCharsets.UTF_8).length;
                          long byteStart = lineStartByte + prefixBytes;
                          long byteEnd = byteStart + matchBytes;
                          String preview = lineStr.length() > 140 ? lineStr.substring(0, 140) + "..." : lineStr;
                          out.add(new SearchMatch(lineIndex, byteStart, byteEnd, preview));
                          searchFrom = idx + needleLen;
                      } else {
                          searchFrom = idx + 1;
                      }
                  }
                  return false;
              }

              public static int replaceAllToFile(File srcFile, File dstTempFile, String query,
                                                 String replacement, boolean matchCase,
                                                 boolean wholeWord) throws IOException {
                  if (srcFile == null || !srcFile.exists() || query == null || query.isEmpty()) return 0;
                  String safeRepl = (replacement != null) ? replacement : "";
                  String needle = matchCase ? query : query.toLowerCase(Locale.ROOT);
                  int needleLen = needle.length();
                  int totalReplaced = 0;

                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(srcFile), 65536);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dstTempFile), 65536)) {
                      ByteArrayOutputStream lineBuf = new ByteArrayOutputStream(256);
                      int b;
                      while ((b = in.read()) != -1) {
                          if (b == '\n') {
                              totalReplaced += writeReplacedLine(lineBuf.toByteArray(), true, needle, needleLen,
                                      safeRepl, matchCase, wholeWord, out);
                              lineBuf.reset();
                          } else {
                              lineBuf.write(b);
                          }
                      }
                      if (lineBuf.size() > 0) {
                          totalReplaced += writeReplacedLine(lineBuf.toByteArray(), false, needle, needleLen,
                                  safeRepl, matchCase, wholeWord, out);
                      }
                      out.flush();
                  }
                  return totalReplaced;
              }

              private static int writeReplacedLine(byte[] rawBytes, boolean hadNewline, String needle,
                                                   int needleLen, String replacement, boolean matchCase,
                                                   boolean wholeWord, BufferedOutputStream out) throws IOException {
                  int len = rawBytes.length;
                  boolean hadCr = (len > 0 && rawBytes[len - 1] == '\r');
                  if (hadCr) len--;

                  String lineStr = new String(rawBytes, 0, len, StandardCharsets.UTF_8);
                  String hay = matchCase ? lineStr : lineStr.toLowerCase(Locale.ROOT);

                  int count = 0;
                  int pos = 0;
                  StringBuilder sb = null;

                  while (pos <= hay.length() - needleLen) {
                      int idx = hay.indexOf(needle, pos);
                      if (idx < 0) break;

                      if (!wholeWord || isWholeWordMatch(lineStr, idx, idx + needleLen)) {
                          if (sb == null) sb = new StringBuilder(lineStr.length() + 32);
                          sb.append(lineStr, pos, idx);
                          sb.append(replacement);
                          pos = idx + needleLen;
                          count++;
                      } else {
                          if (sb != null) sb.append(lineStr, pos, idx + 1);
                          pos = idx + 1;
                      }
                  }

                  if (sb != null) {
                      if (pos < lineStr.length()) sb.append(lineStr, pos, lineStr.length());
                      out.write(sb.toString().getBytes(StandardCharsets.UTF_8));
                  } else {
                      out.write(rawBytes, 0, len);
                  }

                  if (hadCr) out.write('\r');
                  if (hadNewline) out.write('\n');
                  return count;
              }

              private static boolean isWholeWordMatch(String text, int start, int end) {
                  if (start > 0 && isWordChar(text.charAt(start - 1))) return false;
                  if (end < text.length() && isWordChar(text.charAt(end))) return false;
                  return true;
              }

              private static boolean isWordChar(char c) {
                  return Character.isLetterOrDigit(c) || c == '_';
              }
          }
