              private void extractCharacterTags(String textBlock, Map<String, String> roster) {
                  Pattern p = Pattern.compile("^\\s*([^\\[\\]:]+)\\s*\\[([^\\]]+Voice)\\]\\s*:", Pattern.CASE_INSENSITIVE);
                  for (String line : textBlock.split("\n")) {
                      Matcher m = p.matcher(line);
                      if (m.find()) {
                          String cleanC = m.group(1).trim();
                          String cleanT = m.group(2).trim();
                          if (!cleanC.isEmpty() && !cleanT.toLowerCase(Locale.US).contains("narrator")) {
                              roster.put(cleanC, cleanT);
                          }
                      }
                  }
              }

              private void formatStoryPart(final int idx, final List<String> storyChunks, final List<String> formattedParts,
                                           final Map<String, String> characterRoster, final int myGenId,
                                           final BiConsumerBoolStr finishStoryFormat) {
                  if (cancellationRequested || myGenId != currentGenerationId.get()) {
                      finishStoryFormat.accept(!formattedParts.isEmpty(), "Cancelled by user");
                      return;
                  }
                  if (idx >= storyChunks.size()) {
                      finishStoryFormat.accept(true, null);
                      return;
                  }

                  final int totalParts = storyChunks.size();
                  final int pct = Math.max(5, (int) ((idx * 100.0) / totalParts));
                  runOnUi(() -> {
                      createStoryBtn.setText("CREATING STORY (" + pct + "%)...");
                      statusText.setText("[" + pct + "%] Formatting story part " + (idx + 1) + " of " + totalParts + "...");
                  });

                  StringBuilder rosterHint = new StringBuilder();
                  if (!characterRoster.isEmpty()) {
                      rosterHint.append("\nKEEP ASSIGNED VOICES: ");
                      boolean first = true;
                      for (Map.Entry<String, String> e : characterRoster.entrySet()) {
                          if (!first) rosterHint.append(", ");
                          rosterHint.append(e.getKey()).append("=[").append(e.getValue()).append("]");
                          first = false;
                      }
                      rosterHint.append("\n");
                  }

                  String prompt = "Format this story into a multi-voice script WITHOUT omitting or changing any text or language.\n"
                      + "Rules:\n"
                      + "1. Narration lines start with: [Narrator Voice]: \n"
                      + "2. Character dialogues start with: Name [Male One Voice]:  or Name [Female One Voice]: \n"
                      + "3. Match true gender from names, titles, and grammar (boli/kehti=Female, bola/kehta=Male). Use Male One..Fifteen Voice ONLY for males, Female One..Thirteen Voice ONLY for females. Unique voice per character.\n"
                      + "4. No English words/emotion tags inside dialogue, no markdown, no extra text.\n"
                      + rosterHint + "\nStory:\n" + storyChunks.get(idx);

                  callGeminiTextModel(prompt, 0, 0, false, myGenId, (ok, resText, modelUsed) -> {
                      if (!ok) {
                          finishStoryFormat.accept(false, resText);
                          return;
                      }
                      String cleaned = resText.replaceAll("```\\w*", "").replace("```", "").replace("**", "").trim();
                      extractCharacterTags(cleaned, characterRoster);
                      formattedParts.add(cleaned);
                      delay(400, () -> formatStoryPart(idx + 1, storyChunks, formattedParts, characterRoster, myGenId, finishStoryFormat));
                  });
              }

              // ==================== Audio Generation Engine ====================

              private class AudioGenSession {
                  final int myGenId;
                  final List<TtsJob> jobs;
                  final int totalChunks;
                  int completedChunks;
                  volatile int currentJobIndex;
                  final String baseName;
                  final String modeName;
                  final String oldPartialPath;
                  final File tempFile;
                  final FileOutputStream fos;
                  long totalAudioLen;
                  boolean isFinalized = false;
                  String lastErrorMsg = "";
                  int failedChunkIndex = -1;

                  AudioGenSession(int myGenId, List<TtsJob> jobs, int completedChunks, int startIndex, String baseName,
                                  String modeName, String oldPartialPath, File tempFile, FileOutputStream fos, long totalAudioLen) {
                      this.myGenId = myGenId;
                      this.jobs = jobs;
                      this.totalChunks = jobs.size();
                      this.completedChunks = completedChunks;
                      this.currentJobIndex = startIndex;
                      this.baseName = baseName;
                      this.modeName = modeName;
                      this.oldPartialPath = oldPartialPath;
                      this.tempFile = tempFile;
                      this.fos = fos;
                      this.totalAudioLen = totalAudioLen;
                  }
              }

              private void generateFullAudio(final String text, final String requestedMode, final ResumeState customResumeState) {
                  cancellationRequested = false;
                  final int myGenId = currentGenerationId.incrementAndGet();

                  bgExecutor.execute(() -> {
                      try {
                          List<TtsJob> jobs;
                          int completedChunks;
                          int startIndex;
                          String baseName;
                          String modeName = requestedMode;
                          String oldPartialPath = null;
                          File tempFile = new File(getSafeBaseDir(), "tts_temp_" + System.currentTimeMillis() + ".wav");
                          FileOutputStream fos = new FileOutputStream(tempFile);
                          writeWavHeader(fos, 0);
                          long totalAudioLen = 0;

                          if (customResumeState != null && customResumeState.partialWavPath != null && new File(customResumeState.partialWavPath).exists()) {
                              jobs = customResumeState.jobs;
                              completedChunks = customResumeState.completedChunks;
                              startIndex = customResumeState.nextIndex;
                              baseName = customResumeState.baseName;
                              if (customResumeState.modeName != null) modeName = customResumeState.modeName;
                              oldPartialPath = customResumeState.partialWavPath;

                              try (FileInputStream inOld = new FileInputStream(new File(oldPartialPath))) {
                                  long skipped = 0;
                                  while (skipped < 44) {
                                      long s = inOld.skip(44 - skipped);
                                      if (s <= 0) break;
                                      skipped += s;
                                  }
                                  byte[] buf = new byte[8192];
                                  int len;
                                  while ((len = inOld.read(buf)) != -1) {
                                      fos.write(buf, 0, len);
                                      totalAudioLen += len;
                                  }
                              } catch (Exception e) {
                                  logAppError("RESUME_READ", e.getMessage());
                              }
                          } else {
                              assignedVoices.clear();
                              usedVoices.clear();
                              dynMaleIndex = 0;
                              dynFemaleIndex = 0;

                              jobs = buildQuotaSavingJobs(text, modeName);
                              completedChunks = 0;
                              startIndex = 0;

                              if (jobs.isEmpty()) {
                                  try { fos.close(); tempFile.delete(); } catch (Exception ignored) {}
                                  runOnUi(() -> {
                                      generateBtn.setEnabled(true);
                                      generateBtn.setText("GENERATE AUDIO");
                                      generateBtn.setBackgroundColor(Color.parseColor("#2196F3"));
                                      stopBtn.setEnabled(false);
                                      showToast("No valid text to generate");
                                  });
                                  return;
                              }
                              String cleanUser = sanitizeFileName(userFileName);
                              baseName = !cleanUser.isEmpty() ? cleanUser : getDefaultFileName(modeName);
                          }

                          setKeepAwake(true);
                          final AudioGenSession session = new AudioGenSession(myGenId, jobs, completedChunks, startIndex,
                              baseName, modeName, oldPartialPath, tempFile, fos, totalAudioLen);

                          activeStopFinalize = () -> finalizeAudioSession(session, true, session.currentJobIndex);
                          processNextAudioJob(session, startIndex);
                      } catch (Exception e) {
                          setKeepAwake(false);
                          logAppError("AUDIO_INIT", e.getMessage());
                          runOnUi(() -> {
                              generateBtn.setEnabled(true);
                              generateBtn.setText("GENERATE AUDIO");
                              generateBtn.setBackgroundColor(Color.parseColor("#2196F3"));
                              stopBtn.setEnabled(false);
                              statusText.setText("Error initializing audio: " + sanitizeErrorText(e.getMessage()));
                              showErrorDialog("Error initializing audio: " + e.getMessage());
                          });
                      }
                  });
              }

              private void processNextAudioJob(final AudioGenSession s, final int index) {
                  s.currentJobIndex = index;
                  if (cancellationRequested || s.myGenId != currentGenerationId.get()) {
                      finalizeAudioSession(s, true, index);
                      return;
                  }
                  if (index >= s.totalChunks) {
                      finalizeAudioSession(s, false, -1);
                      return;
                  }

                  final int curPct = (int) ((s.completedChunks * 100.0) / s.totalChunks);
                  final int rem = s.totalChunks - s.completedChunks;
                  runOnUi(() -> {
                      generateBtn.setText("GENERATING AUDIO (" + curPct + "%)...");
                      statusText.setText("[" + curPct + "%] Parts: " + s.completedChunks + "/" + s.totalChunks + " done | " + rem + " remaining");
                  });

                  final TtsJob job = s.jobs.get(index);
                  if ("silence".equals(job.mode)) {
                      bgExecutor.execute(() -> {
                          try {
                              synchronized (s) {
                                  if (s.isFinalized) return;
                                  long added = writeSilenceSeconds(s.fos, job.pauseAfter > 0 ? job.pauseAfter : 0.5);
                                  s.totalAudioLen += added;
                                  s.completedChunks++;
                              }
                              processNextAudioJob(s, index + 1);
                          } catch (Exception e) {
                              s.failedChunkIndex = index + 1;
                              s.lastErrorMsg = "File write error: " + e.getMessage();
                              finalizeAudioSession(s, true, index);
                          }
                      });
                      return;
                  }

                  textToSpeechJob(job, 0, 0, 0, false, s.myGenId, (ok, rawBytes, offset, dataLen, errOrModel) -> {
                      if (cancellationRequested || s.myGenId != currentGenerationId.get()) {
                          finalizeAudioSession(s, true, index);
                          return;
                      }
                      if (!ok || rawBytes == null || dataLen <= 0) {
                          s.failedChunkIndex = index + 1;
                          s.lastErrorMsg = errOrModel != null ? errOrModel : "Generation failed";
                          finalizeAudioSession(s, true, index);
                          return;
                      }

                      bgExecutor.execute(() -> {
                          try {
                              synchronized (s) {
                                  if (s.isFinalized) return;
                                  s.fos.write(rawBytes, offset, dataLen);
                                  s.totalAudioLen += dataLen;
                                  if (job.pauseAfter > 0) {
                                      long added = writeSilenceSeconds(s.fos, job.pauseAfter);
                                      s.totalAudioLen += added;
                                  }
                                  s.completedChunks++;
                              }
                              final int newPct = (int) ((s.completedChunks * 100.0) / s.totalChunks);
                              final int newRem = s.totalChunks - s.completedChunks;
                              runOnUi(() -> {
                                  generateBtn.setText("GENERATING AUDIO (" + newPct + "%)...");
                                  statusText.setText("[" + newPct + "%] Parts: " + s.completedChunks + "/" + s.totalChunks + " done | " + newRem + " remaining");
                              });
                              delay(getChunkDelayMs(), () -> processNextAudioJob(s, index + 1));
                          } catch (Exception e) {
                              s.failedChunkIndex = index + 1;
                              s.lastErrorMsg = "File write error: " + e.getMessage();
                              finalizeAudioSession(s, true, index);
                          }
                      });
                  });
              }

              private void finalizeAudioSession(final AudioGenSession s, final boolean isPartial, final int nextIdxToResume) {
                  synchronized (s) {
                      if (s.isFinalized) return;
                      s.isFinalized = true;
                  }
                  activeStopFinalize = null;
                  bgExecutor.execute(() -> {
                      setKeepAwake(false);
                      try { s.fos.flush(); s.fos.close(); } catch (Exception ignored) {}

                      if (s.totalAudioLen <= 0) {
                          try { s.tempFile.delete(); } catch (Exception ignored) {}
                          runOnUi(() -> {
                              generateBtn.setEnabled(true);
                              generateBtn.setText("GENERATE AUDIO");
                              generateBtn.setBackgroundColor(Color.parseColor("#2196F3"));
                              stopBtn.setEnabled(false);
                              String msg = cancellationRequested
                                  ? "Generation stopped by user (0 parts completed)."
                                  : ("Failed: " + (!s.lastErrorMsg.isEmpty() ? s.lastErrorMsg : "Could not generate audio"));
                              statusText.setText(msg);
                              showToast(msg);
                              if (!cancellationRequested && !s.lastErrorMsg.isEmpty()) showErrorDialog(msg);
                          });
                          return;
                      }

                      String finalPath = new File(getLibraryDir(), s.baseName + ".wav").getPath();
                      final String actualFinalPath = isPartial
                          ? new File(getLibraryDir(), "PARTIAL_" + s.baseName + ".wav").getPath()
                          : finalPath;

                      boolean writeOk = false;
                      try (FileOutputStream finalFos = new FileOutputStream(new File(actualFinalPath));
                           FileInputStream tempIn = new FileInputStream(s.tempFile)) {
                          writeWavHeader(finalFos, s.totalAudioLen);
                          long skipped = 0;
                          while (skipped < 44) {
                              long sk = tempIn.skip(44 - skipped);
                              if (sk <= 0) break;
                              skipped += sk;
                          }
                          byte[] buf = new byte[8192];
                          int len;
                          while ((len = tempIn.read(buf)) != -1) finalFos.write(buf, 0, len);
                          finalFos.flush();
                          writeOk = true;
                      } catch (Exception e) {
                          logAppError("FILE_WRITE", "Failed writing final WAV: " + actualFinalPath + " -> " + e.getMessage());
                      }
                      try { s.tempFile.delete(); } catch (Exception ignored) {}

                      if (!writeOk) {
                          runOnUi(() -> {
                              generateBtn.setEnabled(true);
                              generateBtn.setText("GENERATE AUDIO");
                              generateBtn.setBackgroundColor(Color.parseColor("#2196F3"));
                              stopBtn.setEnabled(false);
                              statusText.setText("Error saving audio file to storage.");
                              showToast("Error saving audio file");
                          });
                          return;
                      }

                      if (isPartial && nextIdxToResume >= 0 && nextIdxToResume < s.totalChunks) {
                          ResumeState st = new ResumeState();
                          st.jobs = s.jobs;
                          st.totalChunks = s.totalChunks;
                          st.completedChunks = s.completedChunks;
                          st.nextIndex = nextIdxToResume;
                          st.partialWavPath = actualFinalPath;
                          st.totalAudioLen = s.totalAudioLen;
                          st.baseName = s.baseName;
                          st.modeName = s.modeName;
                          resumeState = st;
                          saveResumeMetaToDisk(resumeState);
                      } else {
                          if (s.oldPartialPath != null && !s.oldPartialPath.equals(actualFinalPath)) {
                              try { new File(s.oldPartialPath).delete(); } catch (Exception ignored) {}
                              deleteResumeMetaFromDisk(s.oldPartialPath);
                          }
                          deleteResumeMetaFromDisk(actualFinalPath);
                          resumeState = null;
                      }

                      generatedAudioPath = actualFinalPath;
                      final String durText = formatDurationReadable(getAudioDurationSec(generatedAudioPath));

                      runOnUi(() -> {
                          resultLayout.setVisibility(View.VISIBLE);
                          initMainMediaPlayer();
                          try {
                              mainMediaPlayer.setDataSource(generatedAudioPath);
                              mainMediaPlayer.prepare();
                              loadedMainAudioPath = generatedAudioPath;
                              mainMediaPlayer.setOnCompletionListener(mp -> {
                                  isMainPlaying = false;
                                  runOnUi(() -> playBtn.setText("PLAY"));
                              });
                          } catch (Exception ignored) {}
                          playBtn.setEnabled(true);
                          playBtn.setText("PLAY");
                          generateBtn.setEnabled(true);
                          generateBtn.setText("REGENERATE");
                          generateBtn.setBackgroundColor(Color.parseColor("#2196F3"));
                          stopBtn.setEnabled(false);

                          if (isPartial) {
                              if (resumeState != null) {
                                  resumeBtn.setVisibility(View.VISIBLE);
                                  resumeBtn.setText("RESUME AUDIO (" + (resumeState.nextIndex + 1) + "/" + s.totalChunks + ")");
                              } else {
                                  resumeBtn.setVisibility(View.GONE);
                              }
                              int pct = (int) ((s.completedChunks * 100.0) / s.totalChunks);
                              if (cancellationRequested) {
                                  statusText.setText("[" + pct + "%] Stopped: Saved " + s.completedChunks + "/" + s.totalChunks + " parts (" + durText + "). Tap PLAY or RESUME AUDIO.");
                                  showToast("Stopped! Partial Audio Saved to Library.");
                              } else {
                                  int partNum = s.failedChunkIndex > 0 ? s.failedChunkIndex : (nextIdxToResume + 1);
                                  statusText.setText("[" + pct + "%] Part " + partNum + " failed (" + s.lastErrorMsg + "). Saved " + s.completedChunks + "/" + s.totalChunks + " parts (" + durText + ").");
                                  showToast("Paused on error. Resume from Home or Audio Library.");
                              }
                          } else {
                              resumeBtn.setVisibility(View.GONE);
                              String labelPrefix = "broadcast".equals(s.modeName) ? "Broadcast Ready" : ("story".equals(s.modeName) ? "Story Ready" : "Audio Ready");
                              statusText.setText("[100%] " + labelPrefix + " (" + durText + ") | Parts: " + s.completedChunks + "/" + s.totalChunks);
                              showToast("Saved to Audio Library (" + durText + ")!");
                          }
                      });
                  });
              }

              private void startResumeFromLibrary(ResumeState meta) {
                  if (meta == null) return;
                  if (!isNetworkAvailable()) {
                      showToast("No internet connection!");
                      showErrorDialog("Please turn on Wi-Fi or Mobile Data to resume audio.");
                      return;
                  }
                  if (getWorkingApiKey(null) == null) {
                      showToast("Please configure API Key first!");
                      showApiSettings();
                      return;
                  }
                  releaseMainMediaPlayer();
                  resumeState = meta;
                  playBtn.setEnabled(false);
                  playBtn.setText("PLAY");
                  resumeBtn.setVisibility(View.GONE);
                  generateBtn.setEnabled(false);
                  generateBtn.setBackgroundColor(Color.parseColor("#9E9E9E"));
                  stopBtn.setEnabled(true);
                  generateFullAudio("", meta.modeName != null ? meta.modeName : "single", meta);
              }

              private void refreshHomeResumeState() {
                  resumeState = findLatestResumeState();
                  runOnUi(() -> {
                      if (resumeState != null && resumeState.partialWavPath != null && new File(resumeState.partialWavPath).exists()) {
                          resumeBtn.setVisibility(View.VISIBLE);
                          resumeBtn.setText("RESUME AUDIO (" + (resumeState.nextIndex + 1) + "/" + resumeState.totalChunks + ")");
                      } else {
                          resumeBtn.setVisibility(View.GONE);
                      }
                      if (generatedAudioPath != null && !new File(generatedAudioPath).exists()) {
                          releaseMainMediaPlayer();
                          generatedAudioPath = null;
                          resultLayout.setVisibility(View.GONE);
                          statusText.setText("");
                      }
                  });
              }

