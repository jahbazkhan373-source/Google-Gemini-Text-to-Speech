          import java.util.zip.GZIPInputStream;
          import java.util.zip.GZIPOutputStream;

          public class BackupManager {

              public static class BackupMeta {
                  public String id;
                  public String fileId;
                  public long timestamp;
                  public String label;
                  public long charCount;
                  public int lineCount;
                  public long byteSize;

                  public JSONObject toJson() throws JSONException {
                      JSONObject obj = new JSONObject();
                      obj.put("id", id);
                      obj.put("fileId", fileId);
                      obj.put("timestamp", timestamp);
                      obj.put("label", label);
                      obj.put("charCount", charCount);
                      obj.put("lineCount", lineCount);
                      obj.put("byteSize", byteSize);
                      return obj;
                  }

                  public static BackupMeta fromJson(JSONObject obj) {
                      BackupMeta m = new BackupMeta();
                      m.id = obj.optString("id", "");
                      m.fileId = obj.optString("fileId", "");
                      m.timestamp = obj.optLong("timestamp", 0L);
                      m.label = obj.optString("label", "Auto Backup");
                      m.charCount = obj.optLong("charCount", 0L);
                      m.lineCount = obj.optInt("lineCount", 0);
                      m.byteSize = obj.optLong("byteSize", 0L);
                      return m;
                  }
              }

              private static final String DIR_BACKUPS = "codebook_backups";
              private static final String BACKUPS_INDEX = "backups_index.json";

              private final File backupsRootDir;
              private final WorkspaceStorageManager workspace;

              public BackupManager(Context context) {
                  Context appCtx = context.getApplicationContext();
                  this.backupsRootDir = new File(appCtx.getFilesDir(), DIR_BACKUPS);
                  if (!backupsRootDir.exists()) backupsRootDir.mkdirs();
                  this.workspace = new WorkspaceStorageManager(appCtx);
              }

              public File getBackupsRootDir() {
                  return backupsRootDir;
              }

              public File getFileBackupDir(String fileId) {
                  File dir = new File(backupsRootDir, fileId);
                  if (!dir.exists()) dir.mkdirs();
                  return dir;
              }

              public File getBackupContentFile(String fileId, String backupId) {
                  return new File(getFileBackupDir(fileId), backupId + ".bak.gz");
              }

              public synchronized BackupMeta createBackup(String fileId, File sourceFile, String label,
                                                          long charCount, int lineCount, int maxBackups) throws IOException {
                  return createBackup(fileId, fileId, sourceFile, label, charCount, lineCount, maxBackups);
              }

              public synchronized BackupMeta createBackup(String fileId, String displayFolderName, File sourceFile, String label,
                                                          long charCount, int lineCount, int maxBackups) throws IOException {
                  if (fileId == null || fileId.isEmpty() || sourceFile == null || !sourceFile.exists()) {
                      return null;
                  }

                  String backupId = UUID.randomUUID().toString();
                  File gzFile = getBackupContentFile(fileId, backupId);
                  File tempGz = new File(gzFile.getParentFile(), backupId + ".tmp.gz");

                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(sourceFile), 65536);
                       GZIPOutputStream gzOut = new GZIPOutputStream(new BufferedOutputStream(new FileOutputStream(tempGz), 65536))) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) gzOut.write(buf, 0, len);
                      gzOut.finish();
                      gzOut.flush();
                  }
                  LargeFileEngine.atomicReplace(tempGz, gzFile);

                  String ts = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                  workspace.mirrorBackupFile(
                          (displayFolderName != null && !displayFolderName.isEmpty()) ? displayFolderName : fileId,
                          gzFile,
                          "backup_" + ts + ".bak.gz"
                  );

                  BackupMeta meta = new BackupMeta();
                  meta.id = backupId;
                  meta.fileId = fileId;
                  meta.timestamp = System.currentTimeMillis();
                  meta.label = (label != null && !label.isEmpty()) ? label : "Auto Backup";
                  meta.charCount = charCount;
                  meta.lineCount = lineCount;
                  meta.byteSize = sourceFile.length();

                  List<BackupMeta> list = listBackups(fileId);
                  list.add(0, meta);

                  int limit = Math.max(1, maxBackups);
                  while (list.size() > limit) {
                      BackupMeta oldest = list.remove(list.size() - 1);
                      File oldFile = getBackupContentFile(fileId, oldest.id);
                      if (oldFile.exists()) oldFile.delete();
                  }

                  saveIndex(fileId, list);
                  return meta;
              }

              public synchronized List<BackupMeta> listBackups(String fileId) {
                  List<BackupMeta> list = new ArrayList<>();
                  if (fileId == null || fileId.isEmpty()) return list;
                  File dir = new File(backupsRootDir, fileId);
                  File idx = new File(dir, BACKUPS_INDEX);
                  if (!idx.exists()) return list;

                  try {
                      byte[] data = readBytes(idx);
                      JSONArray arr = new JSONArray(new String(data, StandardCharsets.UTF_8));
                      for (int i = 0; i < arr.length(); i++) {
                          BackupMeta m = BackupMeta.fromJson(arr.getJSONObject(i));
                          if (getBackupContentFile(fileId, m.id).exists()) list.add(m);
                      }
                      Collections.sort(list, (a, b) -> Long.compare(b.timestamp, a.timestamp));
                  } catch (Exception ignored) {
                  }
                  return list;
              }

              public synchronized boolean hasBackups(String fileId) {
                  return !listBackups(fileId).isEmpty();
              }

              public synchronized void extractBackupToFile(String fileId, String backupId, File destFile) throws IOException {
                  File gzFile = getBackupContentFile(fileId, backupId);
                  if (!gzFile.exists()) throw new IOException("Backup file not found.");
                  File temp = new File(destFile.getParentFile(), destFile.getName() + ".extract.tmp");
                  try (GZIPInputStream gzIn = new GZIPInputStream(new BufferedInputStream(new FileInputStream(gzFile), 65536));
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = gzIn.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
                  LargeFileEngine.atomicReplace(temp, destFile);
              }

              public synchronized void deleteBackup(String fileId, String backupId) throws IOException {
                  List<BackupMeta> list = listBackups(fileId);
                  List<BackupMeta> kept = new ArrayList<>();
                  for (BackupMeta m : list) {
                      if (!backupId.equals(m.id)) kept.add(m);
                  }
                  File gz = getBackupContentFile(fileId, backupId);
                  if (gz.exists()) gz.delete();
                  saveIndex(fileId, kept);
              }

              public synchronized void deleteAllBackupsForFile(String fileId) {
                  deleteRecursive(new File(backupsRootDir, fileId));
              }

              public synchronized int cleanExcessBackups(int keepPerFile) {
                  int removed = 0;
                  File[] dirs = backupsRootDir.listFiles();
                  if (dirs == null) return 0;
                  int limit = Math.max(1, keepPerFile);

                  for (File dir : dirs) {
                      if (!dir.isDirectory()) continue;
                      String fileId = dir.getName();
                      List<BackupMeta> list = listBackups(fileId);
                      if (list.size() > limit) {
                          while (list.size() > limit) {
                              BackupMeta oldest = list.remove(list.size() - 1);
                              File f = getBackupContentFile(fileId, oldest.id);
                              if (f.exists()) f.delete();
                              removed++;
                          }
                          try {
                              saveIndex(fileId, list);
                          } catch (IOException ignored) {
                          }
                      }
                  }
                  return removed;
              }

              private void saveIndex(String fileId, List<BackupMeta> list) throws IOException {
                  File dir = getFileBackupDir(fileId);
                  File idx = new File(dir, BACKUPS_INDEX);
                  File temp = new File(dir, BACKUPS_INDEX + ".tmp");
                  JSONArray arr = new JSONArray();
                  try {
                      for (BackupMeta m : list) arr.put(m.toJson());
                  } catch (JSONException e) {
                      throw new IOException(e.getMessage());
                  }
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp))) {
                      out.write(arr.toString().getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  }
                  LargeFileEngine.atomicReplace(temp, idx);
              }

              private byte[] readBytes(File f) throws IOException {
                  byte[] data = new byte[(int) f.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(f))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return data;
              }

              private void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) deleteRecursive(c);
                      }
                  }
                  f.delete();
              }
          }
