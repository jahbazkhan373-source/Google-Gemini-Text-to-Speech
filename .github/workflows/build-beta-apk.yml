              private int getTargetDurationMinutes() {
                  if ("1 Minute".equals(selectedDuration)) return 1;
                  if ("5 Minutes".equals(selectedDuration)) return 5;
                  if ("10 Minutes".equals(selectedDuration)) return 10;
                  if ("15 Minutes".equals(selectedDuration)) return 15;
                  if ("30 Minutes".equals(selectedDuration)) return 30;
                  if ("1 Hour (60 Minutes)".equals(selectedDuration)) return 60;
                  int val = 10;
                  try {
                      String txt = customMinInput != null ? customMinInput.getText().toString().trim() : customMinutesStr;
                      val = Integer.parseInt(txt);
                  } catch (Exception ignored) {}
                  if (val < 1) val = 1;
                  if (val > 60) val = 60;
                  return val;
              }

              private void runCreateBroadcastScript() {
                  String rawInput = textInput.getText().toString().trim();
                  if (rawInput.isEmpty()) { showToast("Enter a topic or text first!"); return; }
                  if (getWorkingApiKey(null) == null) { showToast("Please configure API Key first!"); showApiSettings(); return; }
                  if (!isNetworkAvailable()) { showToast("No internet connection!"); return; }

                  cancellationRequested = false;
                  final int myGenId = currentGenerationId.incrementAndGet();

                  final int totalMins = getTargetDurationMinutes();
                  final int segments = Math.max(1, (int) Math.ceil(totalMins / 20.0));
                  final int minsPerSeg = (int) Math.ceil((double) totalMins / segments);

                  StringBuilder spkDesc = new StringBuilder();
                  for (int i = 0; i < broadcastSpeakerCount; i++) {
                      if (i > 0) spkDesc.append(", ");
                      String vStr = broadcastVoices[i];
                      String gender = vStr.contains("Female") ? "Female" : "Male";
                      spkDesc.append("Speaker").append(i + 1).append("(").append(gender).append(")");
                  }
                  final String speakersInfo = spkDesc.toString();

                  String moodGuide = selectedBroadcastMood;
                  if ("Funny Jokes".equals(selectedBroadcastMood)) {
                      moodGuide = "Funny Jokes: add witty jokes, teasing banter, and humorous punchlines throughout the topic.";
                  }
                  final String finalMoodGuide = moodGuide;

                  createScriptBtn.setEnabled(false);
                  generateBtn.setEnabled(false);
                  stopBtn.setEnabled(true);
                  setKeepAwake(true);

                  final List<String> builtParts = new ArrayList<>();
                  final boolean[] isDone = {false};

                  final BiConsumerBoolStr finishScript = (okAll, errMsg) -> {
                      synchronized (isDone) {
                          if (isDone[0]) return;
                          isDone[0] = true;
                      }
                      activeStopFinalize = null;
                      setKeepAwake(false);
                      runOnUi(() -> {
                          createScriptBtn.setEnabled(true);
                          createScriptBtn.setText("CREATE SCRIPT");
                          generateBtn.setEnabled(true);
                          stopBtn.setEnabled(false);
                          if (okAll && !builtParts.isEmpty()) {
                              StringBuilder sb = new StringBuilder();
                              for (int i = 0; i < builtParts.size(); i++) {
                                  if (i > 0) sb.append("\n");
                                  sb.append(builtParts.get(i));
                              }
                              setEditBoxTextFast(sb.toString());
                              statusText.setText("[100%] Script Ready in EditBox! Review it and tap GENERATE AUDIO.");
                              showToast("Script Ready in EditBox!");
                          } else {
                              String msg = errMsg != null ? errMsg : "Script creation failed";
                              statusText.setText("Error: " + msg);
                              if (!cancellationRequested) showErrorDialog(msg);
                          }
                      });
                  };

                  activeStopFinalize = () -> finishScript.accept(!builtParts.isEmpty(), "Stopped by user");

                  buildBroadcastSegment(1, segments, totalMins, minsPerSeg, speakersInfo, finalMoodGuide, rawInput, myGenId, builtParts, finishScript);
              }

              private interface BiConsumerBoolStr {
                  void accept(boolean ok, String msg);
              }

              private void buildBroadcastSegment(final int segIdx, final int segments, final int totalMins, final int minsPerSeg,
                                                 final String speakersInfo, final String moodGuide, final String rawInput,
                                                 final int myGenId, final List<String> builtParts, final BiConsumerBoolStr finishScript) {
                  if (cancellationRequested || myGenId != currentGenerationId.get()) {
                      finishScript.accept(!builtParts.isEmpty(), "Cancelled by user");
                      return;
                  }
                  if (segIdx > segments) {
                      finishScript.accept(true, null);
                      return;
                  }

                  final int pct = Math.max(5, (int) (((segIdx - 1) * 100.0) / segments));
                  runOnUi(() -> {
                      createScriptBtn.setText("WRITING SCRIPT (" + pct + "%)...");
                      statusText.setText("[" + pct + "%] Writing " + totalMins + " min script (Part " + segIdx + "/" + segments + ")...");
                  });

                  int targetWords = minsPerSeg * 135;
                  String prevContext = "";
                  if (!builtParts.isEmpty()) {
                      String lastStr = builtParts.get(builtParts.size() - 1);
                      String tail = lastStr.length() > 500 ? lastStr.substring(lastStr.length() - 500) : lastStr;
                      prevContext = "\nContinue seamlessly without repeating intro:\n" + tail + "\n";
                  }
                  String closingRule = (segIdx == segments) ? "End with a warm sign-off." : "Keep discussion open for next part.";
                  String openingRule = (segIdx == 1) ? "Start with a lively studio greeting." : "Continue directly.";
                  String turnHint = (broadcastSpeakerCount >= 3)
                      ? "Write 2-4 sentences per turn so conversations stay rich."
                      : "Keep natural back-and-forth turns.";

                  String prompt = "Write a natural interactive " + broadcastSpeakerCount + "-host broadcast script.\n"
                      + "Hosts: " + speakersInfo + "\nMood: " + moodGuide + "\n"
                      + "Length: ~" + targetWords + " words (" + minsPerSeg + " min). " + turnHint + "\n"
                      + "Hosts must talk to each other like real people in a studio: asking questions, reacting, teasing in comedy, or debating in serious moods.\n"
                      + "Use ONLY the EXACT language/script of the source text below. No English prefixes, no markdown, no asterisks, no brackets.\n"
                      + "Format every line strictly as Speaker1:, Speaker2:, ..., Speaker" + broadcastSpeakerCount + ": "
                      + openingRule + " " + closingRule + prevContext + "\nSource:\n" + rawInput;

                  callGeminiTextModel(prompt, 0, 0, false, myGenId, (ok, resText, modelUsed) -> {
                      if (!ok) {
                          finishScript.accept(false, resText);
                          return;
                      }
                      String cleaned = resText.replaceAll("```\\w*", "").replace("```", "").replace("**", "").trim();
                      builtParts.add(cleaned);
                      delay(400, () -> buildBroadcastSegment(segIdx + 1, segments, totalMins, minsPerSeg,
                          speakersInfo, moodGuide, rawInput, myGenId, builtParts, finishScript));
                  });
              }

