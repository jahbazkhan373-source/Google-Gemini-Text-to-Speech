              private final File stateFile;
              private final File dirtyPageFile;

              public CrashRecoveryManager(Context context) {
                  this.recoveryDir = new File(context.getApplicationContext().getFilesDir(), DIR_RECOVERY);
                  if (!recoveryDir.exists()) recoveryDir.mkdirs();
                  this.stateFile = new File(recoveryDir, STATE_FILE);
                  this.dirtyPageFile = new File(recoveryDir, DIRTY_PAGE_FILE);
