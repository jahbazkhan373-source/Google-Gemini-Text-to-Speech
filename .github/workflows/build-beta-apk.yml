                  String[] codes = {"ur", "hi", "ar", "bn", "zh", "es", "fr"};

                  new AlertDialog.Builder(this)
                          .setTitle("Add Multi-Language strings.xml to App")
                          .setItems(langs, (d, which) -> {
                              String code = codes[which];
                              String rel = "res/values-" + code + "/strings.xml";
                              String xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"app_name\">"
                                      + project.appName + "</string>\n</resources>\n";
                              try {
                                  projectRepo.writeProjectTextFile(project, rel, xml);
                                  AccessibilityHelper.announce(this, rootContainer, "Created " + rel + ". Open it from Files switcher in Editor.");
                              } catch (Exception e) {
