              private LibFileInfo buildLibBaseInfo(File file, ResumeState resumeMeta) {
                  String fileName = file.getName();
                  long byteLen = file.length();
                  if (byteLen <= 44) return new LibFileInfo(fileName + " - [Corrupt / Empty File]", 0, true);
                  double sizeMB = byteLen / (1024.0 * 1024.0);
                  int durSec = (int) Math.max(0, (byteLen - 44) / 48000L);
                  String suffix = "";
                  if (resumeMeta != null) {
                      suffix = String.format(Locale.US, " [Paused %d/%d]", resumeMeta.completedChunks, resumeMeta.totalChunks);
                  }
                  return new LibFileInfo(String.format(Locale.US, "%s - %.2f MB%s", fileName, sizeMB, suffix), durSec, false);
              }

              private void showAudioLibrary() {
                  if (mainMediaPlayer != null && isMainPlaying) {
                      try { mainMediaPlayer.stop(); } catch (Exception ignored) {}
                      isMainPlaying = false;
                      runOnUi(() -> playBtn.setText("PLAY"));
                  }

                  LinearLayout rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setPadding(dp(12), dp(12), dp(12), dp(12));

                  EditText searchInput = new EditText(this);
                  searchInput.setHint("Search audio files...");
                  searchInput.setContentDescription("Search audio files in library");
                  searchInput.setBackgroundColor(Color.parseColor("#F5F5F5"));
                  searchInput.setPadding(dp(10), dp(8), dp(10), dp(8));
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  sp.bottomMargin = dp(10);
                  searchInput.setLayoutParams(sp);
                  rootLayout.addView(searchInput);

                  ScrollView scroll = new ScrollView(this);
                  final LinearLayout mainLayout = new LinearLayout(this);
                  mainLayout.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(mainLayout);
                  rootLayout.addView(scroll);

                  final AlertDialog libDialog = new AlertDialog.Builder(this)
                      .setTitle("Audio Library")
                      .setView(rootLayout)
                      .create();

                  final String[] currentQuery = {""};
                  final Runnable[] renderRef = new Runnable[1];

                  renderRef[0] = () -> {
                      mainLayout.removeAllViews();
                      File dir = getLibraryDir();
                      File[] files = dir.listFiles();
                      List<File> fileList = new ArrayList<>();
                      String qLower = currentQuery[0].trim().toLowerCase(Locale.US);

                      if (files != null) {
                          for (File f : files) {
                              if (f != null && f.getName().endsWith(".wav")) {
                                  if (qLower.isEmpty() || f.getName().toLowerCase(Locale.US).contains(qLower)) {
                                      fileList.add(f);
                                  }
                              }
                          }
                      }
                      Collections.sort(fileList, (a, b) -> Long.compare(b.lastModified(), a.lastModified()));

                      if (fileList.isEmpty()) {
                          TextView emptyTxt = new TextView(this);
                          emptyTxt.setText(qLower.isEmpty() ? "Library is empty. Generate some audio first!" : "No matching audio files found.");
                          emptyTxt.setGravity(Gravity.CENTER);
                          emptyTxt.setPadding(0, dp(24), 0, dp(24));
                          mainLayout.addView(emptyTxt);
                          return;
                      }

                      for (File f : fileList) {
                          final File[] currentFileRef = {f};
                          final String[] filePathRef = {f.getPath()};
                          final String[] fileNameRef = {f.getName()};
                          final ResumeState[] resumeMetaRef = {loadResumeMetaFromDisk(filePathRef[0])};
                          final LibFileInfo[] infoRef = {buildLibBaseInfo(f, resumeMetaRef[0])};
                          final float[] currentSpeedRef = {1.0f};

                          final LinearLayout card = new LinearLayout(this);
                          card.setOrientation(LinearLayout.VERTICAL);
                          card.setBackgroundColor(Color.parseColor("#E3F2FD"));
                          LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                          cp.bottomMargin = dp(12);
                          card.setLayoutParams(cp);
                          card.setPadding(dp(10), dp(10), dp(10), dp(10));

                          final TextView infoTxt = new TextView(this);
                          infoTxt.setText(infoRef[0].isCorrupt
                              ? infoRef[0].baseInfo
                              : (infoRef[0].baseInfo + " | 00:00 / " + formatMMSS(infoRef[0].totalSec)));
                          infoTxt.setTextColor(infoRef[0].isCorrupt ? Color.parseColor("#D32F2F") : Color.BLACK);
                          infoTxt.setTypeface(Typeface.DEFAULT_BOLD);
                          infoTxt.setTextSize(14);
                          infoTxt.setPadding(0, dp(3), 0, dp(6));
                          card.addView(infoTxt);

                          LinearLayout controlsLayout = new LinearLayout(this);
                          controlsLayout.setOrientation(LinearLayout.HORIZONTAL);
                          controlsLayout.setGravity(Gravity.CENTER);
                          controlsLayout.setPadding(0, dp(6), 0, dp(6));

                          Button btnRewind = new Button(this);
                          btnRewind.setText("REWIND 30s");
                          btnRewind.setTextSize(11);
                          btnRewind.setContentDescription("Rewind 30 seconds");
                          btnRewind.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                          final Button btnPlay = new Button(this);
                          btnPlay.setText("PLAY");
                          btnPlay.setTextSize(11);
                          btnPlay.setContentDescription("Play " + fileNameRef[0]);
                          LinearLayout.LayoutParams pPl = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                          pPl.leftMargin = dp(4);
                          pPl.rightMargin = dp(4);
                          btnPlay.setLayoutParams(pPl);

                          Button btnForward = new Button(this);
                          btnForward.setText("FORWARD 30s");
                          btnForward.setTextSize(11);
                          btnForward.setContentDescription("Forward 30 seconds");
                          btnForward.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                          controlsLayout.addView(btnRewind);
                          controlsLayout.addView(btnPlay);
                          controlsLayout.addView(btnForward);
                          card.addView(controlsLayout);

                          LinearLayout speedLayout = new LinearLayout(this);
                          speedLayout.setOrientation(LinearLayout.HORIZONTAL);
                          speedLayout.setGravity(Gravity.CENTER_VERTICAL);

                          final TextView speedLabel = new TextView(this);
                          speedLabel.setText("Speed: 1.0x");
                          speedLabel.setTextSize(12);

                          SeekBar speedBar = new SeekBar(this);
                          speedBar.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                          speedBar.setMax(15);
                          speedBar.setProgress(5);
                          speedBar.setContentDescription("Playback speed slider");

                          speedLayout.addView(speedLabel);
                          speedLayout.addView(speedBar);
                          card.addView(speedLayout);

                          if (resumeMetaRef[0] != null) {
                              Button btnLibResume = makeStyledButton(
                                  "RESUME (" + (resumeMetaRef[0].nextIndex + 1) + "/" + resumeMetaRef[0].totalChunks + ")",
                                  "#FF9800", 6);
                              card.addView(btnLibResume);
                              btnLibResume.setOnClickListener(v -> {
                                  releaseLibMediaPlayer();
                                  libDialog.dismiss();
                                  startResumeFromLibrary(resumeMetaRef[0]);
                              });
                          }

                          LinearLayout actionsRow1 = new LinearLayout(this);
                          actionsRow1.setOrientation(LinearLayout.HORIZONTAL);
                          actionsRow1.setPadding(0, dp(8), 0, 0);

                          Button btnDownload = new Button(this);
                          btnDownload.setText("DOWNLOAD");
                          btnDownload.setBackgroundColor(Color.parseColor("#4CAF50"));
                          btnDownload.setTextColor(Color.WHITE);
                          btnDownload.setTextSize(11);
                          btnDownload.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                          Button btnShare = new Button(this);
                          btnShare.setText("SHARE");
                          btnShare.setBackgroundColor(Color.parseColor("#009688"));
                          btnShare.setTextColor(Color.WHITE);
                          btnShare.setTextSize(11);
                          LinearLayout.LayoutParams pSh = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                          pSh.leftMargin = dp(6);
                          btnShare.setLayoutParams(pSh);

                          actionsRow1.addView(btnDownload);
                          actionsRow1.addView(btnShare);
                          card.addView(actionsRow1);

                          LinearLayout actionsRow2 = new LinearLayout(this);
                          actionsRow2.setOrientation(LinearLayout.HORIZONTAL);
                          actionsRow2.setPadding(0, dp(6), 0, 0);

                          Button btnRename = new Button(this);
                          btnRename.setText("RENAME");
                          btnRename.setBackgroundColor(Color.parseColor("#2196F3"));
                          btnRename.setTextColor(Color.WHITE);
                          btnRename.setTextSize(11);
                          btnRename.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                          Button btnDelete = new Button(this);
                          btnDelete.setText("DELETE");
                          btnDelete.setBackgroundColor(Color.parseColor("#F44336"));
                          btnDelete.setTextColor(Color.WHITE);
                          btnDelete.setTextSize(11);
                          LinearLayout.LayoutParams pDel = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                          pDel.leftMargin = dp(6);
                          btnDelete.setLayoutParams(pDel);

                          actionsRow2.addView(btnRename);
                          actionsRow2.addView(btnDelete);
                          card.addView(actionsRow2);

                          btnPlay.setOnClickListener(v -> {
                              if (infoRef[0].isCorrupt) {
                                  showToast("Cannot play corrupt or empty audio file");
                                  return;
                              }
                              if (filePathRef[0].equals(currentPlayingPath) && libMediaPlayer != null) {
                                  if (isLibPlaying) {
                                      try { libMediaPlayer.pause(); } catch (Exception ignored) {}
                                      isLibPlaying = false;
                                      stopLibTimer();
                                      updateActiveLibTimeText();
                                      btnPlay.setText("PLAY");
                                      btnPlay.setContentDescription("Play " + fileNameRef[0]);
                                  } else {
                                      try {
                                          if (Build.VERSION.SDK_INT >= 23) {
                                              PlaybackParams p = new PlaybackParams();
                                              p.setSpeed(currentSpeedRef[0]);
                                              libMediaPlayer.setPlaybackParams(p);
                                          }
                                          libMediaPlayer.start();
                                          isLibPlaying = true;
                                          btnPlay.setText("PAUSE");
                                          btnPlay.setContentDescription("Pause " + fileNameRef[0]);
                                          startLibTimer();
                                      } catch (Exception ignored) {}
                                  }
                              } else {
                                  stopLibTimer();
                                  if (libMediaPlayer != null) {
                                      try { libMediaPlayer.stop(); libMediaPlayer.release(); } catch (Exception ignored) {}
                                      libMediaPlayer = null;
                                  }
                                  isLibPlaying = false;
                                  if (currentPlayingBtn != null) currentPlayingBtn.setText("PLAY");
                                  if (currentPlayingInfoTxt != null && currentPlayingBaseInfo != null) {
                                      currentPlayingInfoTxt.setText(currentPlayingBaseInfo + " | 00:00 / " + formatMMSS(currentPlayingTotalSec));
                                  }

                                  libMediaPlayer = new MediaPlayer();
                                  try {
                                      libMediaPlayer.setDataSource(filePathRef[0]);
                                      libMediaPlayer.prepare();
                                      if (Build.VERSION.SDK_INT >= 23) {
                                          PlaybackParams p = new PlaybackParams();
                                          p.setSpeed(currentSpeedRef[0]);
                                          libMediaPlayer.setPlaybackParams(p);
                                      }
                                      libMediaPlayer.start();
                                      isLibPlaying = true;
                                      currentPlayingPath = filePathRef[0];
                                      currentPlayingBtn = btnPlay;
                                      currentPlayingInfoTxt = infoTxt;
                                      currentPlayingBaseInfo = infoRef[0].baseInfo;
                                      currentPlayingTotalSec = infoRef[0].totalSec;
                                      btnPlay.setText("PAUSE");
                                      btnPlay.setContentDescription("Pause " + fileNameRef[0]);
                                      startLibTimer();

                                      libMediaPlayer.setOnCompletionListener(mp -> {
                                          isLibPlaying = false;
                                          stopLibTimer();
                                          currentPlayingPath = null;
                                          runOnUi(() -> {
                                              btnPlay.setText("PLAY");
                                              btnPlay.setContentDescription("Play " + fileNameRef[0]);
                                              infoTxt.setText(infoRef[0].baseInfo + " | 00:00 / " + formatMMSS(infoRef[0].totalSec));
                                          });
                                      });
                                  } catch (Exception e) {
                                      isLibPlaying = false;
                                      currentPlayingPath = null;
                                      logAppError("LIB_PLAYER", "Failed to play " + fileNameRef[0]);
                                      showToast("Failed to play audio file");
                                  }
                              }
                          });

                          btnRewind.setOnClickListener(v -> {
                              if (filePathRef[0].equals(currentPlayingPath) && libMediaPlayer != null) {
                                  try {
                                      int pos = libMediaPlayer.getCurrentPosition();
                                      libMediaPlayer.seekTo(Math.max(0, pos - 30000));
                                      updateActiveLibTimeText();
                                  } catch (Exception ignored) {}
                              }
                          });

                          btnForward.setOnClickListener(v -> {
                              if (filePathRef[0].equals(currentPlayingPath) && libMediaPlayer != null) {
                                  try {
                                      int pos = libMediaPlayer.getCurrentPosition();
                                      libMediaPlayer.seekTo(Math.min(libMediaPlayer.getDuration(), pos + 30000));
                                      updateActiveLibTimeText();
                                  } catch (Exception ignored) {}
                              }
                          });

                          speedBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                              @Override
                              public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                                  currentSpeedRef[0] = 0.5f + (progress * 0.1f);
                                  speedLabel.setText(String.format(Locale.US, "Speed: %.1fx", currentSpeedRef[0]));
                                  if (filePathRef[0].equals(currentPlayingPath) && libMediaPlayer != null && isLibPlaying && Build.VERSION.SDK_INT >= 23) {
                                      try {
                                          PlaybackParams p = new PlaybackParams();
                                          p.setSpeed(currentSpeedRef[0]);
                                          libMediaPlayer.setPlaybackParams(p);
                                      } catch (Exception ignored) {}
                                  }
                              }
                              @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                              @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                          });

                          btnShare.setOnClickListener(v -> shareAudioFile(filePathRef[0]));

                          btnRename.setOnClickListener(v -> {
                              EditText editNewName = new EditText(MainActivity.this);
                              editNewName.setText(fileNameRef[0].replaceAll("\\.wav$", ""));
                              new AlertDialog.Builder(MainActivity.this)
                                  .setTitle("Rename Audio")
                                  .setView(editNewName)
                                  .setPositiveButton("SAVE", (d, w) -> {
                                      String newBase = sanitizeFileName(editNewName.getText().toString());
                                      if (newBase.isEmpty()) { showToast("Invalid file name"); return; }
                                      File newFile = new File(getLibraryDir(), newBase + ".wav");
                                      if (newFile.exists()) { showToast("A file with this name already exists"); return; }
                                      String oldPath = filePathRef[0];
                                      File oldMeta = new File(getResumeMetaPath(oldPath));
                                      if (currentFileRef[0].renameTo(newFile)) {
                                          if (oldMeta.exists()) {
                                              oldMeta.renameTo(new File(getResumeMetaPath(newFile.getPath())));
                                          }
                                          boolean wasPlayingThis = oldPath.equals(currentPlayingPath);
                                          if (oldPath.equals(generatedAudioPath)) {
                                              generatedAudioPath = newFile.getPath();
                                              if (oldPath.equals(loadedMainAudioPath)) loadedMainAudioPath = newFile.getPath();
                                          }
                                          currentFileRef[0] = newFile;
                                          filePathRef[0] = newFile.getPath();
                                          fileNameRef[0] = newFile.getName();
                                          resumeMetaRef[0] = loadResumeMetaFromDisk(filePathRef[0]);
                                          infoRef[0] = buildLibBaseInfo(newFile, resumeMetaRef[0]);
                                          if (wasPlayingThis) {
                                              currentPlayingPath = filePathRef[0];
                                              currentPlayingBaseInfo = infoRef[0].baseInfo;
                                              updateActiveLibTimeText();
                                          } else {
                                              infoTxt.setText(infoRef[0].baseInfo + " | 00:00 / " + formatMMSS(infoRef[0].totalSec));
                                          }
                                          refreshHomeResumeState();
                                          showToast("Renamed to " + fileNameRef[0]);
                                      } else {
                                          showToast("Failed to rename file");
                                      }
                                  })
                                  .setNegativeButton("CANCEL", null)
                                  .show();
                          });

                          btnDelete.setOnClickListener(v -> new AlertDialog.Builder(MainActivity.this)
                              .setTitle("Confirm Delete")
                              .setMessage("Are you sure you want to delete this audio?")
                              .setPositiveButton("YES", (d, w) -> {
                                  if (filePathRef[0].equals(currentPlayingPath) && libMediaPlayer != null) {
                                      releaseLibMediaPlayer();
                                  }
                                  boolean deleted = currentFileRef[0].delete();
                                  deleteResumeMetaFromDisk(filePathRef[0]);
                                  if (deleted || !currentFileRef[0].exists()) {
                                      mainLayout.removeView(card);
                                      refreshHomeResumeState();
                                      showToast("Deleted " + fileNameRef[0]);
                                  } else {
                                      showToast("Error: Could not delete " + fileNameRef[0]);
                                  }
                              })
                              .setNegativeButton("NO", null)
                              .show());

                          btnDownload.setOnClickListener(v -> {
                              String res = saveFileToDownloads(filePathRef[0], fileNameRef[0]);
                              if ("OK".equals(res)) showToast("Saved to Downloads: " + fileNameRef[0]);
                              else showToast("Download failed: " + res.replace("ERR:", ""));
                          });

                          mainLayout.addView(card);
                      }
                  };

                  renderRef[0].run();

                  searchInput.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {}
                      @Override
                      public void afterTextChanged(Editable s) {
                          currentQuery[0] = s.toString();
                          renderRef[0].run();
                      }
                  });

                  libDialog.setOnDismissListener(d -> releaseLibMediaPlayer());
                  libDialog.show();
              }

              // ==================== Main UI ====================

              private String getActiveModeName() {
                  if (isBroadcastMode) return "broadcast";
                  if (isStoryMode) return "story";
                  return "single";
              }

              private void setupSpinner(Spinner spinner, final String[] list, String selectedItem, final OnSpinSelect cb) {
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, list);
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  spinner.setAdapter(adapter);
                  for (int i = 0; i < list.length; i++) {
                      if (list[i].equals(selectedItem)) {
                          spinner.setSelection(i);
                          break;
                      }
                  }
                  spinner.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(AdapterView<?> parent, View view, int pos, long id) {
                          cb.onSelect(list[pos], pos);
                      }
                      @Override public void onNothingSelected(AdapterView<?> parent) {}
                  });
              }

              private void syncAllModelSpinners(String modelVal, int pos) {
                  if (isSyncingModelSpinners) return;
                  isSyncingModelSpinners = true;
                  selectedModel = modelVal;
                  if (modelSpinSingle.getSelectedItemPosition() != pos) modelSpinSingle.setSelection(pos);
                  if (modelSpinStory.getSelectedItemPosition() != pos) modelSpinStory.setSelection(pos);
                  if (modelSpinBroadcast.getSelectedItemPosition() != pos) modelSpinBroadcast.setSelection(pos);
                  saveSettings();
                  isSyncingModelSpinners = false;
              }

              private void updateModeVisibility() {
                  singleModeLayout.setVisibility((!isStoryMode && !isBroadcastMode) ? View.VISIBLE : View.GONE);
                  storyModeLayout.setVisibility(isStoryMode ? View.VISIBLE : View.GONE);
                  broadcastModeLayout.setVisibility(isBroadcastMode ? View.VISIBLE : View.GONE);
                  if (isBroadcastMode) {
                      modeStatusText.setText("Broadcast Studio Active (" + broadcastSpeakerCount + " Hosts)");
                      textInput.setHint("Enter topic to CREATE SCRIPT, or paste script to GENERATE AUDIO... Max " + MAX_TOTAL_CHARS + " chars");
                  } else if (isStoryMode) {
                      modeStatusText.setText("Story Mode Active");
                      textInput.setHint("Paste story to CREATE STORY or tagged story to GENERATE AUDIO... Max " + MAX_TOTAL_CHARS + " chars");
                  } else {
                      modeStatusText.setText("Single Voice Active");
                      textInput.setHint("Type text here... Max " + MAX_TOTAL_CHARS + " chars");
                  }
              }

              private void updateBroadcastSpeakerRows() {
                  for (int i = 0; i < 6; i++) {
                      if (spkRows[i] != null) {
                          spkRows[i].setVisibility((i < broadcastSpeakerCount) ? View.VISIBLE : View.GONE);
                      }
                  }
                  if (isBroadcastMode) {
                      modeStatusText.setText("Broadcast Studio Active (" + broadcastSpeakerCount + " Hosts)");
                  }
              }

