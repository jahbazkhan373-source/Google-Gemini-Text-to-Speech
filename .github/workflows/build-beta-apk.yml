              private void showGlobalSearchDialog() {
                  EditText input = new EditText(this);
                  input.setHint("Search across all Library / Project files...");
                  new AlertDialog.Builder(this)
                          .setTitle("Global Search")
                          .setView(input)
                          .setPositiveButton("Search", (d, w) -> {
                              String q = input.getText().toString();
                              if (q.isEmpty()) return;
                              AccessibilityHelper.announce(this, rootContainer, "Running Global Search...");
                              executor.execute(() -> {
                                  List<File> files = new ArrayList<>();
                                  List<String> labels = new ArrayList<>();
                                  if (currentProject != null) {
                                      for (String rel : projectRepository.listEditableProjectFiles(currentProject)) {
                                          files.add(projectRepository.getProjectFile(currentProject, rel));
                                          labels.add(rel);
                                      }
                                  } else {
                                      for (CodeFileMeta meta : repository.getAllFiles()) {
                                          files.add(repository.getCodeFile(meta.id));
                                          labels.add(meta.name);
                                      }
                                  }
                                  List<SearchEngine.GlobalSearchMatch> matches = SearchEngine.searchAcrossFiles(
                                          files, labels, q, settings.isDefaultMatchCase(), settings.isDefaultWholeWord(), 250
                                  );
                                  runOnUiThread(() -> {
                                      if (matches.isEmpty()) {
                                          AccessibilityHelper.announce(this, rootContainer, "No matches found globally.");
                                          return;
                                      }
                                      String[] rows = new String[matches.size()];
                                      for (int i = 0; i < matches.size(); i++) {
                                          SearchEngine.GlobalSearchMatch m = matches.get(i);
                                          rows[i] = m.fileLabel + " (Line " + m.lineNumber + "): " + m.preview;
                                      }
                                      new AlertDialog.Builder(this)
                                              .setTitle("Global Results (" + matches.size() + ")")
                                              .setItems(rows, (dd, idx) -> {
                                                  SearchEngine.GlobalSearchMatch chosen = matches.get(idx);
                                                  if (currentProject != null) {
                                                      switchActiveProjectFile(chosen.fileLabel);
                                                  } else {
                                                      ClipboardHelper.copyPlainText(this, "SearchHit", rows[idx]);
                                                      AccessibilityHelper.announce(this, rootContainer, "Found in " + chosen.fileLabel + " line " + chosen.lineNumber);
                                                  }
                                              })
                                              .setNegativeButton(R.string.ok, null)
                                              .show();
                                  });
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void handleRunLuaDirect() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  AccessibilityHelper.announce(this, rootContainer, "Running Lua in offline sandbox...");
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          String code = new String(engine.readByteRangeRaw(0L, Math.min(engine.getTotalBytes(), 1_500_000L)), StandardCharsets.UTF_8);
                          LuaSandboxRunner.RunResult res = LuaSandboxRunner.runLuaCode(code, 5000L);
                          String msg = res.success ? res.output : ("Error:\n" + res.error + "\n\nOutput:\n" + res.output);
                          runOnUiThread(() -> {
                              AccessibilityHelper.announce(this, rootContainer, res.success ? "Lua executed successfully." : "Lua runtime error.");
                              new AlertDialog.Builder(this)
                                      .setTitle(res.success ? "Lua Console Output" : "Lua Runtime Error")
                                      .setMessage(msg)
                                      .setPositiveButton("Copy", (d, w) -> ClipboardHelper.copyPlainText(this, "LuaOutput", msg))
                                      .setNegativeButton(R.string.ok, null)
                                      .show();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Lua run error: " + e.getMessage()));
                      }
                  });
              }

              // ==================== ERROR CHECKING, COPY, AI ASSISTANT & SAFE FIX ====================

              private void runCodeErrorCheck() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final int level = settings.getErrorCheckLevel();

                  AccessibilityHelper.announce(this, rootContainer, "Checking " + currentLanguage + " code...");
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          CodeAnalyzerEngine.AnalysisReport report = CodeAnalyzerEngine.analyze(
                                  this, engine.getBackingFile(), currentLanguage, level
                          );

                          runOnUiThread(() -> {
                              activeIssues.clear();
                              activeIssues.addAll(report.issues);

                              if (activeIssues.isEmpty()) {
                                  currentIssueIndex = -1;
                                  layoutErrorNavBar.setVisibility(View.GONE);
                                  String okMsg = "No clear errors found." + (!report.notice.isEmpty() ? "\n" + report.notice : "");
                                  AccessibilityHelper.announce(this, rootContainer, okMsg);
                                  new AlertDialog.Builder(this)
                                          .setTitle("Check Complete")
                                          .setMessage(okMsg)
                                          .setPositiveButton(R.string.ok, null)
                                          .show();
                                  return;
                              }

                              currentIssueIndex = 0;
                              layoutErrorNavBar.setVisibility(View.VISIBLE);
                              btnPossibleErrors.setVisibility(report.possibleCount > 0 ? View.VISIBLE : View.GONE);
                              updateErrorNavBarUI();

                              String summary = "Found " + activeIssues.size() + " issue(s) (Errors: "
                                      + report.confirmedCount + ", Possible: " + report.possibleCount + ").";
                              if (!report.notice.isEmpty()) summary += " " + report.notice;
                              AccessibilityHelper.announce(this, rootContainer, summary);
                              showIssueDetailAndFixDialog(activeIssues.get(0), 0);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Check error: " + e.getMessage()));
                      }
                  });
              }

              private void copyAllActiveErrors() {
                  if (activeIssues.isEmpty()) return;
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < activeIssues.size(); i++) {
                      sb.append(i + 1).append(". ").append(activeIssues.get(i).formatCopyText()).append("\n\n");
                  }
                  ClipboardHelper.copyPlainText(this, "AllCodeErrors", sb.toString().trim());
                  AccessibilityHelper.announce(this, rootContainer, "Copied all " + activeIssues.size() + " errors.");
              }

              private void updateErrorNavBarUI() {
                  if (activeIssues.isEmpty() || currentIssueIndex < 0) {
                      layoutErrorNavBar.setVisibility(View.GONE);
                      return;
                  }
                  CodeIssue cur = activeIssues.get(currentIssueIndex);
                  String tag = cur.possibleError ? "Possible" : "Error";
                  tvErrorNavStatus.setText(tag + " " + (currentIssueIndex + 1) + "/" + activeIssues.size()
                          + " — Line " + cur.lineNumber + ": " + cur.name);
                  btnPrevError.setEnabled(activeIssues.size() > 1);
                  btnNextError.setEnabled(activeIssues.size() > 1);
              }

              private void navigateError(int delta) {
                  if (activeIssues.isEmpty()) return;
                  currentIssueIndex = (currentIssueIndex + delta + activeIssues.size()) % activeIssues.size();
                  updateErrorNavBarUI();
                  CodeIssue issue = activeIssues.get(currentIssueIndex);
                  jumpToLineWithCustomAnnouncement(
                          issue.lineNumber - 1,
                          "Issue " + (currentIssueIndex + 1) + " of " + activeIssues.size()
                                  + ", Line " + issue.lineNumber + ": " + issue.name + ". " + issue.reason
                  );
              }

              private void showFilteredIssuesDialog(boolean onlyPossible) {
                  List<Integer> matchingIndices = new ArrayList<>();
                  List<String> labels = new ArrayList<>();
                  for (int i = 0; i < activeIssues.size(); i++) {
                      CodeIssue issue = activeIssues.get(i);
                      if (onlyPossible && !issue.possibleError) continue;
                      matchingIndices.add(i);
                      labels.add((issue.possibleError ? "[Possible] " : "[Error] ") + "Line " + issue.lineNumber + ": " + issue.name);
                  }
                  if (matchingIndices.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "No matching issues.");
                      return;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(onlyPossible ? "Possible Errors (" + matchingIndices.size() + ")" : "All Errors")
                          .setItems(labels.toArray(new String[0]), (d, which) -> {
                              int idx = matchingIndices.get(which);
                              currentIssueIndex = idx;
                              updateErrorNavBarUI();
                              showIssueDetailAndFixDialog(activeIssues.get(idx), idx);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showIssueDetailAndFixDialog(CodeIssue issue, int index) {
                  StringBuilder msg = new StringBuilder();
                  msg.append("Status: ").append(issue.possibleError ? "Possible Error" : "Confirmed Error").append("\n");
                  msg.append("Error: ").append(issue.name).append("\n");
                  msg.append("Line: ").append(issue.lineNumber);
                  if (issue.columnNumber > 0) msg.append(" (Col ").append(issue.columnNumber).append(")");
                  msg.append("\nReason: ").append(issue.reason).append("\n");
                  if (!issue.codeLine.isEmpty()) msg.append("Code: ").append(issue.codeLine).append("\n");

                  if (issue.hasSafeFix()) {
                      msg.append("\nProposed Safe Fix: ").append(issue.fixDescription)
                              .append("\n(An automatic backup is created before YES is applied)\n\nApply this fix?");
                      new AlertDialog.Builder(this)
                              .setTitle("Error " + (index + 1) + " of " + activeIssues.size())
                              .setMessage(msg.toString())
                              .setPositiveButton(R.string.yes_en, (d, w) -> applyUserApprovedFix(issue))
                              .setNegativeButton(R.string.no_en, (d, w) -> AccessibilityHelper.announce(this, rootContainer, "No changes made."))
                              .setNeutralButton("Copy / Go to Line", (d, w) -> {
                                  ClipboardHelper.copyPlainText(this, "CodeError", issue.formatCopyText());
                                  jumpToLineFromAnywhere(issue.lineNumber - 1);
                              })
                              .show();
                  } else {
                      msg.append("\nAuto-fix is disabled because this fix is not 100% certain. Copy the error or jump to the line to edit manually.");
                      AlertDialog.Builder b = new AlertDialog.Builder(this)
                              .setTitle("Error " + (index + 1) + " of " + activeIssues.size())
                              .setMessage(msg.toString())
                              .setPositiveButton("Go to Line", (d, w) -> jumpToLineFromAnywhere(issue.lineNumber - 1))
                              .setNegativeButton("Copy Error", (d, w) -> {
                                  ClipboardHelper.copyPlainText(this, "CodeError", issue.formatCopyText());
                                  AccessibilityHelper.announce(this, rootContainer, "Error copied.");
                              });
                      if (!settings.getAiAssistantEndpoint().isEmpty()) {
                          b.setNeutralButton("Ask AI", (d, w) -> askAiForIssueHelp(issue));
                      }
                      b.show();
                  }
              }

              private void askAiForIssueHelp(CodeIssue issue) {
                  AccessibilityHelper.announce(this, rootContainer, "Asking AI Assistant...");
                  executor.execute(() -> {
                      try {
                          StringBuilder ctx = new StringBuilder();
                          int start = Math.max(0, issue.lineNumber - 6);
                          int end = Math.min(engine.getLineCount() - 1, issue.lineNumber + 4);
                          for (int i = start; i <= end; i++) {
                              ctx.append(i + 1).append(": ").append(engine.readLine(i)).append("\n");
                          }
                          String reply = OnlineAnalyzerClient.askAiAboutIssue(this, currentLanguage, issue, ctx.toString());
                          runOnUiThread(() -> new AlertDialog.Builder(this)
                                  .setTitle("AI Error Assistant")
                                  .setMessage(reply)
                                  .setPositiveButton("Copy Reply", (d, w) -> ClipboardHelper.copyPlainText(this, "AiReply", reply))
                                  .setNegativeButton(R.string.ok, null)
                                  .show());
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "AI Assistant error: " + e.getMessage()));
                      }
                  });
              }

              private void applyUserApprovedFix(CodeIssue issue) {
                  if (engine == null || !issue.hasSafeFix()) return;
                  executor.execute(() -> {
                      try {
                          String bId = getBackupKeyId();
                          if (bId != null) {
                              backupManager.createBackup(bId, currentFileName, engine.getBackingFile(),
                                      "Pre-Fix Safety Backup (Line " + issue.lineNumber + ")",
                                      engine.getTotalChars(), engine.getLineCount(), settings.getMaxBackupsPerFile());
                          }

                          int targetFocusLine = Math.max(0, issue.lineNumber - 1);
                          if (issue.fixType == CodeIssue.FixType.REPLACE_LINE) {
                              int lineIdx = Math.max(0, Math.min(issue.lineNumber - 1, engine.getLineCount() - 1));
                              long start = engine.getLineStartOffset(lineIdx);
                              long end = engine.getLineEndOffsetWithoutNewline(lineIdx);
                              undoManager.applyWithBytes(engine, start, end, issue.fixPayload.getBytes(StandardCharsets.UTF_8), "Error Fix", lineIdx);
                              targetFocusLine = lineIdx;
                          } else if (issue.fixType == CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF) {
                              String prefix = engine.needsNewlineBeforeAppend(issue.fixPayload.charAt(0)) ? engine.getLineEnding() : "";
                              undoManager.applyWithBytes(engine, engine.getTotalBytes(), engine.getTotalBytes(),
                                      (prefix + issue.fixPayload).getBytes(StandardCharsets.UTF_8), "Error Fix", Math.max(0, engine.getLineCount() - 1));
                              targetFocusLine = Math.max(0, engine.getLineCount() - 1);
                          }

                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          final int focusAfter = targetFocusLine;
                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(focusAfter, "Fix applied. Use Undo to revert if needed.");
                              });
                          } else {
                              currentPageIndex = engine.findPageForLine(focusAfter);
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "Fix applied. Use Undo to revert if needed.");
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Fix failed: " + e.getMessage()));
                      }
                  });
              }

