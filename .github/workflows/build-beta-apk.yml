                  File stagingDir = new File(context.getCacheDir(), "zip_restore_" + UUID.randomUUID());
                  if (!stagingDir.exists()) stagingDir.mkdirs();

                  try {
                      unzipUriSafely(context, zipUri, stagingDir);

                      File extractedIndex = new File(stagingDir, "library/index.json");
                      if (!extractedIndex.exists()) {
                          throw new IOException("Invalid Code Book library backup ZIP.");
                      }

                      String jsonStr = readUtf8(extractedIndex);
                      JSONArray array = new JSONArray(jsonStr);
                      int restoredCount = 0;
                      Map<String, String> idMap = new HashMap<>();

                      for (int i = 0; i < array.length(); i++) {
                          CodeFileMeta incoming = CodeFileMeta.fromJson(array.getJSONObject(i));
                          File extractedCode = new File(stagingDir, "library/" + incoming.id + ".code");
                          if (!extractedCode.exists()) continue;

                          CodeFileMeta saved = repo.importRestoredMetaAndFile(incoming, extractedCode);
                          idMap.put(incoming.id, saved.id);
                          restoredCount++;
                      }

                      File extractedBackupsRoot = new File(stagingDir, "backups");
                      if (extractedBackupsRoot.exists() && extractedBackupsRoot.isDirectory()) {
                          for (Map.Entry<String, String> pair : idMap.entrySet()) {
                              File oldBDir = new File(extractedBackupsRoot, pair.getKey());
                              if (oldBDir.exists() && oldBDir.isDirectory()) {
                                  File targetBDir = backupManager.getFileBackupDir(pair.getValue());
                                  File[] files = oldBDir.listFiles();
                                  if (files != null) {
                                      for (File f : files) {
                                          if (f.isFile()) {
                                              LibraryRepository.copyFileAtomic(f, new File(targetBDir, f.getName()));
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      return restoredCount;
                  } catch (IOException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IOException("ZIP restore error: " + e.getMessage());
                  } finally {
                      deleteRecursive(stagingDir);
                  }
              }

              private static String readUtf8(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return new String(data, StandardCharsets.UTF_8);
              }

              private static void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) deleteRecursive(c);
                      }
                  }
                  f.delete();
              }
          }
