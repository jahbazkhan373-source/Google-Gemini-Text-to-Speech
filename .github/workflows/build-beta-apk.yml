          package com.codebook.editor.ui;

          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.TextView;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;

          import com.codebook.editor.R;
          import com.codebook.editor.model.CodeFileMeta;
          import com.codebook.editor.storage.BackupManager;
          import com.codebook.editor.storage.LibraryRepository;
          import com.codebook.editor.storage.ZipBackupManager;
          import com.codebook.editor.util.AccessibilityHelper;

          import java.util.List;
