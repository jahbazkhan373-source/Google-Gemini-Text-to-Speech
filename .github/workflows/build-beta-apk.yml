                  try (InputStream in = context.getContentResolver().openInputStream(uri);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmp), 65536)) {
                      if (in == null) throw new IOException("Cannot open selected keystore file.");
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }

                  // Validate keystore & passwords (try PKCS12 then JKS)
                  KeyStore ks = null;
                  String detectedType = "PKCS12";
                  Exception lastErr = null;
                  for (String type : new String[]{"PKCS12", "JKS", "BKS"}) {
                      try {
                          KeyStore candidate = KeyStore.getInstance(type);
                          try (FileInputStream fis = new FileInputStream(tmp)) {
                              candidate.load(fis, storePass.toCharArray());
                          }
                          ks = candidate;
                          detectedType = type;
                          break;
                      } catch (Exception e) {
                          lastErr = e;
                      }
