name: Build Code Book Final APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Complete Code Book Project (All 5 Phases)
        run: |
          mkdir -p "app"
          mkdir -p "app/src/main"
          mkdir -p "app/src/main/java/com/codebook/editor"
          mkdir -p "app/src/main/java/com/codebook/editor/checker"
          mkdir -p "app/src/main/java/com/codebook/editor/engine"
          mkdir -p "app/src/main/java/com/codebook/editor/model"
          mkdir -p "app/src/main/java/com/codebook/editor/storage"
          mkdir -p "app/src/main/java/com/codebook/editor/ui"
          mkdir -p "app/src/main/java/com/codebook/editor/util"
          mkdir -p "app/src/main/res/drawable"
          mkdir -p "app/src/main/res/layout"
          mkdir -p "app/src/main/res/values"
          mkdir -p "app/src/main/res/values-night"
          cat > "app/build.gradle" <<'CODEBOOK_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.codebook.editor'
              compileSdk 36

              defaultConfig {
                  applicationId "com.codebook.editor"
                  minSdk 24
                  targetSdk 36
                  versionCode 5
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      def ksPath = System.getenv("KEYSTORE_PATH")
                      if (ksPath != null && file(ksPath).exists()) {
                          storeFile file(ksPath)
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      if (signingConfigs.release.storeFile != null) {
                          signingConfig signingConfigs.release
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              packaging {
                  resources {
                      excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.core:core:1.15.0'

              // حقیقی آف لائن جاوا اور لوا پارسر
              implementation 'com.github.javaparser:javaparser-core:3.25.10'
              implementation 'org.luaj:luaj-jse:3.0.1'

              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          CODEBOOK_EOF
          cat > "app/proguard-rules.pro" <<'CODEBOOK_EOF'
          # Code Book ProGuard Rules
          -keep class com.codebook.editor.model.** { *; }
          -keep class com.codebook.editor.checker.** { *; }
          -keep class com.github.javaparser.** { *; }
          -dontwarn com.github.javaparser.**
          -keep class org.luaj.** { *; }
          -dontwarn org.luaj.**
          CODEBOOK_EOF
          cat > "app/src/main/AndroidManifest.xml" <<'CODEBOOK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:name=".CodeBookApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CodeBook">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.EditorActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <activity
                      android:name=".ui.LibraryActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.BackupActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.DiffActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.LanguageCheckersActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.PerformanceTestActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ui.SettingsActivity"
                      android:exported="false" />

              </application>

          </manifest>
          CODEBOOK_EOF
          cat > "app/src/main/java/com/codebook/editor/CodeBookApp.java" <<'CODEBOOK_EOF'
          package com.codebook.editor;

          import android.app.Application;

          import com.codebook.editor.storage.CrashRecoveryManager;
          import com.codebook.editor.util.AppSettings;

          public class CodeBookApp extends Application {

              @Override
              public void onCreate() {
                  super.onCreate();
                  AppSettings settings = new AppSettings(this);
                  AppSettings.applyThemeMode(settings.getThemeMode());

                  final Thread.UncaughtExceptionHandler previousHandler = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((thread, throwable) -> {
                      try {
                          CrashRecoveryManager.saveLastCrashLog(getApplicationContext(), throwable);
                      } catch (Throwable ignored) {
                      }
                      if (previousHandler != null) {
                          previousHandler.uncaughtException(thread, throwable);
                      }
                  });
              }
          }
          CODEBOOK_EOF
          cat > "app/src/main/java/com/codebook/editor/checker/CodeAnalyzerEngine.java" <<'CODEBOOK_EOF'
          package com.codebook.editor.checker;

          import android.content.Context;

          import com.github.javaparser.JavaParser;
          import com.github.javaparser.ParseResult;
          import com.github.javaparser.ParserConfiguration;
          import com.github.javaparser.Problem;
          import com.github.javaparser.Range;
          import com.github.javaparser.TokenRange;
          import com.github.javaparser.ast.CompilationUnit;

          import org.luaj.vm2.LuaError;
          import org.luaj.vm2.compiler.LuaC;

          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Deque;
          import java.util.List;
          import java.util.Locale;
          import java.util.Optional;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class CodeAnalyzerEngine {

              private static final long FULL_PARSER_MAX_BYTES = 2_500_000L;
              private static final Pattern LUA_ERR_PATTERN = Pattern.compile(":(\\d+):\\s*(.+)");

              public static class AnalysisReport {
                  public final List<CodeIssue> issues;
                  public final int confirmedCount;
                  public final int possibleCount;
                  public final String notice;

                  public AnalysisReport(List<CodeIssue> issues, String notice) {
                      this.issues = issues;
                      int conf = 0;
                      int poss = 0;
                      for (CodeIssue i : issues) {
                          if (i.possibleError) poss++;
                          else conf++;
                      }
                      this.confirmedCount = conf;
                      this.possibleCount = poss;
                      this.notice = notice;
                  }
              }

              private static class OpenBracket {
                  final char ch;
                  final int line;
                  final int col;

                  OpenBracket(char ch, int line, int col) {
                      this.ch = ch;
                      this.line = line;
                      this.col = col;
                  }
              }

              public static AnalysisReport analyze(Context context, File file, String language, int checkLevel) throws IOException {
                  List<CodeIssue> issues = new ArrayList<>();
                  if (file == null || !file.exists() || file.length() == 0L) {
                      return new AnalysisReport(issues, "");
                  }

                  String lang = (language != null) ? language.trim() : "Other";
                  String langLower = lang.toLowerCase(Locale.ROOT);
                  LanguageCheckerManager manager = new LanguageCheckerManager(context);
                  LanguageRuleSpec activeSpec = manager.findActiveCheckerForLanguage(lang);

                  boolean languageCheckerActive = (activeSpec != null && activeSpec.enabled);
                  String notice = "";

                  if (checkLevel >= 3 && languageCheckerActive && ("java".equals(langLower) || "lua".equals(langLower))) {
                      if (file.length() > FULL_PARSER_MAX_BYTES) {
                          notice = "فائل 2.5 MB سے بڑی ہے؛ میموری محفوظ رکھنے کے لیے سطح 1 اور 2 کی ہلکی اسٹریمنگ جانچ کی گئی۔";
                          runLevel1StreamingCheck(file, langLower, activeSpec, issues);
                          runLevel2RulesCheck(file, langLower, activeSpec, issues);
                          return new AnalysisReport(issues, notice);
                      }

                      try {
                          String source = readUtf8String(file);
                          if (source.startsWith("\uFEFF")) {
                              source = source.substring(1);
                          }
                          if ("java".equals(langLower)) {
                              runJavaParserCheck(source, issues);
                          } else {
                              runLuaParserCheck(source, issues);
                          }
                          return new AnalysisReport(issues, notice);
                      } catch (OutOfMemoryError oom) {
                          notice = "موبائل کی میموری حد کی وجہ سے مکمل پارسر کی جگہ ہلکی اسٹریمنگ جانچ استعمال کی گئی۔";
                          issues.clear();
                          runLevel1StreamingCheck(file, langLower, activeSpec, issues);
                          return new AnalysisReport(issues, notice);
                      }
                  }

                  runLevel1StreamingCheck(file, langLower, activeSpec, issues);

                  if (checkLevel >= 2) {
                      if ("java".equals(langLower) || "lua".equals(langLower)) {
                          if (languageCheckerActive) {
                              runLevel2RulesCheck(file, langLower, activeSpec, issues);
                          }
                      } else if (activeSpec != null && activeSpec.enabled) {
                          runJsonRulesCheck(file, activeSpec, issues);
                      }
                  }

                  return new AnalysisReport(issues, notice);
              }

              private static void runJavaParserCheck(String source, List<CodeIssue> out) {
                  ParserConfiguration config = new ParserConfiguration();
                  config.setLanguageLevel(ParserConfiguration.LanguageLevel.JAVA_17);
                  JavaParser parser = new JavaParser(config);
                  ParseResult<CompilationUnit> result = parser.parse(source);

                  if (result.isSuccessful() && result.getProblems().isEmpty()) {
                      return;
                  }

                  String[] lines = source.split("\r?\n", -1);
                  for (Problem problem : result.getProblems()) {
                      int lineNum = 1;
                      int colNum = 0;

                      Optional<TokenRange> loc = problem.getLocation();
                      if (loc.isPresent() && loc.get().getBegin().getRange().isPresent()) {
                          Range r = loc.get().getBegin().getRange().get();
                          lineNum = r.begin.line;
                          colNum = r.begin.column;
                      }

                      String rawMsg = problem.getMessage() != null ? problem.getMessage() : "جاوا سینٹیکس غلطی";
                      String shortMsg = simplifyParserMessage(rawMsg);

                      String errorName = "جاوا سینٹیکس غلطی";
                      CodeIssue.FixType fixType = CodeIssue.FixType.NONE;
                      String fixDesc = null;
                      String fixPayload = null;

                      if (rawMsg.contains("\";\"") && rawMsg.toLowerCase(Locale.ROOT).contains("expected")) {
                          errorName = "سیمی کولن (;) کی کمی";
                          int candidateIdx = findLikelyMissingSemicolonLine(lines, lineNum - 1);
                          if (candidateIdx >= 0) {
                              String origLine = lines[candidateIdx];
                              String trimmed = origLine.trim();
                              if (!trimmed.isEmpty() && !trimmed.contains("//") && !trimmed.contains("/*")
                                      && !trimmed.endsWith(";") && !trimmed.endsWith("{") && !trimmed.endsWith("}")) {
                                  lineNum = candidateIdx + 1;
                                  fixType = CodeIssue.FixType.REPLACE_LINE;
                                  fixPayload = origLine + ";";
                                  fixDesc = "لائن " + lineNum + " کے آخر میں سیمی کولن (;) شامل کیا جائے گا۔";
                              }
                          }
                      } else if (rawMsg.contains("\"}\"") && rawMsg.toLowerCase(Locale.ROOT).contains("expected")) {
                          errorName = "بند قوس (}) کی کمی";
                          if (lineNum >= lines.length) {
                              fixType = CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF;
                              fixPayload = "}";
                              fixDesc = "فائل کے آخر میں بند قوس (}) شامل کی جائے گی۔";
                          }
                      } else if (rawMsg.contains("\")\"") && rawMsg.toLowerCase(Locale.ROOT).contains("expected")) {
                          errorName = "بند قوس ()) کی کمی";
                      }

                      out.add(new CodeIssue(
                              errorName,
                              lineNum,
                              colNum,
                              "جاوا پارسر کی تفصیل: " + shortMsg,
                              false,
                              fixType,
                              fixDesc,
                              fixPayload
                      ));
                  }
              }

              private static int findLikelyMissingSemicolonLine(String[] lines, int reportedIdx) {
                  if (reportedIdx < 0 || reportedIdx >= lines.length) return -1;
                  for (int idx = reportedIdx - 1; idx >= Math.max(0, reportedIdx - 3); idx--) {
                      String t = lines[idx].trim();
                      if (!t.isEmpty() && !t.startsWith("//") && !t.startsWith("/*") && !t.startsWith("*")) {
                          if (!t.endsWith(";") && !t.endsWith("{") && !t.endsWith("}") && !t.endsWith(",") && !t.startsWith("@")) {
                              return idx;
                          }
                          break;
                      }
                  }
                  String curr = lines[reportedIdx].trim();
                  if (!curr.isEmpty() && !curr.endsWith(";") && !curr.endsWith("{") && !curr.endsWith("}")) {
                      return reportedIdx;
                  }
                  return -1;
              }

              private static void runLuaParserCheck(String source, List<CodeIssue> out) {
                  try (ByteArrayInputStream bais = new ByteArrayInputStream(source.getBytes(StandardCharsets.UTF_8))) {
                      LuaC.instance.compile(bais, "code.lua");
                  } catch (LuaError err) {
                      String raw = err.getMessage() != null ? err.getMessage() : "لوا سینٹیکس غلطی";
                      int lineNum = 1;
                      String detail = raw;

                      Matcher m = LUA_ERR_PATTERN.matcher(raw);
                      if (m.find()) {
                          try {
                              lineNum = Integer.parseInt(m.group(1));
                          } catch (NumberFormatException ignored) {
                          }
                          detail = m.group(2);
                      }

                      String errorName = "لوا سینٹیکس غلطی";
                      CodeIssue.FixType fixType = CodeIssue.FixType.NONE;
                      String fixDesc = null;
                      String fixPayload = null;

                      String lower = detail.toLowerCase(Locale.ROOT);
                      if (lower.contains("'end' expected") && lower.contains("<eof>")) {
                          errorName = "لوا بلاک بند نہیں (end کی کمی)";
                          fixType = CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF;
                          fixPayload = "end";
                          fixDesc = "فائل کے آخر میں نئی لائن پر 'end' شامل کیا جائے گا۔";
                      } else if (lower.contains("')' expected")) {
                          errorName = "بند قوس ()) کی کمی";
                      } else if (lower.contains("'}' expected")) {
                          errorName = "بند قوس (}) کی کمی";
                      } else if (lower.contains("']' expected")) {
                          errorName = "بند قوس (]) کی کمی";
                      } else if (lower.contains("'then' expected")) {
                          errorName = "شرط کے بعد 'then' کی کمی";
                      } else if (lower.contains("'do' expected")) {
                          errorName = "لوپ کے بعد 'do' کی کمی";
                      } else if (lower.contains("unfinished string")) {
                          errorName = "نامکمل عبارت (اقتباس بند نہیں)";
                      }

                      out.add(new CodeIssue(
                              errorName,
                              lineNum,
                              0,
                              "لوا پارسر کی تفصیل: " + detail,
                              false,
                              fixType,
                              fixDesc,
                              fixPayload
                      ));
                  } catch (Exception e) {
                      out.add(new CodeIssue(
                              "لوا جانچ میں خرابی",
                              1,
                              0,
                              e.getMessage(),
                              true,
                              CodeIssue.FixType.NONE,
                              null,
                              null
                      ));
                  }
              }

              private static void runLevel1StreamingCheck(File file, String langLower,
                                                          LanguageRuleSpec spec, List<CodeIssue> out) throws IOException {
                  Deque<OpenBracket> stack = new ArrayDeque<>();
                  boolean inBlockComment = false;
                  int blockCommentStartLine = 1;
                  int totalLines = 0;

                  String lineCommentToken = getLineCommentToken(langLower, spec);
                  String blockStart = getBlockCommentStart(langLower, spec);
                  String blockEnd = getBlockCommentEnd(langLower, spec);

                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                      String line;
                      while ((line = br.readLine()) != null) {
                          totalLines++;
                          if (totalLines == 1 && line.startsWith("\uFEFF")) {
                              line = line.substring(1);
                          }

                          boolean inDoubleQuote = false;
                          boolean inSingleQuote = false;
                          int len = line.length();

                          for (int i = 0; i < len; i++) {
                              char c = line.charAt(i);

                              if (inBlockComment) {
                                  if (!blockEnd.isEmpty() && line.startsWith(blockEnd, i)) {
                                      inBlockComment = false;
                                      i += blockEnd.length() - 1;
                                  }
                                  continue;
                              }

                              if (inDoubleQuote) {
                                  if (c == '\\') {
                                      i++;
                                  } else if (c == '"') {
                                      inDoubleQuote = false;
                                  }
                                  continue;
                              }

                              if (inSingleQuote) {
                                  if (c == '\\') {
                                      i++;
                                  } else if (c == '\'') {
                                      inSingleQuote = false;
                                  }
                                  continue;
                              }

                              if (!blockStart.isEmpty() && line.startsWith(blockStart, i)) {
                                  inBlockComment = true;
                                  blockCommentStartLine = totalLines;
                                  i += blockStart.length() - 1;
                                  continue;
                              }

                              if (!lineCommentToken.isEmpty() && line.startsWith(lineCommentToken, i)) {
                                  break;
                              }

                              if (c == '"') {
                                  inDoubleQuote = true;
                                  continue;
                              }
                              if (c == '\'') {
                                  inSingleQuote = true;
                                  continue;
                              }

                              if (c == '(' || c == '{' || c == '[') {
                                  stack.push(new OpenBracket(c, totalLines, i + 1));
                              } else if (c == ')' || c == '}' || c == ']') {
                                  if (stack.isEmpty()) {
                                      out.add(new CodeIssue(
                                              "فالتو بند قوس (" + c + ")",
                                              totalLines,
                                              i + 1,
                                              "بند قوس '" + c + "' کے لیے کوئی کھلی قوس موجود نہیں۔",
                                              false,
                                              CodeIssue.FixType.NONE,
                                              null,
                                              null
                                      ));
                                  } else {
                                      OpenBracket top = stack.peek();
                                      if (matchesBracket(top.ch, c)) {
                                          stack.pop();
                                      } else {
                                          out.add(new CodeIssue(
                                                  "قوسین کا غلط جوڑا",
                                                  totalLines,
                                                  i + 1,
                                                  "لائن " + top.line + " پر کھلی قوس '" + top.ch + "' کی جگہ '" + c + "' ملی۔",
                                                  false,
                                                  CodeIssue.FixType.NONE,
                                                  null,
                                                  null
                                          ));
                                          stack.pop();
                                      }
                                  }
                              }
                          }

                          if (inDoubleQuote) {
                              out.add(new CodeIssue(
                                      "نامکمل عبارت (\" بند نہیں)",
                                      totalLines,
                                      len,
                                      "اس لائن پر ڈبل اقتباس (\") کھلا رہ گیا ہے۔",
                                      false,
                                      CodeIssue.FixType.REPLACE_LINE,
                                      "لائن " + totalLines + " کے آخر میں بند اقتباس (\") لگایا جائے گا۔",
                                      line + "\""
                              ));
                          }
                          if (inSingleQuote) {
                              out.add(new CodeIssue(
                                      "نامکمل عبارت (' بند نہیں)",
                                      totalLines,
                                      len,
                                      "اس لائن پر سنگل اقتباس (') کھلا رہ گیا ہے۔",
                                      false,
                                      CodeIssue.FixType.REPLACE_LINE,
                                      "لائن " + totalLines + " کے آخر میں بند اقتباس (') لگایا جائے گا۔",
                                      line + "'"
                              ));
                          }

                          if (out.size() >= 200) break;
                      }
                  }

                  if (inBlockComment) {
                      out.add(new CodeIssue(
                              "بلاک کمنٹ بند نہیں",
                              blockCommentStartLine,
                              1,
                              "لائن " + blockCommentStartLine + " پر شروع ہونے والا بلاک کمنٹ بند نہیں کیا گیا۔",
                              false,
                              CodeIssue.FixType.NONE,
                              null,
                              null
                      ));
                  }

                  boolean singleUnclosedAtEof = (stack.size() == 1);
                  while (!stack.isEmpty() && out.size() < 200) {
                      OpenBracket ob = stack.pop();
                      char expectedClose = closingFor(ob.ch);
                      CodeIssue.FixType fixType = singleUnclosedAtEof ? CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF : CodeIssue.FixType.NONE;
                      String fixDesc = singleUnclosedAtEof ? ("فائل کے آخر میں '" + expectedClose + "' شامل کیا جائے گا۔") : null;
                      String fixPayload = singleUnclosedAtEof ? String.valueOf(expectedClose) : null;

                      out.add(new CodeIssue(
                              "کھلی قوس (" + ob.ch + ") بند نہیں ہوئی",
                              ob.line,
                              ob.col,
                              "لائن " + ob.line + " پر کھولی گئی قوس '" + ob.ch + "' کو '" + expectedClose + "' سے بند نہیں کیا گیا۔",
                              false,
                              fixType,
                              fixDesc,
                              fixPayload
                      ));
                  }
              }

              private static void runLevel2RulesCheck(File file, String langLower,
                                                      LanguageRuleSpec spec, List<CodeIssue> out) throws IOException {
                  if ("lua".equals(langLower)) {
                      int depth = 0;
                      int lastOpenerLine = 1;
                      int lineNum = 0;
                      Pattern tokenPattern = Pattern.compile("\\b(function|if|for|while|repeat|end|until)\\b");

                      try (BufferedReader br = new BufferedReader(
                              new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                          String line;
                          while ((line = br.readLine()) != null) {
                              lineNum++;
                              int commentIdx = line.indexOf("--");
                              String codePart = (commentIdx >= 0) ? line.substring(0, commentIdx) : line;
                              Matcher m = tokenPattern.matcher(codePart);
                              while (m.find()) {
                                  String kw = m.group(1);
                                  if ("function".equals(kw) || "if".equals(kw) || "for".equals(kw)
                                          || "while".equals(kw) || "repeat".equals(kw)) {
                                      depth++;
                                      lastOpenerLine = lineNum;
                                  } else if ("end".equals(kw) || "until".equals(kw)) {
                                      depth--;
                                      if (depth < 0) {
                                          out.add(new CodeIssue(
                                                  "فالتو اختتامی لفظ (" + kw + ")",
                                                  lineNum,
                                                  1,
                                                  "لائن " + lineNum + " پر '" + kw + "' کے لیے کوئی کھلا بلاک نہیں ملا۔",
                                                  true,
                                                  CodeIssue.FixType.NONE,
                                                  null,
                                                  null
                                          ));
                                          depth = 0;
                                      }
                                  }
                              }
                          }
                      }
                      if (depth > 0) {
                          boolean singleMissing = (depth == 1);
                          out.add(new CodeIssue(
                                  "لوا بلاک بند نہیں (end کی کمی)",
                                  lastOpenerLine,
                                  1,
                                  "تقریباً " + depth + " لوا بلاک کھلے رہ گئے ہیں (آخری کھلا بلاک لائن " + lastOpenerLine + ")۔",
                                  true,
                                  singleMissing ? CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF : CodeIssue.FixType.NONE,
                                  singleMissing ? "فائل کے آخر میں 'end' شامل کیا جائے گا۔" : null,
                                  singleMissing ? "end" : null
                          ));
                      }
                  }
              }

              private static void runJsonRulesCheck(File file, LanguageRuleSpec spec, List<CodeIssue> out) throws IOException {
                  int lineNum = 0;
                  int blockDepth = 0;
                  int lastOpenLine = 1;

                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                      String line;
                      while ((line = br.readLine()) != null && out.size() < 200) {
                          lineNum++;
                          String work = line;
                          if (!spec.lineComment.isEmpty()) {
                              int idx = work.indexOf(spec.lineComment);
                              if (idx >= 0) work = work.substring(0, idx);
                          }
                          String trimmed = work.trim();
                          if (trimmed.isEmpty()) continue;

                          if (spec.requireColonOnOpeners) {
                              for (String opener : spec.blockOpeners) {
                                  if (trimmed.startsWith(opener) && !trimmed.endsWith(":") && !trimmed.endsWith("\\")) {
                                      out.add(new CodeIssue(
                                              "کولن (:) کی ممکنہ کمی (" + spec.language + ")",
                                              lineNum,
                                              line.length(),
                                              "لائن " + lineNum + " '" + opener.trim() + "' سے شروع ہوتی ہے لیکن آخر میں ':' نہیں ہے۔",
                                              true,
                                              CodeIssue.FixType.REPLACE_LINE,
                                              "لائن " + lineNum + " کے آخر میں ':' شامل کیا جائے گا۔",
                                              line + ":"
                                      ));
                                      break;
                                  }
                              }
                          } else if (!spec.blockOpeners.isEmpty() && !spec.blockClosers.isEmpty()) {
                              for (String op : spec.blockOpeners) {
                                  if (trimmed.startsWith(op)) {
                                      blockDepth++;
                                      lastOpenLine = lineNum;
                                  }
                              }
                              for (String cl : spec.blockClosers) {
                                  if (trimmed.equals(cl) || trimmed.startsWith(cl + " ")) {
                                      blockDepth--;
                                      if (blockDepth < 0) {
                                          out.add(new CodeIssue(
                                                  "فالتو اختتامی لفظ (" + cl + ")",
                                                  lineNum,
                                                  1,
                                                  spec.language + " رول کے مطابق لائن " + lineNum + " پر فالتو '" + cl + "' ہے۔",
                                                  true,
                                                  CodeIssue.FixType.NONE,
                                                  null,
                                                  null
                                          ));
                                          blockDepth = 0;
                                      }
                                  }
                              }
                          }
                      }
                  }

                  if (blockDepth > 0 && !spec.blockClosers.isEmpty()) {
                      out.add(new CodeIssue(
                              "بلاک بند نہیں (" + spec.language + ")",
                              lastOpenLine,
                              1,
                              "لائن " + lastOpenLine + " کے قریب " + blockDepth + " بلاک بند نہیں ہوئے۔",
                              true,
                              CodeIssue.FixType.NONE,
                              null,
                              null
                      ));
                  }
              }

              private static String getLineCommentToken(String langLower, LanguageRuleSpec spec) {
                  if (spec != null && !spec.lineComment.isEmpty()) return spec.lineComment;
                  if ("lua".equals(langLower)) return "--";
                  if ("python".equals(langLower)) return "#";
                  return "//";
              }

              private static String getBlockCommentStart(String langLower, LanguageRuleSpec spec) {
                  if (spec != null && !spec.blockCommentStart.isEmpty()) return spec.blockCommentStart;
                  if ("lua".equals(langLower)) return "--[[";
                  if ("python".equals(langLower)) return "";
                  return "/*";
              }

              private static String getBlockCommentEnd(String langLower, LanguageRuleSpec spec) {
                  if (spec != null && !spec.blockCommentEnd.isEmpty()) return spec.blockCommentEnd;
                  if ("lua".equals(langLower)) return "]]";
                  if ("python".equals(langLower)) return "";
                  return "*/";
              }

              private static boolean matchesBracket(char open, char close) {
                  return (open == '(' && close == ')')
                          || (open == '{' && close == '}')
                          || (open == '[' && close == ']');
              }

              private static char closingFor(char open) {
                  if (open == '(') return ')';
                  if (open == '{') return '}';
                  return ']';
              }

              private static String simplifyParserMessage(String raw) {
                  int nl = raw.indexOf('\n');
                  String firstLine = (nl > 0) ? raw.substring(0, nl).trim() : raw.trim();
                  return firstLine.length() > 240 ? firstLine.substring(0, 240) + "..." : firstLine;
              }

              private static String readUtf8String(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (FileInputStream in = new FileInputStream(file)) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return new String(data, StandardCharsets.UTF_8);
              }
          }
