                          long copyMs = System.currentTimeMillis() - tCopyStart;

                          Runtime rt = Runtime.getRuntime();
                          double usedRamMb = (rt.totalMemory() - rt.freeMemory()) / (1024.0 * 1024.0);
                          double maxRamMb = rt.maxMemory() / (1024.0 * 1024.0);
                          double fileMb = testFile.length() / (1024.0 * 1024.0);

                          String report = "نتیجہ برائے " + targetChars + " حروف:\n"
                                  + "• اصل حروف: " + actualChars + " (" + String.format(Locale.US, "%.2f MB", fileMb) + ")\n"
                                  + "• کل لائنیں: " + lines + "\n"
                                  + "• آل موڈ صفحات (حد " + settings.getPageCharLimit() + "): " + pages + "\n"
