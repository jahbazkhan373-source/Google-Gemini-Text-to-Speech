                          h.itemView.setContentDescription("Modified line " + e.newLineNumber + ". Old: " + e.oldText + ". New: " + e.newText);
                      } else if (e.type == DiffEngine.Type.ADDED) {
                          h.tvBadge.setText("Added — Line " + e.newLineNumber);
                          h.tvOld.setVisibility(View.GONE);
                          h.tvNew.setVisibility(View.VISIBLE);
                          h.tvNew.setText("+ " + e.newText);
                          h.itemView.setContentDescription("Added line " + e.newLineNumber + ": " + e.newText);
                      } else {
                          h.tvBadge.setText("Deleted — Old Line " + e.oldLineNumber);
                          h.tvOld.setVisibility(View.VISIBLE);
                          h.tvNew.setVisibility(View.GONE);
                          h.tvOld.setText("- " + e.oldText);
                          h.itemView.setContentDescription("Deleted line " + e.oldLineNumber + ": " + e.oldText);
                      }
                  }

                  @Override
                  public int getItemCount() {
                      return items.size();
                  }

                  static class VH extends RecyclerView.ViewHolder {
                      TextView tvBadge, tvOld, tvNew;

                      VH(@NonNull View v) {
                          super(v);
                          tvBadge = v.findViewById(R.id.tvDiffBadge);
                          tvOld = v.findViewById(R.id.tvDiffOld);
                          tvNew = v.findViewById(R.id.tvDiffNew);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
