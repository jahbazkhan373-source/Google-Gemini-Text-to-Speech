              public String generateManifestXml(ProjectMeta meta) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n");
                  sb.append("<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n");
                  sb.append("    package=\"").append(escapeXml(meta.packageName)).append("\">\n\n");

                  List<String> allPerms = new ArrayList<>();
                  if (meta.permissions != null) allPerms.addAll(meta.permissions);
                  if (meta.autoUpdateEnabled) {
                      if (!allPerms.contains("android.permission.INTERNET")) allPerms.add("android.permission.INTERNET");
                      if (!allPerms.contains("android.permission.REQUEST_INSTALL_PACKAGES")) allPerms.add("android.permission.REQUEST_INSTALL_PACKAGES");
                  }
                  for (String p : allPerms) {
                      if ("android.permission.WRITE_EXTERNAL_STORAGE".equals(p)) {
                          sb.append("    <uses-permission android:name=\"").append(escapeXml(p)).append("\" android:maxSdkVersion=\"28\" />\n");
                      } else if ("android.permission.READ_EXTERNAL_STORAGE".equals(p)) {
                          sb.append("    <uses-permission android:name=\"").append(escapeXml(p)).append("\" android:maxSdkVersion=\"32\" />\n");
                      } else {
                          sb.append("    <uses-permission android:name=\"").append(escapeXml(p)).append("\" />\n");
                      }
                  }

                  sb.append("\n    <application\n");
                  sb.append("        android:allowBackup=\"true\"\n");
                  sb.append("        android:label=\"").append(escapeXml(meta.appName)).append("\"\n");
                  sb.append("        android:supportsRtl=\"").append(meta.rtlSupport ? "true" : "false").append("\"\n");
                  if (meta.allowHttpTraffic) {
                      sb.append("        android:usesCleartextTraffic=\"true\"\n");
                  }
                  if (meta.iconFileName != null && !meta.iconFileName.isEmpty()) {
                      sb.append("        android:icon=\"@mipmap/ic_launcher\"\n");
                      sb.append("        android:roundIcon=\"@mipmap/ic_launcher\"\n");
                  }
                  sb.append("        android:enableOnBackInvokedCallback=\"true\"\n");
                  sb.append("        android:resizeableActivity=\"true\">\n\n");

                  // Automatic FileProvider (prevents FileUriExposedException on Android 7-17)
                  sb.append("        <provider\n");
                  sb.append("            android:name=\"androidx.core.content.FileProvider\"\n");
                  sb.append("            android:authorities=\"${applicationId}.fileprovider\"\n");
                  sb.append("            android:exported=\"false\"\n");
                  sb.append("            android:grantUriPermissions=\"true\">\n");
                  sb.append("            <meta-data\n");
                  sb.append("                android:name=\"android.support.FILE_PROVIDER_PATHS\"\n");
                  sb.append("                android:resource=\"@xml/file_paths\" />\n");
                  sb.append("        </provider>\n\n");

                  sb.append("        <activity\n");
                  sb.append("            android:name=\".MainActivity\"\n");
                  sb.append("            android:exported=\"true\"");
                  if ("portrait".equalsIgnoreCase(meta.orientation)) {
                      sb.append("\n            android:screenOrientation=\"portrait\"");
                  } else if ("landscape".equalsIgnoreCase(meta.orientation)) {
                      sb.append("\n            android:screenOrientation=\"landscape\"");
                  }
                  sb.append(">\n");
                  sb.append("            <intent-filter>\n");
                  sb.append("                <action android:name=\"android.intent.action.MAIN\" />\n");
                  sb.append("                <category android:name=\"android.intent.category.LAUNCHER\" />\n");
                  sb.append("            </intent-filter>\n");
                  sb.append("        </activity>\n");

                  if (meta.customManifestSection != null && !meta.customManifestSection.trim().isEmpty()) {
                      sb.append("\n        <!-- Custom Manifest Section (Preserved Safely) -->\n");
                      sb.append("        ").append(meta.customManifestSection.trim()).append("\n");
                  }

                  sb.append("\n    </application>\n</manifest>\n");
                  return sb.toString();
              }

