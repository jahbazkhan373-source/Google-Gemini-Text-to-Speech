              /**
               * Finds the matching closing or opening bracket line (1-based) starting from a given 0-based line index.
               * Returns -1 if no bracket found on that line or no matching pair exists.
               */
              public static int findMatchingBracketLine(File file, int fromLineIndex) throws IOException {
                  List<String> lines = readLinesLimited(file, 200_000);
                  if (fromLineIndex < 0 || fromLineIndex >= lines.size()) return -1;

                  String line = lines.get(fromLineIndex);
                  char openCh = 0;
                  char closeCh = 0;
                  boolean searchForward = true;

                  for (int i = 0; i < line.length(); i++) {
                      char c = line.charAt(i);
                      if (c == '{' || c == '(' || c == '[') {
                          openCh = c;
                          closeCh = (c == '{') ? '}' : (c == '(' ? ')' : ']');
                          searchForward = true;
                          break;
                      }
                  }
                  if (openCh == 0) {
                      for (int i = line.length() - 1; i >= 0; i--) {
                          char c = line.charAt(i);
                          if (c == '}' || c == ')' || c == ']') {
                              closeCh = c;
                              openCh = (c == '}') ? '{' : (c == ')' ? '(' : '[');
                              searchForward = false;
                              break;
                          }
                      }
                  }
                  if (openCh == 0) return -1;

                  int depth = 0;
                  if (searchForward) {
                      for (int ln = fromLineIndex; ln < lines.size(); ln++) {
                          String cur = lines.get(ln);
                          for (int i = 0; i < cur.length(); i++) {
                              char c = cur.charAt(i);
                              if (c == openCh) depth++;
                              else if (c == closeCh) {
                                  depth--;
                                  if (depth == 0) return ln + 1;
                              }
                          }
                      }
                  } else {
                      for (int ln = fromLineIndex; ln >= 0; ln--) {
                          String cur = lines.get(ln);
                          for (int i = cur.length() - 1; i >= 0; i--) {
                              char c = cur.charAt(i);
                              if (c == closeCh) depth++;
                              else if (c == openCh) {
                                  depth--;
                                  if (depth == 0) return ln + 1;
                              }
                          }
                      }
                  }
                  return -1;
              }

              /**
               * Reads current enclosing Class, Function, and open brace depth for Screen Reader context!
               */
              public static String describeCodeContextAtLine(File file, int targetLineIndex, String language) throws IOException {
                  List<String> lines = readLinesLimited(file, Math.max(targetLineIndex + 1, 1));
                  if (lines.isEmpty()) return "File is empty.";
                  int safeIdx = Math.max(0, Math.min(targetLineIndex, lines.size() - 1));

                  String currentClass = "None";
                  String currentFunction = "None";
                  int braceDepth = 0;
                  Pattern classPat = Pattern.compile("\\b(?:class|interface|enum)\\s+([A-Za-z_$][A-Za-z0-9_$]*)");
                  Pattern funcPat = Pattern.compile("(?:function\\s+([A-Za-z_][A-Za-z0-9_.:]*)|(?:public|private|protected|static|final|void|[A-Za-z0-9_<>]+)\\s+([A-Za-z_$][A-Za-z0-9_$]*)\\s*\\()");

                  for (int i = 0; i <= safeIdx; i++) {
                      String l = lines.get(i);
                      Matcher mc = classPat.matcher(l);
                      if (mc.find()) currentClass = mc.group(1);

                      Matcher mf = funcPat.matcher(l);
                      if (mf.find()) {
                          String fn = mf.group(1) != null ? mf.group(1) : mf.group(2);
                          if (fn != null && !"if".equals(fn) && !"for".equals(fn) && !"while".equals(fn) && !"switch".equals(fn) && !"catch".equals(fn)) {
                              currentFunction = fn;
                          }
                      }
                      for (int k = 0; k < l.length(); k++) {
                          char c = l.charAt(k);
                          if (c == '{') braceDepth++;
                          else if (c == '}' && braceDepth > 0) braceDepth--;
                      }
                  }
                  return "Line " + (safeIdx + 1) + " (" + language + ")"
                          + "\nClass: " + currentClass
                          + "\nFunction: " + currentFunction
                          + "\nOpen Braces Depth: " + braceDepth;
              }

              /**
               * Clean, safe Auto-Formatter for Java, Lua, JSON, XML, JS, CSS, HTML.
               */
              public static String autoFormatCode(String raw, String language, String indentUnit) {
                  if (raw == null || raw.isEmpty()) return "";
                  String lang = (language != null) ? language.toLowerCase(Locale.ROOT) : "";
                  String unit = (indentUnit != null && !indentUnit.isEmpty()) ? indentUnit : "    ";

                  if ("json".equals(lang)) {
                      try {
                          String trimmed = raw.trim();
                          if (trimmed.startsWith("{")) return new JSONObject(trimmed).toString(2);
                          if (trimmed.startsWith("[")) return new JSONArray(trimmed).toString(2);
                      } catch (Exception ignored) {
                      }
                  }

                  String[] lines = raw.split("\r?\n", -1);
                  StringBuilder out = new StringBuilder(raw.length() + 128);
                  int depth = 0;

                  for (int i = 0; i < lines.length; i++) {
                      String trimmed = lines[i].trim();
                      if (trimmed.isEmpty()) {
                          if (i < lines.length - 1) out.append('\n');
                          continue;
                      }

                      if ("lua".equals(lang)) {
                          if (trimmed.startsWith("end") || trimmed.startsWith("elseif") || trimmed.startsWith("else") || trimmed.startsWith("until")) {
                              depth = Math.max(0, depth - 1);
                          }
                          appendIndent(out, unit, depth);
                          out.append(trimmed);
                          if (i < lines.length - 1) out.append('\n');

                          if ((trimmed.startsWith("function ") || trimmed.contains("= function(")
                                  || trimmed.endsWith(" then") || trimmed.endsWith(" do")
                                  || trimmed.equals("else") || trimmed.equals("repeat"))
                                  && !trimmed.endsWith(" end")) {
                              depth++;
                          }
                      } else if ("xml".equals(lang) || "html".equals(lang)) {
                          if (trimmed.startsWith("</")) {
                              depth = Math.max(0, depth - 1);
                          }
                          appendIndent(out, unit, depth);
                          out.append(trimmed);
                          if (i < lines.length - 1) out.append('\n');

                          if (trimmed.startsWith("<") && !trimmed.startsWith("</") && !trimmed.startsWith("<?")
                                  && !trimmed.startsWith("<!") && !trimmed.endsWith("/>") && !trimmed.contains("</")) {
                              depth++;
                          }
                      } else {
                          if (trimmed.startsWith("}") || trimmed.startsWith(")") || trimmed.startsWith("]")) {
                              depth = Math.max(0, depth - 1);
                          }
                          appendIndent(out, unit, depth);
                          out.append(trimmed);
                          if (i < lines.length - 1) out.append('\n');

                          int opens = countCharOutsideQuotes(trimmed, '{');
                          int closes = countCharOutsideQuotes(trimmed, '}');
                          if (trimmed.startsWith("}")) closes = Math.max(0, closes - 1);
                          depth = Math.max(0, depth + opens - closes);
                      }
                  }
                  return out.toString();
              }

              private static void appendIndent(StringBuilder sb, String unit, int count) {
                  for (int i = 0; i < count; i++) sb.append(unit);
              }

              private static int countCharOutsideQuotes(String line, char target) {
                  int count = 0;
                  boolean inStr = false;
                  for (int i = 0; i < line.length(); i++) {
                      char c = line.charAt(i);
                      if (c == '\\') { i++; continue; }
                      if (c == '"') { inStr = !inStr; continue; }
                      if (!inStr && c == target) count++;
                  }
                  return count;
              }

              private static List<String> readLinesLimited(File file, int maxLines) throws IOException {
                  List<String> out = new ArrayList<>();
                  if (file == null || !file.exists()) return out;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                      String line;
                      while ((line = br.readLine()) != null && out.size() < maxLines) {
                          out.add(line);
                      }
                  }
                  return out;
              }
          }
