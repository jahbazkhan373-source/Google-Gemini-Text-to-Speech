                              tvResult.setText(msg);
                              AccessibilityHelper.announce(this, rootContainer, msg);
                          });
                      }
                  });
              }

              private void generateJavaTestFile(File dest, long targetChars) throws Exception {
                  long written = 0L;
                  int idx = 1;
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dest), 65536)) {
                      byte[] header = "public class BenchmarkCode {\n".getBytes(StandardCharsets.UTF_8);
                      out.write(header);
                      written += header.length;

                      while (written < targetChars - 2) {
                          String line = "    public static int calc" + idx + "(int x) { return x + " + idx + "; }\n";
                          byte[] bytes = line.getBytes(StandardCharsets.UTF_8);
                          if (written + bytes.length > targetChars - 2) {
                              int rem = (int) Math.max(0, targetChars - 2 - written);
                              if (rem > 0) {
                                  out.write(bytes, 0, Math.min(rem, bytes.length));
                                  written += rem;
                              }
                              break;
                          }
                          out.write(bytes);
                          written += bytes.length;
                          idx++;
                      }
                      out.write("\n}".getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  }
              }

              private void cleanBenchmarkFiles() {
                  File dir = new File(getCacheDir(), "benchmarks");
                  int count = 0;
                  if (dir.exists() && dir.isDirectory()) {
                      File[] files = dir.listFiles();
                      if (files != null) {
                          for (File f : files) {
                              if (f.delete()) count++;
                          }
                      }
                  }
                  lastTestFile = null;
                  btnOpenInEditor.setEnabled(false);
                  tvResult.setText("تمام عارضی آزمائشی فائلیں صاف کر دی گئیں۔");
                  AccessibilityHelper.announce(this, rootContainer, count + " عارضی ٹیسٹ فائلیں صاف کر دی گئیں۔");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
