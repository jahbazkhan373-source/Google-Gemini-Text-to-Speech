                      sb.append("  • 32-bit (armeabi-v7a): ").append(has32 ? "Yes" : "No").append("\n");
                      sb.append("  • 64-bit (arm64-v8a / Play Store): ").append(has64 ? "Yes" : "MISSING!").append("\n\n");
                  }

                  sb.append("Size Breakdown (").append(entryCount).append(" entries):\n");
                  sb.append("  • Code (DEX): ").append(formatSize(dexBytes)).append("\n");
                  sb.append("  • Resources (XML/Images/Audio): ").append(formatSize(resBytes)).append("\n");
                  sb.append("  • Assets: ").append(formatSize(assetsBytes)).append("\n");
                  sb.append("  • Native Libraries: ").append(formatSize(libBytes)).append("\n");
                  sb.append("  • Manifest & Signing: ").append(formatSize(otherBytes)).append("\n");

                  return sb.toString();
              }

              private static String formatSize(long bytes) {
                  if (bytes < 1024) return bytes + " B";
                  double kb = bytes / 1024.0;
                  if (kb < 1024) return String.format(Locale.US, "%.2f KB", kb);
                  return String.format(Locale.US, "%.2f MB", kb / 1024.0);
              }
