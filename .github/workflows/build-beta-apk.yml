              private void showToast(final String msg) {
                  runOnUi(() -> Toast.makeText(MainActivity.this, msg != null ? msg : "", Toast.LENGTH_SHORT).show());
              }

              private boolean isNetworkAvailable() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return true;
                      Network net = cm.getActiveNetwork();
                      if (net == null) return false;
                      NetworkCapabilities caps = cm.getNetworkCapabilities(net);
                      return caps != null && (
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) ||
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) ||
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET) ||
                          caps.hasTransport(NetworkCapabilities.TRANSPORT_VPN)
                      );
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void setKeepAwake(boolean keepAwake) {
                  try {
                      if (wakeLock != null) {
                          if (keepAwake) {
                              if (!wakeLock.isHeld()) wakeLock.acquire(60 * 60 * 1000L);
                          } else {
                              if (wakeLock.isHeld()) wakeLock.release();
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void disconnectActiveHttp() {
                  HttpURLConnection conn = activeConnection;
                  activeConnection = null;
                  if (conn != null) {
                      bgExecutor.execute(() -> {
                          try { conn.disconnect(); } catch (Exception ignored) {}
                      });
                  }
              }

              private String encodeSecret(String str) {
                  if (str == null || str.isEmpty()) return "";
                  try {
                      return "ENC:" + Base64.encodeToString(str.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                  } catch (Exception e) {
                      return str;
                  }
              }

              private String decodeSecret(String str) {
                  if (str == null || str.isEmpty()) return "";
                  if (str.startsWith("ENC:")) {
                      try {
                          byte[] bytes = Base64.decode(str.substring(4), Base64.NO_WRAP);
                          return new String(bytes, StandardCharsets.UTF_8);
                      } catch (Exception ignored) {}
                  }
                  return str;
              }

              private String sanitizeErrorText(String errText) {
                  String clean = errText != null ? errText : "Unknown Error";
                  for (String k : apiKeys) {
                      if (k != null && k.length() > 5) {
                          clean = clean.replace(k, "[HIDDEN_KEY]");
                      }
                  }
                  return clean;
              }

              private String extractApiErrorDetail(String content, String fallback) {
                  if (content != null && !content.isEmpty()) {
                      try {
                          JSONObject errObj = new JSONObject(content);
                          JSONObject e = errObj.optJSONObject("error");
                          if (e != null && e.has("message")) {
                              return sanitizeErrorText(e.optString("message"));
                          }
                      } catch (Exception ignored) {}
                  }
                  return fallback;
              }

              private void saveErrorLogs() {
                  try {
                      JSONArray arr = new JSONArray();
                      for (String s : errorLogs) arr.put(s);
                      prefs.edit().putString("error_logs", arr.toString()).apply();
                  } catch (Exception ignored) {}
              }

              private void loadErrorLogs() {
                  errorLogs.clear();
                  try {
                      String raw = prefs.getString("error_logs", "[]");
                      JSONArray arr = new JSONArray(raw);
                      for (int i = 0; i < arr.length(); i++) {
                          errorLogs.add(arr.optString(i, ""));
                      }
                  } catch (Exception ignored) {}
              }

              private synchronized void logAppError(String source, String msg) {
                  String cleanMsg = sanitizeErrorText(msg);
                  String stamp = new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date());
                  String entry = "[" + stamp + "] [" + source + "] " + cleanMsg;
                  errorLogs.add(entry);
                  while (errorLogs.size() > 50) {
                      errorLogs.remove(0);
                  }
                  saveErrorLogs();
              }

              private boolean writeTextFile(String path, String str) {
                  try (FileOutputStream fos = new FileOutputStream(new File(path))) {
                      fos.write(str.getBytes(StandardCharsets.UTF_8));
                      fos.flush();
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private String readTextFile(String path) {
                  File f = new File(path);
                  if (!f.exists() || f.length() <= 0) return null;
                  try (FileInputStream fis = new FileInputStream(f);
                       ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                      byte[] buf = new byte[4096];
                      int len;
                      while ((len = fis.read(buf)) != -1) bos.write(buf, 0, len);
                      return new String(bos.toByteArray(), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String getResumeMetaPath(String wavPath) {
                  return wavPath + ".resume.json";
              }

              private void saveResumeMetaToDisk(ResumeState st) {
                  if (st == null || st.partialWavPath == null) return;
                  try {
                      writeTextFile(getResumeMetaPath(st.partialWavPath), st.toJson().toString());
                  } catch (Exception ignored) {}
              }

              private ResumeState loadResumeMetaFromDisk(String wavPath) {
                  String raw = readTextFile(getResumeMetaPath(wavPath));
                  if (raw == null) return null;
                  try {
                      return ResumeState.fromJson(new JSONObject(raw), wavPath);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private void deleteResumeMetaFromDisk(String wavPath) {
                  if (wavPath == null) return;
                  try { new File(getResumeMetaPath(wavPath)).delete(); } catch (Exception ignored) {}
              }

              private ResumeState findLatestResumeState() {
                  File dir = getLibraryDir();
                  File[] files = dir.listFiles();
                  if (files == null) return null;
                  File latestFile = null;
                  long latestTime = -1;
                  for (File f : files) {
                      if (f != null && f.getName().endsWith(".wav")) {
                          File metaFile = new File(getResumeMetaPath(f.getPath()));
                          if (metaFile.exists() && f.lastModified() > latestTime) {
                              latestTime = f.lastModified();
                              latestFile = f;
                          }
                      }
                  }
                  if (latestFile != null) {
                      return loadResumeMetaFromDisk(latestFile.getPath());
                  }
                  return null;
              }

              private String formatMMSS(int totalSec) {
                  int sec = Math.max(0, totalSec);
                  return String.format(Locale.US, "%02d:%02d", sec / 60, sec % 60);
              }

              private String formatDurationReadable(int totalSec) {
                  int sec = Math.max(0, totalSec);
                  return String.format(Locale.US, "%d min %d sec", sec / 60, sec % 60);
              }

              private int getAudioDurationSec(String filePath) {
                  if (filePath == null) return 0;
                  File f = new File(filePath);
                  if (!f.exists()) return 0;
                  long len = f.length();
                  if (len <= 44) return 0;
                  return (int) Math.max(0, (len - 44) / 48000L);
              }

              private void shareAudioFile(String filePath) {
                  File f = new File(filePath != null ? filePath : "");
                  if (!f.exists() || f.length() <= 44) {
                      showToast("Audio file not found or empty");
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType("audio/wav");
                      intent.putExtra(Intent.EXTRA_STREAM, uri);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(intent, "Share Audio"));
                  } catch (Exception e) {
                      logAppError("SHARE", e.getMessage());
                      showToast("Failed to open share menu");
                  }
              }

              private boolean copyFile(String sourcePath, String destPath) {
                  try {
                      File outFile = new File(destPath);
                      File parent = outFile.getParentFile();
                      if (parent != null && !parent.exists()) parent.mkdirs();
                      try (InputStream in = new FileInputStream(new File(sourcePath));
                           OutputStream out = new FileOutputStream(outFile)) {
                          byte[] buf = new byte[8192];
                          int len;
                          while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                          out.flush();
                          return true;
                      }
                  } catch (Exception e) {
                      return false;
                  }
              }

              private String saveFileToDownloads(String sourcePath, String fileName) {
                  File srcFile = new File(sourcePath != null ? sourcePath : "");
                  if (!srcFile.exists() || srcFile.length() <= 44) {
                      return "ERR:Source audio file is empty or corrupt";
                  }
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          ContentResolver resolver = getContentResolver();
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, "audio/wav");
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              try (InputStream in = new FileInputStream(srcFile);
                                   OutputStream out = resolver.openOutputStream(uri)) {
                                  if (out != null) {
                                      byte[] buf = new byte[8192];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                      return "OK";
                                  }
                              }
                          }
                      } catch (Exception e) {
                          logAppError("DOWNLOAD_Q", e.getMessage());
                      }
                  }
                  File dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  String destPath = new File(dlDir, fileName).getPath();
                  if (copyFile(sourcePath, destPath)) return "OK";
                  logAppError("DOWNLOAD", "Failed to save " + fileName);
                  return "ERR:Storage permission denied or failed to write";
              }

              private String matchVoiceDisplay(String rawName, String fallback) {
