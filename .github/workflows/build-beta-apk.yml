name: Build & Release Gemini TTS APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (ہر نئی اپڈیٹ پر بڑھائیں: 1, 2, 3...)'
        required: false
        default: '1'
      version_name:
        description: 'Version Name (مثلاً 1.0, 1.1, 1.2)'
        required: false
        default: '1.0'
      release_notes:
        description: 'What is New (اپڈیٹ پاپ اپ میں دکھائی دینے والی تفصیل)'
        required: false
        default: 'New release with performance improvements and bug fixes.'
      publish_release:
        description: 'GitHub Release پبلش کریں (Auto-Update لائیو ہوگا)'
        type: boolean
        required: false
        default: true
  push:
    branches: [main]

permissions:
  contents: write

env:
  APP_VERSION_CODE: '1'
  APP_VERSION_NAME: '1.0'
  DEFAULT_RELEASE_NOTES: 'Initial Release - Google Gemini Text to Speech with Multi-Voice Story, Broadcast Studio & Auto-Update.'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Resolve Version & Verify Signing Secrets
        env:
          IN_VER_CODE: ${{ github.event.inputs.version_code }}
          IN_VER_NAME: ${{ github.event.inputs.version_name }}
          IN_NOTES: ${{ github.event.inputs.release_notes }}
          IN_PUBLISH: ${{ github.event.inputs.publish_release }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VER_CODE="${IN_VER_CODE:-$APP_VERSION_CODE}"
          VER_NAME="${IN_VER_NAME:-$APP_VERSION_NAME}"
          NOTES="${IN_NOTES:-$DEFAULT_RELEASE_NOTES}"
          if [ -z "$IN_PUBLISH" ]; then
            PUB_REL="true"
          else
            PUB_REL="$IN_PUBLISH"
          fi

          echo "BUILD_VERSION_CODE=$VER_CODE" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_NAME=$VER_NAME" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$PUB_REL" >> "$GITHUB_ENV"
          {
            echo "BUILD_RELEASE_NOTES<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_ENV"

          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING KEY_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secrets for Release Signing:$MISSING"
            echo "Please add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in Repository Settings > Secrets > Actions."
            exit 1
          fi

      - name: Generate Android Java Project
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEEDBACK_API_URL: ${{ secrets.FEEDBACK_API_URL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GITHUB_REPO_FULL: ${{ github.repository }}
        run: |
          mkdir -p app/src/main/java/com/gemini/tts
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > app/release.keystore

          ENC_TOKEN=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | base64 | tr -d '\n')
          ENC_CHAT=$(printf '%s' "$TELEGRAM_CHAT_ID" | base64 | tr -d '\n')
          ENC_URL=$(printf '%s' "$FEEDBACK_API_URL" | base64 | tr -d '\n')

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "GeminiTTS"
          include ':app'
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<EOF
          plugins {
            id 'com.android.application' version '8.2.2'
          }
          android {
            namespace 'com.gemini.tts'
            compileSdk 34
            defaultConfig {
              applicationId 'com.gemini.tts'
              minSdk 24
              targetSdk 34
              versionCode ${BUILD_VERSION_CODE}
              versionName '${BUILD_VERSION_NAME}'
              ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            signingConfigs {
              release {
                storeFile file("release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
              }
              debug {
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation 'androidx.core:core:1.12.0'
          }
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <external-files-path name="ext_files" path="." />
            <files-path name="int_files" path="." />
            <cache-path name="cache_files" path="." />
          </paths>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

            <application
              android:label="Google Gemini Text to Speech"
              android:theme="@android:style/Theme.DeviceDefault.Light"
              android:usesCleartextTraffic="true"
              android:requestLegacyExternalStorage="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fileprovider"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths" />
              </provider>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/gemini/tts/AppConfig.java <<EOF
          package com.gemini.tts;

          import android.util.Base64;
          import java.nio.charset.StandardCharsets;

          public final class AppConfig {
              public static final String GITHUB_REPO = "${GITHUB_REPO_FULL}";
              public static final String APP_VERSION_NAME = "${BUILD_VERSION_NAME}";
              public static final int APP_VERSION_CODE = ${BUILD_VERSION_CODE};

              private static final String BOT_TOKEN_B64 = "${ENC_TOKEN}";
              private static final String CHAT_ID_B64 = "${ENC_CHAT}";
              private static final String FEEDBACK_URL_B64 = "${ENC_URL}";

              private AppConfig() {}

              public static String getBotToken() {
                  return decodeB64(BOT_TOKEN_B64);
              }

              public static String getChatId() {
                  return decodeB64(CHAT_ID_B64);
              }

              public static String getFeedbackUrl() {
                  return decodeB64(FEEDBACK_URL_B64);
              }

              private static String decodeB64(String raw) {
                  if (raw == null || raw.isEmpty()) return "";
                  try {
                      byte[] bytes = Base64.decode(raw, Base64.DEFAULT);
                      return new String(bytes, StandardCharsets.UTF_8).trim();
                  } catch (Exception e) {
                      return "";
                  }
              }
          }
          EOF

