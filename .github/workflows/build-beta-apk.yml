                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="6dp"
                      android:text="خودکار محفوظ کرنے کا وقفہ (سیکنڈ، 10 تا 600)"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp" />

                  <EditText
                      android:id="@+id/etAutoSaveSeconds"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:contentDescription="خودکار محفوظ کرنے کا وقفہ سیکنڈ میں"
                      android:inputType="number" />

                  <CheckBox
                      android:id="@+id/cbAutoBackup"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="خودکار ورژن بیک اپ چالو رکھیں"
                      android:textSize="15sp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="6dp"
                      android:text="فی فائل زیادہ سے زیادہ بیک اپ حالتیں (1 تا 100)"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp" />

                  <EditText
                      android:id="@+id/etMaxBackups"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:contentDescription="فی فائل بیک اپ کی تعداد"
                      android:inputType="number" />

                  <CheckBox
                      android:id="@+id/cbAutoCloseBrackets"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="خودکار قوسین اور نشانیاں () {} [] چالو رکھیں"
                      android:textSize="15sp" />

                  <CheckBox
                      android:id="@+id/cbDefaultMatchCase"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="تلاش میں بنیادی طور پر Match Case آن رکھیں"
                      android:textSize="15sp" />

                  <CheckBox
                      android:id="@+id/cbDefaultWholeWord"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="تلاش میں بنیادی طور پر Whole Word آن رکھیں"
                      android:textSize="15sp" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="8dp"
                      android:text="آل موڈ میں فی صفحہ حروف کی حد (بنیادی: 500000)"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp" />

                  <EditText
                      android:id="@+id/etPageCharLimit"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:contentDescription="آل موڈ فی صفحہ حروف کی حد"
                      android:inputType="number" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="ایڈیٹر فونٹ سائز (12 تا 28)"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp" />

                  <EditText
                      android:id="@+id/etFontSize"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:contentDescription="ایڈیٹر فونٹ سائز"
                      android:inputType="number" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="انڈینٹ میں اسپیس کی تعداد (2 یا 4، یا Tab کے لیے 0)"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp" />

                  <EditText
                      android:id="@+id/etIndentSpaces"
                      android:layout_width="match_parent"
