              private static class TtsJob {
                  String mode; // "single", "multi2", "silence"
                  String voice1;
                  String voice2;
                  String text;
                  double pauseAfter;

                  JSONObject toJson() throws Exception {
                      JSONObject obj = new JSONObject();
                      obj.put("mode", mode != null ? mode : "single");
                      if (voice1 != null) obj.put("voice1", voice1);
                      if (voice2 != null) obj.put("voice2", voice2);
                      if (text != null) obj.put("text", text);
                      obj.put("pauseAfter", pauseAfter);
                      return obj;
                  }

                  static TtsJob fromJson(JSONObject obj) {
                      TtsJob j = new TtsJob();
                      j.mode = obj.optString("mode", "single");
                      j.voice1 = obj.optString("voice1", null);
                      j.voice2 = obj.optString("voice2", null);
                      j.text = obj.optString("text", "");
                      j.pauseAfter = obj.optDouble("pauseAfter", 0.0);
                      return j;
                  }
              }

              private static class ResumeState {
                  List<TtsJob> jobs = new ArrayList<>();
                  int totalChunks;
                  int completedChunks;
                  int nextIndex; // 0-based
                  String partialWavPath;
                  long totalAudioLen;
                  String baseName;
                  String modeName;

                  JSONObject toJson() throws Exception {
                      JSONObject obj = new JSONObject();
                      JSONArray arr = new JSONArray();
                      for (TtsJob j : jobs) arr.put(j.toJson());
                      obj.put("jobs", arr);
                      obj.put("totalChunks", totalChunks);
                      obj.put("completedChunks", completedChunks);
                      obj.put("nextIndex", nextIndex);
                      obj.put("partialWavPath", partialWavPath);
                      obj.put("totalAudioLen", totalAudioLen);
                      obj.put("baseName", baseName);
                      obj.put("modeName", modeName);
                      return obj;
                  }

                  static ResumeState fromJson(JSONObject obj, String wavPath) {
                      JSONArray arr = obj.optJSONArray("jobs");
                      if (arr == null) return null;
                      ResumeState st = new ResumeState();
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject jo = arr.optJSONObject(i);
                          if (jo != null) st.jobs.add(TtsJob.fromJson(jo));
                      }
                      st.totalChunks = obj.optInt("totalChunks", st.jobs.size());
                      st.completedChunks = obj.optInt("completedChunks", 0);
                      st.nextIndex = obj.optInt("nextIndex", 0);
                      st.partialWavPath = wavPath;
                      st.totalAudioLen = obj.optLong("totalAudioLen", 0);
                      st.baseName = obj.optString("baseName", "Audio");
                      st.modeName = obj.optString("modeName", "single");
                      return st;
                  }
              }

