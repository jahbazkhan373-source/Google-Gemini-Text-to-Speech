          package com.codebook.editor.ui;

          import android.util.LruCache;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;

          import com.codebook.editor.R;
          import com.codebook.editor.engine.LargeFileEngine;

          import java.util.HashSet;
          import java.util.Set;

          public class LineModeAdapter extends RecyclerView.Adapter<LineModeAdapter.LineViewHolder> {

              public interface LineActionListener {
                  void onLineFocused(int lineIndex);
                  void onEditLine(int lineIndex);
                  void onInsertAfterLine(int lineIndex);
                  void onDeleteLine(int lineIndex);
              }

              private static final int PREVIEW_MAX_BYTES = 4096;

              private LargeFileEngine engine;
              private final LineActionListener listener;
              private final LruCache<Integer, String> lineCache = new LruCache<>(300);
              private final Set<Integer> markedLineNumbers = new HashSet<>();
              private float fontSizeSp = 15f;
              private boolean readIndentation = false;

              public LineModeAdapter(LineActionListener listener) {
                  this.listener = listener;
              }

              public void setEngine(LargeFileEngine engine) {
                  this.engine = engine;
                  refreshAllLines();
              }

              public void setMarkedLineNumbers(Set<Integer> marks) {
                  markedLineNumbers.clear();
                  if (marks != null) markedLineNumbers.addAll(marks);
                  notifyDataSetChanged();
              }

              public void setDisplayPreferences(float fontSizeSp, boolean readIndentation) {
                  this.fontSizeSp = fontSizeSp;
                  this.readIndentation = readIndentation;
                  notifyDataSetChanged();
              }

              public void refreshAllLines() {
                  lineCache.evictAll();
                  notifyDataSetChanged();
              }

              @NonNull
              @Override
              public LineViewHolder onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                  View view = LayoutInflater.from(parent.getContext())
                          .inflate(R.layout.item_code_line, parent, false);
                  return new LineViewHolder(view);
              }

              @Override
              public void onBindViewHolder(@NonNull LineViewHolder holder, int position) {
                  int lineNumber = position + 1;
                  boolean isMarked = markedLineNumbers.contains(lineNumber);
                  String text = getCachedLinePreview(position);

                  holder.tvLineHeader.setText(isMarked ? ("★ لائن " + lineNumber + " (نشان زدہ)") : ("لائن " + lineNumber));
                  holder.tvLineText.setTextSize(fontSizeSp);
                  holder.tvLineText.setText(text.isEmpty() ? "(خالی لائن)" : text);

                  String indentPrefix = readIndentation ? describeLeadingIndent(text) : "";
                  String markSpoken = isMarked ? "نشان زدہ، " : "";
                  String spokenText = text.isEmpty() ? "خالی لائن" : text;
                  holder.tvLineHeader.setContentDescription(markSpoken + "لائن نمبر " + lineNumber);
                  holder.tvLineText.setContentDescription(markSpoken + "لائن " + lineNumber + ": " + indentPrefix + spokenText);

                  holder.btnEdit.setContentDescription("لائن " + lineNumber + " ترمیم کریں");
                  holder.btnNewLine.setContentDescription("لائن " + lineNumber + " کے بعد نئی لائن شامل کریں");
                  holder.btnDelete.setContentDescription("لائن " + lineNumber + " حذف کریں");

                  holder.tvLineText.setOnClickListener(v -> listener.onLineFocused(position));
                  holder.tvLineHeader.setOnClickListener(v -> listener.onLineFocused(position));
                  holder.btnEdit.setOnClickListener(v -> listener.onEditLine(position));
                  holder.btnNewLine.setOnClickListener(v -> listener.onInsertAfterLine(position));
                  holder.btnDelete.setOnClickListener(v -> listener.onDeleteLine(position));
              }

              @Override
              public int getItemCount() {
                  return engine != null ? engine.getLineCount() : 0;
              }

              private String getCachedLinePreview(int position) {
                  String cached = lineCache.get(position);
                  if (cached != null) return cached;
                  if (engine == null) return "";
                  try {
                      String value = engine.readLinePreview(position, PREVIEW_MAX_BYTES);
                      lineCache.put(position, value);
                      return value;
                  } catch (Exception e) {
                      return "";
                  }
              }

              private String describeLeadingIndent(String line) {
                  if (line == null || line.isEmpty()) return "";
                  int tabs = 0;
                  int spaces = 0;
                  for (int i = 0; i < line.length(); i++) {
                      char c = line.charAt(i);
                      if (c == '\t') tabs++;
                      else if (c == ' ') spaces++;
                      else break;
                  }
                  if (tabs == 0 && spaces == 0) return "";
                  StringBuilder sb = new StringBuilder();
                  if (tabs > 0) sb.append(tabs).append(" ٹیب ");
                  if (spaces > 0) sb.append(spaces).append(" اسپیس ");
                  sb.append("، ");
                  return sb.toString();
              }

              public static class LineViewHolder extends RecyclerView.ViewHolder {
                  public final TextView tvLineHeader;
                  public final TextView tvLineText;
                  public final Button btnEdit;
                  public final Button btnNewLine;
                  public final Button btnDelete;

                  LineViewHolder(@NonNull View itemView) {
                      super(itemView);
                      tvLineHeader = itemView.findViewById(R.id.tvLineHeader);
                      tvLineText = itemView.findViewById(R.id.tvLineText);
                      btnEdit = itemView.findViewById(R.id.btnLineEdit);
                      btnNewLine = itemView.findViewById(R.id.btnLineNew);
                      btnDelete = itemView.findViewById(R.id.btnLineDelete);
                  }
              }
          }
