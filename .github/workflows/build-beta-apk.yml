          package com.codebook.editor.ui;

          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.RadioButton;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;

          import com.codebook.editor.R;
          import com.codebook.editor.storage.BackupManager;
          import com.codebook.editor.storage.CrashRecoveryManager;
          import com.codebook.editor.storage.WorkspaceStorageManager;
          import com.codebook.editor.util.AccessibilityHelper;
          import com.codebook.editor.util.AppSettings;

          public class SettingsActivity extends AppCompatActivity {

              private View rootContainer;
              private Button btnSelectAppLanguage, btnSelectStorageFolder, btnDefaultLanguage;
              private RadioButton rbThemeSystem, rbThemeLight, rbThemeDark;
              private RadioButton rbCheckLevel1, rbCheckLevel2, rbCheckLevel3;
              private CheckBox cbOnlineStrictCheck, cbAskLanguageOnTxtImport, cbDefaultLineMode;
              private CheckBox cbAutoSave, cbAutoBackup, cbAutoCloseBrackets;
              private CheckBox cbDefaultMatchCase, cbDefaultWholeWord, cbReadIndentation, cbScreenReader;
              private EditText etCloudBuildUrl, etOfflineSdkUrl, etAiEndpoint, etAiApiKey;
              private EditText etAutoSaveSeconds, etMaxBackups, etPageCharLimit, etFontSize, etIndentSpaces;

              private AppSettings settings;
              private String selectedDefaultLanguage = "Java";

              private final ActivityResultLauncher<android.net.Uri> safFolderPicker =
                      registerForActivityResult(new ActivityResultContracts.OpenDocumentTree(), uri -> {
                          if (uri != null) {
                              try {
                                  getContentResolver().takePersistableUriPermission(
                                          uri,
                                          Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                  );
                                  settings.setSafTreeUri(uri.toString());
                                  WorkspaceStorageManager wsm = new WorkspaceStorageManager(this);
                                  wsm.getSafCodeBookRoot();
                                  updateStorageFolderButton();
                                  AccessibilityHelper.announce(this, rootContainer,
                                          "Code Book storage folder linked! Projects, Download APK, Text Files, Backups, Zip Files, and Keystores created.");
                              } catch (Exception e) {
                                  AccessibilityHelper.announce(this, rootContainer, "Folder link failed: " + e.getMessage());
                              }
                          }
                      });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_settings);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);
                  settings = new AppSettings(this);

                  btnSelectAppLanguage = findViewById(R.id.btnSelectAppLanguage);
                  btnSelectStorageFolder = findViewById(R.id.btnSelectStorageFolder);
                  rbThemeSystem = findViewById(R.id.rbThemeSystem);
                  rbThemeLight = findViewById(R.id.rbThemeLight);
                  rbThemeDark = findViewById(R.id.rbThemeDark);
                  rbCheckLevel1 = findViewById(R.id.rbCheckLevel1);
                  rbCheckLevel2 = findViewById(R.id.rbCheckLevel2);
                  rbCheckLevel3 = findViewById(R.id.rbCheckLevel3);

                  cbOnlineStrictCheck = findViewById(R.id.cbOnlineStrictCheck);
                  etCloudBuildUrl = findViewById(R.id.etCloudBuildUrl);
                  etOfflineSdkUrl = findViewById(R.id.etOfflineSdkPackUrl);
                  etAiEndpoint = findViewById(R.id.etAiAssistantEndpoint);
                  etAiApiKey = findViewById(R.id.etAiAssistantApiKey);

                  btnDefaultLanguage = findViewById(R.id.btnDefaultLanguage);
                  cbAskLanguageOnTxtImport = findViewById(R.id.cbAskLanguageOnTxtImport);
                  cbDefaultLineMode = findViewById(R.id.cbDefaultLineMode);
                  cbAutoSave = findViewById(R.id.cbAutoSave);
                  etAutoSaveSeconds = findViewById(R.id.etAutoSaveSeconds);
                  cbAutoBackup = findViewById(R.id.cbAutoBackup);
                  etMaxBackups = findViewById(R.id.etMaxBackups);
                  cbAutoCloseBrackets = findViewById(R.id.cbAutoCloseBrackets);
                  cbDefaultMatchCase = findViewById(R.id.cbDefaultMatchCase);
                  cbDefaultWholeWord = findViewById(R.id.cbDefaultWholeWord);
                  etPageCharLimit = findViewById(R.id.etPageCharLimit);
                  etFontSize = findViewById(R.id.etFontSize);
                  etIndentSpaces = findViewById(R.id.etIndentSpaces);
                  cbReadIndentation = findViewById(R.id.cbReadIndentation);
                  cbScreenReader = findViewById(R.id.cbScreenReaderAnnouncements);

                  loadValues();

                  btnSelectAppLanguage.setOnClickListener(v -> showAppLanguagePicker());
                  btnSelectStorageFolder.setOnClickListener(v -> safFolderPicker.launch(null));
                  btnDefaultLanguage.setOnClickListener(v -> showDefaultLanguagePicker());
                  findViewById(R.id.btnOpenLanguageCheckers).setOnClickListener(v ->
                          startActivity(new Intent(this, LanguageCheckersActivity.class))
                  );
                  findViewById(R.id.btnSaveSettings).setOnClickListener(v -> saveSettings());
                  findViewById(R.id.btnManageOldBackups).setOnClickListener(v -> {
                      int removed = new BackupManager(this).cleanExcessBackups(settings.getMaxBackupsPerFile());
                      AccessibilityHelper.announce(this, rootContainer, "Cleaned " + removed + " excess backup(s).");
                  });
                  findViewById(R.id.btnOpenLibraryZipShortcut).setOnClickListener(v ->
                          startActivity(new Intent(this, LibraryActivity.class))
                  );
                  findViewById(R.id.btnOpenPerformanceTest).setOnClickListener(v ->
                          startActivity(new Intent(this, PerformanceTestActivity.class))
                  );
                  findViewById(R.id.btnViewCrashLog).setOnClickListener(v -> showCrashLogDialog());
              }

              private void loadValues() {
                  updateAppLanguageButton();
                  updateStorageFolderButton();

                  int theme = settings.getThemeMode();
                  rbThemeSystem.setChecked(theme == AppSettings.THEME_SYSTEM);
                  rbThemeLight.setChecked(theme == AppSettings.THEME_LIGHT);
                  rbThemeDark.setChecked(theme == AppSettings.THEME_DARK);

                  int level = settings.getErrorCheckLevel();
                  rbCheckLevel1.setChecked(level == 1);
                  rbCheckLevel2.setChecked(level == 2);
                  rbCheckLevel3.setChecked(level == 3);

                  cbOnlineStrictCheck.setChecked(settings.isOnlineStrictCheckEnabled());
                  etCloudBuildUrl.setText(settings.getCloudBuildUrl());
                  etOfflineSdkUrl.setText(settings.getOfflineSdkPackUrl());
                  etAiEndpoint.setText(settings.getAiAssistantEndpoint());
                  etAiApiKey.setText(settings.getAiAssistantApiKey());

                  selectedDefaultLanguage = settings.getDefaultLanguage();
                  updateDefaultLanguageButton();

                  cbAskLanguageOnTxtImport.setChecked(settings.isAskLanguageOnTxtImport());
                  cbDefaultLineMode.setChecked(settings.isDefaultLineMode());
                  cbAutoSave.setChecked(settings.isAutoSaveEnabled());
                  etAutoSaveSeconds.setText(String.valueOf(settings.getAutoSaveIntervalSeconds()));
                  cbAutoBackup.setChecked(settings.isAutoBackupEnabled());
                  etMaxBackups.setText(String.valueOf(settings.getMaxBackupsPerFile()));
                  cbAutoCloseBrackets.setChecked(settings.isAutoCloseBracketsEnabled());
                  cbDefaultMatchCase.setChecked(settings.isDefaultMatchCase());
                  cbDefaultWholeWord.setChecked(settings.isDefaultWholeWord());
                  etPageCharLimit.setText(String.valueOf(settings.getPageCharLimit()));
                  etFontSize.setText(String.valueOf(settings.getFontSize()));
                  etIndentSpaces.setText(String.valueOf(settings.getIndentSpaces()));
                  cbReadIndentation.setChecked(settings.isReadIndentationEnabled());
                  cbScreenReader.setChecked(settings.isScreenReaderAnnouncementsEnabled());
              }

              private void updateAppLanguageButton() {
                  String cur = settings.getAppLanguageCode();
                  String label = "English (Default)";
                  for (int i = 0; i < AppSettings.APP_LANGUAGE_CODES.length; i++) {
                      if (AppSettings.APP_LANGUAGE_CODES[i].equalsIgnoreCase(cur)) {
                          label = AppSettings.APP_LANGUAGE_LABELS[i];
                          break;
                      }
                  }
                  btnSelectAppLanguage.setText(getString(R.string.btn_select_app_language) + ": " + label);
              }

              private void updateStorageFolderButton() {
                  boolean linked = new WorkspaceStorageManager(this).hasExternalSafRoot();
                  btnSelectStorageFolder.setText(getString(R.string.btn_select_storage_folder)
                          + (linked ? " (Linked ✓)" : " (Tap to Link Outside Downloads)"));
              }

              private void showAppLanguagePicker() {
                  String cur = settings.getAppLanguageCode();
                  int checked = 0;
                  for (int i = 0; i < AppSettings.APP_LANGUAGE_CODES.length; i++) {
                      if (AppSettings.APP_LANGUAGE_CODES[i].equalsIgnoreCase(cur)) {
                          checked = i;
                          break;
                      }
                  }
                  new AlertDialog.Builder(this)
                          .setTitle(R.string.btn_select_app_language)
                          .setSingleChoiceItems(AppSettings.APP_LANGUAGE_LABELS, checked, (d, which) -> {
                              String chosenCode = AppSettings.APP_LANGUAGE_CODES[which];
                              settings.setAppLanguageCode(chosenCode);
                              d.dismiss();
                              AccessibilityHelper.announce(this, rootContainer, "App language changed to " + AppSettings.APP_LANGUAGE_LABELS[which]);
                              recreate();
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void updateDefaultLanguageButton() {
                  btnDefaultLanguage.setText("Default Code Language: " + selectedDefaultLanguage);
              }

              private void showDefaultLanguagePicker() {
                  int checked = 0;
                  for (int i = 0; i < MainActivity.SUPPORTED_LANGUAGES.length; i++) {
                      if (MainActivity.SUPPORTED_LANGUAGES[i].equalsIgnoreCase(selectedDefaultLanguage)) {
                          checked = i;
                          break;
                      }
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Select Default Code Language")
                          .setSingleChoiceItems(MainActivity.SUPPORTED_LANGUAGES, checked, (d, which) -> {
                              selectedDefaultLanguage = MainActivity.SUPPORTED_LANGUAGES[which];
                              updateDefaultLanguageButton();
                              d.dismiss();
                              AccessibilityHelper.announce(this, rootContainer, "Default language set to " + selectedDefaultLanguage);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showCrashLogDialog() {
                  String log = CrashRecoveryManager.readLastCrashLog(this);
                  if (log == null || log.trim().isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "No crash log recorded.");
                      return;
                  }
                  new AlertDialog.Builder(this)
                          .setTitle("Last Offline Crash Log")
                          .setMessage(log.length() > 3500 ? log.substring(0, 3500) + "\n..." : log)
                          .setPositiveButton(R.string.ok, null)
                          .setNeutralButton("Clear Log", (d, w) -> {
                              CrashRecoveryManager.clearCrashLog(this);
                              AccessibilityHelper.announce(this, rootContainer, "Crash log cleared.");
                          })
                          .show();
              }

              private void saveSettings() {
                  try {
                      int theme = rbThemeLight.isChecked() ? AppSettings.THEME_LIGHT
                              : (rbThemeDark.isChecked() ? AppSettings.THEME_DARK : AppSettings.THEME_SYSTEM);
                      int level = rbCheckLevel1.isChecked() ? 1 : (rbCheckLevel2.isChecked() ? 2 : 3);

                      settings.setErrorCheckLevel(level);
                      settings.setOnlineStrictCheckEnabled(cbOnlineStrictCheck.isChecked());
                      settings.setCloudBuildUrl(etCloudBuildUrl.getText().toString());
                      settings.setOfflineSdkPackUrl(etOfflineSdkUrl.getText().toString());
                      settings.setAiAssistantEndpoint(etAiEndpoint.getText().toString());
                      settings.setAiAssistantApiKey(etAiApiKey.getText().toString());

                      settings.setDefaultLanguage(selectedDefaultLanguage);
                      settings.setAskLanguageOnTxtImport(cbAskLanguageOnTxtImport.isChecked());
                      settings.setDefaultLineMode(cbDefaultLineMode.isChecked());
                      settings.setAutoSaveEnabled(cbAutoSave.isChecked());
                      settings.setAutoSaveIntervalSeconds(Integer.parseInt(etAutoSaveSeconds.getText().toString().trim()));
                      settings.setAutoBackupEnabled(cbAutoBackup.isChecked());
                      settings.setMaxBackupsPerFile(Integer.parseInt(etMaxBackups.getText().toString().trim()));
                      settings.setAutoCloseBracketsEnabled(cbAutoCloseBrackets.isChecked());
                      settings.setDefaultMatchCase(cbDefaultMatchCase.isChecked());
                      settings.setDefaultWholeWord(cbDefaultWholeWord.isChecked());
                      settings.setPageCharLimit(Integer.parseInt(etPageCharLimit.getText().toString().trim()));
                      settings.setFontSize(Integer.parseInt(etFontSize.getText().toString().trim()));
                      settings.setIndentSpaces(Integer.parseInt(etIndentSpaces.getText().toString().trim()));
                      settings.setReadIndentationEnabled(cbReadIndentation.isChecked());
                      settings.setScreenReaderAnnouncementsEnabled(cbScreenReader.isChecked());

                      boolean themeChanged = (theme != settings.getThemeMode());
                      settings.setThemeMode(theme);

                      loadValues();
                      AccessibilityHelper.announce(this, rootContainer, "All settings saved.");
                      if (themeChanged) recreate();
                  } catch (NumberFormatException e) {
                      AccessibilityHelper.announce(this, rootContainer, "Please enter valid numbers in numeric fields.");
                  }
              }
          }
