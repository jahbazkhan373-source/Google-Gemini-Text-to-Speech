              private ProjectMeta project;
              private List<PermissionItem> fullCatalog = new ArrayList<>();
              private final Set<String> selectedPermissions = new HashSet<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_permissions);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);

                  tvPermHeader = findViewById(R.id.tvPermHeader);
                  etSearch = findViewById(R.id.etPermSearch);
                  RecyclerView rv = findViewById(R.id.rvPermissions);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  projectRepo = new ProjectRepository(this);
                  String projectId = getIntent().getStringExtra(EXTRA_PROJECT_ID);
                  project = projectRepo.getById(projectId);
                  if (project == null) {
                      AccessibilityHelper.announce(this, rootContainer, "Project not found.");
                      finish();
                      return;
                  }

                  if (project.permissions != null) {
                      selectedPermissions.addAll(project.permissions);
                  }
                  fullCatalog = projectRepo.loadPermissionsCatalog(project);
                  adapter = new PermAdapter();
                  rv.setAdapter(adapter);
                  applyFilter("");
                  updateHeaderCount();

                  etSearch.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          applyFilter(s.toString());
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });

                  findViewById(R.id.btnPermAddCustom).setOnClickListener(v -> showAddCustomPermissionDialog());
                  findViewById(R.id.btnPermUncheckAll).setOnClickListener(v -> {
                      selectedPermissions.clear();
                      adapter.notifyDataSetChanged();
                      updateHeaderCount();
                      AccessibilityHelper.announce(this, rootContainer, "All permissions unchecked.");
                  });
                  findViewById(R.id.btnPermSaveOk).setOnClickListener(v -> savePermissionsAndFinish());
              }

              private void updateHeaderCount() {
                  tvPermHeader.setText(getString(R.string.btn_select_permissions) + " (" + selectedPermissions.size() + " / " + fullCatalog.size() + ")");
              }

              private void applyFilter(String query) {
                  String q = (query != null) ? query.trim().toLowerCase(Locale.ROOT) : "";
                  List<PermissionItem> filtered = new ArrayList<>();
                  for (PermissionItem p : fullCatalog) {
                      if (q.isEmpty()
                              || p.label.toLowerCase(Locale.ROOT).contains(q)
                              || p.permission.toLowerCase(Locale.ROOT).contains(q)
                              || p.category.toLowerCase(Locale.ROOT).contains(q)
                              || p.description.toLowerCase(Locale.ROOT).contains(q)) {
                          filtered.add(p);
                      }
                  }
                  adapter.setItems(filtered);
              }

              private void showAddCustomPermissionDialog() {
                  EditText input = new EditText(this);
                  input.setHint("e.g. android.permission.NEW_ANDROID_17_PERM");
                  input.setContentDescription("Enter full Android permission name");

                  new AlertDialog.Builder(this)
                          .setTitle("Add Custom Permission")
                          .setMessage("Enter any future Android 17/18/19 or custom library permission:")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String perm = input.getText().toString().trim();
                              if (perm.isEmpty()) return;
                              if (!project.customPermissions.contains(perm)) {
                                  project.customPermissions.add(perm);
                              }
                              selectedPermissions.add(perm);
                              fullCatalog = projectRepo.loadPermissionsCatalog(project);
                              applyFilter(etSearch.getText().toString());
                              updateHeaderCount();
                              AccessibilityHelper.announce(this, rootContainer, "Added and checked " + perm);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void savePermissionsAndFinish() {
                  try {
                      project.permissions = new ArrayList<>(selectedPermissions);
                      projectRepo.updateProject(project);
                      AccessibilityHelper.announce(this, rootContainer, "Saved " + project.permissions.size() + " permission(s) to project.");
                      finish();
                  } catch (Exception e) {
                      AccessibilityHelper.announce(this, rootContainer, "Failed to save permissions: " + e.getMessage());
                  }
              }

              private class PermAdapter extends RecyclerView.Adapter<PermAdapter.VH> {
                  private final List<PermissionItem> items = new ArrayList<>();

                  void setItems(List<PermissionItem> list) {
                      items.clear();
                      items.addAll(list);
                      notifyDataSetChanged();
                  }

                  @NonNull
                  @Override
                  public VH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                      View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_permission, parent, false);
                      return new VH(v);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      PermissionItem item = items.get(pos);
                      h.cb.setOnCheckedChangeListener(null);
                      h.cb.setText(item.label + (item.sensitive ? " [Sensitive]" : ""));
                      h.cb.setChecked(selectedPermissions.contains(item.permission));
                      h.cb.setContentDescription(item.label + ", " + item.category + ", " + item.permission);
                      h.tvCode.setText(item.permission + "  (API " + item.minApi + "+ | " + item.category + ")");
                      h.tvDesc.setText(item.description);

                      h.cb.setOnCheckedChangeListener((buttonView, isChecked) -> {
                          if (isChecked) selectedPermissions.add(item.permission);
                          else selectedPermissions.remove(item.permission);
                          updateHeaderCount();
                      });
                  }

                  @Override
                  public int getItemCount() {
                      return items.size();
                  }

                  class VH extends RecyclerView.ViewHolder {
                      CheckBox cb;
                      TextView tvCode, tvDesc;

                      VH(@NonNull View v) {
                          super(v);
                          cb = v.findViewById(R.id.cbPermission);
                          tvCode = v.findViewById(R.id.tvPermissionCode);
                          tvDesc = v.findViewById(R.id.tvPermissionDesc);
                      }
                  }
              }
          }
