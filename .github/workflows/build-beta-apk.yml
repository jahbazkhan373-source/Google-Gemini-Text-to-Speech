      - name: Build Signed Release APK
        uses: gradle/gradle-build-action@v2
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          arguments: assembleRelease
          gradle-version: '8.5'

      - name: Prepare Release APK & Clean Keystore
        run: |
          rm -f app/release.keystore
          mkdir -p release_out
          APK_FILE="release_out/GeminiTTS-v${BUILD_VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          echo "FINAL_APK_PATH=$APK_FILE" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTTS-v${{ env.BUILD_VERSION_NAME }}-release
          path: ${{ env.FINAL_APK_PATH }}

      - name: Publish Automatic GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${BUILD_VERSION_NAME}"
          TITLE="Google Gemini TTS ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "$FINAL_APK_PATH" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$BUILD_RELEASE_NOTES" --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$FINAL_APK_PATH" \
              --title "$TITLE" \
              --notes "$BUILD_RELEASE_NOTES" \
              --latest
          fi
