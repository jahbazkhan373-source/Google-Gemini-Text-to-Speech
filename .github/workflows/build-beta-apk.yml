          public class UndoRedoManager {

              private static final int MEMORY_THRESHOLD_BYTES = 262_144; // 256 KB
              private static final int MAX_HISTORY = 50;

              public static class Payload {
                  public final byte[] inMemory;
                  public final File onDisk;
                  public final long length;

                  private Payload(byte[] inMemory, File onDisk, long length) {
                      this.inMemory = inMemory;
                      this.onDisk = onDisk;
                      this.length = length;
                  }

                  public static Payload fromBytes(byte[] bytes) {
                      byte[] safe = (bytes != null) ? bytes : new byte[0];
                      return new Payload(safe, null, safe.length);
                  }

                  public static Payload fromFile(File file) {
                      return new Payload(null, file, file != null && file.exists() ? file.length() : 0L);
                  }

                  public void cleanup() {
                      if (onDisk != null && onDisk.exists()) {
                          onDisk.delete();
                      }
                  }
              }

              public static class EditRecord {
                  public final long startOffset;
                  public final Payload oldPayload;
                  public final Payload newPayload;
                  public final String description;
                  public final int focusLineIndex;

                  public EditRecord(long startOffset, Payload oldPayload, Payload newPayload,
                                    String description, int focusLineIndex) {
                      this.startOffset = startOffset;
                      this.oldPayload = oldPayload;
                      this.newPayload = newPayload;
                      this.description = description;
                      this.focusLineIndex = focusLineIndex;
                  }

                  public void cleanup() {
                      oldPayload.cleanup();
                      newPayload.cleanup();
                  }
              }

              private final File undoDir;
              private final Deque<EditRecord> undoStack = new ArrayDeque<>();
              private final Deque<EditRecord> redoStack = new ArrayDeque<>();

              public UndoRedoManager(Context context) {
                  this.undoDir = new File(context.getCacheDir(), "undo_session_" + UUID.randomUUID());
                  if (!undoDir.exists()) {
                      undoDir.mkdirs();
                  }
              }

              public synchronized boolean canUndo() {
                  return !undoStack.isEmpty();
              }

              public synchronized boolean canRedo() {
                  return !redoStack.isEmpty();
              }

              public synchronized EditRecord applyWithBytes(LargeFileEngine engine, long startOffset, long endOffset,
                                                            byte[] newBytes, String description, int focusLineIndex) throws IOException {
                  Payload oldPayload = captureExistingRange(engine, startOffset, endOffset);
                  byte[] safeNew = (newBytes != null) ? newBytes : new byte[0];
                  Payload newPayload;
                  if (safeNew.length <= MEMORY_THRESHOLD_BYTES) {
                      newPayload = Payload.fromBytes(safeNew);
                  } else {
                      File diskCopy = createTempFile("new");
                      try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(diskCopy), 65536)) {
                          out.write(safeNew);
                          out.flush();
                      }
                      newPayload = Payload.fromFile(diskCopy);
                  }

                  engine.replaceByteRangeWithBytes(startOffset, endOffset, safeNew);
                  EditRecord record = new EditRecord(startOffset, oldPayload, newPayload, description, focusLineIndex);
                  pushUndo(record);
                  return record;
              }

              public synchronized EditRecord applyWithFile(LargeFileEngine engine, long startOffset, long endOffset,
                                                           File sourceFile, String description, int focusLineIndex) throws IOException {
                  Payload oldPayload = captureExistingRange(engine, startOffset, endOffset);
                  long newLen = (sourceFile != null && sourceFile.exists()) ? sourceFile.length() : 0L;
                  Payload newPayload;
                  if (newLen == 0L) {
                      newPayload = Payload.fromBytes(new byte[0]);
                  } else if (newLen <= MEMORY_THRESHOLD_BYTES) {
                      byte[] data = readFileFully(sourceFile);
                      newPayload = Payload.fromBytes(data);
                  } else {
                      File diskCopy = createTempFile("newf");
                      copyFile(sourceFile, diskCopy);
                      newPayload = Payload.fromFile(diskCopy);
                  }

                  engine.replaceByteRangeWithFile(startOffset, endOffset, sourceFile);
                  EditRecord record = new EditRecord(startOffset, oldPayload, newPayload, description, focusLineIndex);
                  pushUndo(record);
                  return record;
              }

              public synchronized EditRecord undo(LargeFileEngine engine) throws IOException {
                  if (undoStack.isEmpty()) return null;
                  EditRecord record = undoStack.pop();
                  long endAfterEdit = record.startOffset + record.newPayload.length;
                  applyPayload(engine, record.startOffset, endAfterEdit, record.oldPayload);
                  redoStack.push(record);
                  return record;
              }

              public synchronized EditRecord redo(LargeFileEngine engine) throws IOException {
                  if (redoStack.isEmpty()) return null;
                  EditRecord record = redoStack.pop();
                  long endBeforeEdit = record.startOffset + record.oldPayload.length;
                  applyPayload(engine, record.startOffset, endBeforeEdit, record.newPayload);
                  undoStack.push(record);
                  return record;
              }

              private void applyPayload(LargeFileEngine engine, long start, long end, Payload payload) throws IOException {
                  if (payload.onDisk != null) {
                      engine.replaceByteRangeWithFile(start, end, payload.onDisk);
                  } else {
                      engine.replaceByteRangeWithBytes(start, end, payload.inMemory);
                  }
              }

              private Payload captureExistingRange(LargeFileEngine engine, long startOffset, long endOffset) throws IOException {
                  long len = endOffset - startOffset;
                  if (len <= 0L) {
                      return Payload.fromBytes(new byte[0]);
                  }
                  if (len <= MEMORY_THRESHOLD_BYTES) {
                      byte[] data = engine.readByteRangeRaw(startOffset, endOffset);
                      return Payload.fromBytes(data);
                  }
                  File diskCopy = createTempFile("old");
                  engine.extractByteRangeToFile(startOffset, endOffset, diskCopy);
                  return Payload.fromFile(diskCopy);
              }

              private void pushUndo(EditRecord record) {
                  while (!redoStack.isEmpty()) {
                      redoStack.pop().cleanup();
                  }
                  undoStack.push(record);
                  while (undoStack.size() > MAX_HISTORY) {
                      EditRecord oldest = undoStack.removeLast();
                      oldest.cleanup();
                  }
              }

              public synchronized void clear() {
                  while (!undoStack.isEmpty()) {
                      undoStack.pop().cleanup();
                  }
                  while (!redoStack.isEmpty()) {
                      redoStack.pop().cleanup();
                  }
                  deleteRecursive(undoDir);
              }

              private File createTempFile(String prefix) {
                  if (!undoDir.exists()) undoDir.mkdirs();
                  return new File(undoDir, prefix + "_" + UUID.randomUUID() + ".bin");
              }

              private static byte[] readFileFully(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file), 65536)) {
                      int offset = 0;
                      int read;
                      while (offset < data.length && (read = in.read(data, offset, data.length - offset)) != -1) {
                          offset += read;
                      }
                  }
                  return data;
              }

              private static void copyFile(File src, File dst) throws IOException {
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(src), 65536);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dst), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) {
                          out.write(buf, 0, len);
                      }
                      out.flush();
                  }
              }

              private static void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File child : children) {
                              deleteRecursive(child);
                          }
                      }
                  }
                  f.delete();
              }
          }
