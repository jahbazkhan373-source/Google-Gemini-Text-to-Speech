                              android:layout_width="wrap_content"
                              android:layout_height="44dp"
                              android:layout_marginEnd="6dp"
                              android:contentDescription="@string/btn_error_detail"
                              android:text="@string/btn_error_detail" />

                          <Button
                              android:id="@+id/btnPossibleErrors"
                              android:layout_width="wrap_content"
                              android:layout_height="44dp"
                              android:layout_marginEnd="6dp"
                              android:contentDescription="@string/btn_possible_errors"
                              android:text="@string/btn_possible_errors" />

                          <Button
                              android:id="@+id/btnCloseErrorBar"
                              android:layout_width="wrap_content"
                              android:layout_height="44dp"
                              android:contentDescription="غلطیوں کی پٹی بند کریں"
                              android:text="بند کریں" />
                      </LinearLayout>
                  </HorizontalScrollView>
              </LinearLayout>

              <!-- صفحہ بندی پٹی: صرف آل موڈ میں 5 لاکھ سے زیادہ حروف ہونے پر -->
              <LinearLayout
                  android:id="@+id/layoutPagingBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingBottom="6dp"
                  android:visibility="gone">

                  <Button
                      android:id="@+id/btnPrevPage"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:contentDescription="@string/btn_prev_page"
                      android:text="@string/btn_prev_page" />

                  <TextView
                      android:id="@+id/tvPageInfo"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:gravity="center"
                      android:textColor="@color/text_primary"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnNextPage"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:contentDescription="@string/btn_next_page"
                      android:text="@string/btn_next_page" />
              </LinearLayout>

              <!-- لائن موڈ کی خاص پٹی (بغیر صفحہ بندی، پورا کوڈ یکجا) -->
              <LinearLayout
                  android:id="@+id/layoutLineModeBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingBottom="6dp"
                  android:visibility="gone">

                  <Button
                      android:id="@+id/btnJumpLine"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:layout_marginEnd="6dp"
                      android:contentDescription="@string/btn_jump_line"
                      android:text="@string/btn_jump_line" />

                  <Button
                      android:id="@+id/btnLineRange"
                      android:layout_width="wrap_content"
                      android:layout_height="48dp"
                      android:layout_marginEnd="6dp"
                      android:contentDescription="@string/btn_line_range"
                      android:text="@string/btn_line_range" />

                  <TextView
                      android:id="@+id/tvLineModeSummary"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:gravity="end"
                      android:textColor="@color/text_secondary"
                      android:textSize="14sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- آل موڈ ایڈیٹنگ خانہ -->
              <EditText
                  android:id="@+id/etCodeEditor"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="@color/card_bg"
                  android:contentDescription="@string/editor_hint"
                  android:gravity="top|start"
                  android:hint="@string/editor_hint"
                  android:inputType="textMultiLine|textNoSuggestions"
                  android:padding="12dp"
                  android:scrollbars="vertical"
                  android:textColor="@color/text_primary"
                  android:textDirection="ltr"
                  android:textSize="15sp"
                  android:typeface="monospace" />

              <!-- لائن موڈ کا خالی اسٹیٹ بٹن -->
              <Button
                  android:id="@+id/btnAddFirstLine"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="12dp"
                  android:contentDescription="@string/btn_add_first_line"
                  android:text="@string/btn_add_first_line"
                  android:visibility="gone" />

              <!-- لائن موڈ فہرست -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvLineMode"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:visibility="gone" />

          </LinearLayout>
