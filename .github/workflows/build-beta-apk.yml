          import java.util.concurrent.Executors;

          public class LibraryActivity extends AppCompatActivity implements LibraryAdapter.FileActionListener {

              private View rootContainer;
              private TextView tvEmptyLibrary;
              private LibraryAdapter adapter;
              private LibraryRepository repository;
              private BackupManager backupManager;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              private CodeFileMeta pendingExportMeta = null;
              private boolean pendingZipIncludeBackups = true;

              private final ActivityResultLauncher<String> safCreateTxtLauncher =
                      registerForActivityResult(new ActivityResultContracts.CreateDocument("text/plain"), uri -> {
                          if (uri != null && pendingExportMeta != null) {
                              CodeFileMeta target = pendingExportMeta;
                              pendingExportMeta = null;
                              executor.execute(() -> {
                                  try {
                                      repository.exportToUri(target.id, uri);
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, target.name + " exported as TXT."));
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Export failed: " + e.getMessage()));
                                  }
                              });
                          }
                      });

              private final ActivityResultLauncher<String> safCreateZipLauncher =
                      registerForActivityResult(new ActivityResultContracts.CreateDocument("application/zip"), uri -> {
                          if (uri != null) {
                              executor.execute(() -> {
                                  try {
                                      ZipBackupManager.exportLibraryToUri(this, uri, repository, backupManager, pendingZipIncludeBackups);
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Library exported to ZIP."));
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "ZIP export failed: " + e.getMessage()));
                                  }
                              });
                          }
                      });

              private final ActivityResultLauncher<String[]> safImportZipLauncher =
                      registerForActivityResult(new ActivityResultContracts.OpenDocument(), uri -> {
                          if (uri != null) {
                              AccessibilityHelper.announce(this, rootContainer, "Restoring library from ZIP...");
                              executor.execute(() -> {
                                  try {
                                      int restored = ZipBackupManager.restoreLibraryFromZipUri(this, uri, repository, backupManager);
                                      runOnUiThread(() -> {
                                          refreshList();
                                          AccessibilityHelper.announce(this, rootContainer, "Restored " + restored + " file(s) from ZIP.");
                                      });
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "ZIP restore failed: " + e.getMessage()));
                                  }
                              });
                          }
                      });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_library);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);

                  tvEmptyLibrary = findViewById(R.id.tvEmptyLibrary);
                  RecyclerView rv = findViewById(R.id.rvLibraryFiles);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  repository = new LibraryRepository(this);
                  backupManager = new BackupManager(this);
                  adapter = new LibraryAdapter(this);
                  rv.setAdapter(adapter);

                  findViewById(R.id.btnExportLibraryZip).setOnClickListener(v -> promptExportLibraryZip());
                  findViewById(R.id.btnImportLibraryZip).setOnClickListener(v ->
                          safImportZipLauncher.launch(new String[]{"application/zip", "*/*"})
                  );
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshList();
              }

              private void refreshList() {
                  List<CodeFileMeta> files = repository.getAllFiles();
                  adapter.setItems(files);
                  tvEmptyLibrary.setVisibility(files.isEmpty() ? View.VISIBLE : View.GONE);
              }

              private void promptExportLibraryZip() {
                  if (repository.getAllFiles().isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "Code Library is empty.");
                      return;
                  }
                  String[] choices = {"Files + All Backups (Full ZIP)", "Files Only (Light ZIP)"};
                  new AlertDialog.Builder(this)
                          .setTitle("Export Library to ZIP")
                          .setItems(choices, (d, which) -> {
                              pendingZipIncludeBackups = (which == 0);
                              AccessibilityHelper.announce(this, rootContainer, "Creating ZIP...");
                              executor.execute(() -> {
                                  try {
                                      String saved = ZipBackupManager.exportLibraryToDownloadsZip(
                                              this, repository, backupManager, pendingZipIncludeBackups
                                      );
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "ZIP saved: " + saved));
                                  } catch (Exception e) {
                                      runOnUiThread(() -> safCreateZipLauncher.launch(ZipBackupManager.buildDefaultZipName()));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onOpen(CodeFileMeta meta) {
                  Intent intent = new Intent(this, EditorActivity.class);
                  intent.putExtra(EditorActivity.EXTRA_FILE_ID, meta.id);
                  startActivity(intent);
              }

              @Override
              public void onDownload(CodeFileMeta meta) {
                  executor.execute(() -> {
                      try {
                          String savedPath = repository.exportToDownloadsTxt(meta);
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "TXT saved: " + savedPath));
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              pendingExportMeta = meta;
                              safCreateTxtLauncher.launch(LibraryRepository.buildSafeTxtFileName(meta.name));
                          });
                      }
                  });
              }

              @Override
              public void onBackups(CodeFileMeta meta) {
                  Intent intent = new Intent(this, BackupActivity.class);
                  intent.putExtra(BackupActivity.EXTRA_FILE_ID, meta.id);
                  startActivity(intent);
              }

              @Override
              public void onCompare(CodeFileMeta meta) {
                  List<BackupManager.BackupMeta> backups = backupManager.listBackups(meta.id);
                  if (backups.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "No backups available to compare.");
                      return;
                  }
                  Intent intent = new Intent(this, DiffActivity.class);
                  intent.putExtra(DiffActivity.EXTRA_FILE_ID, meta.id);
                  intent.putExtra(DiffActivity.EXTRA_BACKUP_ID, backups.get(0).id);
                  startActivity(intent);
              }

              @Override
              public void onRename(CodeFileMeta meta) {
                  EditText input = new EditText(this);
                  input.setText(meta.name);
                  input.setSelection(meta.name.length());

                  new AlertDialog.Builder(this)
                          .setTitle("Rename File")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String newName = input.getText().toString().trim();
                              if (newName.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, "Name cannot be empty.");
                                  return;
                              }
                              if (repository.nameExists(newName, meta.id)) {
                                  AccessibilityHelper.announce(this, rootContainer, "A file with this name already exists.");
                                  return;
                              }
                              try {
                                  repository.renameFile(meta.id, newName);
                                  refreshList();
                                  AccessibilityHelper.announce(this, rootContainer, "Renamed to " + newName);
                              } catch (Exception e) {
                                  AccessibilityHelper.announce(this, rootContainer, "Rename failed: " + e.getMessage());
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onDuplicate(CodeFileMeta meta) {
                  EditText input = new EditText(this);
                  input.setText(meta.name + " Copy");

                  new AlertDialog.Builder(this)
                          .setTitle("Duplicate File Name")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String newName = input.getText().toString().trim();
                              if (newName.isEmpty() || repository.nameExists(newName, null)) {
                                  AccessibilityHelper.announce(this, rootContainer, "Enter a unique non-empty name.");
                                  return;
                              }
                              executor.execute(() -> {
                                  try {
                                      repository.duplicateFile(meta.id, newName);
                                      runOnUiThread(() -> {
                                          refreshList();
                                          AccessibilityHelper.announce(this, rootContainer, "Created duplicate: " + newName);
                                      });
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Duplicate failed: " + e.getMessage()));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onDelete(CodeFileMeta meta) {
                  if (!backupManager.hasBackups(meta.id)) {
                      new AlertDialog.Builder(this)
                              .setTitle("Confirm Delete")
                              .setMessage("Delete " + meta.name + " from Code Library?")
                              .setPositiveButton(R.string.yes, (d, w) -> executeDelete(meta, true))
                              .setNegativeButton(R.string.no, null)
                              .show();
                  } else {
                      new AlertDialog.Builder(this)
                              .setTitle("Delete File & Backups")
                              .setMessage(meta.name + " has saved backups. Keep or delete backups too?")
                              .setPositiveButton("Delete File, Keep Backups", (d, w) -> executeDelete(meta, false))
                              .setNeutralButton("Delete Both", (d, w) -> executeDelete(meta, true))
                              .setNegativeButton(R.string.cancel, null)
                              .show();
                  }
              }

              private void executeDelete(CodeFileMeta meta, boolean deleteBackups) {
                  try {
                      repository.deleteFile(meta.id, deleteBackups);
                      refreshList();
                      AccessibilityHelper.announce(this, rootContainer, meta.name + " deleted.");
                  } catch (Exception e) {
                      AccessibilityHelper.announce(this, rootContainer, "Delete failed: " + e.getMessage());
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
