                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Read error: " + e.getMessage()));
                      }
                  });
              }

              @Override
              public void onLinePowerMenu(int lineIndex) {
                  if (engine == null) return;
                  String[] actions = {"Move Line Up", "Move Line Down", "Duplicate Line", "Toggle Comment (// or --)"};
                  new AlertDialog.Builder(this)
                          .setTitle("Line " + (lineIndex + 1) + " Actions")
                          .setItems(actions, (d, which) -> executeLinePowerAction(lineIndex, which))
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void executeLinePowerAction(int lineIndex, int action) {
                  executor.execute(() -> {
                      try {
                          int total = engine.getLineCount();
                          if (lineIndex < 0 || lineIndex >= total) return;
                          if (action == 0 && lineIndex > 0) {
                              swapAdjacentLines(lineIndex - 1, lineIndex);
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  focusLineInRecyclerView(lineIndex - 1, "Moved line up to " + lineIndex);
                              });
                          } else if (action == 1 && lineIndex < total - 1) {
                              swapAdjacentLines(lineIndex, lineIndex + 1);
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  focusLineInRecyclerView(lineIndex + 1, "Moved line down to " + (lineIndex + 2));
                              });
                          } else if (action == 2) {
                              String text = engine.readLine(lineIndex);
                              long pos = engine.getLineEndOffsetWithoutNewline(lineIndex);
                              undoManager.applyWithBytes(engine, pos, pos,
                                      (engine.getLineEnding() + text).getBytes(StandardCharsets.UTF_8), "Duplicate Line", lineIndex + 1);
                              hasChangesSinceLastBackup = true;
                              updateRepoStatsIfSaved();
                              syncProjectFileToExternalIfProject();
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(lineIndex + 1, "Line duplicated.");
                              });
                          } else if (action == 3) {
                              String text = engine.readLine(lineIndex);
                              String tok = "Lua".equalsIgnoreCase(currentLanguage) ? "-- " : ("Python".equalsIgnoreCase(currentLanguage) ? "# " : "// ");
                              String trimmed = text.trim();
                              String updated = trimmed.startsWith(tok.trim())
                                      ? text.replaceFirst(java.util.regex.Pattern.quote(tok.trim()) + "\\s?", "")
                                      : tok + text;
                              long start = engine.getLineStartOffset(lineIndex);
                              long end = engine.getLineEndOffsetWithoutNewline(lineIndex);
                              undoManager.applyWithBytes(engine, start, end, updated.getBytes(StandardCharsets.UTF_8), "Toggle Comment", lineIndex);
                              hasChangesSinceLastBackup = true;
                              updateRepoStatsIfSaved();
                              syncProjectFileToExternalIfProject();
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  focusLineInRecyclerView(lineIndex, "Comment toggled on line " + (lineIndex + 1));
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Action error: " + e.getMessage()));
                      }
                  });
              }

              private void swapAdjacentLines(int upperIdx, int lowerIdx) throws IOException {
                  String upper = engine.readLine(upperIdx);
                  String lower = engine.readLine(lowerIdx);
                  long start = engine.getLineStartOffset(upperIdx);
                  long end = engine.getLineEndOffsetWithoutNewline(lowerIdx);
                  String combined = lower + engine.getLineEnding() + upper;
                  undoManager.applyWithBytes(engine, start, end, combined.getBytes(StandardCharsets.UTF_8), "Move Line", upperIdx);
                  hasChangesSinceLastBackup = true;
                  updateRepoStatsIfSaved();
                  syncProjectFileToExternalIfProject();
              }

