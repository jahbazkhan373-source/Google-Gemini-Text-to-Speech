                      Uri uri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) throw new IOException("Could not create TXT file.");
                      try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(srcFile), 65536);
                           OutputStream out = context.getContentResolver().openOutputStream(uri)) {
                          if (out == null) throw new IOException("Write permission denied.");
                          byte[] buf = new byte[65536];
