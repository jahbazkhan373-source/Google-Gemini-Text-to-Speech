              private boolean isRecognizedVoiceTag(String rawTag) {
                  String s = (rawTag != null ? rawTag : "").toLowerCase(Locale.US);
                  if (s.contains("male") || s.contains("female") || s.contains("narrator") || s.contains("voice") || s.contains("speaker")) return true;
                  if (s.contains("مرد") || s.contains("عورت") || s.contains("فیمیل") || s.contains("میل") || s.contains("راوی")) return true;
                  return ALL_VOICES_LOWER.containsKey(s);
              }

              private String getNextUniqueVoice(boolean isFemale, String narratorClean) {
                  String[] pool = isFemale ? FEMALE_VOICES : MALE_VOICES;
                  for (int i = 0; i < pool.length; i++) {
                      int idx = isFemale ? ((dynFemaleIndex + i) % pool.length) : ((dynMaleIndex + i) % pool.length);
                      String candidate = pool[idx];
                      if (!usedVoices.contains(candidate) && !candidate.equals(narratorClean)) {
                          if (isFemale) dynFemaleIndex = (idx + 1) % pool.length;
                          else dynMaleIndex = (idx + 1) % pool.length;
                          usedVoices.add(candidate);
                          return candidate;
                      }
                  }
                  if (isFemale) {
                      String v = pool[dynFemaleIndex % pool.length];
                      dynFemaleIndex = (dynFemaleIndex + 1) % pool.length;
                      return v;
                  } else {
                      String v = pool[dynMaleIndex % pool.length];
                      dynMaleIndex = (dynMaleIndex + 1) % pool.length;
                      return v;
                  }
              }

              private String normalizeVoiceTagString(String rawTag) {
                  String s = (rawTag != null ? rawTag : "").toLowerCase(Locale.US);
                  s = s.replace("fifteen", "15")
                       .replace("fourteen", "14")
                       .replace("thirteen", "13")
                       .replace("twelve", "12")
                       .replace("eleven", "11")
                       .replace("ten", "10")
                       .replace("nine", "9")
                       .replace("eight", "8")
                       .replace("seven", "7")
                       .replace("six", "6")
                       .replace("five", "5")
                       .replace("four", "4")
                       .replace("three", "3")
                       .replace("two", "2")
                       .replace("one", "1")
                       .replace(" voice", "")
                       .replaceAll("\\s+", " ")
                       .trim();
                  return s;
              }

              private ParsedLine parseStoryLine(String line) {
                  String voiceTag = "";
                  String charName = "";
                  String dialogue = line;

                  Matcher mA = Pattern.compile("^\\s*([^\\[\\]:]+)\\s*\\[([^\\]]+)\\]\\s*:\\s*(.*)", Pattern.DOTALL).matcher(line);
                  if (mA.matches() && isRecognizedVoiceTag(mA.group(2))) {
                      charName = mA.group(1).trim().toLowerCase(Locale.US);
                      voiceTag = mA.group(2).trim().toLowerCase(Locale.US);
                      dialogue = mA.group(3);
                  } else {
                      Matcher mB = Pattern.compile("^\\s*\\[([^\\]]+)\\]\\s*:\\s*(.*)", Pattern.DOTALL).matcher(line);
                      if (mB.matches() && isRecognizedVoiceTag(mB.group(1))) {
                          voiceTag = mB.group(1).trim().toLowerCase(Locale.US);
                          dialogue = mB.group(2);
                      } else {
                          Matcher mC = Pattern.compile("^\\s*\\[([^\\]]+)\\]\\s*([^:]+):\\s*(.*)", Pattern.DOTALL).matcher(line);
                          if (mC.matches() && isRecognizedVoiceTag(mC.group(1))) {
                              voiceTag = mC.group(1).trim().toLowerCase(Locale.US);
                              charName = mC.group(2).trim().toLowerCase(Locale.US);
                              dialogue = mC.group(3);
                          } else {
                              Matcher mD = Pattern.compile("^\\s*\\[([^\\]]+)\\]\\s*(.*)", Pattern.DOTALL).matcher(line);
                              if (mD.matches() && isRecognizedVoiceTag(mD.group(1))) {
                                  voiceTag = mD.group(1).trim().toLowerCase(Locale.US);
                                  dialogue = mD.group(2);
                              } else {
                                  Matcher mE = Pattern.compile("^\\s*([^\\[\\]:]+):\\s*(.*)", Pattern.DOTALL).matcher(line);
                                  if (mE.matches() && mE.group(1).length() < 60) {
                                      charName = mE.group(1).trim().toLowerCase(Locale.US);
                                      dialogue = mE.group(2);
                                  }
                              }
                          }
                      }
                  }

                  String narratorClean = extractFirstWord(selectedNarrator);
                  usedVoices.add(narratorClean);
                  String voiceToUse = narratorClean;

                  if (!charName.isEmpty() && assignedVoices.containsKey("char_" + charName)) {
                      CleanedResult res = cleanDialogueAndExtractPause(dialogue);
                      return new ParsedLine(assignedVoices.get("char_" + charName), res.text, res.pauseSec);
                  }

                  if (!voiceTag.isEmpty()) {
                      String normalizedTag = normalizeVoiceTagString(voiceTag);
                      if (normalizedTag.contains("narrator") || normalizedTag.contains("راوی")) {
                          voiceToUse = narratorClean;
                      } else if (assignedVoices.containsKey("tag_" + normalizedTag)) {
                          voiceToUse = assignedVoices.get("tag_" + normalizedTag);
                      } else if (FEMALE_MAPPING.containsKey(normalizedTag)) {
                          voiceToUse = FEMALE_MAPPING.get(normalizedTag);
                          usedVoices.add(voiceToUse);
                          assignedVoices.put("tag_" + normalizedTag, voiceToUse);
                      } else if (MALE_MAPPING.containsKey(normalizedTag)) {
                          voiceToUse = MALE_MAPPING.get(normalizedTag);
                          usedVoices.add(voiceToUse);
                          assignedVoices.put("tag_" + normalizedTag, voiceToUse);
                      } else if (ALL_VOICES_LOWER.containsKey(normalizedTag)) {
                          voiceToUse = ALL_VOICES_LOWER.get(normalizedTag);
                          usedVoices.add(voiceToUse);
                          assignedVoices.put("tag_" + normalizedTag, voiceToUse);
                      } else {
                          boolean isFem = isFemaleUrduOrEnglishName(normalizedTag) || isFemaleUrduOrEnglishName(charName);
                          voiceToUse = getNextUniqueVoice(isFem, narratorClean);
                          assignedVoices.put("tag_" + normalizedTag, voiceToUse);
                      }
                      if (!charName.isEmpty()) assignedVoices.put("char_" + charName, voiceToUse);
                  } else if (!charName.isEmpty()) {
                      String normChar = normalizeVoiceTagString(charName);
                      if (charName.contains("narrator") || charName.contains("راوی")) {
                          voiceToUse = narratorClean;
                      } else if (FEMALE_MAPPING.containsKey(normChar)) {
                          voiceToUse = FEMALE_MAPPING.get(normChar);
                          usedVoices.add(voiceToUse);
                          assignedVoices.put("char_" + charName, voiceToUse);
                      } else if (MALE_MAPPING.containsKey(normChar)) {
                          voiceToUse = MALE_MAPPING.get(normChar);
                          usedVoices.add(voiceToUse);
                          assignedVoices.put("char_" + charName, voiceToUse);
                      } else {
                          boolean isFemChar = isFemaleUrduOrEnglishName(charName);
                          voiceToUse = getNextUniqueVoice(isFemChar, narratorClean);
                          assignedVoices.put("char_" + charName, voiceToUse);
                      }
                  }

                  CleanedResult res = cleanDialogueAndExtractPause(dialogue);
                  return new ParsedLine(voiceToUse, res.text, res.pauseSec);
              }

              private ParsedLine parseBroadcastLine(String line) {
                  Matcher m = Pattern.compile("^\\s*(?:[Ss][Pp][Ee][Aa][Kk][Ee][Rr]|[Hh][Oo][Ss][Tt])\\s*(\\d+)\\s*:\\s*(.*)", Pattern.DOTALL).matcher(line);
                  int spkIdx = 0;
                  String dialogue = line;
                  if (m.matches()) {
                      int n = 1;
                      try { n = Integer.parseInt(m.group(1)); } catch (Exception ignored) {}
                      if (n < 1) n = 1;
                      if (n > broadcastSpeakerCount) n = ((n - 1) % broadcastSpeakerCount) + 1;
                      spkIdx = n - 1;
                      dialogue = m.group(2);
                  } else {
                      Matcher mAny = Pattern.compile("^\\s*([^:]+):\\s*(.*)", Pattern.DOTALL).matcher(line);
                      if (mAny.matches() && (line.length() - mAny.group(2).length()) < 35) {
                          dialogue = mAny.group(2);
                      }
                  }
                  String vDisplay = broadcastVoices[spkIdx];
                  String cleanV = extractFirstWord(vDisplay);
                  CleanedResult res = cleanDialogueAndExtractPause(dialogue);
                  return new ParsedLine(cleanV, res.text, res.pauseSec);
              }

              private List<String> splitSingleChunkSafe(String text, int minC, int maxC) {
                  List<String> subChunks = new ArrayList<>();
                  if (text == null || text.isEmpty()) return subChunks;
                  int totalLen = text.length();
                  int chunkStart = 0;

                  while (chunkStart < totalLen) {
                      int pos = chunkStart;
                      int charCount = 0;
                      int lastPunctEnd = -1;
                      int lastSpaceEnd = -1;

                      while (pos < totalLen && charCount < maxC) {
                          char ch = text.charAt(pos);
                          charCount++;
                          if (charCount >= minC) {
                              if (ch == '.' || ch == '!' || ch == '?' || ch == '\n' || ch == '۔' || ch == '؟' || ch == '।' || ch == '。' || ch == '！' || ch == '？' || ch == '؛') {
                                  lastPunctEnd = pos + 1;
                              } else if (ch == ' ' || ch == '\t') {
                                  lastSpaceEnd = pos + 1;
                              }
                          }
                          pos++;
                      }

                      if (pos >= totalLen) {
                          String part = text.substring(chunkStart).trim();
                          if (!part.isEmpty()) subChunks.add(part);
                          break;
                      }

                      int splitEnd = pos;
                      if (lastPunctEnd != -1) splitEnd = lastPunctEnd;
                      else if (lastSpaceEnd != -1) splitEnd = lastSpaceEnd;

                      String part = text.substring(chunkStart, splitEnd).trim();
                      if (!part.isEmpty()) subChunks.add(part);
                      chunkStart = splitEnd;
                  }
                  return subChunks;
              }

              private List<TtsJob> buildQuotaSavingJobs(String text, String modeName) {
                  List<TtsJob> jobs = new ArrayList<>();
                  if (text == null || text.isEmpty()) return jobs;
                  text = text.replace("\r\n", "\n").replace("\r", "\n").replaceAll("[\\x00-\\x08\\x0B-\\x1F\\x7F]", "");
                  if (text.length() > MAX_TOTAL_CHARS) {
                      text = text.substring(0, MAX_TOTAL_CHARS);
                  }

                  if ("single".equals(modeName)) {
                      List<String> chunks = splitSingleChunkSafe(text, MIN_CHUNK_SIZE, MAX_CHUNK_SIZE);
                      String cleanV = extractFirstWord(selectedVoice);
                      for (String ch : chunks) {
                          CleanedResult cr = cleanDialogueAndExtractPause(ch);
                          if (!cr.text.isEmpty()) {
                              TtsJob j = new TtsJob();
                              j.mode = "single";
                              j.voice1 = cleanV;
                              j.text = applySingleToneIfNeeded(cr.text);
                              j.pauseAfter = cr.pauseSec;
                              jobs.add(j);
                          } else if (cr.pauseSec > 0) {
                              TtsJob j = new TtsJob();
                              j.mode = "silence";
                              j.pauseAfter = cr.pauseSec;
                              jobs.add(j);
                          }
                      }
                      return jobs;
                  }

                  List<ParsedLine> parsedItems = new ArrayList<>();
                  String[] lines = text.split("\n", -1);
                  for (String line : lines) {
                      String trimmed = line.trim();
                      if (!trimmed.isEmpty()) {
                          ParsedLine pl = "story".equals(modeName) ? parseStoryLine(trimmed) : parseBroadcastLine(trimmed);
                          if (!pl.text.isEmpty()) {
                              if (pl.text.length() > MAX_BATCH_CHARS) {
                                  List<String> subs = splitSingleChunkSafe(pl.text, MIN_CHUNK_SIZE, MAX_CHUNK_SIZE);
                                  for (int i = 0; i < subs.size(); i++) {
                                      parsedItems.add(new ParsedLine(pl.voice, subs.get(i), (i == subs.size() - 1) ? pl.pauseAfter : 0));
                                  }
                              } else {
                                  parsedItems.add(pl);
                              }
                          } else if (pl.pauseAfter > 0) {
                              parsedItems.add(new ParsedLine(null, "", pl.pauseAfter));
                          }
                      }
                  }

                  String curVoice1 = null;
                  String curVoice2 = null;
                  List<ParsedLine> curLines = new ArrayList<>();
                  int curCharCount = 0;
                  double curPauseAfter = 0;

                  for (ParsedLine item : parsedItems) {
                      if (item.text.isEmpty() && item.pauseAfter > 0) {
                          curPauseAfter += item.pauseAfter;
                          flushBatch(jobs, curVoice1, curVoice2, curLines, curPauseAfter);
                          curVoice1 = null; curVoice2 = null; curLines.clear(); curCharCount = 0; curPauseAfter = 0;
                      } else {
                          int cLen = item.text.length();
                          boolean canJoin = false;
                          if (curVoice1 == null) {
                              canJoin = true;
                          } else if ((curCharCount + cLen) <= MAX_BATCH_CHARS) {
                              if (item.voice.equals(curVoice1) || item.voice.equals(curVoice2) || curVoice2 == null) {
                                  canJoin = true;
                              }
                          }
                          if (!canJoin) {
                              flushBatch(jobs, curVoice1, curVoice2, curLines, curPauseAfter);
                              curVoice1 = null; curVoice2 = null; curLines.clear(); curCharCount = 0; curPauseAfter = 0;
                          }
                          if (curVoice1 == null) curVoice1 = item.voice;
                          else if (curVoice2 == null && !item.voice.equals(curVoice1)) curVoice2 = item.voice;

                          curLines.add(item);
                          curCharCount += cLen;
                          if (item.pauseAfter >= 0.8) {
                              curPauseAfter += item.pauseAfter;
                              flushBatch(jobs, curVoice1, curVoice2, curLines, curPauseAfter);
                              curVoice1 = null; curVoice2 = null; curLines.clear(); curCharCount = 0; curPauseAfter = 0;
                          } else if (item.pauseAfter > 0) {
                              curPauseAfter += item.pauseAfter;
                          }
                      }
                  }
                  flushBatch(jobs, curVoice1, curVoice2, curLines, curPauseAfter);
                  return jobs;
              }

              private void flushBatch(List<TtsJob> jobs, String curVoice1, String curVoice2, List<ParsedLine> curLines, double curPauseAfter) {
                  if (curLines.isEmpty()) {
                      if (curPauseAfter > 0) {
                          TtsJob j = new TtsJob();
                          j.mode = "silence";
                          j.pauseAfter = curPauseAfter;
                          jobs.add(j);
                      }
                      return;
                  }
                  StringBuilder sb = new StringBuilder();
                  if (curVoice2 == null) {
                      for (int i = 0; i < curLines.size(); i++) {
                          if (i > 0) sb.append("\n\n");
                          sb.append(curLines.get(i).text);
                      }
                      TtsJob j = new TtsJob();
                      j.mode = "single";
                      j.voice1 = curVoice1;
                      j.text = sb.toString();
                      j.pauseAfter = curPauseAfter;
                      jobs.add(j);
                  } else {
                      for (int i = 0; i < curLines.size(); i++) {
                          if (i > 0) sb.append("\n");
                          ParsedLine item = curLines.get(i);
                          String tag = item.voice.equals(curVoice1) ? "Speaker1: " : "Speaker2: ";
                          sb.append(tag).append(item.text);
                      }
                      TtsJob j = new TtsJob();
                      j.mode = "multi2";
                      j.voice1 = curVoice1;
                      j.voice2 = curVoice2;
                      j.text = sb.toString();
                      j.pauseAfter = curPauseAfter;
                      jobs.add(j);
                  }
              }

              // ==================== Gemini API Calls ====================

              private void discoverActiveTextModel(final String apiKey, final ModelDiscoveryCallback cb) {
                  bgExecutor.execute(() -> {
                      try {
                          String url = "https://generativelanguage.googleapis.com/v1beta/models?key=" + URLEncoder.encode(apiKey, "UTF-8");
                          HttpResult res = httpRequest("GET", url, null, null, false);
                          if (res.code == 200) {
                              JSONObject data = new JSONObject(res.body);
                              JSONArray models = data.optJSONArray("models");
                              if (models != null) {
                                  String bestFlash = null;
                                  String anyGen = null;
                                  for (int i = 0; i < models.length(); i++) {
                                      JSONObject m = models.optJSONObject(i);
                                      if (m == null) continue;
                                      String rawName = m.optString("name", "");
                                      String shortName = rawName.replaceFirst("^models/", "");
                                      String low = shortName.toLowerCase(Locale.US);
                                      boolean supportsGen = false;
                                      JSONArray methods = m.optJSONArray("supportedGenerationMethods");
                                      if (methods != null) {
                                          for (int j = 0; j < methods.length(); j++) {
                                              if ("generateContent".equals(methods.optString(j))) {
                                                  supportsGen = true;
                                                  break;
                                              }
                                          }
                                      }
                                      if (supportsGen && !low.contains("tts") && !low.contains("embedding")
                                          && !low.contains("imagen") && !low.contains("veo")
                                          && !low.contains("audio") && !low.contains("vision")) {
                                          if (low.contains("flash") && bestFlash == null) bestFlash = shortName;
                                          else if (anyGen == null) anyGen = shortName;
                                      }
                                  }
                                  final String chosen = bestFlash != null ? bestFlash : anyGen;
                                  if (chosen != null) {
                                      discoveredTextModel = chosen;
                                      saveSettings();
                                      runOnUi(() -> cb.onFound(true, chosen));
                                      return;
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      runOnUi(() -> cb.onFound(false, null));
                  });
              }

              private void callGeminiTextModel(final String promptText, final int modelIndex, final int retryCount,
                                               final boolean triedDiscovery, final int genId, final TextModelCallback cb) {
                  if (cancellationRequested || genId != currentGenerationId.get()) {
                      runOnUi(() -> cb.onResult(false, "Cancelled by user", null));
                      return;
                  }
                  if (!isNetworkAvailable()) {
                      runOnUi(() -> cb.onResult(false, "No internet connection", null));
                      return;
                  }
                  if (getValidApiKeysList().isEmpty()) {
                      runOnUi(() -> cb.onResult(false, "No API Keys configured", null));
                      return;
                  }

                  final List<String> textModelsList = getOrderedTextModels();
                  if (modelIndex >= textModelsList.size()) {
                      KeyChoice anyKey = getWorkingApiKey(null);
                      if (!triedDiscovery && anyKey != null) {
                          discoverActiveTextModel(anyKey.key, (found, newModel) -> {
                              if (found && newModel != null) {
                                  callGeminiTextModel(promptText, 0, 0, true, genId, cb);
                              } else {
                                  String reason = "No compatible Gemini text model found for this API key";
                                  logAppError("SCRIPT_AI", reason);
                                  cb.onResult(false, reason, null);
                              }
                          });
                      } else {
                          String reason = "All text models failed";
                          logAppError("SCRIPT_AI", reason);
                          runOnUi(() -> cb.onResult(false, reason, null));
                      }
                      return;
                  }

                  final String currentModel = textModelsList.get(modelIndex);
                  final KeyChoice choice = getWorkingApiKey(currentModel);
                  if (choice == null) {
                      callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb);
                      return;
                  }
                  final int maxKeyRetries = Math.max(1, countUnblockedKeys(currentModel));

                  bgExecutor.execute(() -> {
                      try {
                          String apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/" + currentModel
                              + ":generateContent?key=" + URLEncoder.encode(choice.key, "UTF-8");

                          JSONObject reqBody = new JSONObject();
                          reqBody.put("contents", new JSONArray().put(
                              new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", promptText)))
                          ));
                          reqBody.put("generationConfig", new JSONObject()
                              .put("temperature", 0.85)
                              .put("maxOutputTokens", 8192));

                          HttpResult res = httpRequest("POST", apiUrl, reqBody.toString(), "application/json", true);
                          if (cancellationRequested || genId != currentGenerationId.get()) {
                              runOnUi(() -> cb.onResult(false, "Cancelled by user", null));
                              return;
                          }

                          if (res.code == 200) {
                              try {
                                  JSONObject data = new JSONObject(res.body);
                                  JSONArray cands = data.optJSONArray("candidates");
                                  if (cands != null && cands.length() > 0) {
                                      JSONObject cont = cands.getJSONObject(0).optJSONObject("content");
                                      if (cont != null) {
                                          JSONArray resParts = cont.optJSONArray("parts");
                                          if (resParts != null) {
                                              StringBuilder out = new StringBuilder();
                                              for (int i = 0; i < resParts.length(); i++) {
                                                  String t = resParts.getJSONObject(i).optString("text", "");
                                                  if (!t.isEmpty()) {
                                                      if (out.length() > 0) out.append("\n");
                                                      out.append(t);
                                                  }
                                              }
                                              String fullRes = out.toString().trim();
                                              if (!fullRes.isEmpty()) {
                                                  if (!currentModel.equals(discoveredTextModel)) {
                                                      discoveredTextModel = currentModel;
                                                      saveSettings();
                                                  }
                                                  runOnUi(() -> cb.onResult(true, fullRes, currentModel));
                                                  return;
                                              }
                                          }
                                      }
                                  }
                              } catch (Exception ignored) {}
                              callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb);
                          } else if (res.code == 404) {
                              markKeyModelBlocked(choice.index, currentModel);
                              callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb);
                          } else if (res.code == 429) {
                              markKeyCooldown(choice.index, 60);
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(800, () -> callGeminiTextModel(promptText, modelIndex, retryCount + 1, triedDiscovery, genId, cb));
                              } else if (modelIndex + 1 < textModelsList.size()) {
                                  rotateToNextWorkingApiKey(textModelsList.get(modelIndex + 1));
                                  delay(800, () -> callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb));
                              } else {
                                  String reason = "Rate limit exceeded (429) on all API keys for script generation";
                                  logAppError("SCRIPT_AI", reason);
                                  runOnUi(() -> cb.onResult(false, reason, null));
                              }
                          } else if (res.code == 401 || res.code == 403) {
                              String detail = extractApiErrorDetail(res.body, "HTTP " + res.code);
                              markKeyModelBlocked(choice.index, currentModel);
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(600, () -> callGeminiTextModel(promptText, modelIndex, retryCount + 1, triedDiscovery, genId, cb));
                              } else if (modelIndex + 1 < textModelsList.size()) {
                                  callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb);
                              } else {
                                  String reason = currentModel + " Error (" + res.code + "): " + detail;
                                  logAppError("SCRIPT_AI", reason);
                                  runOnUi(() -> cb.onResult(false, reason, null));
                              }
                          } else if (res.code == 400 || res.code == 500 || res.code == 503) {
                              String detail = extractApiErrorDetail(res.body, "HTTP " + res.code);
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(800, () -> callGeminiTextModel(promptText, modelIndex, retryCount + 1, triedDiscovery, genId, cb));
                              } else if (modelIndex + 1 < textModelsList.size()) {
                                  callGeminiTextModel(promptText, modelIndex + 1, 0, triedDiscovery, genId, cb);
                              } else {
                                  String reason = currentModel + " Error (" + res.code + "): " + detail;
                                  logAppError("SCRIPT_AI", reason);
                                  runOnUi(() -> cb.onResult(false, reason, null));
                              }
                          } else {
                              String detail = (res.code <= 0) ? "Network connection lost or timeout" : (currentModel + " HTTP Error " + res.code);
                              logAppError("SCRIPT_AI", detail);
                              runOnUi(() -> cb.onResult(false, detail, null));
                          }
                      } catch (Exception e) {
                          logAppError("SCRIPT_AI", e.getMessage());
                          runOnUi(() -> cb.onResult(false, sanitizeErrorText(e.getMessage()), null));
                      }
                  });
              }

              private void textToSpeechJob(final TtsJob job, final int modelIndex, final int retryCount,
                                           final int cooldownStage, final boolean primaryRateLimited,
                                           final int genId, final TtsJobCallback cb) {
                  if (cancellationRequested || genId != currentGenerationId.get()) {
                      runOnUi(() -> cb.onResult(false, null, 0, 0, "Cancelled by user"));
                      return;
                  }
                  if (!isNetworkAvailable()) {
                      runOnUi(() -> cb.onResult(false, null, 0, 0, "No internet connection"));
                      return;
                  }
                  final List<String> modelsList = getOrderedModels();
                  if (modelIndex >= modelsList.size()) {
                      String msg = primaryRateLimited
                          ? "Quota/Rate limit exceeded (429) on all API keys"
                          : "All TTS models failed to generate audio";
                      runOnUi(() -> cb.onResult(false, null, 0, 0, msg));
                      return;
                  }
                  if (getValidApiKeysList().isEmpty()) {
                      runOnUi(() -> cb.onResult(false, null, 0, 0, "No API Keys configured"));
                      return;
                  }

                  final String currentModel = modelsList.get(modelIndex);
                  if (countUnblockedKeys(currentModel) == 0) {
                      textToSpeechJob(job, modelIndex + 1, 0, 0, primaryRateLimited, genId, cb);
                      return;
                  }

                  final KeyChoice choice = getWorkingApiKey(currentModel);
                  if (choice == null) {
                      textToSpeechJob(job, modelIndex + 1, 0, 0, primaryRateLimited, genId, cb);
                      return;
                  }
                  final int maxKeyRetries = Math.max(1, countUnblockedKeys(currentModel));

                  bgExecutor.execute(() -> {
                      try {
                          String apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/" + currentModel
                              + ":generateContent?key=" + URLEncoder.encode(choice.key, "UTF-8");

                          JSONObject speechCfg = new JSONObject();
                          if ("multi2".equals(job.mode) && job.voice2 != null) {
                              JSONArray spkArr = new JSONArray();
                              spkArr.put(new JSONObject()
                                  .put("speaker", "Speaker1")
                                  .put("voiceConfig", new JSONObject().put("prebuiltVoiceConfig",
                                      new JSONObject().put("voiceName", job.voice1 != null ? job.voice1 : "Puck"))));
                              spkArr.put(new JSONObject()
                                  .put("speaker", "Speaker2")
                                  .put("voiceConfig", new JSONObject().put("prebuiltVoiceConfig",
                                      new JSONObject().put("voiceName", job.voice2))));
                              speechCfg.put("multiSpeakerVoiceConfig", new JSONObject().put("speakerVoiceConfigs", spkArr));
                          } else {
                              speechCfg.put("voiceConfig", new JSONObject().put("prebuiltVoiceConfig",
                                  new JSONObject().put("voiceName", job.voice1 != null ? job.voice1 : "Puck")));
                          }

                          JSONObject reqBody = new JSONObject();
                          reqBody.put("contents", new JSONArray().put(
                              new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", job.text)))
                          ));
                          reqBody.put("generationConfig", new JSONObject()
                              .put("responseModalities", new JSONArray().put("AUDIO"))
                              .put("speechConfig", speechCfg));

                          HttpResult res = httpRequest("POST", apiUrl, reqBody.toString(), "application/json", true);
                          if (cancellationRequested || genId != currentGenerationId.get()) {
                              runOnUi(() -> cb.onResult(false, null, 0, 0, "Cancelled by user"));
                              return;
                          }

                          if (res.code == 200) {
                              try {
                                  JSONObject data = new JSONObject(res.body);
                                  JSONArray cands = data.optJSONArray("candidates");
                                  if (cands != null && cands.length() > 0) {
                                      JSONObject cont = cands.getJSONObject(0).optJSONObject("content");
                                      if (cont != null) {
                                          JSONArray resParts = cont.optJSONArray("parts");
                                          if (resParts != null) {
                                              for (int i = 0; i < resParts.length(); i++) {
                                                  JSONObject inline = resParts.getJSONObject(i).optJSONObject("inlineData");
                                                  if (inline != null && inline.has("data")) {
                                                      String b64 = inline.optString("data", "");
                                                      if (!b64.isEmpty()) {
                                                          byte[] audioBytes = Base64.decode(b64, Base64.DEFAULT);
                                                          if (audioBytes != null && audioBytes.length > 44) {
                                                              int offset = detectWavDataOffset(audioBytes);
                                                              int dataLen = audioBytes.length - offset;
                                                              if (dataLen > 0) {
                                                                  runOnUi(() -> cb.onResult(true, audioBytes, offset, dataLen, currentModel));
                                                                  return;
                                                              }
                                                          }
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              } catch (Exception ignored) {}
                              textToSpeechJob(job, modelIndex + 1, 0, 0, primaryRateLimited, genId, cb);
                          } else if (res.code == 429) {
                              markKeyCooldown(choice.index, 60);
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(800, () -> textToSpeechJob(job, modelIndex, retryCount + 1, cooldownStage, true, genId, cb));
                              } else if (cooldownStage < 3) {
                                  final int waitSecs = (cooldownStage == 0) ? 15 : ((cooldownStage == 1) ? 25 : 35);
                                  runOnUi(() -> statusText.setText("Rate limit (429) - waiting " + waitSecs + "s for quota reset (try " + (cooldownStage + 1) + "/3)..."));
                                  delay(waitSecs * 1000L, () -> textToSpeechJob(job, modelIndex, 0, cooldownStage + 1, true, genId, cb));
                              } else if (modelIndex + 1 < modelsList.size() && countUnblockedKeys(modelsList.get(modelIndex + 1)) > 0) {
                                  rotateToNextWorkingApiKey(modelsList.get(modelIndex + 1));
                                  delay(1000, () -> textToSpeechJob(job, modelIndex + 1, 0, 0, true, genId, cb));
                              } else {
                                  String detail = extractApiErrorDetail(res.body, "Quota/Rate limit exceeded (429) on all API keys");
                                  logAppError("TTS_API", "429: " + detail);
                                  runOnUi(() -> cb.onResult(false, null, 0, 0, "Quota/Rate limit exceeded (429)"));
                              }
                          } else if (res.code == 401 || res.code == 403 || res.code == 404) {
                              String detail = extractApiErrorDetail(res.body, "HTTP " + res.code);
                              markKeyModelBlocked(choice.index, currentModel);
                              logAppError("TTS_API", currentModel + " Key#" + (choice.index + 1) + " HTTP " + res.code + ": " + detail);
                              if (countUnblockedKeys(currentModel) > 0) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(500, () -> textToSpeechJob(job, modelIndex, retryCount + 1, cooldownStage, primaryRateLimited, genId, cb));
                              } else if (modelIndex + 1 < modelsList.size() && countUnblockedKeys(modelsList.get(modelIndex + 1)) > 0) {
                                  textToSpeechJob(job, modelIndex + 1, 0, 0, primaryRateLimited, genId, cb);
                              } else {
                                  final String finalErr = primaryRateLimited
                                      ? "Quota/Rate limit exceeded (429) on primary model"
                                      : (currentModel + " HTTP " + res.code + ": " + detail);
                                  runOnUi(() -> cb.onResult(false, null, 0, 0, finalErr));
                              }
                          } else if (res.code == 500 || res.code == 503) {
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(1200, () -> textToSpeechJob(job, modelIndex, retryCount + 1, cooldownStage, primaryRateLimited, genId, cb));
                              } else if (cooldownStage < 1) {
                                  delay(4000, () -> textToSpeechJob(job, modelIndex, 0, 1, primaryRateLimited, genId, cb));
                              } else {
                                  String detail = extractApiErrorDetail(res.body, "Server Error HTTP " + res.code);
                                  logAppError("TTS_API", detail);
                                  runOnUi(() -> cb.onResult(false, null, 0, 0, detail));
                              }
                          } else if (res.code == 400) {
                              String detail = extractApiErrorDetail(res.body, "Invalid request or invalid API Key");
                              if (retryCount + 1 < maxKeyRetries) {
                                  rotateToNextWorkingApiKey(currentModel);
                                  delay(600, () -> textToSpeechJob(job, modelIndex, retryCount + 1, cooldownStage, primaryRateLimited, genId, cb));
                              } else if (modelIndex + 1 < modelsList.size()) {
                                  textToSpeechJob(job, modelIndex + 1, 0, 0, primaryRateLimited, genId, cb);
                              } else {
                                  logAppError("TTS_API", "HTTP 400: " + detail);
                                  runOnUi(() -> cb.onResult(false, null, 0, 0, "HTTP 400: " + detail));
                              }
                          } else {
                              String errMsg = (res.code <= 0) ? "Network connection lost or timeout" : ("HTTP Error " + res.code);
                              logAppError("TTS_API", errMsg);
                              runOnUi(() -> cb.onResult(false, null, 0, 0, errMsg));
                          }
                      } catch (Exception e) {
                          logAppError("TTS_API", e.getMessage());
                          runOnUi(() -> cb.onResult(false, null, 0, 0, sanitizeErrorText(e.getMessage())));
                      }
                  });
              }

