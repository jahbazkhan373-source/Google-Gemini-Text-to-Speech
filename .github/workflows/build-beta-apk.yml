                                  AccessibilityHelper.announce(this, rootContainer, "Run check passed with zero errors.");
                              });
                          }
                      } catch (Exception e) {
                          List<CodeIssue> errs = new ArrayList<>();
                          errs.add(new CodeIssue("Run Failed", 1, 0, e.getMessage(), "", false, CodeIssue.FixType.NONE, null, null));
                          runOnUiThread(() -> showErrorsList(errs));
                      }
                  });
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void showInteractiveWebView(String html, File baseDir) {
                  scrollConsole.setVisibility(View.GONE);
                  rvRunErrors.setVisibility(View.GONE);
                  btnCopyAllErrors.setVisibility(View.GONE);
                  webView.setVisibility(View.VISIBLE);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  String baseUrl = (baseDir != null) ? ("file://" + baseDir.getAbsolutePath() + "/") : "https://localhost/";
                  webView.loadDataWithBaseURL(baseUrl, html, "text/html", "UTF-8", null);
                  AccessibilityHelper.announce(this, rootContainer, "Interactive preview opened. All buttons and controls are live.");
              }

              private void showConsole(String text) {
                  webView.setVisibility(View.GONE);
                  rvRunErrors.setVisibility(View.GONE);
                  btnCopyAllErrors.setVisibility(View.GONE);
                  scrollConsole.setVisibility(View.VISIBLE);
                  tvConsole.setText(text);
              }

              private void showErrorsList(List<CodeIssue> issues) {
                  webView.setVisibility(View.GONE);
                  scrollConsole.setVisibility(View.GONE);
                  rvRunErrors.setVisibility(View.VISIBLE);
                  btnCopyAllErrors.setVisibility(View.VISIBLE);

                  currentErrors.clear();
                  currentErrors.addAll(issues);
                  errorAdapter.setItems(issues);
                  tvTitle.setText("Run Errors (" + issues.size() + ")");
