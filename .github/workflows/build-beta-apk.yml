                      return new VH(v);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      DiffEngine.DiffEntry e = items.get(pos);
                      if (e.type == DiffEngine.Type.MODIFIED) {
                          h.tvBadge.setText("Modified — Old Line " + e.oldLineNumber + " -> New Line " + e.newLineNumber);
                          h.tvOld.setVisibility(View.VISIBLE);
                          h.tvNew.setVisibility(View.VISIBLE);
