          package com.codebook.editor.util;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.nio.charset.StandardCharsets;

          public class ClipboardHelper {

              private static final String INTERNAL_CLIP_FILE = "internal_clipboard.txt";
              private static long lastInternalCopyTime = 0L;

              public static class CopyResult {
                  public final boolean systemCopied;
                  public final boolean internalCopied;
                  public final String message;

                  public CopyResult(boolean systemCopied, boolean internalCopied, String message) {
                      this.systemCopied = systemCopied;
                      this.internalCopied = internalCopied;
                      this.message = message;
                  }
              }

              public static void copyPlainText(Context context, String label, String text) {
                  if (context == null || text == null) return;
                  try {
                      ClipboardManager cm = (ClipboardManager) context.getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm != null) {
                          cm.setPrimaryClip(ClipData.newPlainText(label != null ? label : "CodeBook", text));
                      }
                  } catch (Throwable ignored) {
                  }
              }

              public static CopyResult copyFileContent(Context context, File sourceFile, long totalChars) {
                  if (sourceFile == null || !sourceFile.exists() || sourceFile.length() == 0) {
                      return new CopyResult(false, false, "Nothing to copy. Editor is empty.");
                  }

                  File internalFile = new File(context.getCacheDir(), INTERNAL_CLIP_FILE);
                  boolean internalOk = false;
                  try {
                      copyStream(sourceFile, internalFile);
                      lastInternalCopyTime = System.currentTimeMillis();
                      internalOk = true;
                  } catch (IOException e) {
                      return new CopyResult(false, false, "Copy failed: " + e.getMessage());
                  }

                  if (sourceFile.length() <= 1_024_000L) {
                      try {
                          String fullText = readFileAsUtf8(sourceFile);
                          ClipboardManager cm = (ClipboardManager) context.getSystemService(Context.CLIPBOARD_SERVICE);
                          if (cm != null) {
                              ClipData clip = ClipData.newPlainText("CodeBook", fullText);
                              cm.setPrimaryClip(clip);
                              return new CopyResult(
                                      true,
                                      internalOk,
                                      "Copied all code (" + totalChars + " chars)."
                              );
                          }
                      } catch (Throwable ignored) {
                      }
                  }

                  return new CopyResult(
                          false,
                          internalOk,
                          "Code is very large (" + totalChars + " chars). Saved completely in Code Book Internal Clipboard (Android system clipboard limit is 1 MB). You can paste it inside Code Book or use Line Range Copy."
                  );
              }

              public static String getPasteText(Context context) {
                  ClipboardManager cm = (ClipboardManager) context.getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null && cm.hasPrimaryClip()) {
                      ClipData clip = cm.getPrimaryClip();
                      if (clip != null && clip.getItemCount() > 0) {
                          CharSequence seq = clip.getItemAt(0).coerceToText(context);
                          if (seq != null && seq.length() > 0) {
                              return seq.toString();
                          }
                      }
                  }

                  File internalFile = new File(context.getCacheDir(), INTERNAL_CLIP_FILE);
                  if (internalFile.exists() && internalFile.length() > 0) {
                      try {
                          return readFileAsUtf8(internalFile);
                      } catch (IOException ignored) {
                      }
                  }
                  return null;
              }

              public static boolean hasLargeInternalClipboard(Context context) {
                  File internalFile = new File(context.getCacheDir(), INTERNAL_CLIP_FILE);
                  return internalFile.exists() && internalFile.length() > 1_024_000L && lastInternalCopyTime > 0L;
              }

              public static File getInternalClipboardFile(Context context) {
                  return new File(context.getCacheDir(), INTERNAL_CLIP_FILE);
              }

              private static void copyStream(File src, File dst) throws IOException {
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(src), 65536);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dst), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) {
                          out.write(buf, 0, len);
                      }
                      out.flush();
                  }
              }

              private static String readFileAsUtf8(File file) throws IOException {
                  byte[] bytes = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file), 65536)) {
                      int offset = 0;
                      int read;
                      while (offset < bytes.length && (read = in.read(bytes, offset, bytes.length - offset)) != -1) {
                          offset += read;
                      }
                  }
                  return new String(bytes, StandardCharsets.UTF_8);
              }
          }
