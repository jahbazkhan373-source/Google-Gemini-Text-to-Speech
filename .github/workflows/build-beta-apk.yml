          package com.codebook.editor.builder;

          import com.android.apksig.ApkSigner;
          import com.codebook.editor.model.KeystoreMeta;

          import java.io.File;
          import java.io.FileInputStream;
          import java.security.KeyStore;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          /**
           * Signs APKs offline using Google's official apksig library with v1, v2, v3, and v4 (.idsig) support.
           */
          public class ApkSignerEngine {

              public static void signApk(File inputUnsignedApk, File outputSignedApk,
                                         File keystoreFile, KeystoreMeta ksMeta,
                                         int minSdk, boolean v1, boolean v2, boolean v3, boolean v4) throws Exception {
                  if (inputUnsignedApk == null || !inputUnsignedApk.exists()) {
                      throw new IllegalArgumentException("Input APK does not exist.");
                  }
                  if (keystoreFile == null || !keystoreFile.exists()) {
                      throw new IllegalArgumentException("Signing Keystore file not found.");
                  }

                  KeyStore ks = KeyStore.getInstance(ksMeta.storeType != null && !ksMeta.storeType.isEmpty() ? ksMeta.storeType : "PKCS12");
                  try (FileInputStream fis = new FileInputStream(keystoreFile)) {
                      ks.load(fis, ksMeta.storePassword.toCharArray());
                  }

                  PrivateKey privateKey = (PrivateKey) ks.getKey(ksMeta.alias, ksMeta.keyPassword.toCharArray());
                  if (privateKey == null) {
                      throw new IllegalStateException("Private key not found for alias: " + ksMeta.alias);
                  }

                  Certificate[] chain = ks.getCertificateChain(ksMeta.alias);
                  List<X509Certificate> certs = new ArrayList<>();
                  if (chain != null) {
                      for (Certificate c : chain) {
                          if (c instanceof X509Certificate) certs.add((X509Certificate) c);
                      }
                  }
                  if (certs.isEmpty()) {
                      Certificate single = ks.getCertificate(ksMeta.alias);
                      if (single instanceof X509Certificate) certs.add((X509Certificate) single);
                  }
                  if (certs.isEmpty()) {
                      throw new IllegalStateException("X.509 certificate missing in keystore.");
                  }

                  ApkSigner.SignerConfig signerConfig = new ApkSigner.SignerConfig.Builder(
                          ksMeta.alias, privateKey, certs
                  ).build();

                  // Android 5 & 6 (minSdk < 24) require v1; v4 requires v2 or v3
                  boolean effectiveV1 = v1 || (minSdk < 24);
                  boolean effectiveV2 = v2;
                  boolean effectiveV3 = v3;
                  boolean effectiveV4 = v4 && (effectiveV2 || effectiveV3);

                  ApkSigner.Builder builder = new ApkSigner.Builder(Collections.singletonList(signerConfig))
                          .setInputApk(inputUnsignedApk)
                          .setOutputApk(outputSignedApk)
                          .setMinSdkVersion(Math.max(21, minSdk))
                          .setV1SigningEnabled(effectiveV1)
                          .setV2SigningEnabled(effectiveV2)
                          .setV3SigningEnabled(effectiveV3)
                          .setV4SigningEnabled(effectiveV4);

                  if (effectiveV4) {
                      builder.setV4SignatureOutputFile(new File(outputSignedApk.getAbsolutePath() + ".idsig"));
                  }

                  builder.build().sign();
              }
          }
