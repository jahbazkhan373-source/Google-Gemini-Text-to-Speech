                  if (dirtyPageFile.exists()) dirtyPageFile.delete();
              }

              public static void saveLastCrashLog(Context context, Throwable throwable) {
                  try {
                      File dir = new File(context.getFilesDir(), DIR_RECOVERY);
                      if (!dir.exists()) dir.mkdirs();
                      File logFile = new File(dir, CRASH_LOG_FILE);

                      StringWriter sw = new StringWriter();
