              public static final String EXTRA_DEFAULT_AAB = "extra_default_aab";

              private View rootContainer;
              private TextView tvBuildTitle, tvDoctor, tvBuildLog;
              private RadioButton rbOffline, rbOnline;
              private Button btnInstall;

              private ProjectRepository projectRepo;
              private ProjectMeta project;
              private File lastBuiltFile = null;
              private boolean building = false;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_build_center);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);

                  tvBuildTitle = findViewById(R.id.tvBuildTitle);
                  tvDoctor = findViewById(R.id.tvBuildDoctorStatus);
                  tvBuildLog = findViewById(R.id.tvBuildLog);
                  rbOffline = findViewById(R.id.rbBuildOffline);
                  rbOnline = findViewById(R.id.rbBuildOnline);
                  btnInstall = findViewById(R.id.btnInstallBuiltApk);

                  projectRepo = new ProjectRepository(this);
                  project = projectRepo.getById(getIntent().getStringExtra(EXTRA_PROJECT_ID));
                  if (project == null) {
                      finish();
                      return;
                  }

                  tvBuildTitle.setText("Build Center: " + project.appName + " (v" + project.versionName + ")");
                  AppSettings settings = new AppSettings(this);
                  boolean defaultAab = getIntent().getBooleanExtra(EXTRA_DEFAULT_AAB, false);
                  if (defaultAab || !settings.getCloudBuildUrl().isEmpty()) {
                      rbOnline.setChecked(defaultAab);
                      rbOffline.setChecked(!defaultAab);
                  } else {
                      rbOffline.setChecked(true);
                  }

                  refreshDoctor(defaultAab);

                  findViewById(R.id.btnStartBuildApk).setOnClickListener(v -> startBuild(false));
                  findViewById(R.id.btnStartBuildAab).setOnClickListener(v -> startBuild(true));
                  btnInstall.setOnClickListener(v -> installBuiltApk());
                  findViewById(R.id.btnInspectBuiltApk).setOnClickListener(v -> inspectLatestApk());
                  findViewById(R.id.btnBuildLiveLogcat).setOnClickListener(v -> showLiveLogcat());
                  findViewById(R.id.btnBuildCleanCache).setOnClickListener(v -> cleanBuildCache());
              }

              private void refreshDoctor(boolean isAab) {
                  HybridBuildEngine.DoctorReport report = HybridBuildEngine.runPreBuildDoctor(project, isAab);
                  tvDoctor.setText(report.formatSummary());
              }

              private void startBuild(boolean isAab) {
                  if (building) {
                      AccessibilityHelper.announce(this, rootContainer, "Build already in progress.");
                      return;
                  }
                  building = true;
                  btnInstall.setEnabled(false);
                  refreshDoctor(isAab);
                  boolean useOnline = rbOnline.isChecked();
                  tvBuildLog.setText("Building " + (isAab ? "Play Store AAB" : "APK") + "... please wait.");
                  AccessibilityHelper.announce(this, rootContainer, "Build started...");

                  executor.execute(() -> {
                      HybridBuildEngine.BuildOutcome outcome = HybridBuildEngine.executeBuild(
                              this, projectRepo, project, isAab, useOnline
                      );
                      runOnUiThread(() -> {
                          building = false;
                          tvBuildLog.setText(outcome.log);
                          if (outcome.success && outcome.outputFile != null) {
                              lastBuiltFile = outcome.outputFile;
                              btnInstall.setEnabled(!isAab);
                              AccessibilityHelper.announce(this, rootContainer, "Build succeeded! Saved to " + outcome.savedLocation);
                          } else {
                              AccessibilityHelper.announce(this, rootContainer, "Build did not complete. Check Build Log.");
                          }
                      });
                  });
              }

              private void installBuiltApk() {
                  if (lastBuiltFile == null || !lastBuiltFile.exists()) {
                      AccessibilityHelper.announce(this, rootContainer, "No APK ready to install yet.");
                      return;
                  }
                  try {
                      Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", lastBuiltFile);
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, "application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      AccessibilityHelper.announce(this, rootContainer, "Install launch failed: " + e.getMessage());
                  }
              }

              private void inspectLatestApk() {
                  File target = lastBuiltFile;
                  if (target == null || !target.exists()) {
                      File dir = projectRepo.getWorkspace().getLocalDownloadApkDir();
                      File[] files = dir.listFiles();
                      if (files != null && files.length > 0) target = files[0];
                  }
                  if (target == null || !target.exists()) {
                      AccessibilityHelper.announce(this, rootContainer, "Build an APK first to inspect it.");
                      return;
                  }
                  final File toInspect = target;
                  executor.execute(() -> {
                      String report = ApkInspectorEngine.inspectApk(toInspect);
                      runOnUiThread(() -> new AlertDialog.Builder(this)
                              .setTitle("Inspect APK")
                              .setMessage(report)
                              .setPositiveButton("Copy Report", (d, w) -> {
                                  ClipboardHelper.copyPlainText(this, "ApkReport", report);
                                  AccessibilityHelper.announce(this, rootContainer, "Inspection report copied.");
                              })
                              .setNegativeButton(R.string.ok, null)
                              .show());
                  });
              }

              private void showLiveLogcat() {
                  executor.execute(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          Process p = Runtime.getRuntime().exec(new String[]{"logcat", "-d", "-t", "120"});
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream()))) {
                              String line;
                              while ((line = br.readLine()) != null) {
                                  sb.append(line).append('\n');
                              }
                          }
                      } catch (Exception e) {
                          sb.append("Logcat unavailable: ").append(e.getMessage());
                      }
                      String logText = sb.toString().trim();
                      runOnUiThread(() -> new AlertDialog.Builder(this)
                              .setTitle("Live Logcat (" + project.packageName + ")")
                              .setMessage(logText.isEmpty() ? "No recent logcat entries." : logText)
                              .setPositiveButton("Copy Logs", (d, w) -> {
                                  ClipboardHelper.copyPlainText(this, "Logcat", logText);
                                  AccessibilityHelper.announce(this, rootContainer, "Logcat copied.");
                              })
                              .setNegativeButton(R.string.ok, null)
                              .show());
                  });
              }

              private void cleanBuildCache() {
                  File cache = getCacheDir();
                  int removed = 0;
                  File[] list = cache.listFiles();
                  if (list != null) {
                      for (File f : list) {
                          if (f.getName().startsWith("unsigned_") || f.getName().startsWith("cloud_") || f.getName().endsWith(".tmp")) {
                              if (f.delete()) removed++;
                          }
                      }
                  }
                  tvBuildLog.setText("Cleaned " + removed + " temporary build cache file(s).");
                  AccessibilityHelper.announce(this, rootContainer, "Build cache cleaned.");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
