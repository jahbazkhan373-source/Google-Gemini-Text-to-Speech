          package com.codebook.editor.ui;

          import android.content.Intent;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          import com.codebook.editor.R;
          import com.codebook.editor.engine.LargeFileEngine;
          import com.codebook.editor.util.AccessibilityHelper;
          import com.codebook.editor.util.AppSettings;
          import com.codebook.editor.util.ClipboardHelper;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class PerformanceTestActivity extends AppCompatActivity {

              private View rootContainer;
              private TextView tvResult;
              private Button btnOpenInEditor;
              private AppSettings settings;
              private File lastTestFile = null;
              private long lastTestedChars = 0L;
              private boolean testRunning = false;

              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_performance_test);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);
                  settings = new AppSettings(this);

                  tvResult = findViewById(R.id.tvBenchmarkResult);
                  btnOpenInEditor = findViewById(R.id.btnOpenBenchmarkInEditor);

                  findViewById(R.id.btnTest10K).setOnClickListener(v -> runBenchmark(10_000L));
                  findViewById(R.id.btnTest100K).setOnClickListener(v -> runBenchmark(100_000L));
                  findViewById(R.id.btnTest500K).setOnClickListener(v -> runBenchmark(500_000L));
                  findViewById(R.id.btnTest1M).setOnClickListener(v -> runBenchmark(1_000_000L));
                  findViewById(R.id.btnTest2M).setOnClickListener(v -> runBenchmark(2_000_000L));
                  findViewById(R.id.btnTest5M).setOnClickListener(v -> runBenchmark(5_000_000L));
                  findViewById(R.id.btnTest10M).setOnClickListener(v -> runBenchmark(10_000_000L));

                  btnOpenInEditor.setOnClickListener(v -> {
                      if (lastTestFile != null && lastTestFile.exists()) {
                          Intent intent = new Intent(this, EditorActivity.class);
                          intent.putExtra(EditorActivity.EXTRA_EXTERNAL_TEST_FILE, lastTestFile.getAbsolutePath());
                          intent.putExtra(EditorActivity.EXTRA_IMPORTED_LANGUAGE, "Java");
                          intent.putExtra(EditorActivity.EXTRA_IMPORTED_NAME, "Benchmark_" + lastTestedChars);
                          startActivity(intent);
                      }
                  });

                  findViewById(R.id.btnCleanBenchmarkFiles).setOnClickListener(v -> cleanBenchmarkFiles());
              }

              private void runBenchmark(long targetChars) {
                  if (testRunning) {
                      AccessibilityHelper.announce(this, rootContainer, "A benchmark is already running.");
                      return;
                  }
                  testRunning = true;
                  btnOpenInEditor.setEnabled(false);
                  tvResult.setText("Running benchmark for " + targetChars + " chars...");
                  AccessibilityHelper.announce(this, rootContainer, "Starting benchmark for " + targetChars + " characters.");

                  executor.execute(() -> {
                      try {
                          File dir = new File(getCacheDir(), "benchmarks");
                          if (!dir.exists()) dir.mkdirs();
                          File testFile = new File(dir, "bench_" + targetChars + ".code");

                          long tGen = System.currentTimeMillis();
                          generateJavaTestFile(testFile, targetChars);
                          long genMs = System.currentTimeMillis() - tGen;

                          long tOpen = System.currentTimeMillis();
                          LargeFileEngine engine = new LargeFileEngine(testFile, settings.getPageCharLimit());
                          engine.rebuildIndex();
                          long openMs = System.currentTimeMillis() - tOpen;

                          int lines = engine.getLineCount();
                          int pages = engine.getPageCount();
                          long actualChars = engine.getTotalChars();

                          int midLine = Math.max(0, lines / 2);
                          int nearEndLine = Math.max(0, (int) (lines * 0.95));
                          long tJump = System.currentTimeMillis();
                          String midText = engine.readLine(midLine);
                          String endText = engine.readLine(nearEndLine);
                          long jumpMs = System.currentTimeMillis() - tJump;

                          long tEdit = System.currentTimeMillis();
                          long lineStart = engine.getLineStartOffset(midLine);
                          long lineEnd = engine.getLineEndOffsetWithoutNewline(midLine);
                          engine.replaceByteRangeWithBytes(lineStart, lineEnd, (midText + " // edited").getBytes(StandardCharsets.UTF_8));
                          long editSaveMs = System.currentTimeMillis() - tEdit;

                          long tCopy = System.currentTimeMillis();
                          ClipboardHelper.CopyResult copyRes = ClipboardHelper.copyFileContent(this, testFile, engine.getTotalChars());
                          long copyMs = System.currentTimeMillis() - tCopy;

                          Runtime rt = Runtime.getRuntime();
                          double usedRamMb = (rt.totalMemory() - rt.freeMemory()) / (1024.0 * 1024.0);
                          double maxRamMb = rt.maxMemory() / (1024.0 * 1024.0);
                          double fileMb = testFile.length() / (1024.0 * 1024.0);

                          String report = "Benchmark Result (" + targetChars + " chars):\n"
                                  + "• Actual Chars: " + actualChars + " (" + String.format(Locale.US, "%.2f MB", fileMb) + ")\n"
                                  + "• Total Lines: " + lines + "\n"
                                  + "• All Mode Pages (limit " + settings.getPageCharLimit() + "): " + pages + "\n"
                                  + "• Generate Time: " + genMs + " ms\n"
                                  + "• Open & Line Index Time: " + openMs + " ms\n"
                                  + "• Jump Line (" + (midLine + 1) + " & " + (nearEndLine + 1) + "): " + jumpMs + " ms\n"
                                  + "• Single Line Edit & Save: " + editSaveMs + " ms\n"
                                  + "• Copy Time: " + copyMs + " ms (" + (copyRes.systemCopied ? "System + Internal Clipboard" : "Internal Clipboard Safe Mode") + ")\n"
                                  + "• RAM Used: " + String.format(Locale.US, "%.1f MB / %.0f MB", usedRamMb, maxRamMb) + "\n"
                                  + "• Sample End Line: " + (endText.length() > 60 ? endText.substring(0, 60) + "..." : endText);

                          lastTestFile = testFile;
                          lastTestedChars = actualChars;

                          runOnUiThread(() -> {
                              testRunning = false;
                              tvResult.setText(report);
                              btnOpenInEditor.setEnabled(true);
                              AccessibilityHelper.announce(this, rootContainer, "Benchmark complete. " + lines + " lines indexed in " + openMs + " ms.");
                          });
                      } catch (OutOfMemoryError oom) {
                          runOnUiThread(() -> {
                              testRunning = false;
                              String msg = "Device RAM limit reached for " + targetChars + " chars.";
                              tvResult.setText(msg);
                              AccessibilityHelper.announce(this, rootContainer, msg);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              testRunning = false;
                              String msg = "Benchmark error: " + e.getMessage();
                              tvResult.setText(msg);
                              AccessibilityHelper.announce(this, rootContainer, msg);
                          });
                      }
                  });
              }

              private void generateJavaTestFile(File dest, long targetChars) throws Exception {
                  long written = 0L;
                  int idx = 1;
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dest), 65536)) {
                      byte[] header = "public class BenchmarkCode {\n".getBytes(StandardCharsets.UTF_8);
                      out.write(header);
                      written += header.length;

                      while (written < targetChars - 2) {
                          String line = "    public static int calc" + idx + "(int x) { return x + " + idx + "; }\n";
                          byte[] bytes = line.getBytes(StandardCharsets.UTF_8);
                          if (written + bytes.length > targetChars - 2) {
                              int rem = (int) Math.max(0, targetChars - 2 - written);
                              if (rem > 0) {
                                  out.write(bytes, 0, Math.min(rem, bytes.length));
                                  written += rem;
                              }
                              break;
                          }
                          out.write(bytes);
                          written += bytes.length;
                          idx++;
                      }
                      out.write("\n}".getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  }
              }

              private void cleanBenchmarkFiles() {
                  File dir = new File(getCacheDir(), "benchmarks");
                  int count = 0;
                  if (dir.exists() && dir.isDirectory()) {
                      File[] files = dir.listFiles();
                      if (files != null) {
                          for (File f : files) if (f.delete()) count++;
                      }
                  }
                  lastTestFile = null;
                  btnOpenInEditor.setEnabled(false);
                  tvResult.setText("Benchmark cache cleaned.");
                  AccessibilityHelper.announce(this, rootContainer, "Removed " + count + " benchmark file(s).");
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
