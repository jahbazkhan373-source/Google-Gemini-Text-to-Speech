              private void showLineEditDialog(int lineIndex, boolean isInsertAfter, String initialText) {
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_line_edit, null);
                  EditText etInput = view.findViewById(R.id.etLineEditInput);
                  etInput.setTextSize(settings.getFontSize());
                  etInput.setText(initialText);
                  etInput.setSelection(etInput.getText().length());
                  etInput.addTextChangedListener(new AutoBracketWatcher(etInput, settings));

                  view.findViewById(R.id.btnDialogIndentAdd).setOnClickListener(v -> {
                      String unit = settings.getIndentUnitString();
                      int start = Math.max(0, etInput.getSelectionStart());
                      int end = Math.max(0, etInput.getSelectionEnd());
                      etInput.getText().replace(Math.min(start, end), Math.max(start, end), unit);
                      AccessibilityHelper.announce(this, etInput, "Indent added.");
                  });

                  view.findViewById(R.id.btnDialogIndentRemove).setOnClickListener(v -> {
                      String text = etInput.getText().toString();
                      int spaces = settings.getIndentSpaces();
                      if (text.startsWith("\t")) {
                          etInput.getText().delete(0, 1);
                      } else {
                          int removeCount = 0;
                          int maxRemove = (spaces == 0) ? 4 : spaces;
                          while (removeCount < maxRemove && removeCount < text.length() && text.charAt(removeCount) == ' ') removeCount++;
                          if (removeCount > 0) etInput.getText().delete(0, removeCount);
                      }
                  });

                  view.findViewById(R.id.btnDialogPaste).setOnClickListener(v -> {
                      String clip = ClipboardHelper.getPasteText(this);
                      if (clip == null || clip.isEmpty()) {
                          AccessibilityHelper.announce(this, etInput, "Clipboard is empty.");
                          return;
                      }
                      int start = Math.max(0, etInput.getSelectionStart());
                      int end = Math.max(0, etInput.getSelectionEnd());
                      etInput.getText().replace(Math.min(start, end), Math.max(start, end), clip);
                  });

                  String dialogTitle = (isInsertAfter && (engine == null || engine.getLineCount() == 0))
                          ? "Add First Line"
                          : (isInsertAfter ? "Add New Line after Line " + (lineIndex + 1) : "Edit Line " + (lineIndex + 1));

                  new AlertDialog.Builder(this)
                          .setTitle(dialogTitle)
                          .setView(view)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String newText = etInput.getText().toString();
                              if (isInsertAfter) executeInsertLineAfter(lineIndex, newText);
                              else executeReplaceLine(lineIndex, newText);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void executeReplaceLine(int lineIndex, String newLineText) {
                  executor.execute(() -> {
                      try {
                          long start = engine.getLineStartOffset(lineIndex);
                          long end = engine.getLineEndOffsetWithoutNewline(lineIndex);
                          undoManager.applyWithBytes(engine, start, end, newLineText.getBytes(StandardCharsets.UTF_8), "Edit Line", lineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              focusLineInRecyclerView(lineIndex, "Line " + (lineIndex + 1) + " updated.");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Edit failed: " + e.getMessage()));
                      }
                  });
              }

              private void executeInsertLineAfter(int lineIndex, String newText) {
                  executor.execute(() -> {
                      try {
                          int targetFocusLine;
                          if (engine.getLineCount() == 0) {
                              undoManager.applyWithBytes(engine, 0L, 0L, newText.getBytes(StandardCharsets.UTF_8), "Add Line", 0);
                              targetFocusLine = 0;
                          } else {
                              long insertPos = engine.getLineEndOffsetWithoutNewline(lineIndex);
                              targetFocusLine = lineIndex + 1;
                              undoManager.applyWithBytes(engine, insertPos, insertPos,
                                      (engine.getLineEnding() + newText).getBytes(StandardCharsets.UTF_8), "Add Line", targetFocusLine);
                          }
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          final int finalFocus = targetFocusLine;
                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              focusLineInRecyclerView(finalFocus, "New line added at line " + (finalFocus + 1));
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Insert failed: " + e.getMessage()));
                      }
                  });
              }

              private void executeDeleteLine(int lineIndex) {
                  executor.execute(() -> {
                      try {
                          long[] delRange = engine.getDeleteLineRangeOffsets(lineIndex, lineIndex);
                          int nextFocus = Math.max(0, Math.min(lineIndex, engine.getLineCount() - 2));
                          undoManager.applyWithBytes(engine, delRange[0], delRange[1], new byte[0], "Delete Line", nextFocus);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              if (engine.getLineCount() > 0) {
                                  focusLineInRecyclerView(nextFocus, "Line deleted. Total lines: " + engine.getLineCount());
                              } else {
                                  AccessibilityHelper.announce(this, rootContainer, "Last line deleted. File is empty.");
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Delete failed: " + e.getMessage()));
                      }
                  });
              }

              private void showJumpLineDialog() {
                  if (engine == null || engine.getLineCount() == 0) {
                      AccessibilityHelper.announce(this, rootContainer, "File is empty.");
                      return;
                  }
                  int totalLines = engine.getLineCount();
                  EditText input = new EditText(this);
                  input.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  input.setHint("Line number (1 to " + totalLines + ")");

                  new AlertDialog.Builder(this)
                          .setTitle("Jump to Line (Total: " + totalLines + ")")
                          .setView(input)
                          .setPositiveButton("Go", (dialog, which) -> {
                              try {
                                  int lineNum = Integer.parseInt(input.getText().toString().trim());
                                  if (lineNum < 1 || lineNum > totalLines) {
                                      AccessibilityHelper.announce(this, rootContainer, "Invalid line number. Range is 1 to " + totalLines);
                                      return;
                                  }
                                  jumpToLineFromAnywhere(lineNum - 1);
                              } catch (NumberFormatException e) {
                                  AccessibilityHelper.announce(this, rootContainer, "Enter a valid line number.");
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
