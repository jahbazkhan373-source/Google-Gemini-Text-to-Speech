              }

              private void createManualBackup() {
                  if (fileId == null) return;
                  executor.execute(() -> {
                      try {
                          File src = repository.getCodeFile(fileId);
                          LargeFileEngine eng = new LargeFileEngine(src, settings.getPageCharLimit());
                          eng.rebuildIndex();
                          backupManager.createBackup(
                                  fileId, src, "دستی بیک اپ",
                                  eng.getTotalChars(), eng.getLineCount(), settings.getMaxBackupsPerFile()
                          );
                          runOnUiThread(() -> {
                              refreshBackups();
                              AccessibilityHelper.announce(this, rootContainer, "نیا بیک اپ کامیابی سے بن گیا۔");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "بیک اپ بنانے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void confirmRestore(BackupManager.BackupMeta backup) {
                  new AlertDialog.Builder(this)
                          .setTitle("پرانی حالت بحال کریں")
                          .setMessage("بحال کرنے سے پہلے آپ کے موجودہ کوڈ کا خودکار بیک اپ بنا لیا جائے گا۔ کیا آپ واقعی یہ پرانی حالت بحال کرنا چاہتے ہیں؟")
                          .setPositiveButton(R.string.yes, (d, w) -> executeRestore(backup))
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void executeRestore(BackupManager.BackupMeta backup) {
                  executor.execute(() -> {
                      try {
                          File targetFile = repository.getCodeFile(fileId);
                          LargeFileEngine currentEng = new LargeFileEngine(targetFile, settings.getPageCharLimit());
                          currentEng.rebuildIndex();
                          backupManager.createBackup(
                                  fileId, targetFile, "بحالی سے پہلے کی محفوظ حالت",
                                  currentEng.getTotalChars(), currentEng.getLineCount(), settings.getMaxBackupsPerFile()
                          );

                          backupManager.extractBackupToFile(fileId, backup.id, targetFile);
                          LargeFileEngine restoredEng = new LargeFileEngine(targetFile, settings.getPageCharLimit());
                          restoredEng.rebuildIndex();
                          repository.updateSavedFileStats(
                                  fileId, restoredEng.getTotalChars(), restoredEng.getLineCount(), restoredEng.getTotalBytes()
                          );

                          runOnUiThread(() -> {
                              refreshBackups();
                              AccessibilityHelper.announce(
                                      this, rootContainer,
                                      "پرانی حالت کامیابی سے بحال ہو گئی۔ کل لائنیں: " + restoredEng.getLineCount()
                              );
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "بحالی ناکام رہی: " + e.getMessage()
                          ));
                      }
                  });
