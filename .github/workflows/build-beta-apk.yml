          package com.codebook.editor.util;

          import android.text.Editable;
          import android.text.TextWatcher;
          import android.widget.EditText;

          public class AutoBracketWatcher implements TextWatcher {

              private final EditText editText;
              private final AppSettings settings;
              private boolean isInternal = false;
              private int insertedStart = -1;
              private char insertedChar = 0;

              public AutoBracketWatcher(EditText editText, AppSettings settings) {
                  this.editText = editText;
                  this.settings = settings;
              }

              @Override
              public void beforeTextChanged(CharSequence s, int start, int count, int after) {
              }

              @Override
              public void onTextChanged(CharSequence s, int start, int before, int count) {
                  if (isInternal) return;
                  if (count == 1 && before == 0 && settings.isAutoCloseBracketsEnabled()) {
                      insertedStart = start;
                      insertedChar = s.charAt(start);
                  } else {
                      insertedStart = -1;
                      insertedChar = 0;
                  }
              }

              @Override
              public void afterTextChanged(Editable s) {
                  if (isInternal || insertedStart < 0) return;

                  String closing = getClosingPair(insertedChar);
                  int pos = insertedStart;
                  insertedStart = -1;
                  insertedChar = 0;

                  if (closing == null) return;

                  isInternal = true;
                  try {
                      int insertPos = pos + 1;
                      if (insertPos <= s.length()) {
                          s.insert(insertPos, closing);
                          editText.setSelection(insertPos);
                      }
                  } finally {
                      isInternal = false;
                  }
              }

              private String getClosingPair(char c) {
                  switch (c) {
                      case '(': return ")";
                      case '{': return "}";
                      case '[': return "]";
                      case '"': return "\"";
                      case '\'': return "'";
                      default: return null;
                  }
              }
          }
