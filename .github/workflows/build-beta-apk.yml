              private void saveCurrentProjectSilent() {
                  if (engine == null) return;
                  final String text = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(text, dirty);
                          isPageDirty = false;
                          syncProjectFileToExternalIfProject();
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void syncProjectFileToExternalIfProject() {
                  if (currentProject != null && engine != null && currentProjectRelPath != null) {
                      projectRepository.getWorkspace().pushProjectFileToSaf(
                              currentProject.folderName, currentProjectRelPath, engine.getBackingFile()
                      );
                      projectRepository.syncFullCodeTxtBackup(currentProject);
                  }
              }

