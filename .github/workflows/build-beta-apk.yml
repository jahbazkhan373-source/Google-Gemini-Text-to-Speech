          package com.codebook.editor.engine;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.RandomAccessFile;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          /**
           * بڑی فائلوں (لاکھوں سے ایک کروڑ حروف تک) کا بنیادی انڈیکس، صفحہ بندی اور لائن انجن۔
           * - آل موڈ: 5 لاکھ حروف تک 1 صفحہ، اس سے زیادہ پر صفحات
           * - لائن موڈ: بغیر صفحہ بندی پورا کوڈ یکجا (O(1) لائن آفسیٹ رسائی)
           * - ڈیلٹا Undo/Redo کے لیے عین بائٹ رینج نکالنے اور بدلنے کی سہولت
           */
          public class LargeFileEngine {

              private final File backingFile;
              private int pageCharLimit;

              private long[] lineStartOffsets = new long[1024];
              private int lineCount = 0;

              private final List<Long> pageStartOffsets = new ArrayList<>();
              private long totalChars = 0L;
              private long totalBytes = 0L;
              private boolean usesCrLf = false;

              public LargeFileEngine(File backingFile, int pageCharLimit) {
                  this.backingFile = backingFile;
                  this.pageCharLimit = Math.max(50_000, pageCharLimit);
              }

              public File getBackingFile() {
                  return backingFile;
              }

              public void setPageCharLimit(int pageCharLimit) throws IOException {
                  this.pageCharLimit = Math.max(50_000, pageCharLimit);
                  rebuildIndex();
              }

              public synchronized void rebuildIndex() throws IOException {
                  lineCount = 0;
                  pageStartOffsets.clear();
                  totalChars = 0L;
                  totalBytes = 0L;
                  usesCrLf = false;

                  if (!backingFile.exists()) {
                      File parent = backingFile.getParentFile();
                      if (parent != null && !parent.exists()) {
                          parent.mkdirs();
                      }
                      backingFile.createNewFile();
                  }

                  totalBytes = backingFile.length();
                  pageStartOffsets.add(0L);

                  if (totalBytes == 0L) {
                      return;
                  }

                  addLineOffset(0L);
                  long charsInCurrentPage = 0L;
                  long currentOffset = 0L;
                  byte prevByte = 0;
                  boolean crlfChecked = false;

                  byte[] buffer = new byte[65536];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(backingFile), 65536)) {
                      int read;
                      while ((read = in.read(buffer)) != -1) {
                          for (int i = 0; i < read; i++) {
                              byte b = buffer[i];

                              if ((b & 0xC0) != 0x80) {
                                  if (charsInCurrentPage >= pageCharLimit) {
                                      pageStartOffsets.add(currentOffset);
                                      charsInCurrentPage = 0L;
                                  }
                                  int utf16Units = ((b & 0xF8) == 0xF0) ? 2 : 1;
                                  totalChars += utf16Units;
                                  charsInCurrentPage += utf16Units;
                              }

                              if (b == '\n') {
                                  if (!crlfChecked) {
                                      usesCrLf = (prevByte == '\r');
                                      crlfChecked = true;
                                  }
                                  addLineOffset(currentOffset + 1L);
                              }

                              prevByte = b;
                              currentOffset++;
                          }
                      }
                  }
              }

              private void addLineOffset(long offset) {
                  if (lineCount >= lineStartOffsets.length) {
                      lineStartOffsets = Arrays.copyOf(lineStartOffsets, lineStartOffsets.length * 2);
                  }
                  lineStartOffsets[lineCount++] = offset;
              }

              public synchronized int getPageCount() {
                  return Math.max(1, pageStartOffsets.size());
              }

              public synchronized int getLineCount() {
                  return lineCount;
              }

              public synchronized long getTotalChars() {
                  return totalChars;
              }

              public synchronized long getTotalBytes() {
                  return totalBytes;
              }

              public synchronized boolean isPaged() {
                  return getPageCount() > 1;
              }

              public synchronized String getLineEnding() {
                  return usesCrLf ? "\r\n" : "\n";
              }

              public synchronized long[] getPageByteRange(int pageIndex) {
                  if (totalBytes == 0L) return new long[]{0L, 0L};
                  int safePage = Math.max(0, Math.min(pageIndex, getPageCount() - 1));
                  long start = pageStartOffsets.get(safePage);
                  long end = (safePage + 1 < pageStartOffsets.size())
                          ? pageStartOffsets.get(safePage + 1)
                          : totalBytes;
                  return new long[]{start, end};
              }

              public synchronized int findPageForLine(int lineIndex) {
                  if (lineCount == 0 || pageStartOffsets.size() <= 1) return 0;
                  int safeLine = Math.max(0, Math.min(lineIndex, lineCount - 1));
                  long offset = lineStartOffsets[safeLine];
                  for (int i = pageStartOffsets.size() - 1; i >= 0; i--) {
                      if (pageStartOffsets.get(i) <= offset) {
                          return i;
                      }
                  }
                  return 0;
              }

              public synchronized long getLineStartOffset(int lineIndex) {
                  if (lineIndex < 0 || lineIndex >= lineCount || totalBytes == 0L) return 0L;
                  return lineStartOffsets[lineIndex];
              }

              public synchronized long getLineEndOffsetWithoutNewline(int lineIndex) throws IOException {
                  if (lineIndex < 0 || lineIndex >= lineCount || totalBytes == 0L) return 0L;
                  long start = lineStartOffsets[lineIndex];
                  long end = (lineIndex + 1 < lineCount) ? lineStartOffsets[lineIndex + 1] : totalBytes;
                  if (end <= start) return start;

                  try (RandomAccessFile raf = new RandomAccessFile(backingFile, "r")) {
                      raf.seek(end - 1L);
                      byte last = raf.readByte();
                      if (last == '\n') {
                          if (end - 2L >= start) {
                              raf.seek(end - 2L);
                              if (raf.readByte() == '\r') {
                                  return end - 2L;
                              }
                          }
                          return end - 1L;
                      }
                  }
                  return end;
              }

              public synchronized long[] getDeleteLineRangeOffsets(int startLine, int endLine) throws IOException {
                  if (lineCount == 0) return new long[]{0L, 0L};
                  int sLine = Math.max(0, Math.min(startLine, lineCount - 1));
                  int eLine = Math.max(sLine, Math.min(endLine, lineCount - 1));

                  if (eLine < lineCount - 1) {
                      return new long[]{lineStartOffsets[sLine], lineStartOffsets[eLine + 1]};
                  } else {
                      if (sLine == 0) {
                          return new long[]{0L, totalBytes};
                      } else {
                          long prevEnd = getLineEndOffsetWithoutNewline(sLine - 1);
                          return new long[]{prevEnd, totalBytes};
                      }
                  }
              }

              public synchronized String readPage(int pageIndex) throws IOException {
                  if (totalBytes == 0L) return "";
                  long[] range = getPageByteRange(pageIndex);
                  return readByteRange(range[0], range[1]);
              }

              public synchronized String readLine(int lineIndex) throws IOException {
                  if (lineIndex < 0 || lineIndex >= lineCount || totalBytes == 0L) {
                      return "";
                  }
                  long start = lineStartOffsets[lineIndex];
                  long end = getLineEndOffsetWithoutNewline(lineIndex);
                  return readByteRange(start, end);
              }

              public synchronized String readLinePreview(int lineIndex, int maxBytes) throws IOException {
                  if (lineIndex < 0 || lineIndex >= lineCount || totalBytes == 0L) {
                      return "";
                  }
                  long start = lineStartOffsets[lineIndex];
                  long end = getLineEndOffsetWithoutNewline(lineIndex);
                  long len = end - start;
                  if (len <= 0) return "";
                  if (len <= maxBytes) {
                      return readByteRange(start, end);
                  }
                  byte[] data = readByteRangeRaw(start, start + maxBytes);
                  int validLen = data.length;
                  while (validLen > 0 && (data[validLen - 1] & 0xC0) == 0x80) {
                      validLen--;
                  }
                  if (validLen > 0 && (data[validLen - 1] & 0x80) != 0) {
                      validLen--;
                  }
                  return new String(data, 0, validLen, StandardCharsets.UTF_8) + " ... (مکمل دیکھنے کے لیے ترمیم دبائیں)";
              }

              public synchronized long extractLineRangeToFile(int startLine, int endLine, File destFile) throws IOException {
                  if (lineCount == 0) {
                      if (destFile.exists()) destFile.delete();
                      destFile.createNewFile();
                      return 0L;
                  }
                  int sLine = Math.max(0, Math.min(startLine, lineCount - 1));
                  int eLine = Math.max(sLine, Math.min(endLine, lineCount - 1));
                  long start = lineStartOffsets[sLine];
                  long end = getLineEndOffsetWithoutNewline(eLine);
                  extractByteRangeToFile(start, end, destFile);
                  return countUtf16CharsInFile(destFile);
              }

              public synchronized byte[] readByteRangeRaw(long start, long end) throws IOException {
                  long length = end - start;
                  if (length <= 0) return new byte[0];
                  if (length > Integer.MAX_VALUE) {
                      throw new IOException("حصے کا حجم میموری کی حد سے زیادہ ہے۔");
                  }
                  byte[] data = new byte[(int) length];
                  try (RandomAccessFile raf = new RandomAccessFile(backingFile, "r")) {
                      raf.seek(start);
                      raf.readFully(data);
                  }
                  return data;
              }

              public synchronized void extractByteRangeToFile(long start, long end, File destFile) throws IOException {
                  File parent = destFile.getParentFile();
                  if (parent != null && !parent.exists()) parent.mkdirs();
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(destFile), 65536)) {
                      if (end > start && backingFile.exists()) {
                          copyByteSlice(backingFile, start, end, out);
                      }
                      out.flush();
                  }
              }

              private String readByteRange(long start, long end) throws IOException {
                  byte[] data = readByteRangeRaw(start, end);
                  return new String(data, StandardCharsets.UTF_8);
              }

              public synchronized boolean needsNewlineBeforeAppend(char firstChar) throws IOException {
                  if (totalBytes == 0L) return false;
                  byte lastByte = readLastByte();
                  return lastByte != '\n' && firstChar != '\n' && firstChar != '\r';
              }

              public synchronized boolean needsNewlineBeforeAppendFile(File extraFile) throws IOException {
                  if (totalBytes == 0L || extraFile == null || !extraFile.exists() || extraFile.length() == 0L) {
                      return false;
                  }
                  byte lastByte = readLastByte();
                  byte firstNewByte;
                  try (FileInputStream fis = new FileInputStream(extraFile)) {
                      firstNewByte = (byte) fis.read();
                  }
                  return lastByte != '\n' && firstNewByte != '\n' && firstNewByte != '\r';
              }

              public synchronized void writePage(int pageIndex, String newPageText) throws IOException {
                  long[] range = getPageByteRange(pageIndex);
                  replaceByteRangeWithBytes(
                          range[0],
                          range[1],
                          (newPageText != null ? newPageText : "").getBytes(StandardCharsets.UTF_8)
                  );
              }

              public synchronized void overwriteAll(String fullText) throws IOException {
                  replaceByteRangeWithBytes(
                          0L,
                          totalBytes,
                          (fullText != null ? fullText : "").getBytes(StandardCharsets.UTF_8)
                  );
              }

              public synchronized void clearAll() throws IOException {
                  overwriteAll("");
              }

              public synchronized void appendText(String textToAppend) throws IOException {
                  if (textToAppend == null || textToAppend.isEmpty()) return;
                  String prefix = needsNewlineBeforeAppend(textToAppend.charAt(0)) ? getLineEnding() : "";
                  replaceByteRangeWithBytes(
                          totalBytes,
                          totalBytes,
                          (prefix + textToAppend).getBytes(StandardCharsets.UTF_8)
                  );
              }

              public synchronized void appendFile(File extraFile) throws IOException {
                  if (extraFile == null || !extraFile.exists() || extraFile.length() == 0L) return;
                  boolean needNewline = needsNewlineBeforeAppendFile(extraFile);
                  if (!needNewline) {
                      replaceByteRangeWithFile(totalBytes, totalBytes, extraFile);
                      return;
                  }
                  File temp = new File(backingFile.getParentFile(), backingFile.getName() + ".append.tmp");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp), 65536)) {
                      out.write(getLineEnding().getBytes(StandardCharsets.UTF_8));
                      copyFileToStream(extraFile, out);
                      out.flush();
                  }
                  try {
                      replaceByteRangeWithFile(totalBytes, totalBytes, temp);
                  } finally {
                      temp.delete();
