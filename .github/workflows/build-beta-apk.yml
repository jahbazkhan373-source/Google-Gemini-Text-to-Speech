          package com.codebook.editor.util;

          import android.content.Context;
          import android.view.View;
          import android.widget.Toast;

          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;

          public class AccessibilityHelper {

              public static void applySafeInsets(View rootView) {
                  if (rootView == null) return;
                  final int padLeft = rootView.getPaddingLeft();
                  final int padTop = rootView.getPaddingTop();
                  final int padRight = rootView.getPaddingRight();
                  final int padBottom = rootView.getPaddingBottom();

                  ViewCompat.setOnApplyWindowInsetsListener(rootView, (v, insets) -> {
                      Insets bars = insets.getInsets(
                              WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.ime()
                      );
                      v.setPadding(
                              padLeft + bars.left,
                              padTop + bars.top,
                              padRight + bars.right,
                              padBottom + bars.bottom
                      );
                      return insets;
                  });
                  ViewCompat.requestApplyInsets(rootView);
              }

              public static void announce(Context context, View anchorView, String message) {
                  if (context == null || message == null || message.isEmpty()) return;
                  AppSettings settings = new AppSettings(context);
                  if (anchorView != null && settings.isScreenReaderAnnouncementsEnabled()) {
                      anchorView.announceForAccessibility(message);
                  }
                  Toast.makeText(context, message, Toast.LENGTH_SHORT).show();
              }
          }
