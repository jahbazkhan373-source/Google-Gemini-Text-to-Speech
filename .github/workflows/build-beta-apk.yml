                      for (String ok : checksPassed) sb.append("  [OK] ").append(ok).append("\n");
                      for (String w : warnings) sb.append("  [!] ").append(w).append("\n");
                      return sb.toString().trim();
                  }
              }

              public static class BuildOutcome {
                  public final boolean success;
                  public final File outputFile;
                  public final String savedLocation;
                  public final String log;

                  public BuildOutcome(boolean success, File outputFile, String savedLocation, String log) {
                      this.success = success;
                      this.outputFile = outputFile;
                      this.savedLocation = savedLocation;
                      this.log = log;
                  }
              }

              public static DoctorReport runPreBuildDoctor(ProjectMeta meta, boolean isPlayStoreAab) {
                  DoctorReport r = new DoctorReport();
                  r.checksPassed.add("Universal 32-bit + 64-bit & 16 KB alignment auto-enabled.");
                  r.checksPassed.add("Android 12-17 exported, FileProvider, MultiDex & Edge-to-Edge auto-enabled.");
                  r.checksPassed.add("SDK Range: minSdk " + meta.minSdk + " -> targetSdk " + meta.targetSdk);

                  if (meta.minSdk < 24 && !meta.signV1) {
                      r.warnings.add("minSdk " + meta.minSdk + " (Android 5/6) requires v1 signing — Code Book will auto-enable v1.");
                  }
                  if (meta.permissions != null && meta.permissions.contains("android.permission.FOREGROUND_SERVICE")) {
                      boolean hasType = false;
                      for (String p : meta.permissions) {
                          if (p.startsWith("android.permission.FOREGROUND_SERVICE_")) {
                              hasType = true;
                              break;
                          }
                      }
                      if (!hasType) {
                          r.warnings.add("FOREGROUND_SERVICE selected without a specific type (e.g. FOREGROUND_SERVICE_MEDIA_PLAYBACK / DATA_SYNC). Required on Android 14-17.");
                      }
                  }
                  if (isPlayStoreAab) {
                      if (meta.targetSdk < 36) {
                          r.warnings.add("Google Play requires targetSdk 36+ for new releases and updates. Play Store AAB will target API 36.");
                      }
                      if (meta.autoUpdateEnabled) {
                          r.warnings.add("Play Store Policy: External APK Auto-Updater will be replaced by Google Play In-App Update in AAB mode.");
                      }
                  }
                  if (meta.permissions != null && (meta.permissions.contains("android.permission.BIND_ACCESSIBILITY_SERVICE")
                          || meta.permissions.contains("android.permission.READ_SMS")
                          || meta.permissions.contains("android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"))) {
                      r.warnings.add("Android 13-17 Tip: After installing sideloaded APKs with Accessibility/SMS permissions, tap 'Allow restricted settings' in App Info.");
                  }
                  return r;
              }

              /**
               * Builds signed APK or Play Store AAB using either Online Cloud Builder (if configured)
               * or Offline Hybrid Pipeline (validates syntax, generates manifest & updater, builds & signs with v1-v4).
               */
              public static BuildOutcome executeBuild(Context context, ProjectRepository projectRepo,
                                                      ProjectMeta meta, boolean isAab, boolean useOnlineCloud) {
                  StringBuilder log = new StringBuilder();
                  try {
                      log.append("=== Code Book Studio Build Started ===\n");
                      log.append("App: ").append(meta.appName).append(" (").append(meta.packageName).append(")\n");
                      log.append("Version: ").append(meta.versionName).append(" (code ").append(meta.versionCode).append(")\n");
                      log.append("Format: ").append(isAab ? "Google Play AAB" : "Universal APK").append("\n\n");

                      // 1. Pre-Build Doctor
                      DoctorReport doc = runPreBuildDoctor(meta, isAab);
                      log.append(doc.formatSummary()).append("\n\n");

                      // 2. Sync Manifest & Optional Auto-Update module
                      projectRepo.saveProjectMetadataFiles(meta);
                      if (meta.autoUpdateEnabled && !isAab && "Java".equalsIgnoreCase(meta.language)) {
                          String updaterCode = AutoUpdateGenerator.generateUpdaterJavaClass(meta);
                          projectRepo.writeProjectTextFile(meta, "CodeBookAutoUpdater.java", updaterCode);
                          projectRepo.writeProjectTextFile(meta, "update_manifest_preview.json", AutoUpdateGenerator.buildUpdateManifestJson(meta));
                          log.append("[Auto-Update] Generated lightweight CodeBookAutoUpdater.java module.\n");
                      }

                      // 3. Syntax check main code before building
                      File mainFile = projectRepo.getProjectFile(meta, meta.mainCodeFile);
                      CodeAnalyzerEngine.AnalysisReport check = CodeAnalyzerEngine.analyze(context, mainFile, meta.language, 3);
                      if (check.confirmedCount > 0) {
                          log.append("[FAILED] Found ").append(check.confirmedCount).append(" confirmed syntax error(s):\n");
                          for (int i = 0; i < Math.min(10, check.issues.size()); i++) {
                              log.append("  ").append(check.issues.get(i).formatCopyText()).append("\n");
                          }
                          return new BuildOutcome(false, null, "", log.toString());
                      }
                      log.append("[Check] Syntax check passed (0 confirmed errors).\n");

                      // 4. Resolve Signing Keystore
                      KeystoreManager km = new KeystoreManager(context);
                      KeystoreMeta ksMeta = km.getById(meta.keystoreId);
                      if (ksMeta == null) {
                          ksMeta = km.ensureDefaultKeystore();
                          meta.keystoreId = ksMeta.id;
                          projectRepo.updateProject(meta);
                      }
                      File ksFile = km.getKeystoreFile(ksMeta);
                      log.append("[Signing] Keystore: ").append(ksMeta.name).append(" (v1=")
                              .append(meta.signV1).append(", v2=").append(meta.signV2)
                              .append(", v3=").append(meta.signV3).append(", v4=").append(meta.signV4).append(")\n");

                      AppSettings settings = new AppSettings(context);
                      WorkspaceStorageManager workspace = projectRepo.getWorkspace();
                      String safeBase = WorkspaceStorageManager.sanitizeFolderName(meta.appName) + "_v" + meta.versionName;
                      String outExt = isAab ? ".aab" : ".apk";
                      String outFileName = safeBase + outExt;

                      // 5A. Online Cloud Build Server (Gradle / AAB / Kotlin / Python / C++)
                      if (useOnlineCloud) {
                          String cloudUrl = settings.getCloudBuildUrl();
                          if (cloudUrl == null || cloudUrl.isEmpty()) {
                              log.append("[Error] Online Cloud Build URL is not set in Settings.\n");
                              log.append("Open Settings -> Online Cloud Build URL, or switch to Offline Build.\n");
                              return new BuildOutcome(false, null, "", log.toString());
                          }
                          File bundleZip = new File(context.getCacheDir(), "cloud_upload_" + System.currentTimeMillis() + ".zip");
                          zipDirectory(projectRepo.getProjectDir(meta), bundleZip);

                          String endpoint = cloudUrl.endsWith("/") ? cloudUrl + "build" : cloudUrl + "/build";
                          endpoint += "?format=" + (isAab ? "aab" : "apk") + "&minSdk=" + meta.minSdk + "&targetSdk=" + (isAab ? Math.max(36, meta.targetSdk) : meta.targetSdk);
                          log.append("[Cloud] Uploading project to ").append(endpoint).append("...\n");

                          File rawOutput = new File(context.getCacheDir(), "cloud_raw_" + outFileName);
                          uploadZipAndDownloadArtifact(endpoint, bundleZip, rawOutput);
                          bundleZip.delete();

                          File finalOut = new File(workspace.getLocalDownloadApkDir(), outFileName);
                          if (!isAab) {
                              ApkSignerEngine.signApk(rawOutput, finalOut, ksFile, ksMeta, meta.minSdk,
                                      meta.signV1, meta.signV2, meta.signV3, meta.signV4);
                              rawOutput.delete();
                          } else {
                              com.codebook.editor.storage.LibraryRepository.copyFileAtomic(rawOutput, finalOut);
                              rawOutput.delete();
                          }
                          String savedLoc = workspace.mirrorApkFlat(finalOut, outFileName);
                          log.append("[SUCCESS] Cloud Build & Signing complete!\nSaved to: ").append(savedLoc).append("\n");
                          return new BuildOutcome(true, finalOut, savedLoc, log.toString());
                      }

                      // 5B. Offline Build Pipeline
                      if (isAab) {
                          log.append("[Notice] Play Store .aab bundles require Online Cloud Build (Gradle bundleRelease).\n");
                          log.append("Switch Build Mode to 'Online Cloud Build' and configure your Cloud Build URL in Settings.\n");
                          return new BuildOutcome(false, null, "", log.toString());
                      }

                      File sdkDir = new File(context.getFilesDir(), "offline_sdk_pack");
                      File baseTemplateApk = new File(sdkDir, "base_" + meta.language.toLowerCase(Locale.ROOT) + ".apk");
                      File unsignedApk = new File(context.getCacheDir(), "unsigned_" + outFileName);

                      if (baseTemplateApk.exists()) {
                          // Real template-based offline APK assembly (merges user's code/assets into offline runtime APK)
                          log.append("[Offline SDK] Packaging with installed Offline SDK runtime template...\n");
                          mergeAssetsIntoTemplateApk(baseTemplateApk, projectRepo.getProjectDir(meta), unsignedApk);
                      } else {
                          // Check if user wants to know why full javac/aapt2 SDK pack isn't installed yet
                          log.append("[Offline Packaging] Offline Java/AAPT2 SDK Pack is not downloaded yet.\n");
                          log.append("Building a signed Code Book Package Archive with v1/v2/v3/v4 apksig verification so you can test signing & inspection.\n");
                          log.append("To compile native Java/XML into standalone installable APKs offline, configure 'Offline Build SDK Pack URL' in Settings (containing android.jar + aapt2 + ecj + d8) or use Online Cloud Build.\n");
                          zipDirectory(projectRepo.getProjectDir(meta), unsignedApk);
                      }

                      File signedApk = new File(workspace.getLocalDownloadApkDir(), outFileName);
                      ApkSignerEngine.signApk(unsignedApk, signedApk, ksFile, ksMeta, meta.minSdk,
                              meta.signV1, meta.signV2, meta.signV3, meta.signV4);
                      unsignedApk.delete();

                      String savedPath = workspace.mirrorApkFlat(signedApk, outFileName);
                      if (meta.signV4) {
                          File idsig = new File(signedApk.getAbsolutePath() + ".idsig");
                          if (idsig.exists()) {
                              workspace.mirrorApkFlat(idsig, outFileName + ".idsig");
                          }
                      }

                      log.append("\n[SUCCESS] Signed with v1/v2/v3/v4!\n");
                      log.append("Saved flat in: ").append(savedPath).append("\n");
                      log.append("Size: ").append(String.format(Locale.US, "%.2f MB", signedApk.length() / (1024.0 * 1024.0))).append("\n");
                      return new BuildOutcome(true, signedApk, savedPath, log.toString());

                  } catch (Exception e) {
                      log.append("\n[BUILD ERROR] ").append(e.getMessage()).append("\n");
                      return new BuildOutcome(false, null, "", log.toString());
                  }
              }

              private static void mergeAssetsIntoTemplateApk(File templateApk, File projectDir, File outApk) throws Exception {
                  try (java.util.zip.ZipFile srcZip = new java.util.zip.ZipFile(templateApk);
                       ZipOutputStream zos = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outApk), 65536))) {
                      java.util.Enumeration<? extends ZipEntry> en = srcZip.entries();
                      byte[] buf = new byte[65536];
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          if (e.getName().startsWith("META-INF/")) continue;
                          zos.putNextEntry(new ZipEntry(e.getName()));
                          try (InputStream is = srcZip.getInputStream(e)) {
                              int n;
                              while ((n = is.read(buf)) != -1) zos.write(buf, 0, n);
                          }
                          zos.closeEntry();
                      }
                      addDirEntries(zos, projectDir, "assets/codebook_app");
                      zos.finish();
                  }
              }

              private static void zipDirectory(File dir, File destZip) throws Exception {
                  try (ZipOutputStream zos = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(destZip), 65536))) {
                      addDirEntries(zos, dir, "");
                      zos.finish();
                  }
              }

              private static void addDirEntries(ZipOutputStream zos, File dir, String prefix) throws Exception {
                  File[] list = dir.listFiles();
                  if (list == null) return;
                  byte[] buf = new byte[65536];
                  for (File f : list) {
                      String entryName = prefix.isEmpty() ? f.getName() : (prefix + "/" + f.getName());
                      if (f.isDirectory()) {
                          addDirEntries(zos, f, entryName);
                      } else if (f.isFile()) {
                          zos.putNextEntry(new ZipEntry(entryName));
                          try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(f), 65536)) {
                              int n;
                              while ((n = in.read(buf)) != -1) zos.write(buf, 0, n);
                          }
                          zos.closeEntry();
                      }
                  }
              }

              private static void uploadZipAndDownloadArtifact(String urlStr, File zipToSend, File destArtifact) throws Exception {
                  HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                  conn.setConnectTimeout(30_000);
                  conn.setReadTimeout(180_000);
                  conn.setRequestMethod("POST");
                  conn.setDoOutput(true);
                  conn.setRequestProperty("Content-Type", "application/zip");

                  byte[] buf = new byte[65536];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(zipToSend), 65536);
                       OutputStream out = conn.getOutputStream()) {
                      int n;
                      while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      out.flush();
                  }

                  int code = conn.getResponseCode();
                  if (code < 200 || code >= 300) {
                      throw new Exception("Cloud Build Server returned HTTP " + code);
                  }
                  try (InputStream in = conn.getInputStream();
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(destArtifact), 65536)) {
                      int n;
                      while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                      out.flush();
                  }
              }
          }
