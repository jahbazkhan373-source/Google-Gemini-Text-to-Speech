                      int read;
                      while ((read = in.read(buffer)) != -1) {
                          for (int i = 0; i < read; i++) {
                              byte b = buffer[i];
                              if ((b & 0xC0) != 0x80) {
                                  count += ((b & 0xF8) == 0xF0) ? 2 : 1;
                              }
                          }
                      }
                  }
                  return count;
              }

              public static void atomicReplace(File tempFile, File targetFile) throws IOException {
                  if (targetFile.exists() && !targetFile.delete()) {
                      try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(tempFile), 65536);
                           BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(targetFile), 65536)) {
                          byte[] buf = new byte[65536];
                          int len;
                          while ((len = in.read(buf)) != -1) {
                              out.write(buf, 0, len);
                          }
                          out.flush();
                      }
                      tempFile.delete();
                      return;
                  }
                  if (!tempFile.renameTo(targetFile)) {
                      throw new IOException("Could not replace target file atomically.");
                  }
              }
