                  @Override
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      CodeIssue err = items.get(pos);
                      h.tvHeader.setText("Line " + err.lineNumber + " — " + err.name);
                      h.tvReason.setText("Error: " + err.reason);
                      h.tvCodeLine.setText(err.codeLine.isEmpty() ? "(line preview unavailable)" : err.codeLine);

                      h.btnCopy.setContentDescription("Copy error at line " + err.lineNumber);
                      h.btnGoLine.setContentDescription("Go to line " + err.lineNumber);

                      h.btnCopy.setOnClickListener(v -> {
                          ClipboardHelper.copyPlainText(LivePreviewActivity.this, "LineError", err.formatCopyText());
                          AccessibilityHelper.announce(LivePreviewActivity.this, rootContainer, "Copied error on line " + err.lineNumber);
