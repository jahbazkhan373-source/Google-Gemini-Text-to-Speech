              private void openOutlineList(OutlineItem.Kind kind) {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final String title = (kind == OutlineItem.Kind.FUNCTION) ? "Function List" : "Class List";

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          List<OutlineItem> items = CodeOutlineExtractor.extract(this, engine.getBackingFile(), currentLanguage, kind);
                          runOnUiThread(() -> {
                              if (items.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, title + " is empty.");
                                  return;
                              }
                              String[] labels = new String[items.size()];
                              for (int i = 0; i < items.size(); i++) {
                                  OutlineItem it = items.get(i);
                                  labels[i] = it.name + " (" + it.detail + ") — Line " + it.lineNumber;
                              }
                              AccessibilityHelper.announce(this, rootContainer, "Found " + items.size() + " item(s) in " + title);
                              new AlertDialog.Builder(this)
                                      .setTitle(title + " (" + items.size() + ")")
                                      .setItems(labels, (d, which) -> {
                                          OutlineItem chosen = items.get(which);
                                          jumpToLineWithCustomAnnouncement(chosen.lineNumber - 1, chosen.name + ", Line " + chosen.lineNumber);
                                      })
                                      .setNegativeButton(R.string.cancel, null)
                                      .show();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, title + " error: " + e.getMessage()));
                      }
                  });
              }

              private void scheduleNextAutoSave() {
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  if (settings.isAutoSaveEnabled()) {
                      mainHandler.postDelayed(autoSaveRunnable, settings.getAutoSaveIntervalSeconds() * 1000L);
                  }
              }

              private void performAutoSaveTick() {
                  if (engine == null || !settings.isAutoSaveEnabled()) return;
                  final boolean dirtyAll = (!isLineMode && isPageDirty);
                  final String pageText = dirtyAll ? etCodeEditor.getText().toString() : null;
                  final int pageIdx = currentPageIndex;
                  if (!dirtyAll && !hasChangesSinceLastBackup) return;

                  executor.execute(() -> {
                      try {
                          if (dirtyAll) {
                              engine.writePage(pageIdx, pageText);
                              isPageDirty = false;
                          }
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();
                          maybeCreatePeriodicBackup("Auto Backup");
                          if (currentFileId != null || currentProject != null) recoveryManager.clearRecovery();
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Auto-save failed: " + e.getMessage()));
                      }
                  });
              }

              private String getBackupKeyId() {
                  if (currentProject != null) return "proj_" + currentProject.id;
                  return currentFileId;
              }

              private void maybeCreatePeriodicBackup(String label) {
                  String bId = getBackupKeyId();
                  if (bId == null || engine == null || !settings.isAutoBackupEnabled() || !hasChangesSinceLastBackup) return;
                  long now = System.currentTimeMillis();
                  if ("Manual Save".equals(label) || (now - lastAutoBackupTime) >= 120_000L) {
                      try {
                          backupManager.createBackup(bId, currentProject != null ? currentProject.appName : currentFileName,
                                  engine.getBackingFile(), label, engine.getTotalChars(), engine.getLineCount(), settings.getMaxBackupsPerFile());
                          lastAutoBackupTime = now;
                          hasChangesSinceLastBackup = false;
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void showFindOrReplaceDialog(boolean isReplaceMode) {
                  if (engine == null) return;
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_find_replace, null);
                  EditText etQuery = view.findViewById(R.id.etFindQuery);
                  EditText etReplace = view.findViewById(R.id.etReplaceWith);
                  CheckBox cbMatchCase = view.findViewById(R.id.cbMatchCase);
                  CheckBox cbWholeWord = view.findViewById(R.id.cbWholeWord);

                  etReplace.setVisibility(isReplaceMode ? View.VISIBLE : View.GONE);
                  cbMatchCase.setChecked(settings.isDefaultMatchCase());
                  cbWholeWord.setChecked(settings.isDefaultWholeWord());

                  AlertDialog.Builder builder = new AlertDialog.Builder(this)
                          .setTitle(isReplaceMode ? "Find & Replace" : "Find in Code")
                          .setView(view)
                          .setNegativeButton(R.string.cancel, null);

                  if (!isReplaceMode) {
                      builder.setPositiveButton("Find", (d, w) -> {
                          String q = etQuery.getText().toString();
                          if (!q.isEmpty()) runBackgroundSearch(q, null, cbMatchCase.isChecked(), cbWholeWord.isChecked(), false);
                      });
                  } else {
                      builder.setPositiveButton("Find & Replace Selected", (d, w) -> {
                          String q = etQuery.getText().toString();
                          if (!q.isEmpty()) runBackgroundSearch(q, etReplace.getText().toString(), cbMatchCase.isChecked(), cbWholeWord.isChecked(), true);
                      });
                      builder.setNeutralButton("Replace All", (d, w) -> {
                          String q = etQuery.getText().toString();
                          if (!q.isEmpty()) confirmReplaceAll(q, etReplace.getText().toString(), cbMatchCase.isChecked(), cbWholeWord.isChecked());
                      });
                  }
                  builder.show();
              }

              private void runBackgroundSearch(String query, String replaceWith, boolean matchCase, boolean wholeWord, boolean allowSingleReplace) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  AccessibilityHelper.announce(this, rootContainer, "Searching...");
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          SearchEngine.SearchResult res = SearchEngine.search(engine.getBackingFile(), query, matchCase, wholeWord, 500);
                          runOnUiThread(() -> showSearchResultsDialog(res, query, replaceWith, allowSingleReplace));
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Search error: " + e.getMessage()));
                      }
                  });
              }

              private void showSearchResultsDialog(SearchEngine.SearchResult res, String query, String replaceWith, boolean allowSingleReplace) {
                  if (res.matches.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "No matches found.");
                      return;
                  }
                  int count = res.matches.size();
                  String[] labels = new String[count];
                  for (int i = 0; i < count; i++) {
                      SearchEngine.SearchMatch m = res.matches.get(i);
                      labels[i] = "Line " + m.lineNumber + ": " + m.linePreview;
                  }
                  AccessibilityHelper.announce(this, rootContainer, "Found " + count + " matches.");
                  new AlertDialog.Builder(this)
                          .setTitle("Matches: " + count + (res.truncated ? "+" : ""))
                          .setItems(labels, (d, which) -> {
                              SearchEngine.SearchMatch selected = res.matches.get(which);
                              if (allowSingleReplace) {
                                  new AlertDialog.Builder(this)
                                          .setTitle("Line " + selected.lineNumber)
                                          .setMessage(selected.linePreview + "\n\nReplace '" + query + "' with '" + replaceWith + "' here?")
                                          .setPositiveButton("Replace", (dd, ww) -> executeSingleReplace(selected, replaceWith))
                                          .setNeutralButton("Go to Line", (dd, ww) -> jumpToLineFromAnywhere(selected.lineIndex))
                                          .setNegativeButton(R.string.cancel, null)
                                          .show();
                              } else {
                                  jumpToLineFromAnywhere(selected.lineIndex);
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void executeSingleReplace(SearchEngine.SearchMatch match, String replaceWith) {
                  executor.execute(() -> {
                      try {
                          undoManager.applyWithBytes(engine, match.byteStart, match.byteEnd,
                                  (replaceWith != null ? replaceWith : "").getBytes(StandardCharsets.UTF_8), "Replace", match.lineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(match.lineIndex, "Replaced on line " + match.lineNumber);
                              });
                          } else {
                              currentPageIndex = engine.findPageForLine(match.lineIndex);
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "Replaced on line " + match.lineNumber);
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Replace failed: " + e.getMessage()));
                      }
                  });
              }

              private void confirmReplaceAll(String query, String replaceWith, boolean matchCase, boolean wholeWord) {
                  new AlertDialog.Builder(this)
                          .setTitle("Confirm Replace All")
                          .setMessage("Replace all occurrences of '" + query + "' with '" + replaceWith + "' across the entire file?")
                          .setPositiveButton(R.string.yes, (d, w) -> executeReplaceAll(query, replaceWith, matchCase, wholeWord))
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void executeReplaceAll(String query, String replaceWith, boolean matchCase, boolean wholeWord) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      File tempOut = new File(getCacheDir(), "replace_all.tmp");
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          int count = SearchEngine.replaceAllToFile(engine.getBackingFile(), tempOut, query, replaceWith, matchCase, wholeWord);
                          if (count == 0) {
                              runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "No occurrences found."));
                              return;
                          }
                          undoManager.applyWithFile(engine, 0L, engine.getTotalBytes(), tempOut, "Replace All", currentFocusedLineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "Replaced " + count + " occurrence(s).");
                              });
                          } else {
                              currentPageIndex = Math.max(0, Math.min(currentPageIndex, engine.getPageCount() - 1));
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "Replaced " + count + " occurrence(s).");
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Replace All failed: " + e.getMessage()));
                      } finally {
                          if (tempOut.exists()) tempOut.delete();
                      }
                  });
              }

              private void handleMarkCurrentOrChosenLine(boolean mark) {
                  if (engine == null || engine.getLineCount() == 0) {
                      AccessibilityHelper.announce(this, rootContainer, "File is empty.");
                      return;
                  }
                  int totalLines = engine.getLineCount();
                  int suggestedLine = Math.max(1, Math.min(currentFocusedLineIndex + 1, totalLines));

                  EditText input = new EditText(this);
                  input.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  input.setText(String.valueOf(suggestedLine));
                  input.setSelection(input.getText().length());

                  new AlertDialog.Builder(this)
                          .setTitle(mark ? "Mark Line" : "Unmark Line")
                          .setMessage("Enter line number (1 to " + totalLines + ")")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              try {
                                  int ln = Integer.parseInt(input.getText().toString().trim());
                                  if (ln < 1 || ln > totalLines) {
                                      AccessibilityHelper.announce(this, rootContainer, "Invalid line number.");
                                      return;
                                  }
                                  if (mark) {
                                      markedLineNumbers.add(ln);
                                      persistMarkedLinesAsync();
                                      lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                                      AccessibilityHelper.announce(this, rootContainer, "Marked line " + ln);
                                  } else if (markedLineNumbers.remove(ln)) {
                                      persistMarkedLinesAsync();
                                      lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                                      AccessibilityHelper.announce(this, rootContainer, "Unmarked line " + ln);
                                  } else {
                                      AccessibilityHelper.announce(this, rootContainer, "Line " + ln + " was not marked.");
                                  }
                              } catch (NumberFormatException e) {
                                  AccessibilityHelper.announce(this, rootContainer, "Enter a valid number.");
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showMarkedLinesDialog() {
                  if (engine == null || markedLineNumbers.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "No marked lines yet.");
                      return;
                  }
                  List<Integer> sorted = new ArrayList<>(markedLineNumbers);
                  Collections.sort(sorted);

                  executor.execute(() -> {
                      List<Integer> validMarks = new ArrayList<>();
                      List<String> labels = new ArrayList<>();
                      int maxLines = engine.getLineCount();
                      for (int ln : sorted) {
                          if (ln >= 1 && ln <= maxLines) {
                              validMarks.add(ln);
                              String preview = "";
                              try { preview = engine.readLinePreview(ln - 1, 120); } catch (Exception ignored) {}
                              labels.add("★ Line " + ln + ": " + (preview.isEmpty() ? "(empty line)" : preview));
                          }
                      }
                      runOnUiThread(() -> {
                          if (validMarks.isEmpty()) return;
                          new AlertDialog.Builder(this)
                                  .setTitle("Marked Lines (" + validMarks.size() + ")")
                                  .setItems(labels.toArray(new String[0]), (d, which) -> jumpToLineFromAnywhere(validMarks.get(which) - 1))
                                  .setNegativeButton(R.string.cancel, null)
                                  .show();
                      });
                  });
              }

              private void persistMarkedLinesAsync() {
                  if (currentFileId == null) return;
                  final List<Integer> snapshot = new ArrayList<>(markedLineNumbers);
                  final String fid = currentFileId;
                  executor.execute(() -> {
                      try { repository.updateMarkedLines(fid, snapshot); } catch (Exception ignored) {}
                  });
              }

              // ==================== MODE SWITCHING, LINE OPERATIONS & POWER MENU ====================

              private void jumpToLineFromAnywhere(int targetLineIndex) {
                  jumpToLineWithCustomAnnouncement(targetLineIndex, null);
              }

              private void jumpToLineWithCustomAnnouncement(int targetLineIndex, String customAnnouncement) {
                  if (engine == null || engine.getLineCount() == 0) return;
                  int safeIdx = Math.max(0, Math.min(targetLineIndex, engine.getLineCount() - 1));

                  if (!isLineMode) {
                      final String currentText = etCodeEditor.getText().toString();
                      final boolean dirty = isPageDirty;
                      executor.execute(() -> {
                          try {
                              commitAllModePageIfDirtySync(currentText, dirty);
                              isPageDirty = false;
                              isLineMode = true;
                              String preview = engine.readLinePreview(safeIdx, 140);
                              String spoken = (customAnnouncement != null)
                                      ? customAnnouncement
                                      : ("Line " + (safeIdx + 1) + ": " + (preview.isEmpty() ? "empty line" : preview));
                              runOnUiThread(() -> {
                                  applyModeVisibility();
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(safeIdx, spoken);
                              });
                          } catch (Exception ignored) {}
                      });
                  } else {
                      executor.execute(() -> {
                          String preview = "";
                          try { preview = engine.readLinePreview(safeIdx, 140); } catch (Exception ignored) {}
                          String spoken = (customAnnouncement != null)
                                  ? customAnnouncement
                                  : ("Line " + (safeIdx + 1) + ": " + (preview.isEmpty() ? "empty line" : preview));
                          runOnUiThread(() -> focusLineInRecyclerView(safeIdx, spoken));
                      });
                  }
              }

              private void displayPageContent(String text) {
                  suppressTextWatcher = true;
                  etCodeEditor.setText(text);
                  isPageDirty = false;
                  suppressTextWatcher = false;
              }

              private void applyModeVisibility() {
                  if (isLineMode) {
                      etCodeEditor.setVisibility(View.GONE);
                      layoutQuickSymbolBar.setVisibility(View.GONE);
                      layoutPagingBar.setVisibility(View.GONE);
                      layoutLineModeBar.setVisibility(View.VISIBLE);
                      boolean empty = (engine == null || engine.getLineCount() == 0);
                      btnAddFirstLine.setVisibility(empty ? View.VISIBLE : View.GONE);
                      rvLineMode.setVisibility(empty ? View.GONE : View.VISIBLE);
                  } else {
                      layoutLineModeBar.setVisibility(View.GONE);
                      btnAddFirstLine.setVisibility(View.GONE);
                      rvLineMode.setVisibility(View.GONE);
                      etCodeEditor.setVisibility(View.VISIBLE);
                      layoutQuickSymbolBar.setVisibility(View.VISIBLE);
                  }
              }

              private void updateHeaderAndBarsUI() {
                  String title = (currentFileName != null && !currentFileName.isEmpty())
                          ? currentFileName : getString(R.string.unsaved_draft);
                  String modeLabel = isLineMode ? getString(R.string.btn_line_mode) : getString(R.string.btn_all_mode);
                  tvEditorHeader.setText(title + " (" + currentLanguage + " - " + modeLabel + ")");

                  // ALWAYS visible fixed All Mode / Line Mode buttons!
                  btnAllMode.setEnabled(isLineMode);
                  btnLineMode.setEnabled(!isLineMode);
                  btnAllMode.setContentDescription(isLineMode ? "Switch to All Mode" : "All Mode active");
                  btnLineMode.setContentDescription(isLineMode ? "Line Mode active" : "Switch to Line Mode");

                  btnUndo.setEnabled((undoManager != null && undoManager.canUndo()) || (!isLineMode && isPageDirty));
                  btnRedo.setEnabled(undoManager != null && undoManager.canRedo());

                  if (isLineMode) {
                      layoutPagingBar.setVisibility(View.GONE);
                      int lines = (engine != null) ? engine.getLineCount() : 0;
                      tvLineModeSummary.setText("Total Lines: " + lines);
                      boolean empty = (lines == 0);
                      btnAddFirstLine.setVisibility(empty ? View.VISIBLE : View.GONE);
                      rvLineMode.setVisibility(empty ? View.GONE : View.VISIBLE);
                  } else if (engine != null && engine.isPaged()) {
                      layoutPagingBar.setVisibility(View.VISIBLE);
                      int totalPages = engine.getPageCount();
                      tvPageInfo.setText("Page " + (currentPageIndex + 1) + " of " + totalPages);
                      btnPrevPage.setEnabled(currentPageIndex > 0);
                      btnNextPage.setEnabled(currentPageIndex < totalPages - 1);
                  } else {
                      layoutPagingBar.setVisibility(View.GONE);
                  }
              }

              private void commitAllModePageIfDirtySync(String pageText, boolean dirty) throws IOException {
                  if (engine == null || !dirty) return;
                  long[] range = engine.getPageByteRange(currentPageIndex);
                  byte[] newBytes = (pageText != null ? pageText : "").getBytes(StandardCharsets.UTF_8);
                  undoManager.applyWithBytes(engine, range[0], range[1], newBytes, "Edit", currentFocusedLineIndex);
                  hasChangesSinceLastBackup = true;
              }

              private void switchToLineMode() {
                  if (engine == null || isLineMode) return;
                  final String currentText = etCodeEditor.getText().toString();
                  final boolean dirty = isPageDirty;

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          isLineMode = true;
                          runOnUiThread(() -> {
                              applyModeVisibility();
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Line Mode active. Total lines: " + engine.getLineCount());
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Error: " + e.getMessage()));
                      }
                  });
              }

              private void switchToAllMode() {
                  if (engine == null || !isLineMode) return;
                  executor.execute(() -> {
                      try {
                          isLineMode = false;
                          currentPageIndex = engine.findPageForLine(currentFocusedLineIndex);
                          String pageText = engine.readPage(currentPageIndex);
                          runOnUiThread(() -> {
                              applyModeVisibility();
                              displayPageContent(pageText);
                              updateHeaderAndBarsUI();
                              String msg = engine.isPaged()
                                      ? "All Mode active. Page " + (currentPageIndex + 1) + " of " + engine.getPageCount()
                                      : "All Mode active.";
                              AccessibilityHelper.announce(this, rootContainer, msg);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Error: " + e.getMessage()));
                      }
                  });
              }

              private void navigateToPage(int targetPage) {
                  if (engine == null || isLineMode || targetPage < 0 || targetPage >= engine.getPageCount()) return;
                  final String currentText = etCodeEditor.getText().toString();
                  final boolean dirty = isPageDirty;

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          currentPageIndex = Math.max(0, Math.min(targetPage, engine.getPageCount() - 1));
                          String newPageText = engine.readPage(currentPageIndex);
                          runOnUiThread(() -> {
                              displayPageContent(newPageText);
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Page " + (currentPageIndex + 1) + " of " + engine.getPageCount());
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Page error: " + e.getMessage()));
                      }
                  });
              }

              @Override
              public void onLineFocused(int lineIndex) {
                  currentFocusedLineIndex = lineIndex;
              }

              @Override
