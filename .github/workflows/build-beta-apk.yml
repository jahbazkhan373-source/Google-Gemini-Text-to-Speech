                  JSONObject payload = new JSONObject();
                  payload.put("meta", meta.toJson());
                  payload.put("keystoreBase64", Base64.encodeToString(ksBytes, Base64.NO_WRAP));

                  byte[] plain = payload.toString().getBytes(StandardCharsets.UTF_8);
                  byte[] encrypted = xorOrAesEncrypt(plain, recoveryPin);

                  String backupName = WorkspaceStorageManager.sanitizeFolderName(meta.name) + "_backup.cbkey";
                  File tmp = new File(context.getCacheDir(), backupName);
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmp))) {
                      out.write(encrypted);
                      out.flush();
                  }
                  try {
                      return workspace.mirrorBackupFile("Keystores", tmp, backupName);
                  } finally {
                      tmp.delete();
                  }
              }

              public synchronized KeystoreMeta recoverFromEncryptedBackup(Uri cbkeyUri, String recoveryPin) throws Exception {
                  byte[] encrypted;
                  try (InputStream in = context.getContentResolver().openInputStream(cbkeyUri);
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      if (in == null) throw new IOException("Unable to open backup file.");
                      byte[] buf = new byte[8192];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      encrypted = out.toByteArray();
                  }

                  byte[] plain = xorOrAesDecrypt(encrypted, recoveryPin);
                  JSONObject payload = new JSONObject(new String(plain, StandardCharsets.UTF_8));
                  KeystoreMeta restored = KeystoreMeta.fromJson(payload.getJSONObject("meta"));
                  byte[] ksBytes = Base64.decode(payload.getString("keystoreBase64"), Base64.DEFAULT);

                  restored.id = UUID.randomUUID().toString();
                  restored.fileName = WorkspaceStorageManager.sanitizeFolderName(restored.name) + "_rec_" + restored.id.substring(0, 6) + ".p12";
                  File dest = getKeystoreFile(restored);
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dest))) {
                      out.write(ksBytes);
                      out.flush();
                  }
                  workspace.mirrorKeystoreFile(dest, restored.fileName);

                  List<KeystoreMeta> all = getAllKeystores();
                  all.add(0, restored);
                  saveIndex(all);
                  return restored;
              }

              public synchronized void deleteKeystore(String id) throws IOException {
                  List<KeystoreMeta> kept = new ArrayList<>();
                  for (KeystoreMeta m : getAllKeystores()) {
                      if (id.equals(m.id)) {
                          File f = getKeystoreFile(m);
                          if (f.exists()) f.delete();
                      } else {
                          kept.add(m);
                      }
                  }
                  saveIndex(kept);
              }

              private static byte[] deriveAesKey(String pin) throws Exception {
                  String safe = (pin != null && !pin.isEmpty()) ? pin : "CodeBookDefaultVaultPin";
                  MessageDigest md = MessageDigest.getInstance("SHA-256");
                  return md.digest(("CB_KEY_VAULT:" + safe).getBytes(StandardCharsets.UTF_8));
              }

              private static byte[] xorOrAesEncrypt(byte[] data, String pin) throws Exception {
                  SecretKeySpec key = new SecretKeySpec(deriveAesKey(pin), "AES");
                  Cipher cipher = Cipher.getInstance("AES/ECB/PKCS5Padding");
                  cipher.init(Cipher.ENCRYPT_MODE, key);
                  return cipher.doFinal(data);
              }

              private static byte[] xorOrAesDecrypt(byte[] data, String pin) throws Exception {
                  SecretKeySpec key = new SecretKeySpec(deriveAesKey(pin), "AES");
                  Cipher cipher = Cipher.getInstance("AES/ECB/PKCS5Padding");
                  cipher.init(Cipher.DECRYPT_MODE, key);
                  return cipher.doFinal(data);
              }

              public static String fingerprint(byte[] certBytes, String algo) {
                  try {
                      MessageDigest md = MessageDigest.getInstance(algo);
                      byte[] digest = md.digest(certBytes);
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < digest.length; i++) {
                          if (i > 0) sb.append(':');
                          sb.append(String.format(Locale.US, "%02X", digest[i]));
                      }
                      return sb.toString();
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static String safeDn(String val, String fallback) {
                  if (val == null || val.trim().isEmpty()) return fallback;
                  return val.trim().replace(",", " ").replace("=", " ");
              }

              private void saveIndex(List<KeystoreMeta> list) throws IOException {
                  JSONArray arr = new JSONArray();
                  try {
                      for (KeystoreMeta m : list) arr.put(m.toJson());
                  } catch (Exception e) {
                      throw new IOException(e.getMessage());
                  }
                  File tmp = new File(indexFile.getParentFile(), INDEX_FILE + ".tmp");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmp))) {
                      out.write(arr.toString(2).getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  } catch (Exception e) {
                      throw new IOException(e.getMessage());
                  }
                  LargeFileEngine.atomicReplace(tmp, indexFile);
              }

              private static byte[] readBytes(File f) throws IOException {
                  byte[] data = new byte[(int) f.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(f))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return data;
              }

              private static String readUtf8(File f) throws IOException {
                  return new String(readBytes(f), StandardCharsets.UTF_8);
              }
