              private void handlePaste() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  boolean useLargeInternal = ClipboardHelper.hasLargeInternalClipboard(this);
                  final String clipText = useLargeInternal ? null : ClipboardHelper.getPasteText(this);

                  if (!useLargeInternal && (clipText == null || clipText.isEmpty())) {
                      AccessibilityHelper.announce(this, rootContainer, "Clipboard is empty.");
                      return;
                  }

                  // AI Code Paste Package Name Sync check for Java projects!
                  if (!useLargeInternal && currentProject != null && "Java".equalsIgnoreCase(currentLanguage)) {
                      String mismatchedPkg = CodeToolsHelper.detectMismatchedJavaPackage(clipText, currentProject.packageName);
                      if (mismatchedPkg != null) {
                          new AlertDialog.Builder(this)
                                  .setTitle("Sync Package Name?")
                                  .setMessage("Pasted Java code uses 'package " + mismatchedPkg + ";', while this project uses '"
                                          + currentProject.packageName + "'. Sync package line automatically?")
                                  .setPositiveButton("Sync & Paste", (d, w) ->
                                          executePasteText(CodeToolsHelper.replaceJavaPackage(clipText, currentProject.packageName), currentText, dirty, false))
                                  .setNegativeButton("Paste As-Is", (d, w) ->
                                          executePasteText(clipText, currentText, dirty, false))
                                  .show();
                          return;
                      }
                  }

                  executePasteText(clipText, currentText, dirty, useLargeInternal);
              }

              private void executePasteText(String clipText, String currentText, boolean dirty, boolean useLargeInternal) {
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;

                          int focusLineBefore = Math.max(0, engine.getLineCount() - 1);
                          if (useLargeInternal) {
                              File clipFile = ClipboardHelper.getInternalClipboardFile(this);
                              if (engine.needsNewlineBeforeAppendFile(clipFile)) {
                                  File combined = new File(getCacheDir(), "paste_combined.tmp");
                                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(combined), 65536);
                                       FileInputStream in = new FileInputStream(clipFile)) {
                                      out.write(engine.getLineEnding().getBytes(StandardCharsets.UTF_8));
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                  }
                                  try {
                                      undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), combined, "Paste", focusLineBefore);
                                  } finally {
                                      combined.delete();
                                  }
                              } else {
                                  undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), clipFile, "Paste", focusLineBefore);
                              }
                          } else {
                              String prefix = engine.needsNewlineBeforeAppend(clipText.charAt(0)) ? engine.getLineEnding() : "";
                              undoManager.applyWithBytes(engine, engine.getTotalBytes(), engine.getTotalBytes(),
                                      (prefix + clipText).getBytes(StandardCharsets.UTF_8), "Paste", focusLineBefore);
                          }

                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          if (isLineMode) {
                              int lastLine = Math.max(0, engine.getLineCount() - 1);
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(lastLine, "Code pasted below. Total lines: " + engine.getLineCount());
                              });
                          } else {
                              currentPageIndex = engine.getPageCount() - 1;
                              String lastPageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(lastPageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "Code pasted below. Total chars: " + engine.getTotalChars());
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Paste failed; existing code is safe: " + e.getMessage()));
                      }
                  });
              }

              private void confirmClearAll() {
                  new AlertDialog.Builder(this)
                          .setTitle("Confirm Clear All")
                          .setMessage("Clear all code from the editor?")
                          .setPositiveButton(R.string.yes, (dialog, which) -> executeClearAll())
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void executeClearAll() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          undoManager.applyWithBytes(engine, 0L, engine.getTotalBytes(), new byte[0], "Clear All", 0);
                          hasChangesSinceLastBackup = true;
                          currentPageIndex = 0;
                          currentFocusedLineIndex = 0;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          runOnUiThread(() -> {
                              displayPageContent("");
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Editor cleared. Use Undo to restore.");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Clear failed: " + e.getMessage()));
                      }
                  });
              }

              private void confirmImportIntoOpenEditor(Uri uri) {
                  boolean hasExistingCode = (engine != null && engine.getTotalBytes() > 0)
                          || (!isLineMode && etCodeEditor.getText().length() > 0);
                  if (!hasExistingCode) {
                      importUriIntoCurrentEditor(uri, true);
                      return;
                  }
                  String[] options = {"1. Replace existing code", "2. Append at the end", "3. Cancel"};
                  new AlertDialog.Builder(this)
                          .setTitle("Editor Is Not Empty")
                          .setItems(options, (dialog, which) -> {
                              if (which == 0) importUriIntoCurrentEditor(uri, true);
                              else if (which == 1) importUriIntoCurrentEditor(uri, false);
                          })
                          .show();
              }

              private void importUriIntoCurrentEditor(Uri uri, boolean replaceExisting) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          if (!replaceExisting) {
                              commitAllModePageIfDirtySync(currentText, dirty);
                              isPageDirty = false;
                          }
                          File tempImport = new File(getCacheDir(), "editor_import.tmp");
                          repository.importUriToFile(uri, tempImport);

                          if (replaceExisting) {
                              undoManager.applyWithFile(engine, 0L, engine.getTotalBytes(), tempImport, "Import File", 0);
                              currentPageIndex = 0;
                              currentFocusedLineIndex = 0;
                          } else {
                              if (engine.needsNewlineBeforeAppendFile(tempImport)) {
                                  File combined = new File(getCacheDir(), "editor_import_combined.tmp");
                                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(combined), 65536);
                                       FileInputStream in = new FileInputStream(tempImport)) {
                                      out.write(engine.getLineEnding().getBytes(StandardCharsets.UTF_8));
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                  }
                                  try {
                                      undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), combined, "Append Import", Math.max(0, engine.getLineCount() - 1));
                                  } finally {
                                      combined.delete();
                                  }
                              } else {
                                  undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), tempImport, "Append Import", Math.max(0, engine.getLineCount() - 1));
                              }
                              currentPageIndex = engine.getPageCount() - 1;
                          }
                          tempImport.delete();
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          String pageText = (!isLineMode) ? engine.readPage(currentPageIndex) : "";
                          runOnUiThread(() -> {
                              if (!isLineMode) displayPageContent(pageText);
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Imported file. Total lines: " + engine.getLineCount());
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Import failed: " + e.getMessage()));
                      }
                  });
              }

              private void showFileStats() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          long chars = engine.getTotalChars();
                          int lines = engine.getLineCount();
                          long bytes = engine.getTotalBytes();
                          int pages = engine.getPageCount();

                          String summary = "File: " + (currentFileName != null ? currentFileName : "Untitled")
                                  + "\nLanguage: " + currentLanguage
                                  + "\nMode: " + (isLineMode ? "Line Mode" : "All Mode")
                                  + "\nTotal Lines: " + lines
                                  + (lines > 0 ? "\nCurrent Line: " + Math.min(currentFocusedLineIndex + 1, lines) : "")
                                  + "\nMarked Lines: " + markedLineNumbers.size()
                                  + "\nTotal Chars: " + chars
                                  + "\nFile Size: " + formatBytes(bytes)
                                  + "\nAll Mode Pages: " + pages + " (Page " + (currentPageIndex + 1) + ")";

                          runOnUiThread(() -> {
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Total lines " + lines + ", total characters " + chars);
                              new AlertDialog.Builder(this)
                                      .setTitle("File Stats")
                                      .setMessage(summary)
                                      .setPositiveButton(R.string.ok, null)
                                      .show();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Stats error: " + e.getMessage()));
                      }
                  });
              }

              private void updateRepoStatsIfSaved() {
                  if (currentFileId != null && engine != null) {
                      try {
                          repository.updateSavedFileStats(currentFileId, engine.getTotalChars(), engine.getLineCount(), engine.getTotalBytes());
                      } catch (Exception ignored) {
                      }
                  }
              }

              private String formatBytes(long bytes) {
                  if (bytes < 1024) return bytes + " Bytes";
                  double kb = bytes / 1024.0;
                  if (kb < 1024) return String.format(Locale.US, "%.2f KB", kb);
                  return String.format(Locale.US, "%.2f MB", kb / 1024.0);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  mainHandler.removeCallbacks(recoverySnapshotRunnable);
                  if (engine != null) {
                      final boolean dirty = (!isLineMode && isPageDirty);
                      final String text = dirty ? etCodeEditor.getText().toString() : null;
                      final boolean closingNormally = isFinishing();
                      executor.execute(() -> {
                          try {
                              if (dirty) {
                                  engine.writePage(currentPageIndex, text);
                                  isPageDirty = false;
                                  hasChangesSinceLastBackup = true;
                              }
                              updateRepoStatsIfSaved();
                              syncProjectFileToExternalIfProject();
                              maybeCreatePeriodicBackup("Pre-Close Backup");
                              if (!isExternalBenchmarkFile) {
                                  if (currentFileId != null || currentProject != null || (closingNormally && engine.getTotalBytes() == 0L)) {
                                      recoveryManager.clearRecovery();
                                  } else if (engine.getTotalBytes() > 0L) {
                                      recoveryManager.saveRecoverySnapshot(
                                              null, null, null, currentFileName, currentLanguage,
                                              isLineMode, currentPageIndex, currentFocusedLineIndex, null
                                      );
                                  }
                              }
                          } catch (Exception ignored) {
                          }
                      });
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (currentProjectId != null) {
                      ProjectMeta refreshed = projectRepository.getById(currentProjectId);
                      if (refreshed != null) {
                          currentProject = refreshed;
                          if (currentProjectRelPath != null) {
                              currentFileName = currentProject.appName + " / " + currentProjectRelPath;
                          }
                          updateHeaderAndBarsUI();
                      }
                  }
                  etCodeEditor.setTextSize(settings.getFontSize());
                  lineAdapter.setDisplayPreferences(settings.getFontSize(), settings.isReadIndentationEnabled());
                  scheduleNextAutoSave();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  mainHandler.removeCallbacks(recoverySnapshotRunnable);
                  if (undoManager != null) undoManager.clear();
                  executor.shutdown();
              }
          }
