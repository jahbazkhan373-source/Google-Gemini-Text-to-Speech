          public class MainActivity extends AppCompatActivity {

              public static final String[] SUPPORTED_LANGUAGES = {
                      "Java", "Lua", "Python", "Kotlin", "JavaScript", "C", "C++", "Dart", "HTML", "XML", "JSON", "Other"
              };

              private View rootContainer;
              private LibraryRepository repository;
              private CrashRecoveryManager recoveryManager;
              private AppSettings settings;
              private boolean recoveryPromptShown = false;
              private final ExecutorService executor = Executors.newSingleThreadExecutor();

              private final ActivityResultLauncher<String[]> importFileLauncher =
                      registerForActivityResult(new ActivityResultContracts.OpenDocument(), uri -> {
                          if (uri != null) {
                              handleImportedUri(uri);
                          }
                      });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);
                  repository = new LibraryRepository(this);
                  recoveryManager = new CrashRecoveryManager(this);
                  settings = new AppSettings(this);

                  Button btnNewCode = findViewById(R.id.btnNewCode);
                  Button btnLibrary = findViewById(R.id.btnLibrary);
                  Button btnImportFile = findViewById(R.id.btnImportFile);
                  Button btnSettings = findViewById(R.id.btnSettings);

                  btnNewCode.setOnClickListener(v -> {
                      Intent intent = new Intent(this, EditorActivity.class);
                      intent.putExtra(EditorActivity.EXTRA_START_EMPTY, true);
                      intent.putExtra(EditorActivity.EXTRA_IMPORTED_LANGUAGE, settings.getDefaultLanguage());
                      startActivity(intent);
                  });

                  btnLibrary.setOnClickListener(v ->
                          startActivity(new Intent(this, LibraryActivity.class))
                  );

                  btnImportFile.setOnClickListener(v ->
                          importFileLauncher.launch(new String[]{"text/*", "*/*"})
                  );

                  btnSettings.setOnClickListener(v ->
                          startActivity(new Intent(this, SettingsActivity.class))
                  );
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  checkCrashRecoveryIfNeeded();
              }

              private void checkCrashRecoveryIfNeeded() {
                  if (recoveryPromptShown || !recoveryManager.hasPendingRecovery()) return;
                  CrashRecoveryManager.RecoveryState state = recoveryManager.getPendingRecovery();
                  if (state == null) {
                      recoveryManager.clearRecovery();
                      return;
                  }
                  recoveryPromptShown = true;

                  String name = (state.fileName != null && !state.fileName.isEmpty()) ? state.fileName : "غیر محفوظ ڈرافٹ";
                  String time = state.timestamp > 0
                          ? new SimpleDateFormat("dd/MM/yyyy hh:mm a", Locale.US).format(new Date(state.timestamp))
                          : "";

                  AccessibilityHelper.announce(this, rootContainer, "پچھلی نشست کا غیر محفوظ کام موجود ہے، کیا بحال کرنا ہے؟");
                  new AlertDialog.Builder(this)
                          .setTitle("غیر محفوظ کام بحال کریں")
                          .setMessage("ایپ اچانک بند ہونے سے پہلے '" + name + "' (" + state.language + ") کا غیر محفوظ کام محفوظ کر لیا گیا تھا۔"
                                  + (time.isEmpty() ? "" : "\nوقت: " + time)
                                  + "\n\nکیا آپ اسے واپس کھولنا چاہتے ہیں؟")
                          .setPositiveButton(R.string.yes, (d, w) -> {
                              Intent intent = new Intent(this, EditorActivity.class);
                              if (state.fileId != null) {
                                  intent.putExtra(EditorActivity.EXTRA_FILE_ID, state.fileId);
                              } else {
                                  intent.putExtra(EditorActivity.EXTRA_START_EMPTY, false);
                              }
                              intent.putExtra(EditorActivity.EXTRA_RECOVER_SESSION, true);
                              startActivity(intent);
                          })
                          .setNegativeButton(R.string.no, (d, w) -> {
                              recoveryManager.clearRecovery();
                              AccessibilityHelper.announce(this, rootContainer, "عارضی ریکوری ریکارڈ ہٹا دیا گیا۔");
                          })
                          .setCancelable(false)
                          .show();
              }

              private void handleImportedUri(Uri uri) {
                  String displayName = queryDisplayName(uri);
                  String detectedLang = LibraryRepository.detectLanguageFromFileName(displayName);

                  if (detectedLang != null) {
                      importIntoNewEditor(uri, detectedLang, displayName);
                  } else if (!settings.isAskLanguageOnTxtImport()) {
                      importIntoNewEditor(uri, settings.getDefaultLanguage(), displayName);
                  } else {
                      new AlertDialog.Builder(this)
                              .setTitle("پروگرامنگ زبان منتخب کریں")
                              .setItems(SUPPORTED_LANGUAGES, (dialog, which) ->
                                      importIntoNewEditor(uri, SUPPORTED_LANGUAGES[which], displayName))
                              .setNegativeButton(R.string.cancel, null)
                              .show();
                  }
              }

              private void importIntoNewEditor(Uri uri, String language, String displayName) {
                  AccessibilityHelper.announce(this, rootContainer, "فائل درآمد کی جا رہی ہے...");
                  executor.execute(() -> {
                      try {
                          File draftFile = repository.getDraftFile();
                          repository.importUriToFile(uri, draftFile);
                          runOnUiThread(() -> {
                              Intent intent = new Intent(this, EditorActivity.class);
                              intent.putExtra(EditorActivity.EXTRA_START_EMPTY, false);
                              intent.putExtra(EditorActivity.EXTRA_IMPORTED_LANGUAGE, language);
                              intent.putExtra(EditorActivity.EXTRA_IMPORTED_NAME, stripExtension(displayName));
                              startActivity(intent);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "فائل درآمد کرنے میں ناکامی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private String queryDisplayName(Uri uri) {
                  String name = "ImportedFile.txt";
                  try (Cursor cursor = getContentResolver().query(uri, null, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                          int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = cursor.getString(idx);
                      }
                  } catch (Exception ignored) {
                  }
                  return name;
              }

              private String stripExtension(String name) {
                  if (name == null) return "";
                  int dot = name.lastIndexOf('.');
                  return (dot > 0) ? name.substring(0, dot) : name;
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
