              // ==================== Lifecycle ====================

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  checkAndRequestPermissionsOnce();

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "GeminiTTS:WakeLock");
                      }
                  } catch (Exception ignored) {}

                  loadSettings();
                  initMainMediaPlayer();
                  buildMainUi();

                  // Auto-check for GitHub App Updates silently on launch
                  delay(1800, () -> checkForAppUpdates(false));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (pendingUpdateApkFile != null && pendingUpdateApkFile.exists()) {
                      if (Build.VERSION.SDK_INT < 26 || getPackageManager().canRequestPackageInstalls()) {
                          File apk = pendingUpdateApkFile;
                          pendingUpdateApkFile = null;
                          launchApkInstaller(apk);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  cancellationRequested = true;
                  currentGenerationId.incrementAndGet();
                  disconnectActiveHttp();
                  Runnable stopFn = activeStopFinalize;
                  activeStopFinalize = null;
                  if (stopFn != null) {
                      try { stopFn.run(); } catch (Exception ignored) {}
                  }
                  setKeepAwake(false);
                  stopLibTimer();
                  releaseMainMediaPlayer();
                  releaseLibMediaPlayer();
                  bgExecutor.shutdownNow();
              }

              // ==================== Auto-Update System (GitHub Releases) ====================

              private void checkForAppUpdates(final boolean showIfUpToDate) {
                  if (!isNetworkAvailable()) {
                      if (showIfUpToDate) showToast("No internet connection");
                      return;
                  }
                  final String repo = AppConfig.GITHUB_REPO;
                  if (repo == null || repo.trim().isEmpty() || !repo.contains("/")) {
                      if (showIfUpToDate) showToast("Update repository is not configured");
                      return;
                  }

                  final ProgressDialog pd = showIfUpToDate ? new ProgressDialog(this) : null;
                  if (pd != null) {
                      pd.setMessage("Checking for updates...");
                      pd.setCancelable(true);
                      pd.show();
                  }

                  bgExecutor.execute(() -> {
                      try {
                          String apiUrl = "https://api.github.com/repos/" + repo + "/releases/latest";
                          HttpResult res = httpRequestWithHeaders("GET", apiUrl, null, null, false, true);
                          if (res.code != 200) {
                              if (showIfUpToDate) {
                                  runOnUi(() -> {
                                      try { if (pd != null) pd.dismiss(); } catch (Exception ignored) {}
                                      if (res.code == 404) showToast("No releases published yet (Current: v" + AppConfig.APP_VERSION_NAME + ")");
                                      else showToast("Could not check updates (HTTP " + res.code + ")");
                                  });
                              }
                              return;
                          }

                          JSONObject rel = new JSONObject(res.body);
                          final String tagName = rel.optString("tag_name", "").trim();
                          final String releaseNotes = rel.optString("body", "New improvements and bug fixes.").trim();
                          final String htmlUrl = rel.optString("html_url", "https://github.com/" + repo + "/releases");

                          String foundApkUrl = null;
                          JSONArray assets = rel.optJSONArray("assets");
                          if (assets != null) {
                              for (int i = 0; i < assets.length(); i++) {
                                  JSONObject asset = assets.optJSONObject(i);
                                  if (asset != null) {
                                      String name = asset.optString("name", "").toLowerCase(Locale.US);
                                      if (name.endsWith(".apk")) {
                                          foundApkUrl = asset.optString("browser_download_url", "");
                                          break;
                                      }
                                  }
                              }
                          }
                          final String apkUrl = foundApkUrl;

                          if (!tagName.isEmpty() && isNewerVersion(tagName, AppConfig.APP_VERSION_NAME)) {
                              runOnUi(() -> {
                                  try { if (pd != null) pd.dismiss(); } catch (Exception ignored) {}
                                  showUpdateAvailableDialog(tagName, releaseNotes, apkUrl, htmlUrl);
                              });
                          } else if (showIfUpToDate) {
                              runOnUi(() -> {
                                  try { if (pd != null) pd.dismiss(); } catch (Exception ignored) {}
                                  showToast("You are on the latest version (v" + AppConfig.APP_VERSION_NAME + ")");
                              });
                          }
                      } catch (Exception e) {
                          logAppError("AUTO_UPDATE", e.getMessage());
                          if (showIfUpToDate) {
                              runOnUi(() -> {
                                  try { if (pd != null) pd.dismiss(); } catch (Exception ignored) {}
                                  showToast("Update check failed");
                              });
                          }
                      }
                  });
              }

              private boolean isNewerVersion(String remoteTag, String localVersion) {
                  try {
                      String rClean = remoteTag.replaceAll("^[^0-9]+", "").split("[^0-9.]")[0];
                      String lClean = localVersion.replaceAll("^[^0-9]+", "").split("[^0-9.]")[0];
                      if (rClean.isEmpty() || lClean.isEmpty()) return false;
                      String[] rParts = rClean.split("\\.");
                      String[] lParts = lClean.split("\\.");
                      int maxLen = Math.max(rParts.length, lParts.length);
                      for (int i = 0; i < maxLen; i++) {
                          int rNum = (i < rParts.length && !rParts[i].isEmpty()) ? Integer.parseInt(rParts[i]) : 0;
                          int lNum = (i < lParts.length && !lParts[i].isEmpty()) ? Integer.parseInt(lParts[i]) : 0;
                          if (rNum > lNum) return true;
                          if (rNum < lNum) return false;
                      }
                  } catch (Exception ignored) {}
                  return false;
              }

              private void showUpdateAvailableDialog(final String newVersion, final String notes, final String apkUrl, final String htmlUrl) {
                  if (isFinishing() || isDestroyed()) return;
                  String msg = "Current Version: v" + AppConfig.APP_VERSION_NAME
                      + "\nNew Version: " + newVersion
                      + "\n\nWhat's New:\n" + (notes.isEmpty() ? "Bug fixes and improvements." : notes);

                  new AlertDialog.Builder(this)
                      .setTitle("Update Available!")
                      .setMessage(msg)
                      .setCancelable(true)
                      .setPositiveButton("UPDATE NOW", (d, w) -> {
                          if (apkUrl != null && !apkUrl.isEmpty()) {
                              downloadAndInstallUpdate(apkUrl, newVersion);
                          } else {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(htmlUrl)));
                              } catch (Exception e) {
                                  showToast("Unable to open release link");
                              }
                          }
                      })
                      .setNegativeButton("LATER", null)
                      .show();
              }

              private void downloadAndInstallUpdate(final String apkUrl, final String versionTag) {
                  final ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("Downloading Update (" + versionTag + ")");
                  pd.setMessage("Starting download...");
                  pd.setCancelable(false);
                  pd.show();

                  bgExecutor.execute(() -> {
                      HttpURLConnection conn = null;
                      try {
                          String currentUrl = apkUrl;
                          int code = -1;
                          for (int hops = 0; hops < 6; hops++) {
                              URL url = new URL(currentUrl);
                              conn = (HttpURLConnection) url.openConnection();
                              conn.setInstanceFollowRedirects(false);
                              conn.setConnectTimeout(60000);
                              conn.setReadTimeout(120000);
                              conn.setRequestProperty("User-Agent", "GeminiTTS-Android");
                              conn.connect();
                              code = conn.getResponseCode();
                              if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                                  String loc = conn.getHeaderField("Location");
                                  conn.disconnect();
                                  conn = null;
                                  if (loc == null || loc.isEmpty()) throw new Exception("Empty redirect location");
                                  currentUrl = loc;
                              } else {
                                  break;
                              }
                          }
                          if (conn == null || code != 200) {
                              throw new Exception("Download HTTP " + code);
                          }

                          long totalBytes = conn.getContentLengthLong();
                          File dlDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                          if (dlDir == null) dlDir = getCacheDir();
                          if (!dlDir.exists()) dlDir.mkdirs();
                          final File apkFile = new File(dlDir, "GeminiTTS_Update.apk");
                          if (apkFile.exists()) apkFile.delete();

                          try (InputStream in = conn.getInputStream();
                               FileOutputStream out = new FileOutputStream(apkFile)) {
                              byte[] buf = new byte[8192];
                              long downloaded = 0;
                              int len;
                              long lastUiUpdate = 0;
                              while ((len = in.read(buf)) != -1) {
                                  out.write(buf, 0, len);
                                  downloaded += len;
                                  long now = System.currentTimeMillis();
                                  if (now - lastUiUpdate > 250) {
                                      lastUiUpdate = now;
                                      final long dlNow = downloaded;
                                      runOnUi(() -> {
                                          if (totalBytes > 0) {
                                              int pct = (int) ((dlNow * 100L) / totalBytes);
                                              pd.setMessage(String.format(Locale.US, "Downloading... %d%% (%.2f MB / %.2f MB)",
                                                  pct, dlNow / (1024.0 * 1024.0), totalBytes / (1024.0 * 1024.0)));
                                          } else {
                                              pd.setMessage(String.format(Locale.US, "Downloading... %.2f MB", dlNow / (1024.0 * 1024.0)));
                                          }
                                      });
                                  }
                              }
                              out.flush();
                          }

                          runOnUi(() -> {
                              try { pd.dismiss(); } catch (Exception ignored) {}
                              if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                                  pendingUpdateApkFile = apkFile;
                                  new AlertDialog.Builder(MainActivity.this)
                                      .setTitle("Install Permission Required")
                                      .setMessage("Please enable 'Allow from this source' so the app can install the update automatically.")
                                      .setPositiveButton("OPEN SETTINGS", (dlg, which) -> {
                                          try {
                                              Intent intent = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                                  Uri.parse("package:" + getPackageName()));
                                              startActivity(intent);
                                          } catch (Exception ex) {
                                              showToast("Please allow app installs in Settings");
                                          }
                                      })
                                      .setNegativeButton("CANCEL", null)
                                      .show();
                              } else {
                                  launchApkInstaller(apkFile);
                              }
                          });
                      } catch (Exception e) {
                          logAppError("AUTO_UPDATE_DL", e.getMessage());
                          runOnUi(() -> {
                              try { pd.dismiss(); } catch (Exception ignored) {}
                              showErrorDialog("Failed to download update: " + e.getMessage());
                          });
                      } finally {
                          if (conn != null) {
                              try { conn.disconnect(); } catch (Exception ignored) {}
                          }
                      }
                  });
              }

              private void launchApkInstaller(File apkFile) {
                  try {
                      Uri apkUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", apkFile);
                      Intent installIntent = new Intent(Intent.ACTION_VIEW);
                      installIntent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                      installIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(installIntent);
                  } catch (Exception e) {
                      logAppError("APK_INSTALL", e.getMessage());
                      showErrorDialog("Unable to start installer: " + e.getMessage());
                  }
              }

