                      <RadioButton
                          android:id="@+id/rbCheckLevel3"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:text="سطح 3: تفصیلی آف لائن پارسر جانچ (جاوا اور لوا مکمل)" />
                  </RadioGroup>

                  <Button
                      android:id="@+id/btnOpenLanguageCheckers"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:layout_marginBottom="10dp"
                      android:contentDescription="@string/btn_language_checkers"
                      android:text="@string/btn_language_checkers" />

                  <!-- فائل درآمد اور بنیادی زبان -->
