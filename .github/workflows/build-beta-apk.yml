              // ==================== WAV & Silence ====================

              private void writeWavHeader(OutputStream out, long totalAudioLen) throws Exception {
                  int sampleRate = 24000;
                  int channels = 1;
                  int bitsPerSample = 16;
                  int byteRate = sampleRate * channels * (bitsPerSample / 8);
                  int blockAlign = channels * (bitsPerSample / 8);
                  long totalSize = totalAudioLen + 36;

                  byte[] header = new byte[44];
                  header[0] = 'R'; header[1] = 'I'; header[2] = 'F'; header[3] = 'F';
                  header[4] = (byte) (totalSize & 0xff);
                  header[5] = (byte) ((totalSize >> 8) & 0xff);
                  header[6] = (byte) ((totalSize >> 16) & 0xff);
                  header[7] = (byte) ((totalSize >> 24) & 0xff);
                  header[8] = 'W'; header[9] = 'A'; header[10] = 'V'; header[11] = 'E';
                  header[12] = 'f'; header[13] = 'm'; header[14] = 't'; header[15] = ' ';
                  header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0;
                  header[20] = 1; header[21] = 0;
                  header[22] = (byte) channels; header[23] = 0;
                  header[24] = (byte) (sampleRate & 0xff);
                  header[25] = (byte) ((sampleRate >> 8) & 0xff);
                  header[26] = (byte) ((sampleRate >> 16) & 0xff);
                  header[27] = (byte) ((sampleRate >> 24) & 0xff);
                  header[28] = (byte) (byteRate & 0xff);
                  header[29] = (byte) ((byteRate >> 8) & 0xff);
                  header[30] = (byte) ((byteRate >> 16) & 0xff);
                  header[31] = (byte) ((byteRate >> 24) & 0xff);
                  header[32] = (byte) blockAlign; header[33] = 0;
                  header[34] = (byte) bitsPerSample; header[35] = 0;
                  header[36] = 'd'; header[37] = 'a'; header[38] = 't'; header[39] = 'a';
                  header[40] = (byte) (totalAudioLen & 0xff);
                  header[41] = (byte) ((totalAudioLen >> 8) & 0xff);
                  header[42] = (byte) ((totalAudioLen >> 16) & 0xff);
                  header[43] = (byte) ((totalAudioLen >> 24) & 0xff);
                  out.write(header);
              }

              private long writeSilenceSeconds(OutputStream out, double seconds) throws Exception {
                  if (seconds <= 0) return 0;
                  if (seconds > 15) seconds = 15;
                  long totalBytes = (long) Math.floor(seconds * 24000.0 * 2.0);
                  if (totalBytes % 2 != 0) totalBytes++;
                  byte[] zeroBuf = new byte[4800];
                  long remaining = totalBytes;
                  while (remaining > 0) {
                      int toWrite = (int) Math.min(remaining, zeroBuf.length);
                      out.write(zeroBuf, 0, toWrite);
                      remaining -= toWrite;
                  }
                  return totalBytes;
              }

              private int detectWavDataOffset(byte[] bytes) {
                  if (bytes != null && bytes.length > 44
                      && (bytes[0] & 0xFF) == 'R'
                      && (bytes[1] & 0xFF) == 'I'
                      && (bytes[2] & 0xFF) == 'F'
                      && (bytes[3] & 0xFF) == 'F') {
                      int limit = Math.min(bytes.length - 8, 256);
                      for (int i = 12; i < limit; i++) {
                          if ((bytes[i] & 0xFF) == 'd' && (bytes[i + 1] & 0xFF) == 'a'
                              && (bytes[i + 2] & 0xFF) == 't' && (bytes[i + 3] & 0xFF) == 'a') {
                              return i + 8;
                          }
                      }
                      return 44;
                  }
                  return 0;
              }

