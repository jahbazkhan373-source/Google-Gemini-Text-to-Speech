              private static final String KEY_AUTO_SAVE = "auto_save_enabled";
              private static final String KEY_AUTO_SAVE_SEC = "auto_save_seconds";
              private static final String KEY_AUTO_BACKUP = "auto_backup_enabled";
              private static final String KEY_MAX_BACKUPS = "max_backups_per_file";
              private static final String KEY_AUTO_CLOSE_BRACKETS = "auto_close_brackets";
              private static final String KEY_DEFAULT_MATCH_CASE = "default_match_case";
              private static final String KEY_DEFAULT_WHOLE_WORD = "default_whole_word";
              private static final String KEY_ERROR_CHECK_LEVEL = "error_check_level";

              private static final String KEY_THEME_MODE = "theme_mode";
              private static final String KEY_DEFAULT_LANGUAGE = "default_language";
              private static final String KEY_ASK_LANG_ON_TXT_IMPORT = "ask_lang_on_txt_import";

              public static final int THEME_SYSTEM = 0;
              public static final int THEME_LIGHT = 1;
              public static final int THEME_DARK = 2;

              public static final int DEFAULT_PAGE_CHAR_LIMIT = 500_000;
              public static final int MIN_PAGE_CHAR_LIMIT = 50_000;
              public static final int DEFAULT_FONT_SIZE = 15;
              public static final int DEFAULT_INDENT_SPACES = 4;

              private final SharedPreferences prefs;

              public AppSettings(Context context) {
                  this.prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              public static void applyThemeMode(int mode) {
                  if (mode == THEME_LIGHT) {
