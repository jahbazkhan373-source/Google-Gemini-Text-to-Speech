                      } else if (dirtyPageFile.exists()) {
                          dirtyPageFile.delete();
                      }

                      JSONObject obj = new JSONObject();
                      obj.put("fileId", fileId != null ? fileId : "");
                      obj.put("fileName", fileName != null ? fileName : "");
                      obj.put("language", language != null ? language : "Java");
                      obj.put("isLineMode", isLineMode);
                      obj.put("pageIndex", pageIndex);
                      obj.put("lineIndex", lineIndex);
                      obj.put("hasDirtyPageText", hasDirty);
                      obj.put("timestamp", System.currentTimeMillis());

                      File tmpState = new File(recoveryDir, STATE_FILE + ".tmp");
                      try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmpState))) {
