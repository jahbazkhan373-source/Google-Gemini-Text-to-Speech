              private void executeRunPreview(String filePath, String language, String projectId) {
                  if (filePath == null || filePath.isEmpty()) {
                      showConsole("No code file provided.");
                      return;
                  }
                  File codeFile = new File(filePath);
                  if (!codeFile.exists()) {
                      showConsole("Code file not found.");
                      return;
                  }

                  String lang = (language != null) ? language.trim() : "Java";
                  String lower = lang.toLowerCase(Locale.ROOT);
                  showConsole("Checking and running " + lang + " code...");

                  executor.execute(() -> {
                      try {
                          // Step 1: Always run syntax validation first so errors show with per-line Copy buttons!
                          CodeAnalyzerEngine.AnalysisReport report = CodeAnalyzerEngine.analyze(this, codeFile, lang, 3);
                          if (report.confirmedCount > 0) {
                              runOnUiThread(() -> showErrorsList(report.issues));
                              return;
                          }

                          String source = readUtf8Limited(codeFile, 2_000_000);

                          // Step 2: Interactive Live Execution based on language
                          if (lower.contains("html") || lower.equals("javascript") || lower.equals("css")) {
                              String html = lower.contains("html")
                                      ? source
                                      : ("<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'></head><body><pre id='out'></pre><script>"
                                      + "console.log = function(){ document.getElementById('out').innerText += Array.from(arguments).join(' ') + '\\n'; };\n"
                                      + source + "</script></body></html>");
                              runOnUiThread(() -> showInteractiveWebView(html, codeFile.getParentFile()));
                          } else if (lower.contains("lua")) {
                              LuaSandboxRunner.RunResult res = LuaSandboxRunner.runLuaCode(source, 5000L);
                              if (!res.success) {
                                  List<CodeIssue> rtErrs = new ArrayList<>();
                                  rtErrs.add(new CodeIssue("Lua Runtime Error", 1, 0, res.error, "", false, CodeIssue.FixType.NONE, null, null));
