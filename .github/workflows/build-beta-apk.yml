                  long dexBytes = 0, resBytes = 0, assetsBytes = 0, libBytes = 0, otherBytes = 0;
                  Set<String> abis = new HashSet<>();
                  int entryCount = 0;

                  try (ZipFile zf = new ZipFile(apkFile)) {
                      Enumeration<? extends ZipEntry> entries = zf.entries();
                      while (entries.hasMoreElements()) {
                          ZipEntry e = entries.nextElement();
                          entryCount++;
                          long sz = Math.max(0, e.getCompressedSize());
                          String name = e.getName();
                          if (name.endsWith(".dex")) dexBytes += sz;
                          else if (name.startsWith("res/") || name.equals("resources.arsc")) resBytes += sz;
                          else if (name.startsWith("assets/")) assetsBytes += sz;
                          else if (name.startsWith("lib/")) {
                              libBytes += sz;
                              String[] parts = name.split("/");
                              if (parts.length >= 2) abis.add(parts[1]);
                          } else otherBytes += sz;
                      }
                  } catch (Exception e) {
                      sb.append("ZIP Read Error: ").append(e.getMessage()).append("\n");
                  }

                  sb.append("Architecture Compatibility:\n");
                  if (abis.isEmpty()) {
                      sb.append("  • Universal Pure Java/DEX (Works on BOTH 32-bit & 64-bit devices, 16 KB Safe)\n\n");
                  } else {
                      boolean has32 = abis.contains("armeabi-v7a");
                      boolean has64 = abis.contains("arm64-v8a");
