                  findViewById(R.id.btnCompressWebp).setOnClickListener(v -> {
                      AccessibilityHelper.announce(this, rootContainer, "Compressing drawable images to WebP...");
                      executor.execute(() -> {
                          int count = projectRepo.compressDrawableImagesToWebP(project);
                          runOnUiThread(() -> {
                              refreshList();
                              AccessibilityHelper.announce(this, rootContainer, "Compressed " + count + " image(s) to WebP.");
                          });
                      });
                  });

                  refreshList();
              }

              private void refreshList() {
                  List<File> files = projectRepo.listMediaAssets(project);
                  adapter.setItems(files);
                  tvEmptyMedia.setVisibility(files.isEmpty() ? View.VISIBLE : View.GONE);

                  long mediaBytes = projectRepo.calculateMediaSizeBytes(project);
                  long estTotal = projectRepo.calculateEstimatedApkSizeBytes(project);
                  long baseBytes = estTotal - mediaBytes;
                  tvSizeEstimate.setText(String.format(Locale.US,
                          "Base Code: %.2f MB + Media/Assets: %.2f MB = Estimated APK: %.2f MB",
                          baseBytes / 1048576.0, mediaBytes / 1048576.0, estTotal / 1048576.0));
              }

              private void previewFile(File f) {
                  String lower = f.getName().toLowerCase(Locale.US);
                  if (lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".ogg") || lower.endsWith(".m4a")) {
                      stopAudio();
                      try {
                          activePlayer = new MediaPlayer();
                          activePlayer.setDataSource(f.getAbsolutePath());
                          activePlayer.prepare();
                          activePlayer.start();
                          AccessibilityHelper.announce(this, rootContainer, "Playing audio: " + f.getName());
                          new AlertDialog.Builder(this)
                                  .setTitle("Audio Preview: " + f.getName())
                                  .setMessage("Playing sound effect...")
                                  .setPositiveButton("Stop", (d, w) -> stopAudio())
                                  .setOnDismissListener(d -> stopAudio())
                                  .show();
                      } catch (Exception e) {
                          AccessibilityHelper.announce(this, rootContainer, "Cannot play audio: " + e.getMessage());
                      }
                  } else if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp")) {
                      Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath());
                      if (bmp == null) {
                          AccessibilityHelper.announce(this, rootContainer, "Cannot decode image.");
                          return;
                      }
                      ImageView iv = new ImageView(this);
                      iv.setImageBitmap(bmp);
                      iv.setAdjustViewBounds(true);
                      iv.setPadding(24, 24, 24, 24);
                      new AlertDialog.Builder(this)
                              .setTitle("Image Preview: " + f.getName() + " (" + bmp.getWidth() + "x" + bmp.getHeight() + ")")
                              .setView(iv)
                              .setPositiveButton(R.string.ok, null)
                              .show();
                  } else {
                      AccessibilityHelper.announce(this, rootContainer, "Asset: " + f.getName() + " (" + (f.length() / 1024) + " KB)");
                  }
              }

              private void stopAudio() {
                  if (activePlayer != null) {
                      try {
                          if (activePlayer.isPlaying()) activePlayer.stop();
                          activePlayer.release();
                      } catch (Exception ignored) {
                      }
                      activePlayer = null;
                  }
              }

              private String getCodeReference(File f) {
                  String parent = f.getParentFile() != null ? f.getParentFile().getName() : "";
                  String name = f.getName();
                  int dot = name.lastIndexOf('.');
                  String base = (dot > 0) ? name.substring(0, dot) : name;
                  if ("raw".equals(parent)) return "R.raw." + base;
                  if ("drawable".equals(parent)) return "R.drawable." + base;
                  return "assets/" + name;
              }

              private String queryDisplayName(Uri uri) {
                  String name = "asset_file";
                  try (Cursor c = getContentResolver().query(uri, null, null, null, null)) {
                      if (c != null && c.moveToFirst()) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = c.getString(idx);
                      }
                  } catch (Exception ignored) {
                  }
                  return name;
              }

              private class MediaAdapter extends RecyclerView.Adapter<MediaAdapter.VH> {
                  private final List<File> items = new ArrayList<>();

                  void setItems(List<File> list) {
                      items.clear();
                      items.addAll(list);
                      notifyDataSetChanged();
                  }

                  @NonNull
                  @Override
                  public VH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                      View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_media_asset, parent, false);
                      return new VH(v);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      File f = items.get(pos);
                      String ref = getCodeReference(f);
                      h.tvName.setText(f.getName());
                      h.tvMeta.setText(String.format(Locale.US, "Ref: %s | Size: %.1f KB", ref, f.length() / 1024.0));

                      h.btnPreview.setOnClickListener(v -> previewFile(f));
                      h.btnCopyRef.setOnClickListener(v -> {
                          ClipboardHelper.copyPlainText(MediaAssetsActivity.this, "AssetRef", ref);
                          AccessibilityHelper.announce(MediaAssetsActivity.this, rootContainer, "Copied reference: " + ref);
                      });
                      h.btnDelete.setOnClickListener(v -> {
                          if (f.delete()) {
                              refreshList();
                              AccessibilityHelper.announce(MediaAssetsActivity.this, rootContainer, "Deleted " + f.getName());
                          }
                      });
                  }

                  @Override
                  public int getItemCount() {
                      return items.size();
                  }

                  class VH extends RecyclerView.ViewHolder {
                      TextView tvName, tvMeta;
                      Button btnPreview, btnCopyRef, btnDelete;

                      VH(@NonNull View v) {
                          super(v);
                          tvName = v.findViewById(R.id.tvAssetName);
                          tvMeta = v.findViewById(R.id.tvAssetMeta);
                          btnPreview = v.findViewById(R.id.btnAssetPreview);
                          btnCopyRef = v.findViewById(R.id.btnAssetCopyRef);
                          btnDelete = v.findViewById(R.id.btnAssetDelete);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  stopAudio();
                  executor.shutdown();
              }
          }
