                      h.btnDelete.setContentDescription("Delete project " + m.appName);

                      h.btnOpen.setOnClickListener(v -> openProjectInEditor(m));
                      h.btnClone.setOnClickListener(v -> {
                          EditText input = new EditText(ProjectsActivity.this);
                          input.setText(m.appName + " Copy");
                          new AlertDialog.Builder(ProjectsActivity.this)
                                  .setTitle("Clone Project")
                                  .setView(input)
                                  .setPositiveButton(R.string.ok, (d, w) -> {
                                      String nm = input.getText().toString().trim();
                                      if (nm.isEmpty()) return;
                                      executor.execute(() -> {
                                          try {
                                              projectRepo.cloneProject(m, nm);
                                              runOnUiThread(() -> {
                                                  refreshList();
                                                  AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Cloned project: " + nm);
                                              });
                                          } catch (Exception e) {
                                              runOnUiThread(() -> AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Clone failed: " + e.getMessage()));
                                          }
                                      });
                                  })
                                  .setNegativeButton(R.string.cancel, null)
                                  .show();
                      });
                      h.btnExportZip.setOnClickListener(v -> {
                          AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Exporting project ZIP...");
                          executor.execute(() -> {
                              try {
                                  String saved = projectRepo.exportProjectZip(m);
                                  runOnUiThread(() -> AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "ZIP saved: " + saved));
                              } catch (Exception e) {
                                  runOnUiThread(() -> AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Export failed: " + e.getMessage()));
                              }
                          });
                      });
                      h.btnBackup.setOnClickListener(v -> {
                          File mainFile = projectRepo.getProjectFile(m, m.mainCodeFile);
                          Intent intent = new Intent(ProjectsActivity.this, BackupActivity.class);
                          intent.putExtra(BackupActivity.EXTRA_FILE_ID, "proj_" + m.id);
                          intent.putExtra(BackupActivity.EXTRA_CUSTOM_FILE_PATH, mainFile.getAbsolutePath());
                          intent.putExtra(BackupActivity.EXTRA_DISPLAY_NAME, m.appName);
                          startActivity(intent);
                      });
                      h.btnDelete.setOnClickListener(v -> {
                          new AlertDialog.Builder(ProjectsActivity.this)
                                  .setTitle("Delete Project")
                                  .setMessage("Permanently delete project '" + m.appName + "' and all its files?")
                                  .setPositiveButton(R.string.yes, (d, w) -> {
                                      try {
                                          projectRepo.deleteProject(m.id);
                                          refreshList();
                                          AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Project deleted: " + m.appName);
                                      } catch (Exception e) {
                                          AccessibilityHelper.announce(ProjectsActivity.this, rootContainer, "Delete failed: " + e.getMessage());
                                      }
                                  })
                                  .setNegativeButton(R.string.no, null)
                                  .show();
                      });
                  }

                  @Override
                  public int getItemCount() {
                      return items.size();
                  }

                  class VH extends RecyclerView.ViewHolder {
                      TextView tvName, tvDetails;
                      Button btnOpen, btnClone, btnExportZip, btnBackup, btnDelete;

                      VH(@NonNull View v) {
                          super(v);
                          tvName = v.findViewById(R.id.tvProjectName);
                          tvDetails = v.findViewById(R.id.tvProjectDetails);
                          btnOpen = v.findViewById(R.id.btnProjectOpen);
                          btnClone = v.findViewById(R.id.btnProjectClone);
                          btnExportZip = v.findViewById(R.id.btnProjectExportZip);
                          btnBackup = v.findViewById(R.id.btnProjectBackup);
                          btnDelete = v.findViewById(R.id.btnProjectDelete);
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
