                  <RadioGroup
                      android:id="@+id/rgThemeMode"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingBottom="12dp">

                      <RadioButton
                          android:id="@+id/rbThemeSystem"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:text="موبائل سسٹم کے مطابق" />

                      <RadioButton
                          android:id="@+id/rbThemeLight"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:text="روشن تھیم (Light)" />

                      <RadioButton
                          android:id="@+id/rbThemeDark"
                          android:layout_width="match_parent"
                          android:layout_height="46dp"
                          android:text="تاریک تھیم (Dark)" />
                  </RadioGroup>

                  <!-- غلطیوں کی جانچ کا درجہ -->
                  <TextView
                      android:layout_width="match_parent"
