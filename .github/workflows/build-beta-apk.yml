              public static String buildSafeTxtFileName(String rawName) {
                  String safe = rawName == null ? "CodeBookFile" : rawName.trim();
                  safe = safe.replaceAll("[\\\\/:*?\"<>|]", "_");
                  if (safe.isEmpty()) safe = "CodeBookFile";
                  if (!safe.toLowerCase().endsWith(".txt")) {
                      safe = safe + ".txt";
                  }
                  return safe;
              }

              public static String detectLanguageFromFileName(String fileName) {
                  if (fileName == null) return "Java";
                  String lower = fileName.toLowerCase();
                  if (lower.endsWith(".java")) return "Java";
                  if (lower.endsWith(".lua")) return "Lua";
                  if (lower.endsWith(".py")) return "Python";
                  if (lower.endsWith(".kt")) return "Kotlin";
                  if (lower.endsWith(".js")) return "JavaScript";
                  if (lower.endsWith(".html") || lower.endsWith(".htm")) return "HTML";
                  if (lower.endsWith(".xml")) return "XML";
                  if (lower.endsWith(".json")) return "JSON";
                  if (lower.endsWith(".cpp") || lower.endsWith(".cc")) return "C++";
                  if (lower.endsWith(".c")) return "C";
                  if (lower.endsWith(".dart")) return "Dart";
                  return null;
              }

