          package com.codebook.editor;

          import android.app.Application;

          import com.codebook.editor.storage.CrashRecoveryManager;
          import com.codebook.editor.util.AppSettings;

          public class CodeBookApp extends Application {

              @Override
              public void onCreate() {
                  super.onCreate();
                  AppSettings settings = new AppSettings(this);
                  AppSettings.applyThemeMode(settings.getThemeMode());
                  AppSettings.applyAppLanguage(settings.getAppLanguageCode());

                  final Thread.UncaughtExceptionHandler previousHandler = Thread.getDefaultUncaughtExceptionHandler();
                  Thread.setDefaultUncaughtExceptionHandler((thread, throwable) -> {
                      try {
                          CrashRecoveryManager.saveLastCrashLog(getApplicationContext(), throwable);
                      } catch (Throwable ignored) {
                      }
                      if (previousHandler != null) {
                          previousHandler.uncaughtException(thread, throwable);
                      }
                  });
              }
          }
          CODEBOOK_EOF
