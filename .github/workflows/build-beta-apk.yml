                      placeholder.installed = false;
                      placeholder.enabled = false;
                      map.put(lang.toLowerCase(Locale.ROOT), placeholder);
                  }

                  File[] files = checkersDir.listFiles();
                  if (files != null) {
                      for (File f : files) {
                          if (!f.isFile() || !f.getName().endsWith(".json")) continue;
                          try {
                              LanguageRuleSpec spec = readSpecFile(f);
                              if (spec != null && !spec.language.isEmpty()) {
                                  String key = spec.language.toLowerCase(Locale.ROOT);
                                  if (!"java".equals(key) && !"lua".equals(key)) map.put(key, spec);
                              }
                          } catch (Exception ignored) {
                          }
                      }
                  }

                  return new ArrayList<>(map.values());
              }

              public LanguageRuleSpec findActiveCheckerForLanguage(String language) {
                  if (language == null || language.trim().isEmpty()) return null;
                  String target = language.trim().toLowerCase(Locale.ROOT);
                  for (LanguageRuleSpec spec : getAllDisplayCheckers()) {
                      if (spec.language.toLowerCase(Locale.ROOT).equals(target)) {
                          return (spec.installed && spec.enabled) ? spec : null;
                      }
                  }
                  return null;
              }

              public boolean isBuiltInEnabled(String language) {
                  return statePrefs.getBoolean("builtin_" + language.toLowerCase(Locale.ROOT), true);
              }

              public void setCheckerEnabled(LanguageRuleSpec spec, boolean enabled) throws IOException {
                  if (spec == null || !spec.installed) return;
                  if (spec.builtIn) {
                      statePrefs.edit().putBoolean("builtin_" + spec.language.toLowerCase(Locale.ROOT), enabled).apply();
                      return;
                  }
                  spec.enabled = enabled;
                  saveCustomSpec(spec);
              }

              public void removeCustomChecker(String language) {
                  if (language == null) return;
                  File f = getCustomSpecFile(language);
                  if (f.exists()) f.delete();
              }

              public LanguageRuleSpec importJsonCheckerFromUri(Uri uri) throws IOException {
                  byte[] raw = readLimitedUri(uri, MAX_JSON_BYTES);
                  String jsonText = new String(raw, StandardCharsets.UTF_8).trim();
                  if (jsonText.startsWith("\uFEFF")) jsonText = jsonText.substring(1).trim();
                  if (!jsonText.startsWith("{")) {
                      throw new IOException("Invalid JSON file. Only safe JSON grammar rules are accepted.");
                  }

                  try {
                      JSONObject obj = new JSONObject(jsonText);
                      LanguageRuleSpec spec = LanguageRuleSpec.fromJson(obj);
                      if (spec.language.isEmpty()) throw new IOException("Missing 'language' field in JSON.");
                      String lower = spec.language.toLowerCase(Locale.ROOT);
                      if ("java".equals(lower) || "lua".equals(lower)) {
                          throw new IOException("Java and Lua offline parsers are already built into Code Book.");
                      }

                      validateSafeRegex(spec.functionPattern, "functionPattern");
                      validateSafeRegex(spec.classPattern, "classPattern");

                      spec.enabled = true;
                      spec.installed = true;
                      spec.builtIn = false;
                      saveCustomSpec(spec);
                      return spec;
                  } catch (IOException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IOException("Invalid JSON checker schema: " + e.getMessage());
                  }
              }

              private void validateSafeRegex(String patternStr, String fieldName) throws IOException {
                  if (patternStr == null || patternStr.isEmpty()) return;
                  if (patternStr.length() > 200) throw new IOException(fieldName + " exceeds 200-char safety limit.");
                  if (patternStr.contains("(.+)+") || patternStr.contains("(.*)+")
                          || patternStr.contains("(.*)*") || patternStr.contains("(\\w+)+")) {
                      throw new IOException("Unsafe nested regex rejected in " + fieldName);
                  }
                  try {
                      Pattern.compile(patternStr);
                  } catch (PatternSyntaxException e) {
                      throw new IOException("Invalid regex in " + fieldName + ": " + e.getDescription());
                  }
              }

              public static String getSamplePythonJson() {
                  return "{\n"
                          + "  \"language\": \"Python\",\n"
                          + "  \"version\": \"1.0\",\n"
                          + "  \"description\": \"Python JSON Rules Checker\",\n"
                          + "  \"extensions\": [\".py\"],\n"
                          + "  \"lineComment\": \"#\",\n"
                          + "  \"blockCommentStart\": \"\\\"\\\"\\\"\",\n"
                          + "  \"blockCommentEnd\": \"\\\"\\\"\\\"\",\n"
                          + "  \"blockOpeners\": [\"def \", \"class \", \"if \", \"elif \", \"else\", \"for \", \"while \", \"try\", \"except\"],\n"
                          + "  \"blockClosers\": [],\n"
                          + "  \"requireColonOnOpeners\": true,\n"
                          + "  \"requireSemicolon\": false,\n"
                          + "  \"functionPattern\": \"^\\\\s*def\\\\s+([A-Za-z_][A-Za-z0-9_]*)\\\\s*\\\\(\",\n"
                          + "  \"classPattern\": \"^\\\\s*class\\\\s+([A-Za-z_][A-Za-z0-9_]*)\"\n"
                          + "}";
              }

              private File getCustomSpecFile(String language) {
                  String safe = language.trim().toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9_+-]", "_");
                  return new File(checkersDir, safe + ".json");
              }

              private void saveCustomSpec(LanguageRuleSpec spec) throws IOException {
                  File dest = getCustomSpecFile(spec.language);
                  File temp = new File(checkersDir, dest.getName() + ".tmp");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp))) {
                      out.write(spec.toJson().toString(2).getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  } catch (Exception e) {
                      throw new IOException("Failed to save checker: " + e.getMessage());
                  }
                  LargeFileEngine.atomicReplace(temp, dest);
              }

              private LanguageRuleSpec readSpecFile(File file) throws Exception {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return LanguageRuleSpec.fromJson(new JSONObject(new String(data, StandardCharsets.UTF_8)));
              }

              private byte[] readLimitedUri(Uri uri, int maxBytes) throws IOException {
                  try (InputStream in = context.getContentResolver().openInputStream(uri);
                       ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                      if (in == null) throw new IOException("Unable to open file.");
                      byte[] buf = new byte[8192];
                      int len, total = 0;
                      while ((len = in.read(buf)) != -1) {
                          total += len;
                          if (total > maxBytes) throw new IOException("JSON checker exceeds 256 KB safety limit.");
                          out.write(buf, 0, len);
                      }
                      return out.toByteArray();
                  }
              }
          }
