              public List<LanguageRuleSpec> getAllDisplayCheckers() {
                  Map<String, LanguageRuleSpec> map = new LinkedHashMap<>();

                  LanguageRuleSpec javaSpec = new LanguageRuleSpec();
                  javaSpec.language = "Java";
                  javaSpec.version = "JavaParser 3.25";
                  javaSpec.description = "پہلے سے شامل حقیقی آف لائن جاوا پارسر (کلاسز، میتھڈز، سیمی کولن اور مکمل جاوا سینٹیکس کی جانچ)۔";
                  javaSpec.builtIn = true;
                  javaSpec.installed = true;
                  javaSpec.enabled = isBuiltInEnabled("Java");
                  javaSpec.extensions = Arrays.asList(".java");
                  map.put("java", javaSpec);

                  LanguageRuleSpec luaSpec = new LanguageRuleSpec();
                  luaSpec.language = "Lua";
                  luaSpec.version = "LuaJ LuaC 3.0";
                  luaSpec.description = "پہلے سے شامل حقیقی آف لائن لوا پارسر (کوڈ چلائے بغیر فنکشنز، end، then، لوپس اور مکمل لوا قواعد کی جانچ)۔";
                  luaSpec.builtIn = true;
                  luaSpec.installed = true;
                  luaSpec.enabled = isBuiltInEnabled("Lua");
                  luaSpec.extensions = Arrays.asList(".lua");
                  map.put("lua", luaSpec);

                  for (String lang : STANDARD_PLACEHOLDER_LANGUAGES) {
                      LanguageRuleSpec placeholder = new LanguageRuleSpec();
                      placeholder.language = lang;
                      placeholder.version = "-";
                      placeholder.description = "یہ زبان محفوظ JSON رولز فائل کے ذریعے درآمد کی جا سکتی ہے۔ فی الحال بنیادی سطح 1 کی جانچ دستیاب ہے۔";
                      placeholder.builtIn = false;
                      placeholder.installed = false;
                      placeholder.enabled = false;
                      map.put(lang.toLowerCase(Locale.ROOT), placeholder);
                  }

                  File[] files = checkersDir.listFiles();
                  if (files != null) {
                      for (File f : files) {
                          if (!f.isFile() || !f.getName().endsWith(".json")) continue;
                          try {
                              LanguageRuleSpec spec = readSpecFile(f);
                              if (spec != null && !spec.language.isEmpty()) {
                                  String key = spec.language.toLowerCase(Locale.ROOT);
                                  if (!"java".equals(key) && !"lua".equals(key)) {
