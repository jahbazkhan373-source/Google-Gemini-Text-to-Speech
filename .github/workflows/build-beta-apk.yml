                      return new VH(v);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull VH h, int pos) {
                      BackupManager.BackupMeta m = items.get(pos);
                      String date = df.format(new Date(m.timestamp));
                      h.tvLabel.setText(m.label + " — " + date);
                      h.tvInfo.setText("لائنیں: " + m.lineCount + " | حروف: " + m.charCount);

                      h.btnRestore.setContentDescription(m.label + " تاریخ " + date + " بحال کریں");
                      h.btnDiff.setContentDescription(m.label + " کا موجودہ کوڈ سے موازنہ کریں");
                      h.btnDelete.setContentDescription(m.label + " حذف کریں");

                      h.btnRestore.setOnClickListener(v -> confirmRestore(m));
                      h.btnDiff.setOnClickListener(v -> {
                          Intent i = new Intent(BackupActivity.this, DiffActivity.class);
                          i.putExtra(DiffActivity.EXTRA_FILE_ID, fileId);
                          i.putExtra(DiffActivity.EXTRA_BACKUP_ID, m.id);
                          startActivity(i);
                      });
                      h.btnDelete.setOnClickListener(v -> {
                          try {
                              backupManager.deleteBackup(fileId, m.id);
                              refreshBackups();
                              AccessibilityHelper.announce(BackupActivity.this, rootContainer, "بیک اپ حذف ہو گیا۔");
                          } catch (Exception e) {
                              AccessibilityHelper.announce(BackupActivity.this, rootContainer, "حذف کرنے میں خرابی: " + e.getMessage());
                          }
                      });
                  }

                  @Override
                  public int getItemCount() {
                      return items.size();
                  }

                  class VH extends RecyclerView.ViewHolder {
