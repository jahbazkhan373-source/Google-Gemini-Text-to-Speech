              public static String getDefaultMainFileName(String language) {
                  if (language == null) return "main.java";
                  String l = language.toLowerCase(Locale.ROOT);
                  if (l.contains("lua")) return "main.lua";
                  if (l.contains("html")) return "index.html";
                  if (l.contains("javascript") || l.equals("js")) return "main.js";
                  if (l.contains("css")) return "style.css";
                  if (l.contains("python")) return "main.py";
                  if (l.contains("kotlin")) return "MainActivity.kt";
                  if (l.contains("c++")) return "main.cpp";
                  if (l.equals("c")) return "main.c";
                  if (l.contains("dart")) return "main.dart";
                  return "main.java";
              }

              public static String sanitizePackageName(String rawPkg, String fallbackAppName) {
                  if (rawPkg != null && rawPkg.trim().matches("^[a-zA-Z][a-zA-Z0-9_]*(\\.[a-zA-Z][a-zA-Z0-9_]*)+$")) {
                      return rawPkg.trim().toLowerCase(Locale.US);
                  }
                  String clean = (fallbackAppName != null ? fallbackAppName : "myapp")
                          .toLowerCase(Locale.US).replaceAll("[^a-z0-9]", "");
                  if (clean.isEmpty() || Character.isDigit(clean.charAt(0))) clean = "app" + clean;
                  return "com.codebook." + clean;
              }

              private void saveIndex(List<ProjectMeta> list) throws IOException {
                  JSONArray arr = new JSONArray();
                  try {
                      for (ProjectMeta m : list) arr.put(m.toJson());
                  } catch (Exception e) {
                      throw new IOException(e.getMessage());
                  }
                  File tmp = new File(indexFile.getParentFile(), INDEX_FILE + ".tmp");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmp))) {
                      out.write(arr.toString(2).getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  } catch (Exception e) {
                      throw new IOException(e.getMessage());
                  }
                  LargeFileEngine.atomicReplace(tmp, indexFile);
              }

              private static void copyDirRecursive(File src, File dst) throws IOException {
                  if (!src.exists()) return;
                  if (src.isDirectory()) {
                      if (!dst.exists()) dst.mkdirs();
                      File[] children = src.listFiles();
                      if (children != null) {
                          for (File c : children) copyDirRecursive(c, new File(dst, c.getName()));
                      }
                  } else {
                      LibraryRepository.copyFileAtomic(src, dst);
                  }
              }

              private static void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) deleteRecursive(c);
                      }
                  }
                  f.delete();
              }

              private static String readUtf8(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return new String(data, StandardCharsets.UTF_8);
              }

              private static String escapeXml(String s) {
                  if (s == null) return "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;");
              }
          }
