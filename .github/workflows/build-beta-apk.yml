                  public final long byteEnd;
                  public final String linePreview;

                  public SearchMatch(int lineIndex, long byteStart, long byteEnd, String linePreview) {
                      this.lineIndex = lineIndex;
                      this.lineNumber = lineIndex + 1;
                      this.byteStart = byteStart;
                      this.byteEnd = byteEnd;
                      this.linePreview = linePreview;
