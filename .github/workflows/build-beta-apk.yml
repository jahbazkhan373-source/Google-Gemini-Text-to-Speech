          package com.codebook.editor.checker;

          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;

          import com.codebook.editor.util.AppSettings;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * Online Strict Compiler Checker + Optional AI Error Assistant.
           * Only runs when online and configured in Settings; offline parsers always work without internet.
           */
          public class OnlineAnalyzerClient {

              public static boolean isOnline(Context context) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) context.getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;
                      NetworkInfo info = cm.getActiveNetworkInfo();
                      return info != null && info.isConnected();
                  } catch (Exception e) {
                      return false;
                  }
              }

              public static List<CodeIssue> runStrictCloudCheck(Context context, String language, String sourceCode) throws Exception {
                  AppSettings settings = new AppSettings(context);
                  String baseUrl = settings.getCloudBuildUrl();
                  if (baseUrl == null || baseUrl.isEmpty()) {
                      throw new IllegalStateException("Cloud Strict Checker URL is not configured in Settings.");
                  }
                  if (!isOnline(context)) {
                      throw new IllegalStateException("No internet connection.");
                  }

                  String endpoint = baseUrl.endsWith("/") ? baseUrl + "check" : baseUrl + "/check";
                  JSONObject req = new JSONObject();
                  req.put("language", language);
                  req.put("code", sourceCode);

                  String respStr = postJson(endpoint, null, req.toString(), 20_000);
                  JSONObject resp = new JSONObject(respStr);
                  JSONArray arr = resp.optJSONArray("issues");
                  List<CodeIssue> out = new ArrayList<>();
                  if (arr != null) {
                      String[] lines = sourceCode.split("\r?\n", -1);
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject item = arr.getJSONObject(i);
                          int ln = Math.max(1, item.optInt("line", 1));
                          String codeLine = (ln - 1 < lines.length) ? lines[ln - 1].trim() : "";
                          out.add(new CodeIssue(
                                  item.optString("name", "Compiler Error"),
                                  ln,
                                  item.optInt("column", 0),
                                  item.optString("reason", "Strict compiler reported an error."),
                                  codeLine,
                                  item.optBoolean("possible", false),
                                  CodeIssue.FixType.NONE,
                                  null,
                                  null
                          ));
                      }
                  }
                  return out;
              }

              public static String askAiAboutIssue(Context context, String language, CodeIssue issue, String surroundingCode) throws Exception {
                  AppSettings settings = new AppSettings(context);
                  String endpoint = settings.getAiAssistantEndpoint();
                  String apiKey = settings.getAiAssistantApiKey();
                  if (endpoint == null || endpoint.isEmpty()) {
                      throw new IllegalStateException("AI Assistant Endpoint URL is not set in Settings.");
                  }
                  if (!isOnline(context)) {
                      throw new IllegalStateException("Internet is required for AI Error Assistant.");
                  }

                  String prompt = "You are a concise coding assistant. Explain this " + language + " error and provide the exact corrected line.\n"
                          + issue.formatCopyText() + "\n\nCode context:\n" + surroundingCode;

                  JSONObject req = new JSONObject();
                  JSONArray messages = new JSONArray();
                  JSONObject userMsg = new JSONObject();
                  userMsg.put("role", "user");
                  userMsg.put("content", prompt);
                  messages.put(userMsg);
                  req.put("model", "gpt-4o-mini");
                  req.put("messages", messages);

                  String respStr = postJson(endpoint, apiKey, req.toString(), 25_000);
                  JSONObject resp = new JSONObject(respStr);
                  if (resp.has("reply")) return resp.getString("reply");
                  if (resp.has("text")) return resp.getString("text");
                  JSONArray choices = resp.optJSONArray("choices");
                  if (choices != null && choices.length() > 0) {
                      JSONObject msg = choices.getJSONObject(0).optJSONObject("message");
                      if (msg != null) return msg.optString("content", respStr);
                  }
                  return respStr;
              }

              private static String postJson(String urlStr, String bearerKey, String body, int timeoutMs) throws Exception {
                  HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                  conn.setConnectTimeout(timeoutMs);
                  conn.setReadTimeout(timeoutMs);
                  conn.setRequestMethod("POST");
                  conn.setDoOutput(true);
                  conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                  if (bearerKey != null && !bearerKey.isEmpty()) {
                      conn.setRequestProperty("Authorization", "Bearer " + bearerKey);
                  }
                  try (OutputStream out = conn.getOutputStream()) {
                      out.write(body.getBytes(StandardCharsets.UTF_8));
                      out.flush();
                  }

                  int code = conn.getResponseCode();
                  InputStream stream = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();
                  StringBuilder sb = new StringBuilder();
                  if (stream != null) {
                      try (BufferedReader br = new BufferedReader(new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line).append('\n');
                      }
                  }
                  if (code < 200 || code >= 300) {
                      throw new Exception("HTTP " + code + ": " + sb.toString().trim());
                  }
                  return sb.toString();
              }
          }
