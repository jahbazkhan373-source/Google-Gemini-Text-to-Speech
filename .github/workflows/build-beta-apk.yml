          package com.codebook.editor.storage;

          import android.content.ContentValues;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;

          import com.codebook.editor.model.CodeFileMeta;

          import org.json.JSONArray;

          import java.io.BufferedInputStream;
          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;
          import java.util.zip.ZipOutputStream;

          public class ZipBackupManager {

              public static String buildDefaultZipName() {
                  String ts = new SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(new Date());
                  return "CodeBook_Library_" + ts + ".zip";
              }

              public static String exportLibraryToDownloadsZip(Context context, LibraryRepository repo,
                                                               BackupManager backupManager,
                                                               boolean includeBackups) throws IOException {
                  String fileName = buildDefaultZipName();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.Downloads.DISPLAY_NAME, fileName);
                      values.put(MediaStore.Downloads.MIME_TYPE, "application/zip");
                      values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);

                      Uri uri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("Download فولڈر میں ZIP فائل بنائی نہیں جا سکی۔");
                      }
                      try (OutputStream out = context.getContentResolver().openOutputStream(uri)) {
                          if (out == null) throw new IOException("ZIP لکھنے کی رسائی نہیں ملی۔");
                          writeZipArchive(out, repo, backupManager, includeBackups);
                      }
                      return fileName;
                  } else {
                      File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!downloadsDir.exists()) downloadsDir.mkdirs();
                      File dest = new File(downloadsDir, fileName);
                      try (OutputStream out = new BufferedOutputStream(new FileOutputStream(dest), 65536)) {
                          writeZipArchive(out, repo, backupManager, includeBackups);
                      }
                      return dest.getAbsolutePath();
                  }
              }

              public static void exportLibraryToUri(Context context, Uri destUri, LibraryRepository repo,
                                                    BackupManager backupManager, boolean includeBackups) throws IOException {
                  try (OutputStream out = context.getContentResolver().openOutputStream(destUri)) {
                      if (out == null) throw new IOException("منتخب جگہ پر ZIP محفوظ نہیں ہو سکی۔");
                      writeZipArchive(out, repo, backupManager, includeBackups);
                  }
              }

              private static void writeZipArchive(OutputStream out, LibraryRepository repo,
                                                  BackupManager backupManager, boolean includeBackups) throws IOException {
                  try (ZipOutputStream zos = new ZipOutputStream(new BufferedOutputStream(out, 65536))) {
                      File indexFile = repo.getIndexFile();
                      if (indexFile.exists()) {
                          addFileToZip(zos, indexFile, "library/index.json");
                      }
                      List<CodeFileMeta> files = repo.getAllFiles();
                      for (CodeFileMeta meta : files) {
                          File codeFile = repo.getCodeFile(meta.id);
                          if (codeFile.exists()) {
                              addFileToZip(zos, codeFile, "library/" + meta.id + ".code");
                          }
                          if (includeBackups) {
                              File bDir = new File(backupManager.getBackupsRootDir(), meta.id);
                              if (bDir.exists() && bDir.isDirectory()) {
                                  File[] bFiles = bDir.listFiles();
                                  if (bFiles != null) {
                                      for (File bf : bFiles) {
                                          if (bf.isFile()) {
                                              addFileToZip(zos, bf, "backups/" + meta.id + "/" + bf.getName());
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      zos.finish();
                      zos.flush();
                  }
              }

              private static void addFileToZip(ZipOutputStream zos, File file, String entryName) throws IOException {
                  ZipEntry entry = new ZipEntry(entryName);
                  zos.putNextEntry(entry);
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) {
                          zos.write(buf, 0, len);
                      }
                  }
                  zos.closeEntry();
              }

              public static int restoreLibraryFromZipUri(Context context, Uri zipUri,
                                                         LibraryRepository repo, BackupManager backupManager) throws IOException {
                  File stagingDir = new File(context.getCacheDir(), "zip_restore_" + UUID.randomUUID());
                  if (!stagingDir.exists()) stagingDir.mkdirs();

                  try {
                      String canonicalRoot = stagingDir.getCanonicalPath();
                      try (InputStream is = context.getContentResolver().openInputStream(zipUri);
                           ZipInputStream zis = new ZipInputStream(new BufferedInputStream(is, 65536))) {
                          ZipEntry entry;
                          byte[] buf = new byte[65536];
                          while ((entry = zis.getNextEntry()) != null) {
                              if (entry.isDirectory()) {
                                  zis.closeEntry();
                                  continue;
                              }
                              File outFile = new File(stagingDir, entry.getName());
                              if (!outFile.getCanonicalPath().startsWith(canonicalRoot + File.separator)) {
                                  throw new IOException("غیر محفوظ ZIP فائل کا راستہ مسترد کر دیا گیا۔");
                              }
                              File parent = outFile.getParentFile();
                              if (parent != null && !parent.exists()) parent.mkdirs();

                              try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(outFile), 65536)) {
                                  int len;
                                  while ((len = zis.read(buf)) != -1) {
                                      out.write(buf, 0, len);
                                  }
                                  out.flush();
                              }
                              zis.closeEntry();
                          }
                      }

                      File extractedIndex = new File(stagingDir, "library/index.json");
                      if (!extractedIndex.exists()) {
                          throw new IOException("یہ Code Book کی درست بیک اپ ZIP فائل نہیں ہے۔");
                      }

                      String jsonStr = readUtf8(extractedIndex);
                      JSONArray array = new JSONArray(jsonStr);
                      int restoredCount = 0;
                      Map<String, String> idMap = new HashMap<>();

                      for (int i = 0; i < array.length(); i++) {
                          CodeFileMeta incoming = CodeFileMeta.fromJson(array.getJSONObject(i));
                          File extractedCode = new File(stagingDir, "library/" + incoming.id + ".code");
                          if (!extractedCode.exists()) continue;

                          CodeFileMeta saved = repo.importRestoredMetaAndFile(incoming, extractedCode);
                          idMap.put(incoming.id, saved.id);
                          restoredCount++;
                      }

                      File extractedBackupsRoot = new File(stagingDir, "backups");
                      if (extractedBackupsRoot.exists() && extractedBackupsRoot.isDirectory()) {
                          for (Map.Entry<String, String> pair : idMap.entrySet()) {
                              File oldBDir = new File(extractedBackupsRoot, pair.getKey());
                              if (oldBDir.exists() && oldBDir.isDirectory()) {
                                  File targetBDir = backupManager.getFileBackupDir(pair.getValue());
                                  File[] files = oldBDir.listFiles();
                                  if (files != null) {
                                      for (File f : files) {
                                          if (f.isFile()) {
                                              LibraryRepository.copyFileAtomic(f, new File(targetBDir, f.getName()));
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      return restoredCount;
                  } catch (IOException e) {
                      throw e;
                  } catch (Exception e) {
                      throw new IOException("ZIP بحال کرنے میں خرابی: " + e.getMessage());
                  } finally {
                      deleteRecursive(stagingDir);
                  }
              }

              private static String readUtf8(File file) throws IOException {
                  byte[] data = new byte[(int) file.length()];
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file))) {
                      int off = 0, r;
                      while (off < data.length && (r = in.read(data, off, data.length - off)) != -1) off += r;
                  }
                  return new String(data, StandardCharsets.UTF_8);
              }

              private static void deleteRecursive(File f) {
                  if (f == null || !f.exists()) return;
                  if (f.isDirectory()) {
                      File[] children = f.listFiles();
                      if (children != null) {
                          for (File c : children) deleteRecursive(c);
                      }
                  }
                  f.delete();
              }
          }
