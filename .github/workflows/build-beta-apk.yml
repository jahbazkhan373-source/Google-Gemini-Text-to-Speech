              public synchronized void saveRecoverySnapshot(String fileId, String fileName, String language,
                                                            boolean isLineMode, int pageIndex, int lineIndex,
                                                            String dirtyPageText) {
                  try {
                      boolean hasDirty = (dirtyPageText != null);
                      if (hasDirty) {
