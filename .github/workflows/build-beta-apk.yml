                  File dir = getProjectDir(meta);
                  collectMedia(new File(dir, "res/raw"), out);
                  collectMedia(new File(dir, "res/drawable"), out);
                  collectMedia(new File(dir, "assets"), out);
                  Collections.sort(out, (a, b) -> a.getName().compareToIgnoreCase(b.getName()));
                  return out;
              }

              private void collectMedia(File dir, List<File> out) {
                  if (dir == null || !dir.exists() || !dir.isDirectory()) return;
                  File[] list = dir.listFiles();
                  if (list == null) return;
                  for (File f : list) {
                      if (f.isFile()) out.add(f);
                  }
              }

              public File importMediaFile(ProjectMeta meta, Uri uri, String originalName, String folderType) throws IOException {
                  String subDir;
                  String prefix;
                  if ("raw".equals(folderType)) {
                      subDir = "res/raw";
                      prefix = "audio";
                  } else if ("drawable".equals(folderType)) {
                      subDir = "res/drawable";
                      prefix = "img";
                  } else {
                      subDir = "assets";
                      prefix = "asset";
                  }

                  String safeName = "assets".equals(folderType)
                          ? WorkspaceStorageManager.sanitizeFolderName(originalName)
                          : CodeToolsHelper.sanitizeResourceFileName(originalName, prefix);

                  File dest = getProjectFile(meta, subDir + "/" + safeName);
                  File parent = dest.getParentFile();
                  if (parent != null && !parent.exists()) parent.mkdirs();

                  File tmp = new File(parent, safeName + ".tmp");
                  try (InputStream in = context.getContentResolver().openInputStream(uri);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmp), 65536)) {
                      if (in == null) throw new IOException("Unable to read media file.");
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
                  LargeFileEngine.atomicReplace(tmp, dest);
                  workspace.pushProjectFileToSaf(meta.folderName, subDir + "/" + safeName, dest);
                  return dest;
              }

              public int compressDrawableImagesToWebP(ProjectMeta meta) {
                  File drawDir = getProjectFile(meta, "res/drawable");
                  if (!drawDir.exists()) return 0;
                  File[] files = drawDir.listFiles();
                  if (files == null) return 0;

                  int converted = 0;
                  for (File f : files) {
                      if (!f.isFile()) continue;
                      String lower = f.getName().toLowerCase(Locale.US);
                      if (!lower.endsWith(".png") && !lower.endsWith(".jpg") && !lower.endsWith(".jpeg")) continue;
                      try {
                          Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath());
                          if (bmp == null) continue;
                          String base = f.getName().substring(0, f.getName().lastIndexOf('.'));
                          File webpFile = new File(drawDir, base + ".webp");
                          try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(webpFile))) {
                              Bitmap.CompressFormat fmt = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R)
                                      ? Bitmap.CompressFormat.WEBP_LOSSY
                                      : Bitmap.CompressFormat.WEBP;
                              bmp.compress(fmt, 82, out);
                              out.flush();
                          }
                          bmp.recycle();
                          if (webpFile.exists() && webpFile.length() < f.length()) {
                              f.delete();
                              workspace.pushProjectFileToSaf(meta.folderName, "res/drawable/" + webpFile.getName(), webpFile);
                              converted++;
                          } else if (webpFile.exists()) {
                              webpFile.delete();
                          }
                      } catch (Exception ignored) {
                      }
                  }
                  return converted;
              }

              /**
               * Generates all 5 Android mipmap launcher icon sizes (mdpi to xxxhdpi) from a single selected image!
               */
              public void saveAppIconFromUri(ProjectMeta meta, Uri imageUri) throws IOException {
                  Bitmap src;
                  try (InputStream in = context.getContentResolver().openInputStream(imageUri)) {
                      if (in == null) throw new IOException("Unable to read selected icon image.");
                      src = BitmapFactory.decodeStream(in);
                  }
                  if (src == null) throw new IOException("Invalid image format.");

                  int[][] densities = {
                          {48, 0},   // mdpi
                          {72, 1},   // hdpi
                          {96, 2},   // xhdpi
                          {144, 3},  // xxhdpi
                          {192, 4}   // xxxhdpi
                  };
                  String[] folders = {"mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"};

                  for (int i = 0; i < densities.length; i++) {
                      int sz = densities[i][0];
                      Bitmap scaled = Bitmap.createScaledBitmap(src, sz, sz, true);
                      File dest = getProjectFile(meta, "res/" + folders[i] + "/ic_launcher.png");
                      File p = dest.getParentFile();
                      if (p != null && !p.exists()) p.mkdirs();
                      try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dest))) {
                          scaled.compress(Bitmap.CompressFormat.PNG, 100, out);
                          out.flush();
                      }
                      if (scaled != src) scaled.recycle();
                      workspace.pushProjectFileToSaf(meta.folderName, "res/" + folders[i] + "/ic_launcher.png", dest);
                  }

                  // Also save drawable preview icon
                  Bitmap preview = Bitmap.createScaledBitmap(src, 192, 192, true);
                  File previewFile = getProjectFile(meta, "res/drawable/ic_launcher.png");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(previewFile))) {
                      preview.compress(Bitmap.CompressFormat.PNG, 100, out);
                      out.flush();
                  }
                  if (preview != src) preview.recycle();
                  src.recycle();

                  meta.iconFileName = "ic_launcher.png";
                  updateProject(meta);
              }

