              private static String extractFirstWord(String s) {
                  if (s == null) return "Puck";
                  Matcher m = Pattern.compile("^(\\w+)").matcher(s.trim());
                  return m.find() ? m.group(1) : s.trim();
              }

              private String cleanKeyString(String k) {
                  if (k == null) return "";
                  return k.replaceAll("[\\s\\p{Cntrl}]+", "");
              }

              private String sanitizeFileName(String raw) {
                  if (raw == null) return "";
                  return raw.trim().replaceAll("[\\\\/:*?\"<>|]", "_");
              }

              private void checkAndRequestPermissionsOnce() {
                  if (Build.VERSION.SDK_INT >= 23) {
                      boolean hasAsked = prefs.getBoolean("has_asked_permission", false);
                      if (!hasAsked) {
                          List<String> permsToAsk = new ArrayList<>();
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission("android.permission.READ_MEDIA_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_MEDIA_AUDIO");
                              }
                          } else {
                              if (checkSelfPermission("android.permission.WRITE_EXTERNAL_STORAGE") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.WRITE_EXTERNAL_STORAGE");
                              }
                              if (checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") != PackageManager.PERMISSION_GRANTED) {
                                  permsToAsk.add("android.permission.READ_EXTERNAL_STORAGE");
                              }
                          }
                          if (!permsToAsk.isEmpty()) {
                              try {
                                  requestPermissions(permsToAsk.toArray(new String[0]), 1);
                              } catch (Exception ignored) {}
                          }
                          prefs.edit().putBoolean("has_asked_permission", true).apply();
                      }
                  }
              }

