              private void setupButtons() {
                  btnAllMode.setOnClickListener(v -> switchToAllMode());
                  btnLineMode.setOnClickListener(v -> switchToLineMode());
                  btnUndo.setOnClickListener(v -> handleUndo());
                  btnRedo.setOnClickListener(v -> handleRedo());

                  findViewById(R.id.btnSave).setOnClickListener(v -> handleSaveClicked());
                  findViewById(R.id.btnCheckErrors).setOnClickListener(v -> runCodeErrorCheck());
                  findViewById(R.id.btnFunctionList).setOnClickListener(v -> openOutlineList(OutlineItem.Kind.FUNCTION));
                  findViewById(R.id.btnClassList).setOnClickListener(v -> openOutlineList(OutlineItem.Kind.CLASS));

                  btnPrevError.setOnClickListener(v -> navigateError(-1));
                  btnNextError.setOnClickListener(v -> navigateError(1));
                  findViewById(R.id.btnErrorDetail).setOnClickListener(v -> {
                      if (currentIssueIndex >= 0 && currentIssueIndex < activeIssues.size()) {
                          showIssueDetailAndFixDialog(activeIssues.get(currentIssueIndex), currentIssueIndex);
                      }
                  });
                  btnPossibleErrors.setOnClickListener(v -> showFilteredIssuesDialog(true));
                  findViewById(R.id.btnCloseErrorBar).setOnClickListener(v -> {
                      activeIssues.clear();
                      currentIssueIndex = -1;
                      layoutErrorNavBar.setVisibility(View.GONE);
                      AccessibilityHelper.announce(this, rootContainer, "غلطیوں کی پٹی بند کر دی گئی۔");
                  });

                  findViewById(R.id.btnFind).setOnClickListener(v -> showFindOrReplaceDialog(false));
                  findViewById(R.id.btnReplace).setOnClickListener(v -> showFindOrReplaceDialog(true));
                  findViewById(R.id.btnMarkLine).setOnClickListener(v -> handleMarkCurrentOrChosenLine(true));
                  findViewById(R.id.btnUnmarkLine).setOnClickListener(v -> handleMarkCurrentOrChosenLine(false));
                  findViewById(R.id.btnMarkedLines).setOnClickListener(v -> showMarkedLinesDialog());

                  findViewById(R.id.btnCopyAll).setOnClickListener(v -> handleCopyAll());
                  findViewById(R.id.btnPaste).setOnClickListener(v -> handlePaste());
                  findViewById(R.id.btnClearAll).setOnClickListener(v -> confirmClearAll());
                  findViewById(R.id.btnImportIntoEditor).setOnClickListener(v ->
                          importInEditorLauncher.launch(new String[]{"text/*", "*/*"})
                  );
                  findViewById(R.id.btnFileStats).setOnClickListener(v -> showFileStats());

                  btnPrevPage.setOnClickListener(v -> navigateToPage(currentPageIndex - 1));
                  btnNextPage.setOnClickListener(v -> navigateToPage(currentPageIndex + 1));

                  findViewById(R.id.btnJumpLine).setOnClickListener(v -> showJumpLineDialog());
