              private void handleJumpMatchingBracket() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final int fromLine = currentFocusedLineIndex;

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          int matchLine = CodeToolsHelper.findMatchingBracketLine(engine.getBackingFile(), fromLine);
                          runOnUiThread(() -> {
                              if (matchLine < 1) {
                                  AccessibilityHelper.announce(this, rootContainer, "No matching bracket found for line " + (fromLine + 1));
                              } else {
                                  jumpToLineWithCustomAnnouncement(matchLine - 1, "Jumped to matching bracket at line " + matchLine);
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Bracket jump error: " + e.getMessage()));
                      }
                  });
              }

              private void showSnippetsDialog() {
                  List<CodeToolsHelper.SnippetItem> snippets = CodeToolsHelper.loadBuiltInSnippets(this);
                  if (snippets.isEmpty()) return;
                  String[] labels = new String[snippets.size()];
                  for (int i = 0; i < snippets.size(); i++) labels[i] = snippets.get(i).title;

                  new AlertDialog.Builder(this)
                          .setTitle("Insert Code Snippet / Template")
                          .setItems(labels, (d, which) -> {
                              String snippetCode = snippets.get(which).code;
                              if (!isLineMode) {
                                  int start = Math.max(0, etCodeEditor.getSelectionStart());
                                  int end = Math.max(0, etCodeEditor.getSelectionEnd());
                                  etCodeEditor.getText().replace(Math.min(start, end), Math.max(start, end), snippetCode);
                                  AccessibilityHelper.announce(this, rootContainer, "Inserted snippet: " + snippets.get(which).title);
                              } else {
                                  executor.execute(() -> {
                                      try {
                                          String prefix = engine.needsNewlineBeforeAppend(snippetCode.charAt(0)) ? engine.getLineEnding() : "";
                                          undoManager.applyWithBytes(engine, engine.getTotalBytes(), engine.getTotalBytes(),
                                                  (prefix + snippetCode).getBytes(StandardCharsets.UTF_8), "Insert Snippet", engine.getLineCount());
                                          runOnUiThread(() -> {
                                              lineAdapter.refreshAllLines();
                                              updateHeaderAndBarsUI();
                                              AccessibilityHelper.announce(this, rootContainer, "Snippet appended at end of file.");
                                          });
                                      } catch (Exception ignored) {
                                      }
                                  });
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void handleAutoFormat() {
                  if (engine == null) return;
                  if (engine.getTotalBytes() > 1_500_000L) {
                      AccessibilityHelper.announce(this, rootContainer, "File exceeds 1.5 MB; Auto-Format skipped to protect RAM.");
                      return;
                  }
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final String indentUnit = settings.getIndentUnitString();

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          String raw = new String(engine.readByteRangeRaw(0L, engine.getTotalBytes()), StandardCharsets.UTF_8);
                          String formatted = CodeToolsHelper.autoFormatCode(raw, currentLanguage, indentUnit);
                          undoManager.applyWithBytes(engine, 0L, engine.getTotalBytes(),
                                  formatted.getBytes(StandardCharsets.UTF_8), "Auto-Format", currentFocusedLineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          syncProjectFileToExternalIfProject();

                          String pageText = (!isLineMode) ? engine.readPage(Math.min(currentPageIndex, engine.getPageCount() - 1)) : "";
                          runOnUiThread(() -> {
                              if (!isLineMode) displayPageContent(pageText);
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Code formatted cleanly. Use Undo to revert if needed.");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Format failed: " + e.getMessage()));
                      }
                  });
              }

