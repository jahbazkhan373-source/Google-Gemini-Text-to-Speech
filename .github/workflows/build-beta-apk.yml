                  final EditText editName = new EditText(this);
                  editName.setHint("Enter Name");
                  editName.setContentDescription("Enter your name");
                  layout.addView(editName);

                  final EditText editWa = new EditText(this);
                  editWa.setHint("WhatsApp Number (Optional)");
                  editWa.setContentDescription("Enter WhatsApp number optional");
                  editWa.setInputType(InputType.TYPE_CLASS_PHONE);
                  layout.addView(editWa);

                  final EditText editMsg = new EditText(this);
                  editMsg.setHint("Enter Feedback Message");
                  editMsg.setContentDescription("Enter feedback message");
                  layout.addView(editMsg);

                  Button btnSend = makeStyledButton("SEND FEEDBACK", "#2196F3", 10);
                  Button btnBack = makeStyledButton("GO BACK", "#F44336", 8);
                  layout.addView(btnSend);
                  layout.addView(btnBack);

                  scroll.addView(layout);
                  final AlertDialog fbDialog = new AlertDialog.Builder(this).setView(scroll).create();
                  fbDialog.show();

                  btnBack.setOnClickListener(v -> fbDialog.dismiss());

                  btnSend.setOnClickListener(v -> {
                      final String name = editName.getText().toString().trim();
                      final String wa = editWa.getText().toString().trim();
                      final String trimmedMsg = editMsg.getText().toString().trim();
                      if (trimmedMsg.isEmpty()) {
                          showToast("Please enter a valid feedback message");
                          return;
                      }
                      if (trimmedMsg.length() > 5000) {
                          showToast("Feedback exceeds 5000 characters");
                          return;
                      }
                      if (!isNetworkAvailable()) {
                          showToast("No internet connection. Please connect to the internet.");
                          showErrorDialog("No internet connection available.");
                          return;
                      }

                      final String botToken = AppConfig.getBotToken();
                      final String chatId = AppConfig.getChatId();
                      final String feedbackUrl = AppConfig.getFeedbackUrl();
                      if (botToken.isEmpty() || chatId.isEmpty() || feedbackUrl.isEmpty()) {
                          showErrorDialog("Feedback service secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, FEEDBACK_API_URL) are missing in GitHub Secrets.");
                          return;
                      }

                      final ProgressDialog pd = new ProgressDialog(MainActivity.this);
                      pd.setMessage("Sending please wait...");
                      pd.setCancelable(false);
                      pd.show();
                      showToast("Sending please wait");

                      bgExecutor.execute(() -> {
                          try {
                              String formattedName = !name.isEmpty() ? name : "Anonymous";
                              StringBuilder fullText = new StringBuilder();
                              fullText.append("New Feedback Received:\nApp: Google Gemini Text to Speech (v")
                                  .append(AppConfig.APP_VERSION_NAME).append(")\nName: ").append(formattedName);
                              if (!wa.isEmpty()) fullText.append("\nWhatsApp: ").append(wa);
                              fullText.append("\nFeedback: ").append(trimmedMsg);

                              String postData = "bot_token=" + URLEncoder.encode(botToken, "UTF-8")
                                  + "&chat_id=" + URLEncoder.encode(chatId, "UTF-8")
                                  + "&text=" + URLEncoder.encode(fullText.toString(), "UTF-8");

                              HttpResult res = httpRequest("POST", feedbackUrl, postData, "application/x-www-form-urlencoded", false);
                              runOnUi(() -> {
                                  try { pd.dismiss(); } catch (Exception ignored) {}
                                  if (res.code == 200) {
                                      showToast("Feedback sent successfully");
                                      editMsg.setText("");
                                      showSuccessDialog(fbDialog, "Feedback sent successfully!");
                                  } else {
                                      String errCode = res.code > 0 ? String.valueOf(res.code) : "Network Error";
                                      logAppError("FEEDBACK", "HTTP " + errCode);
                                      showToast("Failed to send feedback.");
                                      showErrorDialog("Failed to send feedback (Code: " + errCode + "). Please check your internet connection.");
                                  }
                              });
                          } catch (Exception e) {
                              logAppError("FEEDBACK", e.getMessage());
                              runOnUi(() -> {
                                  try { pd.dismiss(); } catch (Exception ignored) {}
                                  showErrorDialog("Failed to send feedback: " + e.getMessage());
                              });
                          }
                      });
                  });
              }

