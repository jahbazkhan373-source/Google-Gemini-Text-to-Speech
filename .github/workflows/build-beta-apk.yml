              // ==================== HTTP Helpers ====================

              private HttpResult httpRequest(String method, String urlStr, String body, String contentType, boolean trackActive) {
                  return httpRequestWithHeaders(method, urlStr, body, contentType, trackActive, false);
              }

              private HttpResult httpRequestWithHeaders(String method, String urlStr, String body, String contentType, boolean trackActive, boolean isGithubApi) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(urlStr);
                      conn = (HttpURLConnection) url.openConnection();
                      if (trackActive) activeConnection = conn;
                      conn.setConnectTimeout(HTTP_TIMEOUT_MS);
                      conn.setReadTimeout(HTTP_TIMEOUT_MS);
                      conn.setRequestMethod(method);
                      if (contentType != null) conn.setRequestProperty("Content-Type", contentType);
                      if (isGithubApi) {
                          conn.setRequestProperty("Accept", "application/vnd.github+json");
                          conn.setRequestProperty("User-Agent", "GeminiTTS-Android");
                      }
                      if ("POST".equals(method) && body != null) {
                          conn.setDoOutput(true);
                          byte[] outBytes = body.getBytes(StandardCharsets.UTF_8);
                          conn.setFixedLengthStreamingMode(outBytes.length);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(outBytes);
                              os.flush();
                          }
                      }
                      int code = conn.getResponseCode();
                      InputStream is = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                      String respBody = "";
                      if (is != null) {
                          try (InputStream in = is; ByteArrayOutputStream bos = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = in.read(buf)) != -1) bos.write(buf, 0, len);
                              respBody = new String(bos.toByteArray(), StandardCharsets.UTF_8);
                          }
                      }
                      return new HttpResult(code, respBody);
                  } catch (Exception e) {
                      return new HttpResult(-1, e.getMessage() != null ? e.getMessage() : "Network error");
                  } finally {
                      if (trackActive && activeConnection == conn) activeConnection = null;
                      if (conn != null) {
                          try { conn.disconnect(); } catch (Exception ignored) {}
                      }
                  }
              }

              // ==================== Text Parsing & Job Builder ====================

              private CleanedResult cleanDialogueAndExtractPause(String rawText) {
                  if (rawText == null) return new CleanedResult("", 0);
                  double extraPauseSec = 0;
                  Pattern pausePat = Pattern.compile("\\[[pP][aA][uU][sS][eE]:\\s*([\\d.]+)\\s*([mM]?[sS]?)\\s*\\]");
                  Matcher m = pausePat.matcher(rawText);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      try {
                          double val = Double.parseDouble(m.group(1));
                          String unit = m.group(2) != null ? m.group(2).toLowerCase(Locale.US) : "";
                          if ("ms".equals(unit)) val = val / 1000.0;
                          extraPauseSec += val;
                      } catch (Exception ignored) {}
                      m.appendReplacement(sb, " ");
                  }
                  m.appendTail(sb);
                  String text = sb.toString();
                  text = text.replaceAll("\\[[^\\]]*\\]", "");
                  text = text.replaceAll("</?speak>", "");
                  text = text.replaceAll("<break[^>]*>", " ");
                  text = text.replaceAll("</?emphasis[^>]*>", "");
                  text = text.replaceAll("\\*([^*]*)\\*", "$1");
                  text = text.replaceAll("\\s+", " ").trim();
                  return new CleanedResult(text, extraPauseSec);
              }

              private String applySingleToneIfNeeded(String cleanedText) {
                  if (cleanedText == null || cleanedText.isEmpty()) return "";
                  if (selectedTone == null || selectedTone.isEmpty() || "Default".equals(selectedTone)) {
                      return cleanedText;
                  }
                  String cleanTone = selectedTone;
                  int dashIdx = cleanTone.indexOf('-');
                  if (dashIdx > 0) cleanTone = cleanTone.substring(0, dashIdx);
                  cleanTone = cleanTone.trim();
                  if (cleanTone.isEmpty() || "Default".equalsIgnoreCase(cleanTone)) {
                      return cleanedText;
                  }
                  return "Speak in a " + cleanTone.toLowerCase(Locale.US) + " tone:\n\n" + cleanedText;
              }

