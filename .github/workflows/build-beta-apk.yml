                  LargeFileEngine.atomicReplace(tmp, dest);
                  workspace.mirrorKeystoreFile(dest, fileName);

                  KeystoreMeta meta = new KeystoreMeta();
                  meta.id = id;
                  meta.name = name.trim();
                  meta.fileName = fileName;
                  meta.alias = resolvedAlias;
                  meta.storePassword = storePass;
                  meta.keyPassword = keyPass;
                  meta.storeType = detectedType;
