                                  + "• لائن ترمیم و محفوظ کرنے کا وقت: " + editSaveMs + " ms\n"
                                  + "• کاپی کا وقت: " + copyMs + " ms (" + (copyRes.systemCopied ? "سسٹم + اندرونی کلپ بورڈ" : "صرف محفوظ اندرونی کلپ بورڈ") + ")\n"
                                  + "• استعمال شدہ ریم: " + String.format(Locale.US, "%.1f MB / %.0f MB", usedRamMb, maxRamMb) + "\n"
                                  + "• نمونہ آخری لائن: " + (endText.length() > 60 ? endText.substring(0, 60) + "..." : endText);

                          lastTestFile = testFile;
                          lastTestedChars = actualChars;

                          runOnUiThread(() -> {
                              testRunning = false;
                              tvResult.setText(report);
                              btnOpenInEditor.setEnabled(true);
                              AccessibilityHelper.announce(
                                      this, rootContainer,
                                      "آزمائش مکمل۔ " + lines + " لائنیں " + openMs + " ملی سیکنڈ میں کھل گئیں۔"
