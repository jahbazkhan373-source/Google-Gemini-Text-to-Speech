                  for (int i = 0; i < currentErrors.size(); i++) {
                      sb.append(i + 1).append(". ").append(currentErrors.get(i).formatCopyText()).append("\n\n");
                  }
                  ClipboardHelper.copyPlainText(this, "AllRunErrors", sb.toString().trim());
                  AccessibilityHelper.announce(this, rootContainer, "Copied all " + currentErrors.size() + " error(s).");
              }

              private class RunErrorAdapter extends RecyclerView.Adapter<RunErrorAdapter.VH> {
                  private final List<CodeIssue> items = new ArrayList<>();

