                                      AccessibilityHelper.announce(this, rootContainer, "Lua run finished cleanly.");
                                  });
                              }
                          } else {
                              // Java / Kotlin / Android Project: Dry-Run passed! Offer instant Build & Launch APK
                              String msg = "=== Dry-Run Validation PASSED (0 Errors) ===\n\n"
                                      + "Language: " + lang + "\n"
                                      + "File: " + codeFile.getName() + "\n"
                                      + "Status: Ready to build & install as Android APK.\n\n"
                                      + "Tip: Press Close to return to Editor, or open More Options -> Build APK to compile and install on your device.";
                              runOnUiThread(() -> {
