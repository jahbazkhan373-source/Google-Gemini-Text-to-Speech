              private boolean pullRecursive(DocumentFile safDir, File localDir) throws IOException {
                  boolean pulled = false;
                  if (!localDir.exists()) localDir.mkdirs();
                  for (DocumentFile child : safDir.listFiles()) {
                      String name = child.getName();
                      if (name == null || name.isEmpty()) continue;
                      File localTarget = new File(localDir, name);
                      if (child.isDirectory()) {
                          if (pullRecursive(child, localTarget)) pulled = true;
                      } else if (child.isFile()) {
                          long safModified = child.lastModified();
                          if (!localTarget.exists() || (safModified > 0 && safModified > localTarget.lastModified() + 1500L)) {
                              try (InputStream in = context.getContentResolver().openInputStream(child.getUri());
                                   BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(localTarget), 65536)) {
                                  if (in != null) {
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                      pulled = true;
                                  }
                              }
                          }
                      }
                  }
                  return pulled;
              }

              private DocumentFile getOrCreateSafDir(DocumentFile parent, String name) {
                  if (parent == null) return null;
                  DocumentFile existing = parent.findFile(name);
                  if (existing != null && existing.isDirectory()) return existing;
                  return parent.createDirectory(name);
              }

              private void writeFileToSafDir(DocumentFile dir, String fileName, String mime, File src) throws IOException {
                  if (dir == null || src == null || !src.exists()) return;
                  DocumentFile existing = dir.findFile(fileName);
                  if (existing != null && existing.exists()) {
                      existing.delete();
                  }
                  DocumentFile created = dir.createFile(mime, fileName);
                  if (created == null) return;
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(src), 65536);
                       OutputStream out = context.getContentResolver().openOutputStream(created.getUri())) {
                      if (out == null) return;
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
              }

              private static void copyLocal(File src, File dst) throws IOException {
                  File p = dst.getParentFile();
                  if (p != null && !p.exists()) p.mkdirs();
                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(src), 65536);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(dst), 65536)) {
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
              }

              public static String sanitizeFolderName(String raw) {
                  if (raw == null || raw.trim().isEmpty()) return "Default";
                  String clean = raw.trim().replaceAll("[\\\\/:*?\"<>|]", "_");
                  return clean.isEmpty() ? "Default" : clean;
              }

              private static String guessMime(String name) {
                  String lower = name.toLowerCase();
                  if (lower.endsWith(".json")) return "application/json";
                  if (lower.endsWith(".xml") || lower.endsWith(".html")) return "text/xml";
                  if (lower.endsWith(".png")) return "image/png";
                  if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                  if (lower.endsWith(".webp")) return "image/webp";
                  if (lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".ogg")) return "audio/*";
                  return "text/plain";
              }

              private static void mkdirsSafe(File d) {
                  if (d != null && !d.exists()) d.mkdirs();
              }
