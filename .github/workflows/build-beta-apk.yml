              private void saveIndex(List<CodeFileMeta> list) throws IOException {
                  JSONArray array = new JSONArray();
                  try {
                      for (CodeFileMeta meta : list) array.put(meta.toJson());
                  } catch (JSONException e) {
                      throw new IOException("Index error: " + e.getMessage());
                  }

                  File temp = new File(libraryDir, INDEX_FILE + ".tmp");
                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(temp))) {
                      out.write(array.toString().getBytes(StandardCharsets.UTF_8));
                      out.flush();
