          package com.codebook.editor.engine;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;

          public class DiffEngine {

              public enum Type {
                  MODIFIED, ADDED, DELETED
              }

              public static class DiffEntry {
                  public final Type type;
                  public final int oldLineNumber;
                  public final int newLineNumber;
                  public final String oldText;
                  public final String newText;

                  public DiffEntry(Type type, int oldLineNumber, int newLineNumber, String oldText, String newText) {
                      this.type = type;
                      this.oldLineNumber = oldLineNumber;
                      this.newLineNumber = newLineNumber;
                      this.oldText = oldText;
                      this.newText = newText;
                  }
              }

              public static class DiffResult {
                  public final List<DiffEntry> entries;
                  public final int modifiedCount;
                  public final int addedCount;
                  public final int deletedCount;
                  public final boolean truncated;

                  public DiffResult(List<DiffEntry> entries, int modifiedCount, int addedCount,
                                    int deletedCount, boolean truncated) {
                      this.entries = entries;
                      this.modifiedCount = modifiedCount;
                      this.addedCount = addedCount;
                      this.deletedCount = deletedCount;
                      this.truncated = truncated;
                  }
              }

              private static final int MAX_DISPLAY_ENTRIES = 3000;
              private static final int LCS_LIMIT = 900;
              private static final int LOOKAHEAD_WINDOW = 40;

              public static DiffResult compareFiles(File oldFile, File newFile) throws IOException {
                  List<String> oldLines = readLinesBounded(oldFile, 100_000);
                  List<String> newLines = readLinesBounded(newFile, 100_000);

                  if (oldLines.size() <= LCS_LIMIT && newLines.size() <= LCS_LIMIT) {
                      return compareWithLcs(oldLines, newLines);
                  } else {
                      return compareWithWindow(oldLines, newLines);
                  }
              }

              private static DiffResult compareWithLcs(List<String> a, List<String> b) {
                  int n = a.size();
                  int m = b.size();
                  int[][] dp = new int[n + 1][m + 1];

                  for (int i = n - 1; i >= 0; i--) {
                      String ai = a.get(i);
                      for (int j = m - 1; j >= 0; j--) {
                          if (ai.equals(b.get(j))) {
                              dp[i][j] = 1 + dp[i + 1][j + 1];
                          } else {
                              dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
                          }
                      }
                  }

                  List<DiffEntry> raw = new ArrayList<>();
                  int i = 0, j = 0;
                  while (i < n || j < m) {
                      if (i < n && j < m && a.get(i).equals(b.get(j))) {
                          i++;
                          j++;
                      } else if (i < n && j < m && dp[i + 1][j] == dp[i][j + 1] && dp[i + 1][j + 1] == dp[i][j]) {
                          raw.add(new DiffEntry(Type.MODIFIED, i + 1, j + 1, a.get(i), b.get(j)));
                          i++;
                          j++;
                      } else if (j < m && (i == n || dp[i][j + 1] >= dp[i + 1][j])) {
                          raw.add(new DiffEntry(Type.ADDED, 0, j + 1, "", b.get(j)));
                          j++;
                      } else {
                          raw.add(new DiffEntry(Type.DELETED, i + 1, 0, a.get(i), ""));
                          i++;
                      }
                  }
                  return packageEntries(raw);
              }

              private static DiffResult compareWithWindow(List<String> a, List<String> b) {
                  List<DiffEntry> raw = new ArrayList<>();
                  int i = 0, j = 0;
                  int n = a.size(), m = b.size();

                  while (i < n && j < m) {
                      if (a.get(i).equals(b.get(j))) {
                          i++;
                          j++;
                          continue;
                      }

                      int matchInB = findWithinWindow(b, j + 1, a.get(i));
                      int matchInA = findWithinWindow(a, i + 1, b.get(j));

                      if (matchInB >= 0 && (matchInA < 0 || (matchInB - j) <= (matchInA - i))) {
                          while (j < matchInB) {
                              raw.add(new DiffEntry(Type.ADDED, 0, j + 1, "", b.get(j)));
                              j++;
                          }
                      } else if (matchInA >= 0) {
                          while (i < matchInA) {
                              raw.add(new DiffEntry(Type.DELETED, i + 1, 0, a.get(i), ""));
                              i++;
                          }
                      } else {
                          raw.add(new DiffEntry(Type.MODIFIED, i + 1, j + 1, a.get(i), b.get(j)));
                          i++;
                          j++;
                      }
                      if (raw.size() >= MAX_DISPLAY_ENTRIES) break;
                  }

                  while (i < n && raw.size() < MAX_DISPLAY_ENTRIES) {
                      raw.add(new DiffEntry(Type.DELETED, i + 1, 0, a.get(i), ""));
                      i++;
                  }
                  while (j < m && raw.size() < MAX_DISPLAY_ENTRIES) {
                      raw.add(new DiffEntry(Type.ADDED, 0, j + 1, "", b.get(j)));
                      j++;
                  }

                  return packageEntries(raw);
              }

              private static int findWithinWindow(List<String> list, int start, String target) {
                  int limit = Math.min(list.size(), start + LOOKAHEAD_WINDOW);
                  for (int k = start; k < limit; k++) {
                      if (list.get(k).equals(target)) return k;
                  }
                  return -1;
              }

              private static DiffResult packageEntries(List<DiffEntry> raw) {
                  List<DiffEntry> finalEntries = new ArrayList<>();
                  int mod = 0, add = 0, del = 0;
                  boolean truncated = false;

                  for (DiffEntry e : raw) {
                      if (e.type == Type.MODIFIED) mod++;
                      else if (e.type == Type.ADDED) add++;
                      else del++;

                      if (finalEntries.size() < MAX_DISPLAY_ENTRIES) {
                          finalEntries.add(e);
                      } else {
                          truncated = true;
                      }
                  }
                  return new DiffResult(finalEntries, mod, add, del, truncated);
              }

              private static List<String> readLinesBounded(File file, int maxLines) throws IOException {
                  List<String> lines = new ArrayList<>();
                  if (file == null || !file.exists()) return lines;
                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                      String line;
                      while ((line = br.readLine()) != null && lines.size() < maxLines) {
                          lines.add(line);
                      }
                  }
                  return lines;
              }
          }
