              public synchronized void saveRecoverySnapshot(String fileId, String projectId, String projectRelPath,
                                                            String fileName, String language,
                                                            boolean isLineMode, int pageIndex, int lineIndex,
                                                            String dirtyPageText) {
                  try {
                      boolean hasDirty = (dirtyPageText != null);
                      if (hasDirty) {
                          File tmpPage = new File(recoveryDir, DIRTY_PAGE_FILE + ".tmp");
                          try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmpPage), 65536)) {
                              out.write(dirtyPageText.getBytes(StandardCharsets.UTF_8));
                              out.flush();
                          }
                          LargeFileEngine.atomicReplace(tmpPage, dirtyPageFile);
                      } else if (dirtyPageFile.exists()) {
                          dirtyPageFile.delete();
                      }

                      JSONObject obj = new JSONObject();
                      obj.put("fileId", fileId != null ? fileId : "");
                      obj.put("projectId", projectId != null ? projectId : "");
                      obj.put("projectRelPath", projectRelPath != null ? projectRelPath : "");
                      obj.put("fileName", fileName != null ? fileName : "");
                      obj.put("language", language != null ? language : "Java");
                      obj.put("isLineMode", isLineMode);
                      obj.put("pageIndex", pageIndex);
                      obj.put("lineIndex", lineIndex);
                      obj.put("hasDirtyPageText", hasDirty);
                      obj.put("timestamp", System.currentTimeMillis());

                      File tmpState = new File(recoveryDir, STATE_FILE + ".tmp");
                      try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tmpState))) {
                          out.write(obj.toString().getBytes(StandardCharsets.UTF_8));
                          out.flush();
                      }
                      LargeFileEngine.atomicReplace(tmpState, stateFile);
                  } catch (Exception ignored) {
                  }
              }

              public synchronized boolean hasPendingRecovery() {
                  return stateFile.exists() && stateFile.length() > 0L;
              }

              public synchronized RecoveryState getPendingRecovery() {
                  if (!hasPendingRecovery()) return null;
                  try {
                      String jsonStr = readUtf8(stateFile);
                      JSONObject obj = new JSONObject(jsonStr);
                      RecoveryState s = new RecoveryState();
                      String fid = obj.optString("fileId", "");
                      String pid = obj.optString("projectId", "");
                      String prp = obj.optString("projectRelPath", "");
                      s.fileId = fid.isEmpty() ? null : fid;
                      s.projectId = pid.isEmpty() ? null : pid;
                      s.projectRelPath = prp.isEmpty() ? null : prp;
                      s.fileName = obj.optString("fileName", "");
                      s.language = obj.optString("language", "Java");
                      s.isLineMode = obj.optBoolean("isLineMode", false);
                      s.pageIndex = obj.optInt("pageIndex", 0);
                      s.lineIndex = obj.optInt("lineIndex", 0);
                      s.hasDirtyPageText = obj.optBoolean("hasDirtyPageText", false) && dirtyPageFile.exists();
                      s.timestamp = obj.optLong("timestamp", 0L);
                      return s;
                  } catch (Exception e) {
                      return null;
                  }
              }

