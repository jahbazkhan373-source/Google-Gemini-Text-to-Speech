          package com.codebook.editor.checker;

          import android.content.Context;

          import com.github.javaparser.JavaParser;
          import com.github.javaparser.ParseResult;
          import com.github.javaparser.ParserConfiguration;
          import com.github.javaparser.ast.CompilationUnit;
          import com.github.javaparser.ast.body.ClassOrInterfaceDeclaration;
          import com.github.javaparser.ast.body.ConstructorDeclaration;
          import com.github.javaparser.ast.body.EnumDeclaration;
          import com.github.javaparser.ast.body.MethodDeclaration;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class CodeOutlineExtractor {

              private static final long AST_MAX_BYTES = 2_000_000L;

              private static final Pattern JAVA_CLASS_FALLBACK = Pattern.compile(
                      "^\\s*(?:public|private|protected|abstract|final|static|\\s)*\\b(class|interface|enum|record)\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
              );
              private static final Pattern JAVA_METHOD_FALLBACK = Pattern.compile(
                      "^\\s*(?:public|private|protected|static|final|synchronized|abstract|native|\\s)+[A-Za-z0-9_<>\\[\\],.?\\s]+\\s+([A-Za-z_$][A-Za-z0-9_$]*)\\s*\\([^;]*$"
              );

              private static final Pattern LUA_FUNC_1 = Pattern.compile(
                      "^\\s*(?:local\\s+)?function\\s+([A-Za-z_][A-Za-z0-9_.:]*)\\s*\\("
              );
              private static final Pattern LUA_FUNC_2 = Pattern.compile(
                      "^\\s*(?:local\\s+)?([A-Za-z_][A-Za-z0-9_.]*)\\s*=\\s*function\\s*\\("
              );
              private static final Pattern LUA_MODULE_TABLE = Pattern.compile(
                      "^\\s*(?:local\\s+)?([A-Za-z_][A-Za-z0-9_]*)\\s*=\\s*\\{\\s*\\}"
              );

              private static final Pattern PY_FUNC = Pattern.compile("^\\s*(?:async\\s+)?def\\s+([A-Za-z_][A-Za-z0-9_]*)\\s*\\(");
              private static final Pattern PY_CLASS = Pattern.compile("^\\s*class\\s+([A-Za-z_][A-Za-z0-9_]*)");

              private static final Pattern GENERIC_FUNC = Pattern.compile(
                      "^\\s*(?:export\\s+)?(?:async\\s+)?(?:fun|function|func|def)\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
              );
              private static final Pattern GENERIC_CLASS = Pattern.compile(
                      "^\\s*(?:export\\s+)?(?:public|private|open|data|abstract|\\s)*\\b(?:class|interface|struct|enum)\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
              );

              public static List<OutlineItem> extract(Context context, File file, String language, OutlineItem.Kind kind) throws IOException {
                  List<OutlineItem> items = new ArrayList<>();
                  if (file == null || !file.exists() || file.length() == 0L) return items;

                  String lang = (language != null) ? language.trim().toLowerCase(Locale.ROOT) : "other";

                  if ("java".equals(lang) && file.length() <= AST_MAX_BYTES) {
                      List<OutlineItem> astItems = tryExtractJavaAst(file, kind);
                      if (!astItems.isEmpty()) {
                          Collections.sort(astItems, (a, b) -> Integer.compare(a.lineNumber, b.lineNumber));
                          return astItems;
                      }
                  }

                  LanguageCheckerManager manager = new LanguageCheckerManager(context);
                  LanguageRuleSpec spec = manager.findActiveCheckerForLanguage(language);
                  Pattern customPattern = null;
                  if (spec != null && !spec.builtIn) {
                      String patStr = (kind == OutlineItem.Kind.FUNCTION) ? spec.functionPattern : spec.classPattern;
                      if (patStr != null && !patStr.isEmpty()) {
                          try {
                              customPattern = Pattern.compile(patStr);
                          } catch (Exception ignored) {
                          }
                      }
                  }

                  try (BufferedReader br = new BufferedReader(
                          new InputStreamReader(new FileInputStream(file), StandardCharsets.UTF_8), 65536)) {
                      String line;
                      int lineNum = 0;
                      while ((line = br.readLine()) != null && items.size() < 2000) {
                          lineNum++;
                          if (customPattern != null) {
                              Matcher m = customPattern.matcher(line);
                              if (m.find()) {
                                  String name = (m.groupCount() >= 1 && m.group(1) != null) ? m.group(1) : m.group(0).trim();
                                  items.add(new OutlineItem(kind, name, language, lineNum));
                              }
                              continue;
                          }

                          if ("lua".equals(lang)) {
                              if (kind == OutlineItem.Kind.FUNCTION) {
                                  Matcher m1 = LUA_FUNC_1.matcher(line);
                                  if (m1.find()) {
                                      items.add(new OutlineItem(kind, m1.group(1), "Lua function", lineNum));
                                  } else {
                                      Matcher m2 = LUA_FUNC_2.matcher(line);
                                      if (m2.find()) {
                                          items.add(new OutlineItem(kind, m2.group(1), "Lua function", lineNum));
                                      }
                                  }
                              } else {
                                  Matcher mt = LUA_MODULE_TABLE.matcher(line);
                                  if (mt.find()) {
                                      items.add(new OutlineItem(kind, mt.group(1), "Lua module/table", lineNum));
                                  }
                              }
                          } else if ("java".equals(lang)) {
                              if (kind == OutlineItem.Kind.CLASS) {
                                  Matcher mc = JAVA_CLASS_FALLBACK.matcher(line);
                                  if (mc.find()) {
                                      items.add(new OutlineItem(kind, mc.group(2), mc.group(1), lineNum));
                                  }
                              } else {
                                  Matcher mm = JAVA_METHOD_FALLBACK.matcher(line);
                                  if (mm.find()) {
                                      String nm = mm.group(1);
                                      if (!isControlKeyword(nm)) {
                                          items.add(new OutlineItem(kind, nm + "()", "Java method", lineNum));
                                      }
                                  }
                              }
                          } else if ("python".equals(lang)) {
                              Matcher m = (kind == OutlineItem.Kind.FUNCTION ? PY_FUNC : PY_CLASS).matcher(line);
                              if (m.find()) {
                                  items.add(new OutlineItem(kind, m.group(1), "Python", lineNum));
                              }
                          } else {
                              Matcher m = (kind == OutlineItem.Kind.FUNCTION ? GENERIC_FUNC : GENERIC_CLASS).matcher(line);
                              if (m.find()) {
                                  items.add(new OutlineItem(kind, m.group(1), language, lineNum));
                              }
                          }
                      }
                  }

                  return items;
              }

              private static List<OutlineItem> tryExtractJavaAst(File file, OutlineItem.Kind kind) {
                  List<OutlineItem> items = new ArrayList<>();
                  try {
                      byte[] bytes = new byte[(int) file.length()];
                      try (FileInputStream in = new FileInputStream(file)) {
                          int off = 0, r;
                          while (off < bytes.length && (r = in.read(bytes, off, bytes.length - off)) != -1) off += r;
                      }
                      String source = new String(bytes, StandardCharsets.UTF_8);
                      if (source.startsWith("\uFEFF")) source = source.substring(1);

                      ParserConfiguration config = new ParserConfiguration();
                      config.setLanguageLevel(ParserConfiguration.LanguageLevel.JAVA_17);
                      JavaParser parser = new JavaParser(config);
                      ParseResult<CompilationUnit> res = parser.parse(source);
                      if (!res.getResult().isPresent()) return items;

                      CompilationUnit cu = res.getResult().get();
                      if (kind == OutlineItem.Kind.CLASS) {
                          for (ClassOrInterfaceDeclaration c : cu.findAll(ClassOrInterfaceDeclaration.class)) {
                              int ln = c.getBegin().map(p -> p.line).orElse(1);
                              items.add(new OutlineItem(kind, c.getNameAsString(), c.isInterface() ? "interface" : "class", ln));
                          }
                          for (EnumDeclaration e : cu.findAll(EnumDeclaration.class)) {
                              int ln = e.getBegin().map(p -> p.line).orElse(1);
                              items.add(new OutlineItem(kind, e.getNameAsString(), "enum", ln));
                          }
                      } else {
                          for (ConstructorDeclaration ctor : cu.findAll(ConstructorDeclaration.class)) {
                              int ln = ctor.getBegin().map(p -> p.line).orElse(1);
                              items.add(new OutlineItem(kind, ctor.getNameAsString() + "()", "constructor", ln));
                          }
                          for (MethodDeclaration m : cu.findAll(MethodDeclaration.class)) {
                              int ln = m.getBegin().map(p -> p.line).orElse(1);
                              items.add(new OutlineItem(kind, m.getNameAsString() + "()", m.getTypeAsString(), ln));
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return items;
              }

              private static boolean isControlKeyword(String word) {
                  return "if".equals(word) || "for".equals(word) || "while".equals(word)
                          || "switch".equals(word) || "catch".equals(word) || "synchronized".equals(word);
              }
          }
