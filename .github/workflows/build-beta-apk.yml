          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/rootContainer"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingBottom="10dp"
                      android:text="@string/btn_auto_update"
                      android:textColor="@color/text_primary"
                      android:textSize="21sp"
                      android:textStyle="bold" />

                  <CheckBox
                      android:id="@+id/cbAutoUpdateEnable"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:text="Include Built-In Auto-Update Module in APK" />

                  <CheckBox
                      android:id="@+id/cbAutoUpdateForce"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:text="Force Update (User must update to continue)" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="8dp"
                      android:text="Update Manifest JSON URL (Cloud or Custom Server):"
                      android:textColor="@color/text_primary" />

                  <EditText
                      android:id="@+id/etAutoUpdateUrl"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:hint="https://your-server.com/myapp/update.json"
                      android:inputType="textUri"
                      android:textDirection="ltr" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Latest APK Download URL:"
                      android:textColor="@color/text_primary" />

                  <EditText
                      android:id="@+id/etAutoUpdateApkUrl"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:layout_marginBottom="10dp"
                      android:hint="https://your-server.com/myapp/app-v2.apk"
                      android:inputType="textUri"
                      android:textDirection="ltr" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="What's New / Release Notes:"
                      android:textColor="@color/text_primary" />

                  <EditText
                      android:id="@+id/etAutoUpdateNotes"
                      android:layout_width="match_parent"
                      android:layout_height="100dp"
                      android:layout_marginBottom="12dp"
                      android:background="@color/card_bg"
                      android:gravity="top|start"
                      android:hint="Describe new features and fixes..."
                      android:inputType="textMultiLine"
                      android:padding="8dp" />

                  <Button
                      android:id="@+id/btnAutoUpdateSave"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:layout_marginBottom="8dp"
                      android:text="@string/btn_save" />

                  <Button
                      android:id="@+id/btnAutoUpdatePublish"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:layout_marginBottom="10dp"
                      android:text="@string/btn_publish_update" />

                  <TextView
                      android:id="@+id/tvAutoUpdatePreviewJson"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@color/card_bg"
                      android:padding="10dp"
                      android:textColor="@color/text_secondary"
                      android:textDirection="ltr"
                      android:textSize="12sp"
                      android:typeface="monospace" />

              </LinearLayout>
          </ScrollView>
