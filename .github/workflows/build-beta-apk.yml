                          : (ks.aliases().hasMoreElements() ? ks.aliases().nextElement() : "");
                  if (resolvedAlias.isEmpty() || !ks.containsAlias(resolvedAlias)) {
                      tmp.delete();
                      throw new IOException("Key alias not found in keystore.");
