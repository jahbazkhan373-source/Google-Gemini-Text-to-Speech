name: Build Code Book Studio Final APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Complete Code Book Studio Project (Parts 1 to 5)
        run: |
          mkdir -p "app"
          mkdir -p "app/src/main"
          mkdir -p "app/src/main/assets"
          mkdir -p "app/src/main/java/com/codebook/editor"
          mkdir -p "app/src/main/java/com/codebook/editor/builder"
          mkdir -p "app/src/main/java/com/codebook/editor/checker"
          mkdir -p "app/src/main/java/com/codebook/editor/engine"
          mkdir -p "app/src/main/java/com/codebook/editor/model"
          mkdir -p "app/src/main/java/com/codebook/editor/storage"
          mkdir -p "app/src/main/java/com/codebook/editor/ui"
          mkdir -p "app/src/main/java/com/codebook/editor/util"
          mkdir -p "app/src/main/res/drawable"
          mkdir -p "app/src/main/res/layout"
          mkdir -p "app/src/main/res/xml"
          mkdir -p "app/src/main/res/values"
          mkdir -p "app/src/main/res/values-night"
          mkdir -p "app/src/main/res/values-ur"
          mkdir -p "app/src/main/res/values-hi"
          mkdir -p "app/src/main/res/values-bn"
          mkdir -p "app/src/main/res/values-ne"
          mkdir -p "app/src/main/res/values-ar"
          mkdir -p "app/src/main/res/values-zh"
          mkdir -p "app/src/main/res/values-fa"
          mkdir -p "app/src/main/res/values-tr"
          mkdir -p "app/src/main/res/values-in"
          mkdir -p "app/src/main/res/values-es"
          mkdir -p "app/src/main/res/values-fr"
          mkdir -p "app/src/main/res/values-ru"
          cat > "app/build.gradle" <<'CODEBOOK_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.codebook.editor'
              compileSdk 36

              defaultConfig {
                  applicationId "com.codebook.editor"
                  minSdk 24
                  targetSdk 36
                  versionCode 10
                  versionName "2.0.0"
                  multiDexEnabled true
              }

              signingConfigs {
                  release {
                      def ksPath = System.getenv("KEYSTORE_PATH")
                      if (ksPath != null && file(ksPath).exists()) {
                          storeFile file(ksPath)
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      if (signingConfigs.release.storeFile != null) {
                          signingConfig signingConfigs.release
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/LICENSE*',
                          'META-INF/NOTICE*',
                          'META-INF/DEPENDENCIES',
                          'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                          'META-INF/*.SF',
                          'META-INF/*.DSA',
                          'META-INF/*.RSA'
                      ]
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'

              // Offline Java & Lua Parsers
              implementation 'com.github.javaparser:javaparser-core:3.25.10'
              implementation 'org.luaj:luaj-jse:3.0.1'

              // Official APK Signer (v1, v2, v3, v4) & Offline RSA Keystore Generator
              implementation 'com.android.tools.build:apksig:8.9.1'
              implementation 'org.bouncycastle:bcpkix-jdk15to18:1.78.1'
              implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'

              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          CODEBOOK_EOF
          cat > "app/proguard-rules.pro" <<'CODEBOOK_EOF'
          # Code Book Studio ProGuard Rules
          -keep class com.codebook.editor.model.** { *; }
          -keep class com.codebook.editor.checker.** { *; }
          -keep class com.codebook.editor.builder.** { *; }
          -keep class com.github.javaparser.** { *; }
          -dontwarn com.github.javaparser.**
          -keep class org.luaj.** { *; }
          -dontwarn org.luaj.**
          -keep class com.android.apksig.** { *; }
          -dontwarn com.android.apksig.**
          -keep class org.bouncycastle.** { *; }
          -dontwarn org.bouncycastle.**
          CODEBOOK_EOF
          cat > "app/src/main/AndroidManifest.xml" <<'CODEBOOK_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:name=".CodeBookApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CodeBook">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ui.EditorActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <activity android:name=".ui.ProjectsActivity" android:exported="false" />
                  <activity android:name=".ui.ProjectPropertiesActivity" android:exported="false" />
                  <activity android:name=".ui.PermissionsPickerActivity" android:exported="false" />
                  <activity android:name=".ui.MediaAssetsActivity" android:exported="false" />
                  <activity android:name=".ui.KeystoreVaultActivity" android:exported="false" />
                  <activity android:name=".ui.AutoUpdateSettingsActivity" android:exported="false" />
                  <activity android:name=".ui.BuildCenterActivity" android:exported="false" />
                  <activity android:name=".ui.LivePreviewActivity" android:exported="false" />
                  <activity android:name=".ui.LibraryActivity" android:exported="false" />
                  <activity android:name=".ui.BackupActivity" android:exported="false" />
                  <activity android:name=".ui.DiffActivity" android:exported="false" />
                  <activity android:name=".ui.LanguageCheckersActivity" android:exported="false" />
                  <activity android:name=".ui.PerformanceTestActivity" android:exported="false" />
                  <activity android:name=".ui.SettingsActivity" android:exported="false" />

              </application>

          </manifest>
          CODEBOOK_EOF
