              public synchronized List<CodeFileMeta> getAllFiles() {
                  List<CodeFileMeta> list = new ArrayList<>();
                  if (!indexFile.exists()) return list;
                  try {
                      String jsonStr = readSmallFile(indexFile);
                      if (jsonStr.trim().isEmpty()) return list;
                      JSONArray array = new JSONArray(jsonStr);
                      for (int i = 0; i < array.length(); i++) {
                          list.add(CodeFileMeta.fromJson(array.getJSONObject(i)));
                      }
                      Collections.sort(list, (a, b) -> Long.compare(b.updatedAt, a.updatedAt));
                  } catch (Exception ignored) {
                  }
                  return list;
              }

              public synchronized CodeFileMeta getById(String fileId) {
                  if (fileId == null) return null;
                  for (CodeFileMeta meta : getAllFiles()) {
                      if (fileId.equals(meta.id)) return meta;
                  }
                  return null;
              }

              public synchronized boolean nameExists(String candidateName, String ignoreId) {
                  if (candidateName == null) return false;
                  String clean = candidateName.trim();
                  for (CodeFileMeta meta : getAllFiles()) {
                      if (ignoreId != null && ignoreId.equals(meta.id)) continue;
                      if (meta.name != null && meta.name.trim().equalsIgnoreCase(clean)) return true;
                  }
                  return false;
              }

              public synchronized CodeFileMeta createNewSavedFile(String name, String language, File sourceContentFile,
                                                                  long charCount, int lineCount, long byteSize) throws IOException {
                  List<CodeFileMeta> all = getAllFiles();
                  String id = UUID.randomUUID().toString();
                  long now = System.currentTimeMillis();
                  CodeFileMeta meta = new CodeFileMeta(id, name.trim(), language, now);
                  meta.charCount = charCount;
                  meta.lineCount = lineCount;
                  meta.byteSize = byteSize;

                  File target = getCodeFile(id);
                  copyFileAtomic(sourceContentFile, target);

                  all.add(meta);
                  saveIndex(all);
                  workspace.mirrorTextFile(meta.name, target, buildSafeTxtFileName(meta.name));
                  return meta;
              }

              public synchronized void updateSavedFileStats(String fileId, long charCount, int lineCount, long byteSize) throws IOException {
                  List<CodeFileMeta> all = getAllFiles();
                  long now = System.currentTimeMillis();
                  CodeFileMeta updatedMeta = null;
                  for (CodeFileMeta meta : all) {
                      if (fileId.equals(meta.id)) {
                          meta.charCount = charCount;
                          meta.lineCount = lineCount;
                          meta.byteSize = byteSize;
                          meta.updatedAt = now;
                          meta.lastSavedAt = now;
                          updatedMeta = meta;
                          break;
                      }
                  }
                  saveIndex(all);
                  if (updatedMeta != null) {
                      File f = getCodeFile(fileId);
                      if (f.exists()) {
                          workspace.mirrorTextFile(updatedMeta.name, f, buildSafeTxtFileName(updatedMeta.name));
                      }
                  }
              }

              public synchronized void updateMarkedLines(String fileId, List<Integer> markedLines) throws IOException {
                  if (fileId == null) return;
                  List<CodeFileMeta> all = getAllFiles();
                  for (CodeFileMeta meta : all) {
                      if (fileId.equals(meta.id)) {
                          meta.markedLines = new ArrayList<>(markedLines);
                          Collections.sort(meta.markedLines);
                          break;
                      }
                  }
                  saveIndex(all);
              }

              public synchronized void renameFile(String fileId, String newName) throws IOException {
                  List<CodeFileMeta> all = getAllFiles();
                  for (CodeFileMeta meta : all) {
                      if (fileId.equals(meta.id)) {
                          meta.name = newName.trim();
                          meta.updatedAt = System.currentTimeMillis();
                          break;
                      }
                  }
                  saveIndex(all);
              }

              public synchronized CodeFileMeta duplicateFile(String sourceId, String newName) throws IOException {
                  CodeFileMeta original = getById(sourceId);
                  if (original == null) throw new IOException("Original file not found.");
                  File srcFile = getCodeFile(sourceId);
                  return createNewSavedFile(
                          newName.trim(), original.language, srcFile,
                          original.charCount, original.lineCount, srcFile.length()
                  );
              }

              public synchronized void deleteFile(String fileId) throws IOException {
                  deleteFile(fileId, false);
              }

              public synchronized void deleteFile(String fileId, boolean deleteBackups) throws IOException {
                  List<CodeFileMeta> all = getAllFiles();
                  List<CodeFileMeta> updated = new ArrayList<>();
                  for (CodeFileMeta meta : all) {
                      if (!fileId.equals(meta.id)) updated.add(meta);
                  }
                  File codeFile = getCodeFile(fileId);
                  if (codeFile.exists()) codeFile.delete();
                  if (deleteBackups) {
                      new BackupManager(context).deleteAllBackupsForFile(fileId);
                  }
                  saveIndex(updated);
              }

              public synchronized CodeFileMeta importRestoredMetaAndFile(CodeFileMeta incoming, File extractedCode) throws IOException {
                  List<CodeFileMeta> all = getAllFiles();
                  String finalId = (incoming.id != null && !incoming.id.isEmpty() && getById(incoming.id) == null)
                          ? incoming.id
                          : UUID.randomUUID().toString();

                  String baseName = (incoming.name != null && !incoming.name.trim().isEmpty())
                          ? incoming.name.trim() : "Restored File";
                  String finalName = baseName;
                  int suffix = 1;
                  while (nameExists(finalName, null)) {
                      finalName = baseName + " (Restored " + suffix + ")";
                      suffix++;
                  }

                  CodeFileMeta saved = new CodeFileMeta(finalId, finalName, incoming.language,
                          incoming.createdAt > 0 ? incoming.createdAt : System.currentTimeMillis());
                  saved.updatedAt = System.currentTimeMillis();
                  saved.lastSavedAt = saved.updatedAt;
                  saved.charCount = incoming.charCount;
                  saved.lineCount = incoming.lineCount;
                  saved.byteSize = extractedCode.length();
                  saved.markedLines = incoming.markedLines != null ? new ArrayList<>(incoming.markedLines) : new ArrayList<>();

                  copyFileAtomic(extractedCode, getCodeFile(finalId));
                  all.add(saved);
                  saveIndex(all);
                  return saved;
              }

              public void importUriToFile(Uri uri, File targetFile) throws IOException {
                  File tempFile = new File(targetFile.getParentFile(), targetFile.getName() + ".import.tmp");
                  try (InputStream in = context.getContentResolver().openInputStream(uri);
                       BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(tempFile), 65536)) {
                      if (in == null) throw new IOException("Unable to open selected file.");
                      byte[] buf = new byte[65536];
                      int len;
                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                      out.flush();
                  }
                  LargeFileEngine.atomicReplace(tempFile, targetFile);
              }

              /**
               * Exports always as UTF-8 TXT into Code Book/Text Files/<Name>/ (and Downloads if SAF not linked).
               */
              public String exportToDownloadsTxt(CodeFileMeta meta) throws IOException {
                  File srcFile = getCodeFile(meta.id);
                  if (!srcFile.exists()) throw new IOException("Saved code file not found.");
                  String fileName = buildSafeTxtFileName(meta.name);

                  if (workspace.hasExternalSafRoot()) {
                      return workspace.mirrorTextFile(meta.name, srcFile, fileName);
                  }

                  workspace.mirrorTextFile(meta.name, srcFile, fileName);
