              private TextView tvLineModeSummary;

              private EditText etCodeEditor;
              private Button btnAddFirstLine;
              private RecyclerView rvLineMode;
              private LinearLayoutManager lineLayoutManager;
              private LineModeAdapter lineAdapter;

              private LibraryRepository repository;
              private BackupManager backupManager;
              private CrashRecoveryManager recoveryManager;
              private AppSettings settings;
              private LargeFileEngine engine;
              private UndoRedoManager undoManager;

              private String currentFileId = null;
              private String currentFileName = null;
              private String currentLanguage = "Java";
              private int currentPageIndex = 0;
              private int currentFocusedLineIndex = 0;
              private boolean isLineMode = false;
              private boolean isExternalBenchmarkFile = false;

              private final Set<Integer> markedLineNumbers = new HashSet<>();
              private final List<CodeIssue> activeIssues = new ArrayList<>();
              private int currentIssueIndex = -1;

              private boolean isPageDirty = false;
              private boolean hasChangesSinceLastBackup = false;
              private boolean suppressTextWatcher = false;
              private long lastAutoBackupTime = 0L;

              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private final Runnable autoSaveRunnable = new Runnable() {
                  @Override
                  public void run() {
                      performAutoSaveTick();
                      scheduleNextAutoSave();
                  }
              };

              private final Runnable recoverySnapshotRunnable = () -> {
                  if (engine == null || isExternalBenchmarkFile) return;
                  if (!isLineMode && isPageDirty) {
                      final String dirtyText = etCodeEditor.getText().toString();
                      final String fid = currentFileId;
                      final String fname = currentFileName;
                      final String lang = currentLanguage;
                      final int pIdx = currentPageIndex;
                      final int lIdx = currentFocusedLineIndex;
                      executor.execute(() -> recoveryManager.saveRecoverySnapshot(
                              fid, fname, lang, false, pIdx, lIdx, dirtyText
                      ));
                  }
              };

              private final ActivityResultLauncher<String[]> importInEditorLauncher =
                      registerForActivityResult(new ActivityResultContracts.OpenDocument(), uri -> {
                          if (uri != null) {
                              confirmImportIntoOpenEditor(uri);
                          }
                      });

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_editor);

                  rootContainer = findViewById(R.id.rootContainer);
                  AccessibilityHelper.applySafeInsets(rootContainer);

                  tvEditorHeader = findViewById(R.id.tvEditorHeader);
                  btnAllMode = findViewById(R.id.btnAllMode);
                  btnLineMode = findViewById(R.id.btnLineMode);
                  btnUndo = findViewById(R.id.btnUndo);
                  btnRedo = findViewById(R.id.btnRedo);

                  layoutErrorNavBar = findViewById(R.id.layoutErrorNavBar);
                  tvErrorNavStatus = findViewById(R.id.tvErrorNavStatus);
                  btnPrevError = findViewById(R.id.btnPrevError);
                  btnNextError = findViewById(R.id.btnNextError);
                  btnPossibleErrors = findViewById(R.id.btnPossibleErrors);

                  layoutPagingBar = findViewById(R.id.layoutPagingBar);
                  btnPrevPage = findViewById(R.id.btnPrevPage);
                  btnNextPage = findViewById(R.id.btnNextPage);
                  tvPageInfo = findViewById(R.id.tvPageInfo);

                  layoutLineModeBar = findViewById(R.id.layoutLineModeBar);
                  tvLineModeSummary = findViewById(R.id.tvLineModeSummary);

                  etCodeEditor = findViewById(R.id.etCodeEditor);
                  btnAddFirstLine = findViewById(R.id.btnAddFirstLine);
                  rvLineMode = findViewById(R.id.rvLineMode);

                  repository = new LibraryRepository(this);
                  backupManager = new BackupManager(this);
                  recoveryManager = new CrashRecoveryManager(this);
                  settings = new AppSettings(this);
                  undoManager = new UndoRedoManager(this);

                  currentLanguage = settings.getDefaultLanguage();
                  etCodeEditor.setTextSize(settings.getFontSize());
                  etCodeEditor.addTextChangedListener(new AutoBracketWatcher(etCodeEditor, settings));
                  isLineMode = settings.isDefaultLineMode();

                  lineLayoutManager = new LinearLayoutManager(this);
                  rvLineMode.setLayoutManager(lineLayoutManager);
                  lineAdapter = new LineModeAdapter(this);
                  lineAdapter.setDisplayPreferences(settings.getFontSize(), settings.isReadIndentationEnabled());
