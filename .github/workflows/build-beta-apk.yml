                          .setTitle("Restore Version")
                          .setMessage("Your current code will be backed up automatically before restoring. Continue?")
                          .setPositiveButton(R.string.yes, (d, w) -> executeRestore(backup))
                          .setNegativeButton(R.string.no, null)
                          .show();
