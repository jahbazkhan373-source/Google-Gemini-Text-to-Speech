              private static final Pattern PACKAGE_PATTERN = Pattern.compile("^\\s*package\\s+([a-zA-Z0-9_.]+)\\s*;", Pattern.MULTILINE);

              public static String sanitizeResourceFileName(String rawName, String fallbackPrefix) {
                  if (rawName == null || rawName.trim().isEmpty()) {
                      return fallbackPrefix + "_" + (System.currentTimeMillis() % 100000);
                  }
                  String name = rawName.trim();
                  String ext = "";
                  int dot = name.lastIndexOf('.');
                  if (dot > 0) {
                      ext = name.substring(dot).toLowerCase(Locale.US).replaceAll("[^a-z0-9.]", "");
                      name = name.substring(0, dot);
                  }
                  String base = name.toLowerCase(Locale.US)
                          .replaceAll("[^a-z0-9_]+", "_")
                          .replaceAll("^_+|_+$", "");
                  if (base.isEmpty() || Character.isDigit(base.charAt(0))) {
                      base = fallbackPrefix + "_" + (base.isEmpty() ? String.valueOf(System.currentTimeMillis() % 100000) : base);
                  }
                  return base + ext;
