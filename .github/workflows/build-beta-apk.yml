              public static SearchResult search(File file, String query, boolean matchCase,
                                                boolean wholeWord, int maxResults) throws IOException {
                  List<SearchMatch> results = new ArrayList<>();
                  if (file == null || !file.exists() || query == null || query.isEmpty()) {
                      return new SearchResult(results, false);
                  }

                  String needle = matchCase ? query : query.toLowerCase(Locale.ROOT);
                  int needleLen = needle.length();
                  boolean truncated = false;

                  try (BufferedInputStream in = new BufferedInputStream(new FileInputStream(file), 65536)) {
                      ByteArrayOutputStream lineBuf = new ByteArrayOutputStream(256);
