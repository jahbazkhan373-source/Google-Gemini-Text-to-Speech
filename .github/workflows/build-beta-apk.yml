              private void switchActiveProjectFile(String newRelPath) {
                  if (currentProject == null || newRelPath == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          syncProjectFileToExternalIfProject();

                          currentProjectRelPath = newRelPath;
                          File nextFile = projectRepository.getProjectFile(currentProject, newRelPath);
                          currentFileName = currentProject.appName + " / " + newRelPath;
                          String detected = LibraryRepository.detectLanguageFromFileName(newRelPath);
                          currentLanguage = (detected != null) ? detected : currentProject.language;

                          engine = new LargeFileEngine(nextFile, settings.getPageCharLimit());
                          engine.rebuildIndex();
                          currentPageIndex = 0;
                          currentFocusedLineIndex = 0;
                          String pageText = engine.readPage(0);

                          runOnUiThread(() -> {
                              lineAdapter.setEngine(engine);
                              displayPageContent(pageText);
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "Switched to " + newRelPath);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Switch failed: " + e.getMessage()));
                      }
                  });
              }

