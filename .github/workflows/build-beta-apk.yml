              private static class DiffAdapter extends RecyclerView.Adapter<DiffAdapter.VH> {
                  private final List<DiffEngine.DiffEntry> items = new ArrayList<>();

                  void setItems(List<DiffEngine.DiffEntry> list) {
                      items.clear();
                      items.addAll(list);
                      notifyDataSetChanged();
                  }

