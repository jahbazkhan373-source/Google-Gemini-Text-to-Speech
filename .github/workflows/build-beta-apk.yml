              private void setupTextWatcher() {
                  etCodeEditor.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {}

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                          if (!suppressTextWatcher) {
                              isPageDirty = true;
                              hasChangesSinceLastBackup = true;
                              mainHandler.removeCallbacks(recoverySnapshotRunnable);
                              mainHandler.postDelayed(recoverySnapshotRunnable, 3000L);
                          }
                      }

                      @Override
                      public void afterTextChanged(Editable s) {}
                  });
              }

              private void initializeFileSession() {
                  currentFileId = getIntent().getStringExtra(EXTRA_FILE_ID);
                  boolean startEmpty = getIntent().getBooleanExtra(EXTRA_START_EMPTY, false);
                  String importedLang = getIntent().getStringExtra(EXTRA_IMPORTED_LANGUAGE);
                  String importedName = getIntent().getStringExtra(EXTRA_IMPORTED_NAME);
                  String externalTestPath = getIntent().getStringExtra(EXTRA_EXTERNAL_TEST_FILE);
                  boolean recoverSession = getIntent().getBooleanExtra(EXTRA_RECOVER_SESSION, false);

                  if (importedLang != null && !importedLang.isEmpty()) currentLanguage = importedLang;
                  if (importedName != null && !importedName.isEmpty()) currentFileName = importedName;

                  executor.execute(() -> {
                      try {
                          File backingFile;
                          markedLineNumbers.clear();
                          isExternalBenchmarkFile = false;

                          if (externalTestPath != null && !externalTestPath.isEmpty()) {
                              backingFile = new File(externalTestPath);
                              isExternalBenchmarkFile = true;
                          } else if (currentFileId != null) {
                              CodeFileMeta meta = repository.getById(currentFileId);
                              if (meta != null) {
                                  currentFileName = meta.name;
                                  currentLanguage = meta.language;
                                  if (meta.markedLines != null) {
                                      markedLineNumbers.addAll(meta.markedLines);
                                  }
                              }
                              backingFile = repository.getCodeFile(currentFileId);
                          } else {
                              backingFile = repository.getDraftFile();
                              if (startEmpty && backingFile.exists()) {
                                  backingFile.delete();
                              }
                          }

                          engine = new LargeFileEngine(backingFile, settings.getPageCharLimit());
                          engine.rebuildIndex();
                          currentPageIndex = 0;
                          currentFocusedLineIndex = 0;

                          boolean restoredFromCrash = false;
                          if (recoverSession && recoveryManager.hasPendingRecovery()) {
                              CrashRecoveryManager.RecoveryState st = recoveryManager.getPendingRecovery();
                              if (st != null) {
                                  if (st.language != null && !st.language.isEmpty()) currentLanguage = st.language;
                                  if (st.fileName != null && !st.fileName.isEmpty()) currentFileName = st.fileName;
                                  isLineMode = st.isLineMode;
                                  currentPageIndex = Math.max(0, Math.min(st.pageIndex, engine.getPageCount() - 1));
                                  currentFocusedLineIndex = Math.max(0, Math.min(st.lineIndex, Math.max(0, engine.getLineCount() - 1)));
                                  if (st.hasDirtyPageText) {
                                      String recoveredText = recoveryManager.readRecoveredPageText();
                                      if (recoveredText != null) {
                                          engine.writePage(currentPageIndex, recoveredText);
                                          restoredFromCrash = true;
                                      }
                                  }
                              }
                              recoveryManager.clearRecovery();
                          }

                          lastAutoBackupTime = System.currentTimeMillis();
                          String pageContent = engine.readPage(currentPageIndex);
                          final boolean wasRecovered = restoredFromCrash;

                          runOnUiThread(() -> {
                              lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                              lineAdapter.setEngine(engine);
                              displayPageContent(pageContent);
                              applyModeVisibility();
                              updateHeaderAndBarsUI();
                              scheduleNextAutoSave();
                              String openMsg = wasRecovered
                                      ? "غیر محفوظ کام کامیابی سے بحال ہو گیا۔"
                                      : ((currentFileName != null ? currentFileName : "نئی فائل")
                                          + (isLineMode ? " لائن موڈ میں کھل گئی۔" : " آل موڈ میں کھل گئی۔"));
                              AccessibilityHelper.announce(this, rootContainer, openMsg);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "فائل کھولنے میں ناکامی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void runCodeErrorCheck() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final int level = settings.getErrorCheckLevel();

                  AccessibilityHelper.announce(this, rootContainer, currentLanguage + " کوڈ کی جانچ جاری ہے...");
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;

                          CodeAnalyzerEngine.AnalysisReport report = CodeAnalyzerEngine.analyze(
                                  this, engine.getBackingFile(), currentLanguage, level
                          );

                          runOnUiThread(() -> {
                              activeIssues.clear();
                              activeIssues.addAll(report.issues);

                              if (activeIssues.isEmpty()) {
                                  currentIssueIndex = -1;
                                  layoutErrorNavBar.setVisibility(View.GONE);
                                  String okMsg = "کوئی واضح غلطی نہیں ملی۔"
                                          + (!report.notice.isEmpty() ? "\n" + report.notice : "");
                                  AccessibilityHelper.announce(this, rootContainer, okMsg);
                                  new AlertDialog.Builder(this)
                                          .setTitle("جانچ مکمل")
                                          .setMessage(okMsg)
                                          .setPositiveButton(R.string.ok, null)
                                          .show();
                                  return;
                              }

                              currentIssueIndex = 0;
                              layoutErrorNavBar.setVisibility(View.VISIBLE);
                              btnPossibleErrors.setVisibility(report.possibleCount > 0 ? View.VISIBLE : View.GONE);
                              updateErrorNavBarUI();

                              String summary = "کل " + activeIssues.size() + " مسائل ملے (واضح غلطیاں: "
                                      + report.confirmedCount + "، ممکنہ غلطیاں: " + report.possibleCount + ")۔";
                              if (!report.notice.isEmpty()) summary += " " + report.notice;
                              AccessibilityHelper.announce(this, rootContainer, summary);
                              showIssueDetailAndFixDialog(activeIssues.get(0), 0);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "جانچ کے دوران خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void updateErrorNavBarUI() {
                  if (activeIssues.isEmpty() || currentIssueIndex < 0) {
                      layoutErrorNavBar.setVisibility(View.GONE);
                      return;
                  }
                  CodeIssue cur = activeIssues.get(currentIssueIndex);
                  String tag = cur.possibleError ? "ممکنہ غلطی" : "غلطی";
                  tvErrorNavStatus.setText(
                          tag + " " + (currentIssueIndex + 1) + " از " + activeIssues.size()
                                  + " — لائن " + cur.lineNumber + ": " + cur.name
                  );
                  btnPrevError.setEnabled(activeIssues.size() > 1);
                  btnNextError.setEnabled(activeIssues.size() > 1);
              }

              private void navigateError(int delta) {
                  if (activeIssues.isEmpty()) return;
                  currentIssueIndex = (currentIssueIndex + delta + activeIssues.size()) % activeIssues.size();
                  updateErrorNavBarUI();
                  CodeIssue issue = activeIssues.get(currentIssueIndex);
                  jumpToLineWithCustomAnnouncement(
                          issue.lineNumber - 1,
                          (issue.possibleError ? "ممکنہ غلطی " : "غلطی ")
                                  + (currentIssueIndex + 1) + " از " + activeIssues.size()
                                  + "، لائن " + issue.lineNumber + ": " + issue.name + "۔ " + issue.reason
                  );
              }

              private void showFilteredIssuesDialog(boolean onlyPossible) {
                  List<Integer> matchingIndices = new ArrayList<>();
                  List<String> labels = new ArrayList<>();

                  for (int i = 0; i < activeIssues.size(); i++) {
                      CodeIssue issue = activeIssues.get(i);
                      if (onlyPossible && !issue.possibleError) continue;
                      matchingIndices.add(i);
                      labels.add((issue.possibleError ? "[ممکنہ] " : "[واضح] ")
                              + "لائن " + issue.lineNumber + ": " + issue.name);
                  }

                  if (matchingIndices.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "کوئی ممکنہ غلطی موجود نہیں۔");
                      return;
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(onlyPossible ? "ممکنہ غلطیاں (" + matchingIndices.size() + ")" : "تمام غلطیاں")
                          .setItems(labels.toArray(new String[0]), (d, which) -> {
                              int idx = matchingIndices.get(which);
                              currentIssueIndex = idx;
                              updateErrorNavBarUI();
                              showIssueDetailAndFixDialog(activeIssues.get(idx), idx);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showIssueDetailAndFixDialog(CodeIssue issue, int index) {
                  StringBuilder msg = new StringBuilder();
                  msg.append("حیثیت: ").append(issue.possibleError ? "ممکنہ غلطی" : "واضح غلطی").append("\n");
                  msg.append("غلطی کا نام: ").append(issue.name).append("\n");
                  msg.append("لائن نمبر: ").append(issue.lineNumber);
                  if (issue.columnNumber > 0) msg.append(" (کالم ").append(issue.columnNumber).append(")");
                  msg.append("\nوجہ: ").append(issue.reason).append("\n\n");

                  if (issue.hasSafeFix()) {
                      msg.append("مجوزہ اصلاح: ").append(issue.fixDescription).append("\n");
                      msg.append("(YES دبانے سے پہلے اصل کوڈ کا خودکار بیک اپ بنایا جائے گا)\n\n");
                      msg.append("کیا اس غلطی کو درست کرنا ہے؟");

                      new AlertDialog.Builder(this)
                              .setTitle("غلطی " + (index + 1) + " از " + activeIssues.size())
                              .setMessage(msg.toString())
                              .setPositiveButton(R.string.yes_en, (d, w) -> applyUserApprovedFix(issue))
                              .setNegativeButton(R.string.no_en, (d, w) ->
                                      AccessibilityHelper.announce(this, rootContainer, "کوڈ میں کوئی تبدیلی نہیں کی گئی۔"))
                              .setNeutralButton("لائن پر جائیں", (d, w) -> jumpToLineFromAnywhere(issue.lineNumber - 1))
                              .show();
                  } else {
                      msg.append("اس غلطی کا خودکار حل سو فیصد یقینی نہیں، اس لیے ازخود تبدیلی دستیاب نہیں۔ آپ براہِ راست اس لائن پر جا کر دستی ترمیم کر سکتے ہیں۔");

                      new AlertDialog.Builder(this)
                              .setTitle("غلطی " + (index + 1) + " از " + activeIssues.size())
                              .setMessage(msg.toString())
                              .setPositiveButton("لائن پر جائیں", (d, w) -> jumpToLineFromAnywhere(issue.lineNumber - 1))
                              .setNegativeButton(R.string.ok, null)
                              .show();
                  }
              }

              private void applyUserApprovedFix(CodeIssue issue) {
                  if (engine == null || !issue.hasSafeFix()) return;
                  executor.execute(() -> {
                      try {
                          if (currentFileId != null) {
                              backupManager.createBackup(
                                      currentFileId,
                                      engine.getBackingFile(),
                                      "اصلاح سے پہلے بیک اپ (لائن " + issue.lineNumber + ")",
                                      engine.getTotalChars(),
                                      engine.getLineCount(),
                                      settings.getMaxBackupsPerFile()
                              );
                          }

                          int targetFocusLine = Math.max(0, issue.lineNumber - 1);
                          if (issue.fixType == CodeIssue.FixType.REPLACE_LINE) {
                              int lineIdx = Math.max(0, Math.min(issue.lineNumber - 1, engine.getLineCount() - 1));
                              long start = engine.getLineStartOffset(lineIdx);
                              long end = engine.getLineEndOffsetWithoutNewline(lineIdx);
                              byte[] newBytes = issue.fixPayload.getBytes(StandardCharsets.UTF_8);
                              undoManager.applyWithBytes(engine, start, end, newBytes, "غلطی کی اصلاح", lineIdx);
                              targetFocusLine = lineIdx;
                          } else if (issue.fixType == CodeIssue.FixType.APPEND_NEW_LINE_AT_EOF) {
                              String prefix = engine.needsNewlineBeforeAppend(issue.fixPayload.charAt(0))
                                      ? engine.getLineEnding() : "";
                              byte[] newBytes = (prefix + issue.fixPayload).getBytes(StandardCharsets.UTF_8);
                              undoManager.applyWithBytes(
                                      engine, engine.getTotalBytes(), engine.getTotalBytes(),
                                      newBytes, "غلطی کی اصلاح", Math.max(0, engine.getLineCount() - 1)
                              );
                              targetFocusLine = Math.max(0, engine.getLineCount() - 1);
                          }

                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          final int focusAfter = targetFocusLine;
                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(focusAfter, "اصلاح مکمل ہو گئی۔ واپس بٹن سے تبدیلی لوٹائی جا سکتی ہے۔");
                              });
                          } else {
                              currentPageIndex = engine.findPageForLine(focusAfter);
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(
                                          this, rootContainer, "اصلاح مکمل ہو گئی۔ واپس بٹن سے تبدیلی لوٹائی جا سکتی ہے۔"
                                  );
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "اصلاح لاگو کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void openOutlineList(OutlineItem.Kind kind) {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);
                  final String title = (kind == OutlineItem.Kind.FUNCTION) ? "فنکشن فہرست" : "کلاس فہرست";

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          List<OutlineItem> items = CodeOutlineExtractor.extract(
                                  this, engine.getBackingFile(), currentLanguage, kind
                          );
                          runOnUiThread(() -> {
                              if (items.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, title + " خالی ہے، کوئی حصہ نہیں ملا۔");
                                  return;
                              }
                              String[] labels = new String[items.size()];
                              for (int i = 0; i < items.size(); i++) {
                                  OutlineItem it = items.get(i);
                                  labels[i] = it.name + " (" + it.detail + ") — لائن " + it.lineNumber;
                              }
                              AccessibilityHelper.announce(this, rootContainer, title + " میں " + items.size() + " حصے ملے۔");
                              new AlertDialog.Builder(this)
                                      .setTitle(title + " (" + items.size() + ")")
                                      .setItems(labels, (d, which) -> {
                                          OutlineItem chosen = items.get(which);
                                          jumpToLineWithCustomAnnouncement(
                                                  chosen.lineNumber - 1,
                                                  chosen.name + "، لائن نمبر " + chosen.lineNumber
                                          );
                                      })
                                      .setNegativeButton(R.string.cancel, null)
                                      .show();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, title + " بنانے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void scheduleNextAutoSave() {
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  if (settings.isAutoSaveEnabled()) {
                      long delayMs = settings.getAutoSaveIntervalSeconds() * 1000L;
                      mainHandler.postDelayed(autoSaveRunnable, delayMs);
                  }
              }

              private void performAutoSaveTick() {
                  if (engine == null || !settings.isAutoSaveEnabled()) return;
                  final boolean dirtyAll = (!isLineMode && isPageDirty);
                  final String pageText = dirtyAll ? etCodeEditor.getText().toString() : null;
                  final int pageIdx = currentPageIndex;

                  if (!dirtyAll && !hasChangesSinceLastBackup) return;

                  executor.execute(() -> {
                      try {
                          if (dirtyAll) {
                              engine.writePage(pageIdx, pageText);
                              isPageDirty = false;
                          }
                          updateRepoStatsIfSaved();
                          maybeCreatePeriodicBackup("خودکار بیک اپ");
                          if (currentFileId != null) {
                              recoveryManager.clearRecovery();
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "خودکار محفوظ کرنے میں ناکامی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void maybeCreatePeriodicBackup(String label) {
                  if (currentFileId == null || engine == null || !settings.isAutoBackupEnabled()) return;
                  if (!hasChangesSinceLastBackup) return;
                  long now = System.currentTimeMillis();
                  if ("دستی محفوظ".equals(label) || (now - lastAutoBackupTime) >= 120_000L) {
                      try {
                          backupManager.createBackup(
                                  currentFileId,
                                  engine.getBackingFile(),
                                  label,
                                  engine.getTotalChars(),
                                  engine.getLineCount(),
                                  settings.getMaxBackupsPerFile()
                          );
                          lastAutoBackupTime = now;
                          hasChangesSinceLastBackup = false;
                      } catch (Exception ignored) {
                      }
                  }
              }

              private void showFindOrReplaceDialog(boolean isReplaceMode) {
                  if (engine == null) return;
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_find_replace, null);
                  EditText etQuery = view.findViewById(R.id.etFindQuery);
                  EditText etReplace = view.findViewById(R.id.etReplaceWith);
                  CheckBox cbMatchCase = view.findViewById(R.id.cbMatchCase);
                  CheckBox cbWholeWord = view.findViewById(R.id.cbWholeWord);

                  etReplace.setVisibility(isReplaceMode ? View.VISIBLE : View.GONE);
                  cbMatchCase.setChecked(settings.isDefaultMatchCase());
                  cbWholeWord.setChecked(settings.isDefaultWholeWord());

                  AlertDialog.Builder builder = new AlertDialog.Builder(this)
                          .setTitle(isReplaceMode ? "تلاش اور تبدیل کریں" : "کوڈ میں تلاش کریں")
                          .setView(view)
                          .setNegativeButton(R.string.cancel, null);

                  if (!isReplaceMode) {
                      builder.setPositiveButton("تلاش کریں", (d, w) -> {
                          String q = etQuery.getText().toString();
                          if (q.isEmpty()) {
                              AccessibilityHelper.announce(this, rootContainer, "تلاش کے لیے کوئی لفظ لکھیں۔");
                              return;
                          }
                          runBackgroundSearch(q, null, cbMatchCase.isChecked(), cbWholeWord.isChecked(), false);
                      });
                  } else {
                      builder.setPositiveButton("نتائج دیکھیں (منتخب بدلیں)", (d, w) -> {
                          String q = etQuery.getText().toString();
                          String r = etReplace.getText().toString();
                          if (q.isEmpty()) {
                              AccessibilityHelper.announce(this, rootContainer, "تلاش کا لفظ خالی نہیں ہو سکتا۔");
                              return;
                          }
                          runBackgroundSearch(q, r, cbMatchCase.isChecked(), cbWholeWord.isChecked(), true);
                      });
                      builder.setNeutralButton("سب بدلیں (Replace All)", (d, w) -> {
                          String q = etQuery.getText().toString();
                          String r = etReplace.getText().toString();
                          if (q.isEmpty()) {
                              AccessibilityHelper.announce(this, rootContainer, "تلاش کا لفظ خالی نہیں ہو سکتا۔");
                              return;
                          }
                          confirmReplaceAll(q, r, cbMatchCase.isChecked(), cbWholeWord.isChecked());
                      });
                  }

                  builder.show();
              }

              private void runBackgroundSearch(String query, String replaceWith, boolean matchCase,
                                               boolean wholeWord, boolean allowSingleReplace) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  AccessibilityHelper.announce(this, rootContainer, "تلاش جاری ہے...");
                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          SearchEngine.SearchResult res = SearchEngine.search(
                                  engine.getBackingFile(), query, matchCase, wholeWord, 500
                          );
                          runOnUiThread(() -> showSearchResultsDialog(res, query, replaceWith, allowSingleReplace));
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "تلاش میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void showSearchResultsDialog(SearchEngine.SearchResult res, String query,
                                                   String replaceWith, boolean allowSingleReplace) {
                  if (res.matches.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "کوئی نتیجہ نہیں ملا۔");
                      return;
                  }

                  int count = res.matches.size();
                  String[] labels = new String[count];
                  for (int i = 0; i < count; i++) {
                      SearchEngine.SearchMatch m = res.matches.get(i);
                      labels[i] = "لائن " + m.lineNumber + ": " + m.linePreview;
                  }

                  String title = "نتائج: " + count + (res.truncated ? "+" : "")
                          + (allowSingleReplace ? " (تبدیل یا جانے کے لیے چنیں)" : " (جانے کے لیے چنیں)");
                  AccessibilityHelper.announce(this, rootContainer, count + " مقامات مل گئے۔");

                  new AlertDialog.Builder(this)
                          .setTitle(title)
                          .setItems(labels, (d, which) -> {
                              SearchEngine.SearchMatch selected = res.matches.get(which);
                              if (allowSingleReplace) {
                                  new AlertDialog.Builder(this)
                                          .setTitle("لائن " + selected.lineNumber)
                                          .setMessage("متن: " + selected.linePreview + "\n\nکیا آپ اس مقام پر '" + query + "' کو '" + replaceWith + "' سے بدلنا چاہتے ہیں؟")
                                          .setPositiveButton("یہ جگہ بدلیں", (dd, ww) -> executeSingleReplace(selected, replaceWith))
                                          .setNeutralButton("صرف لائن پر جائیں", (dd, ww) -> jumpToLineFromAnywhere(selected.lineIndex))
                                          .setNegativeButton(R.string.cancel, null)
                                          .show();
                              } else {
                                  jumpToLineFromAnywhere(selected.lineIndex);
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void executeSingleReplace(SearchEngine.SearchMatch match, String replaceWith) {
                  executor.execute(() -> {
                      try {
                          byte[] replBytes = (replaceWith != null ? replaceWith : "").getBytes(StandardCharsets.UTF_8);
                          undoManager.applyWithBytes(engine, match.byteStart, match.byteEnd, replBytes, "تبدیلی (Replace)", match.lineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(match.lineIndex, "لائن " + match.lineNumber + " پر تبدیلی مکمل ہو گئی۔");
                              });
                          } else {
                              currentPageIndex = engine.findPageForLine(match.lineIndex);
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "لائن " + match.lineNumber + " پر تبدیلی مکمل ہو گئی۔");
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "تبدیلی ناکام رہی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void confirmReplaceAll(String query, String replaceWith, boolean matchCase, boolean wholeWord) {
                  new AlertDialog.Builder(this)
                          .setTitle("تمام جگہوں پر تبدیلی کی تصدیق")
                          .setMessage("کیا آپ واقعی پوری فائل میں '" + query + "' کی تمام جگہوں کو '" + replaceWith + "' سے بدلنا چاہتے ہیں؟")
                          .setPositiveButton(R.string.yes, (d, w) -> executeReplaceAll(query, replaceWith, matchCase, wholeWord))
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void executeReplaceAll(String query, String replaceWith, boolean matchCase, boolean wholeWord) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  AccessibilityHelper.announce(this, rootContainer, "تمام جگہیں تبدیل کی جا رہی ہیں...");
                  executor.execute(() -> {
                      File tempOut = new File(getCacheDir(), "replace_all.tmp");
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;

                          int count = SearchEngine.replaceAllToFile(
                                  engine.getBackingFile(), tempOut, query, replaceWith, matchCase, wholeWord
                          );
                          if (count == 0) {
                              runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "بدلنے کے لیے کوئی مقام نہیں ملا۔"));
                              return;
                          }

                          undoManager.applyWithFile(engine, 0L, engine.getTotalBytes(), tempOut, "سب بدلیں", currentFocusedLineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          if (isLineMode) {
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "کل " + count + " مقامات تبدیل ہو گئے۔");
                              });
                          } else {
                              currentPageIndex = Math.max(0, Math.min(currentPageIndex, engine.getPageCount() - 1));
                              String pageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(pageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "کل " + count + " مقامات تبدیل ہو گئے۔");
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "تبدیلی ناکام رہی: " + e.getMessage()
                          ));
                      } finally {
                          if (tempOut.exists()) tempOut.delete();
                      }
                  });
              }

              private void handleMarkCurrentOrChosenLine(boolean mark) {
                  if (engine == null || engine.getLineCount() == 0) {
                      AccessibilityHelper.announce(this, rootContainer, "فائل خالی ہے، نشان لگانے کے لیے کوئی لائن موجود نہیں۔");
                      return;
                  }
                  int totalLines = engine.getLineCount();
                  int suggestedLine = Math.max(1, Math.min(currentFocusedLineIndex + 1, totalLines));

                  EditText input = new EditText(this);
                  input.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  input.setText(String.valueOf(suggestedLine));
                  input.setSelection(input.getText().length());
                  input.setHint("لائن نمبر (1 تا " + totalLines + ")");

                  new AlertDialog.Builder(this)
                          .setTitle(mark ? "لائن پر نشان لگائیں" : "لائن سے نشان ختم کریں")
                          .setMessage("لائن نمبر درج کریں (موجودہ لائن: " + suggestedLine + ")")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              try {
                                  int ln = Integer.parseInt(input.getText().toString().trim());
                                  if (ln < 1 || ln > totalLines) {
                                      AccessibilityHelper.announce(this, rootContainer, "غلط لائن نمبر۔");
                                      return;
                                  }
                                  if (mark) {
                                      markedLineNumbers.add(ln);
                                      persistMarkedLinesAsync();
                                      lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                                      AccessibilityHelper.announce(this, rootContainer, "لائن نمبر " + ln + " پر نشان لگ گیا۔");
                                  } else {
                                      if (markedLineNumbers.remove(ln)) {
                                          persistMarkedLinesAsync();
                                          lineAdapter.setMarkedLineNumbers(markedLineNumbers);
                                          AccessibilityHelper.announce(this, rootContainer, "لائن نمبر " + ln + " سے نشان ختم کر دیا گیا۔");
                                      } else {
                                          AccessibilityHelper.announce(this, rootContainer, "لائن نمبر " + ln + " پر کوئی نشان نہیں لگا تھا۔");
                                      }
                                  }
                              } catch (NumberFormatException e) {
                                  AccessibilityHelper.announce(this, rootContainer, "براہِ کرم درست نمبر درج کریں۔");
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showMarkedLinesDialog() {
                  if (engine == null || markedLineNumbers.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "ابھی کسی لائن پر نشان نہیں لگایا گیا۔");
                      return;
                  }

                  List<Integer> sorted = new ArrayList<>(markedLineNumbers);
                  Collections.sort(sorted);

                  executor.execute(() -> {
                      List<Integer> validMarks = new ArrayList<>();
                      List<String> labels = new ArrayList<>();
                      int maxLines = engine.getLineCount();

                      for (int ln : sorted) {
                          if (ln >= 1 && ln <= maxLines) {
                              validMarks.add(ln);
                              String preview = "";
                              try {
                                  preview = engine.readLinePreview(ln - 1, 120);
                              } catch (Exception ignored) {}
                              labels.add("★ لائن " + ln + ": " + (preview.isEmpty() ? "(خالی لائن)" : preview));
                          }
                      }

                      runOnUiThread(() -> {
                          if (validMarks.isEmpty()) {
                              AccessibilityHelper.announce(this, rootContainer, "کوئی درست نشان والی لائن موجود نہیں۔");
                              return;
                          }
                          String[] items = labels.toArray(new String[0]);
                          new AlertDialog.Builder(this)
                                  .setTitle("نشان والی لائنیں (" + validMarks.size() + ")")
                                  .setItems(items, (d, which) -> jumpToLineFromAnywhere(validMarks.get(which) - 1))
                                  .setNegativeButton(R.string.cancel, null)
                                  .show();
                      });
                  });
              }

              private void persistMarkedLinesAsync() {
                  if (currentFileId == null) return;
                  final List<Integer> snapshot = new ArrayList<>(markedLineNumbers);
                  final String fid = currentFileId;
                  executor.execute(() -> {
                      try {
                          repository.updateMarkedLines(fid, snapshot);
                      } catch (Exception ignored) {
                      }
                  });
              }

              private void jumpToLineFromAnywhere(int targetLineIndex) {
                  jumpToLineWithCustomAnnouncement(targetLineIndex, null);
              }

              private void jumpToLineWithCustomAnnouncement(int targetLineIndex, String customAnnouncement) {
                  if (engine == null || engine.getLineCount() == 0) return;
                  int safeIdx = Math.max(0, Math.min(targetLineIndex, engine.getLineCount() - 1));

                  if (!isLineMode) {
                      final String currentText = etCodeEditor.getText().toString();
                      final boolean dirty = isPageDirty;
                      executor.execute(() -> {
                          try {
                              commitAllModePageIfDirtySync(currentText, dirty);
                              isPageDirty = false;
                              isLineMode = true;
                              String preview = engine.readLinePreview(safeIdx, 140);
                              String spoken = (customAnnouncement != null)
                                      ? customAnnouncement
                                      : ("لائن " + (safeIdx + 1) + ": " + (preview.isEmpty() ? "خالی لائن" : preview));
                              runOnUiThread(() -> {
                                  applyModeVisibility();
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(safeIdx, spoken);
                              });
                          } catch (Exception ignored) {}
                      });
                  } else {
                      executor.execute(() -> {
                          String preview = "";
                          try {
                              preview = engine.readLinePreview(safeIdx, 140);
                          } catch (Exception ignored) {}
                          String spoken = (customAnnouncement != null)
                                  ? customAnnouncement
                                  : ("لائن " + (safeIdx + 1) + ": " + (preview.isEmpty() ? "خالی لائن" : preview));
                          runOnUiThread(() -> focusLineInRecyclerView(safeIdx, spoken));
                      });
                  }
              }

              private void displayPageContent(String text) {
                  suppressTextWatcher = true;
                  etCodeEditor.setText(text);
                  isPageDirty = false;
                  suppressTextWatcher = false;
              }

              private void applyModeVisibility() {
                  if (isLineMode) {
                      etCodeEditor.setVisibility(View.GONE);
                      layoutPagingBar.setVisibility(View.GONE);
                      layoutLineModeBar.setVisibility(View.VISIBLE);
                      boolean empty = (engine == null || engine.getLineCount() == 0);
                      btnAddFirstLine.setVisibility(empty ? View.VISIBLE : View.GONE);
                      rvLineMode.setVisibility(empty ? View.GONE : View.VISIBLE);
                  } else {
                      layoutLineModeBar.setVisibility(View.GONE);
                      btnAddFirstLine.setVisibility(View.GONE);
                      rvLineMode.setVisibility(View.GONE);
                      etCodeEditor.setVisibility(View.VISIBLE);
                  }
              }

              private void updateHeaderAndBarsUI() {
                  String title = (currentFileName != null && !currentFileName.isEmpty())
                          ? currentFileName
                          : getString(R.string.unsaved_draft);
                  String modeLabel = isLineMode ? "لائن موڈ" : "آل موڈ";
                  tvEditorHeader.setText(title + " (" + currentLanguage + " - " + modeLabel + ")");

                  btnAllMode.setEnabled(isLineMode);
                  btnLineMode.setEnabled(!isLineMode);
                  btnAllMode.setContentDescription(isLineMode ? "آل موڈ کھولیں" : "آل موڈ اس وقت فعال ہے");
                  btnLineMode.setContentDescription(isLineMode ? "لائن موڈ اس وقت فعال ہے" : "لائن موڈ کھولیں");

                  boolean canUndo = (undoManager != null && undoManager.canUndo()) || (!isLineMode && isPageDirty);
                  boolean canRedo = (undoManager != null && undoManager.canRedo());
                  btnUndo.setEnabled(canUndo);
                  btnRedo.setEnabled(canRedo);

                  if (isLineMode) {
                      layoutPagingBar.setVisibility(View.GONE);
                      int lines = (engine != null) ? engine.getLineCount() : 0;
                      tvLineModeSummary.setText("کل لائنیں: " + lines);
                      boolean empty = (lines == 0);
                      btnAddFirstLine.setVisibility(empty ? View.VISIBLE : View.GONE);
                      rvLineMode.setVisibility(empty ? View.GONE : View.VISIBLE);
                  } else {
                      if (engine != null && engine.isPaged()) {
                          layoutPagingBar.setVisibility(View.VISIBLE);
                          int totalPages = engine.getPageCount();
                          tvPageInfo.setText("صفحہ " + (currentPageIndex + 1) + " از " + totalPages);
                          btnPrevPage.setEnabled(currentPageIndex > 0);
                          btnNextPage.setEnabled(currentPageIndex < totalPages - 1);
                      } else {
                          layoutPagingBar.setVisibility(View.GONE);
                      }
                  }
              }

              private void commitAllModePageIfDirtySync(String pageText, boolean dirty) throws IOException {
                  if (engine == null || !dirty) return;
                  long[] range = engine.getPageByteRange(currentPageIndex);
                  byte[] newBytes = (pageText != null ? pageText : "").getBytes(StandardCharsets.UTF_8);
                  undoManager.applyWithBytes(engine, range[0], range[1], newBytes, "آل موڈ تبدیلی", currentFocusedLineIndex);
                  hasChangesSinceLastBackup = true;
              }

              private void switchToLineMode() {
                  if (engine == null || isLineMode) return;
                  final String currentText = etCodeEditor.getText().toString();
                  final boolean dirty = isPageDirty;

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          isLineMode = true;

                          runOnUiThread(() -> {
                              applyModeVisibility();
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(
                                      this, rootContainer, "لائن موڈ کھل گیا۔ کل لائنیں " + engine.getLineCount()
                              );
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "لائن موڈ کھولنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void switchToAllMode() {
                  if (engine == null || !isLineMode) return;
                  executor.execute(() -> {
                      try {
                          isLineMode = false;
                          currentPageIndex = engine.findPageForLine(currentFocusedLineIndex);
                          String pageText = engine.readPage(currentPageIndex);

                          runOnUiThread(() -> {
                              applyModeVisibility();
                              displayPageContent(pageText);
                              updateHeaderAndBarsUI();
                              String msg = engine.isPaged()
                                      ? "آل موڈ کھل گیا۔ صفحہ " + (currentPageIndex + 1) + " از " + engine.getPageCount()
                                      : "آل موڈ کھل گیا۔";
                              AccessibilityHelper.announce(this, rootContainer, msg);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "آل موڈ کھولنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void navigateToPage(int targetPage) {
                  if (engine == null || isLineMode) return;
                  if (targetPage < 0 || targetPage >= engine.getPageCount()) return;
                  final String currentText = etCodeEditor.getText().toString();
                  final boolean dirty = isPageDirty;

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          int safeTarget = Math.max(0, Math.min(targetPage, engine.getPageCount() - 1));
                          currentPageIndex = safeTarget;
                          String newPageText = engine.readPage(currentPageIndex);

                          runOnUiThread(() -> {
                              displayPageContent(newPageText);
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(
                                      this, rootContainer, "صفحہ " + (currentPageIndex + 1) + " از " + engine.getPageCount()
                              );
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "صفحہ تبدیل کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              @Override
              public void onLineFocused(int lineIndex) {
                  currentFocusedLineIndex = lineIndex;
              }

              @Override
              public void onEditLine(int lineIndex) {
                  if (engine == null) return;
                  currentFocusedLineIndex = lineIndex;
                  executor.execute(() -> {
                      try {
                          String fullLine = engine.readLine(lineIndex);
                          runOnUiThread(() -> showLineEditDialog(lineIndex, false, fullLine));
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "لائن پڑھنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              @Override
              public void onInsertAfterLine(int lineIndex) {
                  if (engine == null) return;
                  currentFocusedLineIndex = lineIndex;
                  showLineEditDialog(lineIndex, true, "");
              }

              @Override
              public void onDeleteLine(int lineIndex) {
                  if (engine == null) return;
                  currentFocusedLineIndex = lineIndex;
                  int lineNum = lineIndex + 1;

                  new AlertDialog.Builder(this)
                          .setTitle("لائن حذف کرنے کی تصدیق")
                          .setMessage("کیا آپ واقعی لائن نمبر " + lineNum + " کو حذف کرنا چاہتے ہیں؟")
                          .setPositiveButton(R.string.yes, (dialog, which) -> executeDeleteLine(lineIndex))
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void showLineEditDialog(int lineIndex, boolean isInsertAfter, String initialText) {
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_line_edit, null);
                  EditText etInput = view.findViewById(R.id.etLineEditInput);
                  Button btnIndentAdd = view.findViewById(R.id.btnDialogIndentAdd);
                  Button btnIndentRemove = view.findViewById(R.id.btnDialogIndentRemove);
                  Button btnDialogPaste = view.findViewById(R.id.btnDialogPaste);

                  etInput.setTextSize(settings.getFontSize());
                  etInput.setText(initialText);
                  etInput.setSelection(etInput.getText().length());
                  etInput.addTextChangedListener(new AutoBracketWatcher(etInput, settings));

                  btnIndentAdd.setOnClickListener(v -> {
                      String unit = settings.getIndentUnitString();
                      int start = Math.max(0, etInput.getSelectionStart());
                      int end = Math.max(0, etInput.getSelectionEnd());
                      etInput.getText().replace(Math.min(start, end), Math.max(start, end), unit);
                      AccessibilityHelper.announce(this, etInput, "انڈینٹ شامل کیا گیا۔");
                  });

                  btnIndentRemove.setOnClickListener(v -> {
                      String text = etInput.getText().toString();
                      int spaces = settings.getIndentSpaces();
                      if (text.startsWith("\t")) {
                          etInput.getText().delete(0, 1);
                          AccessibilityHelper.announce(this, etInput, "ایک ٹیب ہٹایا گیا۔");
                      } else {
                          int removeCount = 0;
                          int maxRemove = (spaces == 0) ? 4 : spaces;
                          while (removeCount < maxRemove && removeCount < text.length() && text.charAt(removeCount) == ' ') {
                              removeCount++;
                          }
                          if (removeCount > 0) {
                              etInput.getText().delete(0, removeCount);
                              AccessibilityHelper.announce(this, etInput, removeCount + " اسپیس ہٹائے گئے۔");
                          } else {
                              AccessibilityHelper.announce(this, etInput, "شروع میں کوئی انڈینٹ موجود نہیں۔");
                          }
                      }
                  });

                  btnDialogPaste.setOnClickListener(v -> {
                      String clip = ClipboardHelper.getPasteText(this);
                      if (clip == null || clip.isEmpty()) {
                          AccessibilityHelper.announce(this, etInput, "کلپ بورڈ خالی ہے۔");
                          return;
                      }
                      int start = Math.max(0, etInput.getSelectionStart());
                      int end = Math.max(0, etInput.getSelectionEnd());
                      etInput.getText().replace(Math.min(start, end), Math.max(start, end), clip);
                      AccessibilityHelper.announce(this, etInput, "متن پیسٹ ہو گیا۔");
                  });

                  String dialogTitle;
                  if (isInsertAfter && (engine == null || engine.getLineCount() == 0)) {
                      dialogTitle = "پہلی لائن شامل کریں";
                  } else if (isInsertAfter) {
                      dialogTitle = "لائن " + (lineIndex + 1) + " کے بعد نئی لائن";
                  } else {
                      dialogTitle = "لائن " + (lineIndex + 1) + " کی ترمیم";
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(dialogTitle)
                          .setView(view)
                          .setPositiveButton(R.string.btn_save, (d, w) -> {
                              String newText = etInput.getText().toString();
                              if (isInsertAfter) executeInsertLineAfter(lineIndex, newText);
                              else executeReplaceLine(lineIndex, newText);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void executeReplaceLine(int lineIndex, String newLineText) {
                  executor.execute(() -> {
                      try {
                          long start = engine.getLineStartOffset(lineIndex);
                          long end = engine.getLineEndOffsetWithoutNewline(lineIndex);
                          byte[] newBytes = newLineText.getBytes(StandardCharsets.UTF_8);
                          undoManager.applyWithBytes(engine, start, end, newBytes, "لائن ترمیم", lineIndex);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              focusLineInRecyclerView(lineIndex, "لائن " + (lineIndex + 1) + " تبدیل ہو گئی۔");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "لائن تبدیل کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void executeInsertLineAfter(int lineIndex, String newText) {
                  executor.execute(() -> {
                      try {
                          int targetFocusLine;
                          if (engine.getLineCount() == 0) {
                              byte[] newBytes = newText.getBytes(StandardCharsets.UTF_8);
                              undoManager.applyWithBytes(engine, 0L, 0L, newBytes, "نئی لائن", 0);
                              targetFocusLine = 0;
                          } else {
                              long insertPos = engine.getLineEndOffsetWithoutNewline(lineIndex);
                              String payloadStr = engine.getLineEnding() + newText;
                              byte[] newBytes = payloadStr.getBytes(StandardCharsets.UTF_8);
                              targetFocusLine = lineIndex + 1;
                              undoManager.applyWithBytes(engine, insertPos, insertPos, newBytes, "نئی لائن", targetFocusLine);
                          }
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          final int finalFocus = targetFocusLine;
                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              focusLineInRecyclerView(finalFocus, "نئی لائن نمبر " + (finalFocus + 1) + " پر شامل ہو گئی۔");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "نئی لائن شامل کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void executeDeleteLine(int lineIndex) {
                  executor.execute(() -> {
                      try {
                          long[] delRange = engine.getDeleteLineRangeOffsets(lineIndex, lineIndex);
                          int nextFocus = Math.max(0, Math.min(lineIndex, engine.getLineCount() - 2));
                          undoManager.applyWithBytes(engine, delRange[0], delRange[1], new byte[0], "لائن حذف", nextFocus);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              if (engine.getLineCount() > 0) {
                                  focusLineInRecyclerView(nextFocus, "لائن حذف ہو گئی۔ کل لائنیں " + engine.getLineCount());
                              } else {
                                  AccessibilityHelper.announce(this, rootContainer, "آخری لائن حذف ہو گئی۔ فائل خالی ہے۔");
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "لائن حذف کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void showJumpLineDialog() {
                  if (engine == null || engine.getLineCount() == 0) {
                      AccessibilityHelper.announce(this, rootContainer, "فائل خالی ہے، جانے کے لیے کوئی لائن موجود نہیں۔");
                      return;
                  }
                  int totalLines = engine.getLineCount();
                  EditText input = new EditText(this);
                  input.setInputType(android.text.InputType.TYPE_CLASS_NUMBER);
                  input.setHint("لائن نمبر لکھیں (1 تا " + totalLines + ")");
                  input.setContentDescription("مطلوبہ لائن نمبر، 1 سے " + totalLines + " تک");

                  new AlertDialog.Builder(this)
                          .setTitle("جمپ لائن (کل لائنیں: " + totalLines + ")")
                          .setView(input)
                          .setPositiveButton("جائیں", (dialog, which) -> {
                              String raw = input.getText().toString().trim();
                              try {
                                  int lineNum = Integer.parseInt(raw);
                                  if (lineNum < 1 || lineNum > totalLines) {
                                      AccessibilityHelper.announce(
                                              this, rootContainer,
                                              "غلط لائن نمبر۔ اس فائل میں صرف 1 سے " + totalLines + " تک لائنیں ہیں۔"
                                      );
                                      return;
                                  }
                                  jumpToLineFromAnywhere(lineNum - 1);
                              } catch (NumberFormatException e) {
                                  AccessibilityHelper.announce(this, rootContainer, "براہِ کرم درست لائن نمبر لکھیں۔");
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void showLineRangeDialog() {
                  if (engine == null || engine.getLineCount() == 0) {
                      AccessibilityHelper.announce(this, rootContainer, "فائل خالی ہے، لائن رینج دستیاب نہیں۔");
                      return;
                  }
                  int totalLines = engine.getLineCount();
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_line_range, null);
                  TextView tvHint = view.findViewById(R.id.tvRangeHint);
                  EditText etStart = view.findViewById(R.id.etRangeStart);
                  EditText etEnd = view.findViewById(R.id.etRangeEnd);

                  tvHint.setText("کل دستیاب لائنیں: 1 تا " + totalLines);

                  new AlertDialog.Builder(this)
                          .setTitle("لائن رینج (کاپی یا حذف)")
                          .setView(view)
                          .setPositiveButton("رینج کاپی کریں", (d, w) -> handleLineRangeAction(etStart, etEnd, false))
                          .setNeutralButton("رینج حذف کریں", (d, w) -> handleLineRangeAction(etStart, etEnd, true))
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void handleLineRangeAction(EditText etStart, EditText etEnd, boolean isDelete) {
                  int totalLines = engine.getLineCount();
                  try {
                      int startNum = Integer.parseInt(etStart.getText().toString().trim());
                      int endNum = Integer.parseInt(etEnd.getText().toString().trim());
                      if (startNum < 1 || endNum > totalLines || startNum > endNum) {
                          AccessibilityHelper.announce(this, rootContainer, "غلط لائن رینج درج کی گئی ہے۔");
                          return;
                      }
                      int sIdx = startNum - 1;
                      int eIdx = endNum - 1;

                      if (!isDelete) {
                          executor.execute(() -> {
                              try {
                                  File tempRange = new File(getCacheDir(), "range_copy.tmp");
                                  long chars = engine.extractLineRangeToFile(sIdx, eIdx, tempRange);
                                  ClipboardHelper.CopyResult res = ClipboardHelper.copyFileContent(this, tempRange, chars);
                                  tempRange.delete();
                                  runOnUiThread(() -> AccessibilityHelper.announce(
                                          this, rootContainer, "لائن " + startNum + " تا " + endNum + ": " + res.message
                                  ));
                              } catch (Exception e) {
                                  runOnUiThread(() -> AccessibilityHelper.announce(
                                          this, rootContainer, "رینج کاپی ناکام رہی: " + e.getMessage()
                                  ));
                              }
                          });
                      } else {
                          new AlertDialog.Builder(this)
                                  .setTitle("لائن رینج حذف کرنے کی تصدیق")
                                  .setMessage("کیا آپ واقعی لائن " + startNum + " سے لائن " + endNum + " تک حذف کرنا چاہتے ہیں؟")
                                  .setPositiveButton(R.string.yes, (dialog, which) -> executeDeleteLineRange(sIdx, eIdx, startNum, endNum))
                                  .setNegativeButton(R.string.no, null)
                                  .show();
                      }
                  } catch (NumberFormatException e) {
                      AccessibilityHelper.announce(this, rootContainer, "براہِ کرم شروعاتی اور آخری لائن کے درست نمبر لکھیں۔");
                  }
              }

              private void executeDeleteLineRange(int sIdx, int eIdx, int startNum, int endNum) {
                  executor.execute(() -> {
                      try {
                          long[] offsets = engine.getDeleteLineRangeOffsets(sIdx, eIdx);
                          int nextFocus = Math.max(0, Math.min(sIdx, engine.getLineCount() - (eIdx - sIdx + 1) - 1));
                          undoManager.applyWithBytes(engine, offsets[0], offsets[1], new byte[0], "لائن رینج حذف", nextFocus);
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          runOnUiThread(() -> {
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              String msg = "لائن " + startNum + " تا " + endNum + " حذف ہو گئیں۔ باقی لائنیں " + engine.getLineCount();
                              if (engine.getLineCount() > 0) {
                                  focusLineInRecyclerView(nextFocus, msg);
                              } else {
                                  AccessibilityHelper.announce(this, rootContainer, msg);
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "رینج حذف کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void focusLineInRecyclerView(int targetIndex, String announcement) {
                  if (engine == null || engine.getLineCount() == 0) {
                      if (announcement != null) AccessibilityHelper.announce(this, rootContainer, announcement);
                      return;
                  }
                  int safeIndex = Math.max(0, Math.min(targetIndex, engine.getLineCount() - 1));
                  currentFocusedLineIndex = safeIndex;
                  lineLayoutManager.scrollToPositionWithOffset(safeIndex, 0);

                  rvLineMode.post(() -> {
                      RecyclerView.ViewHolder vh = rvLineMode.findViewHolderForAdapterPosition(safeIndex);
                      if (vh instanceof LineModeAdapter.LineViewHolder) {
                          TextView targetView = ((LineModeAdapter.LineViewHolder) vh).tvLineText;
                          targetView.requestFocus();
                          targetView.sendAccessibilityEvent(AccessibilityEvent.TYPE_VIEW_FOCUSED);
                      }
                      if (announcement != null && !announcement.isEmpty()) {
                          AccessibilityHelper.announce(this, rootContainer, announcement);
                      }
                  });
              }

              private void handleUndo() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          if (dirty) {
                              commitAllModePageIfDirtySync(currentText, true);
                              isPageDirty = false;
                          }
                          UndoRedoManager.EditRecord rec = undoManager.undo(engine);
                          if (rec == null) {
                              runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "واپس کرنے کے لیے کوئی تبدیلی موجود نہیں۔"));
                              return;
                          }
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          refreshAfterUndoRedo(rec, "تبدیلی واپس کر دی گئی: " + rec.description);
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "واپس کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void handleRedo() {
                  if (engine == null) return;
                  executor.execute(() -> {
                      try {
                          UndoRedoManager.EditRecord rec = undoManager.redo(engine);
                          if (rec == null) {
                              runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "دوبارہ لگانے کے لیے کوئی تبدیلی موجود نہیں۔"));
                              return;
                          }
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();
                          refreshAfterUndoRedo(rec, "تبدیلی دوبارہ لگا دی گئی: " + rec.description);
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "دوبارہ لگانے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void refreshAfterUndoRedo(UndoRedoManager.EditRecord rec, String message) throws IOException {
                  if (isLineMode) {
                      runOnUiThread(() -> {
                          lineAdapter.refreshAllLines();
                          updateHeaderAndBarsUI();
                          if (engine.getLineCount() > 0) {
                              focusLineInRecyclerView(rec.focusLineIndex, message);
                          } else {
                              AccessibilityHelper.announce(this, rootContainer, message);
                          }
                      });
                  } else {
                      currentPageIndex = Math.max(0, Math.min(currentPageIndex, engine.getPageCount() - 1));
                      String pageText = engine.readPage(currentPageIndex);
                      runOnUiThread(() -> {
                          displayPageContent(pageText);
                          updateHeaderAndBarsUI();
                          AccessibilityHelper.announce(this, rootContainer, message);
                      });
                  }
              }

              private void handleSaveClicked() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  if (currentFileId != null) {
                      executor.execute(() -> {
                          try {
                              commitAllModePageIfDirtySync(currentText, dirty);
                              isPageDirty = false;
                              hasChangesSinceLastBackup = true;
                              updateRepoStatsIfSaved();
                              maybeCreatePeriodicBackup("دستی محفوظ");
                              recoveryManager.clearRecovery();
                              runOnUiThread(() -> {
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(this, rootContainer, "فائل اور بیک اپ محفوظ ہو گئے۔");
                              });
                          } catch (Exception e) {
                              runOnUiThread(() -> AccessibilityHelper.announce(
                                      this, rootContainer, "محفوظ کرنے میں ناکامی: " + e.getMessage()
                              ));
                          }
                      });
                  } else {
                      promptSaveNewFile(currentText, dirty);
                  }
              }

              private void promptSaveNewFile(String currentText, boolean dirty) {
                  EditText inputName = new EditText(this);
                  inputName.setHint("فائل کا نام لکھیں (مثلاً My Java Project)");
                  if (currentFileName != null) {
                      inputName.setText(currentFileName);
                  }

                  new AlertDialog.Builder(this)
                          .setTitle("نئی فائل محفوظ کریں")
                          .setView(inputName)
                          .setPositiveButton("اگلا: زبان چنیں", (dialog, which) -> {
                              String chosenName = inputName.getText().toString().trim();
                              if (chosenName.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, "براہِ کرم فائل کا نام لکھیں۔");
                                  return;
                              }
                              if (repository.nameExists(chosenName, null)) {
                                  AccessibilityHelper.announce(this, rootContainer, "اس نام کی فائل پہلے سے موجود ہے، کوئی دوسرا نام لکھیں۔");
                                  return;
                              }
                              promptLanguageAndSave(chosenName, currentText, dirty);
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void promptLanguageAndSave(String chosenName, String currentText, boolean dirty) {
                  int preselected = 0;
                  for (int i = 0; i < MainActivity.SUPPORTED_LANGUAGES.length; i++) {
                      if (MainActivity.SUPPORTED_LANGUAGES[i].equalsIgnoreCase(currentLanguage)) {
                          preselected = i;
                          break;
                      }
                  }
                  final int[] selectedIndex = {preselected};

                  new AlertDialog.Builder(this)
                          .setTitle("پروگرامنگ زبان منتخب کریں")
                          .setSingleChoiceItems(MainActivity.SUPPORTED_LANGUAGES, preselected, (d, which) -> selectedIndex[0] = which)
                          .setPositiveButton(R.string.btn_save, (d, which) -> {
                              String lang = MainActivity.SUPPORTED_LANGUAGES[selectedIndex[0]];
                              executor.execute(() -> {
                                  try {
                                      commitAllModePageIfDirtySync(currentText, dirty);
                                      isPageDirty = false;
                                      CodeFileMeta saved = repository.createNewSavedFile(
                                              chosenName, lang, engine.getBackingFile(),
                                              engine.getTotalChars(), engine.getLineCount(), engine.getTotalBytes()
                                      );
                                      currentFileId = saved.id;
                                      currentFileName = saved.name;
                                      currentLanguage = saved.language;
                                      isExternalBenchmarkFile = false;
                                      repository.updateMarkedLines(currentFileId, new ArrayList<>(markedLineNumbers));

                                      engine = new LargeFileEngine(repository.getCodeFile(currentFileId), settings.getPageCharLimit());
                                      engine.rebuildIndex();
                                      hasChangesSinceLastBackup = true;
                                      maybeCreatePeriodicBackup("ابتدائی محفوظ حالت");
                                      recoveryManager.clearRecovery();

                                      runOnUiThread(() -> {
                                          lineAdapter.setEngine(engine);
                                          updateHeaderAndBarsUI();
                                          AccessibilityHelper.announce(this, rootContainer, "فائل " + saved.name + " لائبریری میں محفوظ ہو گئی۔");
                                      });
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(
                                              this, rootContainer, "محفوظ کرنے میں خرابی: " + e.getMessage()
                                      ));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              private void handleCopyAll() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          ClipboardHelper.CopyResult result = ClipboardHelper.copyFileContent(
                                  this, engine.getBackingFile(), engine.getTotalChars()
                          );
                          runOnUiThread(() -> {
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, result.message);
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "کاپی کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void handlePaste() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  boolean useLargeInternal = ClipboardHelper.hasLargeInternalClipboard(this);
                  final String clipText = useLargeInternal ? null : ClipboardHelper.getPasteText(this);

                  if (!useLargeInternal && (clipText == null || clipText.isEmpty())) {
                      AccessibilityHelper.announce(this, rootContainer, "کلپ بورڈ خالی ہے، پیسٹ کرنے کے لیے کوئی کوڈ نہیں ملا۔");
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;

                          int focusLineBefore = Math.max(0, engine.getLineCount() - 1);
                          if (useLargeInternal) {
                              File clipFile = ClipboardHelper.getInternalClipboardFile(this);
                              if (engine.needsNewlineBeforeAppendFile(clipFile)) {
                                  File combined = new File(getCacheDir(), "paste_combined.tmp");
                                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(combined), 65536);
                                       FileInputStream in = new FileInputStream(clipFile)) {
                                      out.write(engine.getLineEnding().getBytes(StandardCharsets.UTF_8));
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                  }
                                  try {
                                      undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), combined, "پیسٹ", focusLineBefore);
                                  } finally {
                                      combined.delete();
                                  }
                              } else {
                                  undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), clipFile, "پیسٹ", focusLineBefore);
                              }
                          } else {
                              String prefix = engine.needsNewlineBeforeAppend(clipText.charAt(0)) ? engine.getLineEnding() : "";
                              byte[] payload = (prefix + clipText).getBytes(StandardCharsets.UTF_8);
                              undoManager.applyWithBytes(engine, engine.getTotalBytes(), engine.getTotalBytes(), payload, "پیسٹ", focusLineBefore);
                          }

                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          if (isLineMode) {
                              int lastLine = Math.max(0, engine.getLineCount() - 1);
                              runOnUiThread(() -> {
                                  lineAdapter.refreshAllLines();
                                  updateHeaderAndBarsUI();
                                  focusLineInRecyclerView(lastLine, "کوڈ نیچے شامل ہو گیا۔ کل لائنیں: " + engine.getLineCount());
                              });
                          } else {
                              currentPageIndex = engine.getPageCount() - 1;
                              String lastPageText = engine.readPage(currentPageIndex);
                              runOnUiThread(() -> {
                                  displayPageContent(lastPageText);
                                  updateHeaderAndBarsUI();
                                  AccessibilityHelper.announce(
                                          this, rootContainer, "کوڈ نیچے شامل ہو گیا۔ کل حروف: " + engine.getTotalChars()
                                  );
                              });
                          }
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "پیسٹ ناکام رہا، پرانا کوڈ محفوظ ہے: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void confirmClearAll() {
                  new AlertDialog.Builder(this)
                          .setTitle("کلیئر آل کی تصدیق")
                          .setMessage("کیا آپ واقعی پورا کوڈ حذف کرنا چاہتے ہیں؟")
                          .setPositiveButton(R.string.yes, (dialog, which) -> executeClearAll())
                          .setNegativeButton(R.string.no, null)
                          .show();
              }

              private void executeClearAll() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          undoManager.applyWithBytes(engine, 0L, engine.getTotalBytes(), new byte[0], "کلیئر آل", 0);
                          hasChangesSinceLastBackup = true;
                          currentPageIndex = 0;
                          currentFocusedLineIndex = 0;
                          updateRepoStatsIfSaved();

                          runOnUiThread(() -> {
                              displayPageContent("");
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "ایڈیٹر کا پورا کوڈ صاف ہو گیا۔ واپس بٹن سے بحال کیا جا سکتا ہے۔");
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "کوڈ صاف کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void confirmImportIntoOpenEditor(Uri uri) {
                  boolean hasExistingCode = (engine != null && engine.getTotalBytes() > 0)
                          || (!isLineMode && etCodeEditor.getText().length() > 0);

                  if (!hasExistingCode) {
                      importUriIntoCurrentEditor(uri, true);
                      return;
                  }

                  String[] options = {
                          "1۔ موجودہ کوڈ کی جگہ نیا کوڈ رکھیں",
                          "2۔ نیا کوڈ موجودہ کوڈ کے آخر میں شامل کریں",
                          "3۔ منسوخ کریں"
                  };

                  new AlertDialog.Builder(this)
                          .setTitle("ایڈیٹر پہلے سے خالی نہیں ہے")
                          .setItems(options, (dialog, which) -> {
                              if (which == 0) importUriIntoCurrentEditor(uri, true);
                              else if (which == 1) importUriIntoCurrentEditor(uri, false);
                          })
                          .show();
              }

              private void importUriIntoCurrentEditor(Uri uri, boolean replaceExisting) {
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          if (!replaceExisting) {
                              commitAllModePageIfDirtySync(currentText, dirty);
                              isPageDirty = false;
                          }
                          File tempImport = new File(getCacheDir(), "editor_import.tmp");
                          repository.importUriToFile(uri, tempImport);

                          if (replaceExisting) {
                              undoManager.applyWithFile(engine, 0L, engine.getTotalBytes(), tempImport, "فائل درآمد", 0);
                              currentPageIndex = 0;
                              currentFocusedLineIndex = 0;
                          } else {
                              if (engine.needsNewlineBeforeAppendFile(tempImport)) {
                                  File combined = new File(getCacheDir(), "editor_import_combined.tmp");
                                  try (BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream(combined), 65536);
                                       FileInputStream in = new FileInputStream(tempImport)) {
                                      out.write(engine.getLineEnding().getBytes(StandardCharsets.UTF_8));
                                      byte[] buf = new byte[65536];
                                      int len;
                                      while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                                      out.flush();
                                  }
                                  try {
                                      undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), combined, "فائل شامل", Math.max(0, engine.getLineCount() - 1));
                                  } finally {
                                      combined.delete();
                                  }
                              } else {
                                  undoManager.applyWithFile(engine, engine.getTotalBytes(), engine.getTotalBytes(), tempImport, "فائل شامل", Math.max(0, engine.getLineCount() - 1));
                              }
                              currentPageIndex = engine.getPageCount() - 1;
                          }
                          tempImport.delete();
                          hasChangesSinceLastBackup = true;
                          updateRepoStatsIfSaved();

                          String pageText = (!isLineMode) ? engine.readPage(currentPageIndex) : "";
                          runOnUiThread(() -> {
                              if (!isLineMode) displayPageContent(pageText);
                              lineAdapter.refreshAllLines();
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(
                                      this, rootContainer, "فائل کامیابی سے شامل ہو گئی۔ کل لائنیں: " + engine.getLineCount()
                              );
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "فائل درآمد کرنے میں ناکامی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void showFileStats() {
                  if (engine == null) return;
                  final String currentText = (!isLineMode) ? etCodeEditor.getText().toString() : null;
                  final boolean dirty = (!isLineMode && isPageDirty);

                  executor.execute(() -> {
                      try {
                          commitAllModePageIfDirtySync(currentText, dirty);
                          isPageDirty = false;
                          long chars = engine.getTotalChars();
                          int lines = engine.getLineCount();
                          long bytes = engine.getTotalBytes();
                          int pages = engine.getPageCount();
                          String sizeText = formatBytes(bytes);

                          String summary = "فائل کا نام: " + (currentFileName != null ? currentFileName : "غیر محفوظ")
                                  + "\nزبان: " + currentLanguage
                                  + "\nموجودہ موڈ: " + (isLineMode ? "لائن موڈ" : "آل موڈ")
                                  + "\nکل لائنیں: " + lines
                                  + (lines > 0 ? "\nموجودہ لائن نمبر: " + (Math.min(currentFocusedLineIndex + 1, lines)) : "")
                                  + "\nنشان زدہ لائنیں: " + markedLineNumbers.size()
                                  + "\nکل حروف: " + chars
                                  + "\nفائل کا حجم: " + sizeText
                                  + "\nآل موڈ صفحات: " + pages + " (صفحہ: " + (currentPageIndex + 1) + ")";

                          runOnUiThread(() -> {
                              updateHeaderAndBarsUI();
                              AccessibilityHelper.announce(this, rootContainer, "کل لائنیں " + lines + "، کل حروف " + chars);
                              new AlertDialog.Builder(this)
                                      .setTitle("فائل کی معلومات")
                                      .setMessage(summary)
                                      .setPositiveButton(R.string.ok, null)
                                      .show();
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "معلومات حاصل کرنے میں خرابی: " + e.getMessage()
                          ));
                      }
                  });
              }

              private void updateRepoStatsIfSaved() {
                  if (currentFileId != null && engine != null) {
                      try {
                          repository.updateSavedFileStats(
                                  currentFileId, engine.getTotalChars(), engine.getLineCount(), engine.getTotalBytes()
                          );
                      } catch (Exception ignored) {
                      }
                  }
              }

              private String formatBytes(long bytes) {
                  if (bytes < 1024) return bytes + " Bytes";
                  double kb = bytes / 1024.0;
                  if (kb < 1024) return String.format(Locale.US, "%.2f KB", kb);
                  return String.format(Locale.US, "%.2f MB", kb / 1024.0);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  mainHandler.removeCallbacks(recoverySnapshotRunnable);
                  if (engine != null) {
                      final boolean dirty = (!isLineMode && isPageDirty);
                      final String text = dirty ? etCodeEditor.getText().toString() : null;
                      final boolean closingNormally = isFinishing();
                      executor.execute(() -> {
                          try {
                              if (dirty) {
                                  engine.writePage(currentPageIndex, text);
                                  isPageDirty = false;
                                  hasChangesSinceLastBackup = true;
                              }
                              updateRepoStatsIfSaved();
                              maybeCreatePeriodicBackup("بند ہونے سے پہلے بیک اپ");
                              if (!isExternalBenchmarkFile) {
                                  if (currentFileId != null || (closingNormally && engine.getTotalBytes() == 0L)) {
                                      recoveryManager.clearRecovery();
                                  } else if (engine.getTotalBytes() > 0L) {
                                      recoveryManager.saveRecoverySnapshot(
                                              null, currentFileName, currentLanguage,
                                              isLineMode, currentPageIndex, currentFocusedLineIndex, null
                                      );
                                  }
                              }
                          } catch (Exception ignored) {
                          }
                      });
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  etCodeEditor.setTextSize(settings.getFontSize());
                  lineAdapter.setDisplayPreferences(settings.getFontSize(), settings.isReadIndentationEnabled());
                  scheduleNextAutoSave();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  mainHandler.removeCallbacks(autoSaveRunnable);
                  mainHandler.removeCallbacks(recoverySnapshotRunnable);
                  if (undoManager != null) {
                      undoManager.clear();
                  }
                  executor.shutdown();
              }
          }
