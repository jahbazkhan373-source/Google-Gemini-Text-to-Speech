                      raf.seek(start);
                      while (remaining > 0) {
                          int toRead = (int) Math.min(buffer.length, remaining);
                          int read = raf.read(buffer, 0, toRead);
                          if (read == -1) break;
                          out.write(buffer, 0, read);
                          remaining -= read;
