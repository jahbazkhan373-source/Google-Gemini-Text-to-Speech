          package com.codebook.editor.builder;

          import org.luaj.vm2.Globals;
          import org.luaj.vm2.LuaValue;
          import org.luaj.vm2.lib.jse.JsePlatform;

          import java.io.ByteArrayOutputStream;
          import java.io.PrintStream;
          import java.nio.charset.StandardCharsets;

          public class LuaSandboxRunner {

              public static class RunResult {
                  public final boolean success;
                  public final String output;
                  public final String error;

                  public RunResult(boolean success, String output, String error) {
                      this.success = success;
                      this.output = output != null ? output : "";
                      this.error = error != null ? error : "";
                  }
              }

              public static RunResult runLuaCode(final String luaCode, long timeoutMs) {
                  final ByteArrayOutputStream baos = new ByteArrayOutputStream();
                  final String[] errHolder = new String[1];
                  final boolean[] doneHolder = new boolean[1];

                  Thread runner = new Thread(() -> {
                      try {
                          Globals globals = JsePlatform.standardGlobals();
                          PrintStream ps = new PrintStream(baos, true, "UTF-8");
                          globals.STDOUT = ps;
                          globals.STDERR = ps;
                          LuaValue chunk = globals.load(luaCode != null ? luaCode : "", "main.lua");
                          chunk.call();
                          ps.flush();
                          doneHolder[0] = true;
                      } catch (Throwable t) {
                          errHolder[0] = t.getMessage() != null ? t.getMessage() : t.toString();
                          doneHolder[0] = true;
                      }
                  });
                  runner.setDaemon(true);
                  runner.start();

                  try {
                      runner.join(Math.max(500L, timeoutMs));
                  } catch (InterruptedException ignored) {
                  }

                  String outText = new String(baos.toByteArray(), StandardCharsets.UTF_8);
                  if (!doneHolder[0]) {
                      runner.interrupt();
                      return new RunResult(false, outText, "Execution timed out after " + timeoutMs + " ms (possible infinite loop).");
                  }
                  if (errHolder[0] != null) {
                      return new RunResult(false, outText, errHolder[0]);
                  }
                  return new RunResult(true, outText.isEmpty() ? "(Finished with no print output)" : outText, "");
              }
          }
