                  RecyclerView rv = findViewById(R.id.rvLibraryFiles);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  repository = new LibraryRepository(this);
                  backupManager = new BackupManager(this);
                  adapter = new LibraryAdapter(this);
                  rv.setAdapter(adapter);

                  findViewById(R.id.btnExportLibraryZip).setOnClickListener(v -> promptExportLibraryZip());
                  findViewById(R.id.btnImportLibraryZip).setOnClickListener(v ->
                          safImportZipLauncher.launch(new String[]{"application/zip", "*/*"})
                  );
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshList();
              }

              private void refreshList() {
                  List<CodeFileMeta> files = repository.getAllFiles();
                  adapter.setItems(files);
                  tvEmptyLibrary.setVisibility(files.isEmpty() ? View.VISIBLE : View.GONE);
              }

              private void promptExportLibraryZip() {
                  if (repository.getAllFiles().isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "لائبریری خالی ہے، ZIP بنانے کے لیے کوئی فائل نہیں۔");
                      return;
                  }
                  String[] choices = {
                          "فائلیں + تمام پرانے بیک اپ (مکمل ZIP)",
                          "صرف فائلیں (ہلکی ZIP)"
                  };
                  new AlertDialog.Builder(this)
                          .setTitle("پوری لائبریری ZIP میں محفوظ کریں")
                          .setItems(choices, (d, which) -> {
                              pendingZipIncludeBackups = (which == 0);
                              AccessibilityHelper.announce(this, rootContainer, "ZIP تیار کی جا رہی ہے...");
                              executor.execute(() -> {
                                  try {
                                      String saved = ZipBackupManager.exportLibraryToDownloadsZip(
                                              this, repository, backupManager, pendingZipIncludeBackups
                                      );
                                      runOnUiThread(() -> AccessibilityHelper.announce(
                                              this, rootContainer, "پوری لائبریری Download فولڈر میں " + saved + " کے نام سے محفوظ ہو گئی۔"
                                      ));
                                  } catch (Exception e) {
                                      runOnUiThread(() -> safCreateZipLauncher.launch(ZipBackupManager.buildDefaultZipName()));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onOpen(CodeFileMeta meta) {
                  Intent intent = new Intent(this, EditorActivity.class);
                  intent.putExtra(EditorActivity.EXTRA_FILE_ID, meta.id);
                  startActivity(intent);
              }

              @Override
              public void onDownload(CodeFileMeta meta) {
                  executor.execute(() -> {
                      try {
                          String savedName = repository.exportToDownloadsTxt(meta);
                          runOnUiThread(() -> AccessibilityHelper.announce(
                                  this, rootContainer, "فائل Download فولڈر میں " + savedName + " کے نام سے محفوظ ہو گئی۔"
                          ));
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              pendingExportMeta = meta;
                              safCreateTxtLauncher.launch(LibraryRepository.buildSafeTxtFileName(meta.name));
                          });
                      }
                  });
              }

              @Override
              public void onBackups(CodeFileMeta meta) {
                  Intent intent = new Intent(this, BackupActivity.class);
                  intent.putExtra(BackupActivity.EXTRA_FILE_ID, meta.id);
                  startActivity(intent);
              }

              @Override
              public void onCompare(CodeFileMeta meta) {
                  List<BackupManager.BackupMeta> backups = backupManager.listBackups(meta.id);
                  if (backups.isEmpty()) {
                      AccessibilityHelper.announce(this, rootContainer, "موازنہ کرنے کے لیے اس فائل کا کوئی پرانا بیک اپ موجود نہیں۔");
                      return;
                  }
                  Intent intent = new Intent(this, DiffActivity.class);
                  intent.putExtra(DiffActivity.EXTRA_FILE_ID, meta.id);
                  intent.putExtra(DiffActivity.EXTRA_BACKUP_ID, backups.get(0).id);
                  startActivity(intent);
              }

              @Override
              public void onRename(CodeFileMeta meta) {
                  EditText input = new EditText(this);
                  input.setText(meta.name);
                  input.setSelection(meta.name.length());

                  new AlertDialog.Builder(this)
                          .setTitle("فائل کا نام تبدیل کریں")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String newName = input.getText().toString().trim();
                              if (newName.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, "نام خالی نہیں ہو سکتا۔");
                                  return;
                              }
                              if (repository.nameExists(newName, meta.id)) {
                                  AccessibilityHelper.announce(this, rootContainer, "اس نام کی فائل پہلے سے موجود ہے۔");
                                  return;
                              }
                              try {
                                  repository.renameFile(meta.id, newName);
                                  refreshList();
                                  AccessibilityHelper.announce(this, rootContainer, "نام تبدیل ہو کر " + newName + " ہو گیا۔");
                              } catch (Exception e) {
                                  AccessibilityHelper.announce(this, rootContainer, "نام تبدیل نہیں ہو سکا: " + e.getMessage());
                              }
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onDuplicate(CodeFileMeta meta) {
                  EditText input = new EditText(this);
                  input.setText(meta.name + " Copy");

                  new AlertDialog.Builder(this)
                          .setTitle("نقل کے لیے نیا نام لکھیں")
                          .setView(input)
                          .setPositiveButton(R.string.ok, (d, w) -> {
                              String newName = input.getText().toString().trim();
                              if (newName.isEmpty()) {
                                  AccessibilityHelper.announce(this, rootContainer, "نام خالی نہیں ہو سکتا۔");
                                  return;
                              }
                              if (repository.nameExists(newName, null)) {
                                  AccessibilityHelper.announce(this, rootContainer, "اس نام کی فائل پہلے سے موجود ہے۔");
                                  return;
                              }
                              executor.execute(() -> {
                                  try {
                                      repository.duplicateFile(meta.id, newName);
                                      runOnUiThread(() -> {
                                          refreshList();
                                          AccessibilityHelper.announce(this, rootContainer, "نقل " + newName + " تیار ہو گئی۔");
                                      });
                                  } catch (Exception e) {
                                      runOnUiThread(() -> AccessibilityHelper.announce(
                                              this, rootContainer, "نقل بنانے میں ناکامی: " + e.getMessage()
                                      ));
                                  }
                              });
                          })
                          .setNegativeButton(R.string.cancel, null)
                          .show();
              }

              @Override
              public void onDelete(CodeFileMeta meta) {
                  boolean hasBackups = backupManager.hasBackups(meta.id);
                  if (!hasBackups) {
                      new AlertDialog.Builder(this)
                              .setTitle("فائل حذف کرنے کی تصدیق")
                              .setMessage("کیا آپ واقعی " + meta.name + " کو لائبریری سے حذف کرنا چاہتے ہیں؟")
                              .setPositiveButton(R.string.yes, (d, w) -> executeDelete(meta, true))
                              .setNegativeButton(R.string.no, null)
                              .show();
                  } else {
                      new AlertDialog.Builder(this)
                              .setTitle("فائل اور بیک اپ حذف کرنے کا اختیار")
                              .setMessage(meta.name + " کے پرانے بیک اپ موجود ہیں۔ کیا آپ انہیں محفوظ رکھنا چاہتے ہیں یا ساتھ حذف کرنا چاہتے ہیں؟")
                              .setPositiveButton("فائل حذف کریں، بیک اپ رکھیں", (d, w) -> executeDelete(meta, false))
                              .setNeutralButton("فائل اور بیک اپ دونوں حذف کریں", (d, w) -> executeDelete(meta, true))
                              .setNegativeButton(R.string.cancel, null)
                              .show();
                  }
              }

              private void executeDelete(CodeFileMeta meta, boolean deleteBackups) {
                  try {
                      repository.deleteFile(meta.id, deleteBackups);
                      refreshList();
                      AccessibilityHelper.announce(
                              this, rootContainer,
                              deleteBackups ? meta.name + " اور اس کے بیک اپ حذف ہو گئے۔" : meta.name + " حذف ہو گئی، بیک اپ محفوظ ہیں۔"
                      );
                  } catch (Exception e) {
                      AccessibilityHelper.announce(this, rootContainer, "حذف کرنے میں ناکامی: " + e.getMessage());
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  executor.shutdown();
              }
          }
