              private void executeRestore(BackupManager.BackupMeta backup) {
                  executor.execute(() -> {
                      try {
                          File targetFile = resolveTargetFile();
                          LargeFileEngine curEng = new LargeFileEngine(targetFile, settings.getPageCharLimit());
                          curEng.rebuildIndex();
                          backupManager.createBackup(fileId, displayName, targetFile, "Pre-Restore Safety Backup",
                                  curEng.getTotalChars(), curEng.getLineCount(), settings.getMaxBackupsPerFile());

                          backupManager.extractBackupToFile(fileId, backup.id, targetFile);
                          LargeFileEngine restoredEng = new LargeFileEngine(targetFile, settings.getPageCharLimit());
                          restoredEng.rebuildIndex();
                          if (customFilePath == null || customFilePath.isEmpty()) {
                              repository.updateSavedFileStats(fileId, restoredEng.getTotalChars(), restoredEng.getLineCount(), restoredEng.getTotalBytes());
                          }

                          runOnUiThread(() -> {
                              refreshBackups();
                              AccessibilityHelper.announce(this, rootContainer, "Restored version successfully. Lines: " + restoredEng.getLineCount());
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> AccessibilityHelper.announce(this, rootContainer, "Restore failed: " + e.getMessage()));
                      }
                  });
              }

